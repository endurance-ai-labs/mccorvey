<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bid Pipeline — MSM Operations Portal</title>
<meta name="description" content="McCorvey Sheet Metal Works, L.P. (MSM) — HVAC sheet metal ductwork fabrication & installation. Jobs, billing, timesheets and forecasting in one operations portal. Demo environment.">
<meta property="og:site_name" content="MSM Operations Portal">
<meta property="og:title" content="McCorvey Sheet Metal Works, L.P. — Operations Portal">
<meta property="og:description" content="Leaders in the HVAC Industry — jobs, billing, timesheets and forecasting in one place. Demo environment, fictional data.">
<meta property="og:image" content="https://endurance-ai-labs.github.io/mccorvey/assets/brand/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://endurance-ai-labs.github.io/mccorvey/assets/brand/og-cover.png">
<link rel="icon" type="image/png" href="/mccorvey/assets/brand/mccorvey-mark.png">
<link rel="stylesheet" href="/mccorvey/css/theme.css">
<link rel="stylesheet" href="/mccorvey/css/demo.css">
<link rel="stylesheet" href="/mccorvey/css/mccorvey.css">
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="app"></div></main>

<script src="/mccorvey/js/data.js"></script>
<script src="/mccorvey/js/util.js"></script>
<script src="/mccorvey/js/nav.js"></script>
<script src="/mccorvey/vendor/chart.umd.min.js"></script>
<script src="/mccorvey/js/mccorvey-brain.js" defer></script>
<script>
McCorveyNav.renderTopbar({ subtitle: 'Bid Pipeline' });
var PFILT = { est: 'all', status: 'all', sector: 'all' };
const me = currentPersona();
if (!me || me.perms.external || !(can('bids') || can('margins'))) {
  if (isSignedIn()) $('#app').innerHTML = `<div class="demo-panel" style="margin-top:40px"><div class="demo-panel-head"><h2>Restricted module</h2></div>
    <div class="ynote">The bid pipeline requires estimating or financial access.</div></div>`;
} else {
  render();
}

function render() {
  const showMargin = can('margins');
  const P = BID_PIPELINE;
  const selOpt = (list, cur) => `<option value="all">All</option>` + list.map(v => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const regRows = P.filter(b => (PFILT.est === 'all' || b.est === PFILT.est) && (PFILT.status === 'all' || b.status === PFILT.status) && (PFILT.sector === 'all' || b.sector === PFILT.sector));
  const open = P.filter(b => ['Draft', 'Submitted', 'Pending Award'].includes(b.status));
  const won = P.filter(b => b.status === 'Won');
  const lost = P.filter(b => b.status === 'Lost');
  const hitRate = won.length / (won.length + lost.length) * 100;
  const dollarHit = won.reduce((s, b) => s + b.amount, 0) / (won.reduce((s, b) => s + b.amount, 0) + lost.reduce((s, b) => s + b.amount, 0)) * 100;
  const avgMarginWon = won.reduce((s, b) => s + b.marginPct, 0) / won.length;
  const avgMarginLost = lost.reduce((s, b) => s + b.marginPct, 0) / lost.length;
  const openVal = open.reduce((s, b) => s + b.amount, 0);
  const weighted = open.reduce((s, b) => s + b.amount * ({ Draft: 0.15, Submitted: 0.35, 'Pending Award': 0.65 }[b.status]), 0);

  const stPill = (st) => `<span class="ypill ${{ Draft: 'gray', Submitted: 'blue', 'Pending Award': 'amber', Won: 'green', Lost: 'red' }[st]}">${st}</span>`;

  const stages = [['Draft', '#8a93a1'], ['Submitted', '#14283c'], ['Pending Award', '#b98a36'], ['Won (T-6 mo)', '#4f7d5d'], ['Lost (T-6 mo)', '#b1503f']];
  const stageVals = [
    P.filter(b => b.status === 'Draft').reduce((s, b) => s + b.amount, 0),
    P.filter(b => b.status === 'Submitted').reduce((s, b) => s + b.amount, 0),
    P.filter(b => b.status === 'Pending Award').reduce((s, b) => s + b.amount, 0),
    won.reduce((s, b) => s + b.amount, 0),
    lost.reduce((s, b) => s + b.amount, 0),
  ];
  const maxStage = Math.max(...stageVals, 1);

  const rows = regRows.slice().sort((a, b) => b.due.localeCompare(a.due)).map(b => `
    <tr>
      <td><b>${b.id}</b></td>
      <td>${esc(b.project)}<div class="ynote">${esc(b.owner)}${b.note ? ' · <i>' + esc(b.note) + '</i>' : ''}</div></td>
      <td>${esc(b.sector)}</td>
      <td>${esc(b.est)}</td>
      <td>${fmtDateShort(b.due)}, ${b.due.slice(2, 4)}</td>
      <td style="text-align:right">${fmt$(b.amount)}</td>
      ${showMargin ? `<td style="text-align:right">${fmtPct(b.marginPct)}</td>` : ''}
      <td>${stPill(b.status)}${b.jobId ? ` <a href="/mccorvey/jobs/job/?id=${b.jobId}" style="font-size:10px;color:var(--color-blue);font-weight:700">→ ${b.jobId}</a>` : ''}</td>
    </tr>`).join('');

  $('#app').innerHTML = `
    <div class="cmd-hero">
      <div class="cmd-head">
        <div>
          <div class="cmd-eyebrow">MSM — PRECONSTRUCTION · WIN/LOSS INTELLIGENCE</div>
          <h1 class="cmd-title">Bid Pipeline Command Center</h1>
          <div class="cmd-sub">Every bid out the door — status, hit rate, and where margin wins or loses work. Won bids link straight to their job; the weighted pipeline feeds the revenue forecast.</div>
        </div>
        <div class="cmd-side">
          <span class="cmd-range">FY2026 P8 · 07-06-2026 — 08-02-2026</span>
          <span class="demo-live"><span class="dot"></span> ${open.length} OPEN BIDS · ${fmtK(openVal)}</span>
          <div class="cmd-chips">${srcChip('brain')} ${srcChip('prop')}</div>
        </div>
      </div>
      <div class="cmd-tiles">
        <div class="cmd-tile"><div class="l">Open Pipeline</div><div class="v">${fmtK(openVal)}</div><span class="d up">▲ ${open.length} bids in flight</span><div class="s">pre-screened by AI doc review</div>${sparkSVG('openpipe', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile"><div class="l">Weighted Pipeline</div><div class="v">${fmtK(weighted)}</div><span class="d up">▲ by stage probability</span><div class="s">15% / 35% / 65% by stage</div>${sparkSVG('weighted', { up: true })}</div>
        <div class="cmd-tile"><div class="l">Hit Rate (T-6 mo)</div><div class="v">${fmtPct(hitRate, 0)}</div><span class="d up">▲ ${fmtPct(dollarHit, 0)} by $</span><div class="s">${won.length} won / ${lost.length} lost</div>${sparkSVG('hitrate', { up: true })}</div>
        ${showMargin ? `<div class="cmd-tile"><div class="l">Avg Margin — Won</div><div class="v">${fmtPct(avgMarginWon)}</div><span class="d up">▲ vs ${fmtPct(avgMarginLost)} lost</span><div class="s">margin holds on wins</div>${sparkSVG('marginwon', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile hot"><div class="l">Margin Insight</div><div class="v" style="font-size:15px;line-height:1.3">Losses cluster &lt; 14%</div><span class="d down">▼ price isn't the lever</span><div class="s">fit is — bid the right work</div>${sparkSVG('insight', { up: false, color: '#c8102e' })}</div>` : ''}
      </div>
    </div>

    <div class="scope-bar">
      <span class="scope-chip">Period: <b>FY2026 P8</b></span>
      <span class="scope-chip">Sector: <b>all</b></span>
      <span class="scope-chip">GC: <b>all</b></span>
      <span class="scope-chip">Estimator: <b>all</b></span>
      <span class="scope-chip">Stage: <b>all</b></span>
      <span class="scope-note">${P.length} bids in scope · prepared for ${esc(currentPersona().name)}, ${esc(currentPersona().title)}</span>
    </div>

    <div class="demo-two" style="margin-bottom:22px">
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Pipeline by Stage</h2><span class="k">$ value</span></div>
        <div class="demo-aging">${stages.map((st, i) => `
          <div class="demo-aging-row">
            <div class="lab" style="width:110px">${st[0]}</div>
            <div class="bar"><i style="width:${stageVals[i] / maxStage * 100}%;background:${st[1]}"></i></div>
            <div class="amt">${fmtK(stageVals[i])}</div>
          </div>`).join('')}</div>
        <div class="ynote" style="margin-top:10px">Weighted pipeline applies 15% / 35% / 65% probability by stage — ${fmtK(weighted)} expected award value.</div>
      </div>
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Win Rate by Sector</h2><span class="k">trailing 6 months</span></div>
        <div class="demo-chart" style="height:230px"><canvas id="ch-sector"></canvas></div>
      </div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px;border-left:3px solid var(--mccorvey-red)">
      <div class="demo-panel-head"><h2>Win More of What You Bid</h2><span class="k">flagship module</span></div>
      <div class="ynote">McCorvey spends roughly <b>$3M a year</b> reviewing bid documents by hand. The <a href="/mccorvey/bidreview/" style="color:var(--color-blue);font-weight:700">AI Bid &amp; Document Review</a> module machine-reads every drawing set, spec section and addendum — flagging gauge-schedule changes, alternate traps and scope gaps competitors miss before the bid is priced. Losses below the margin line above usually trace back to documents, not price.</div>
    </div>

    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Bid Register</h2><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label class="k">Estimator</label><select class="pa-btn" data-pfilt="est" style="cursor:pointer">${selOpt([...new Set(P.map(b => b.est))].sort(), PFILT.est)}</select>
        <label class="k">Status</label><select class="pa-btn" data-pfilt="status" style="cursor:pointer">${selOpt(['Draft', 'Submitted', 'Pending Award', 'Won', 'Lost'], PFILT.status)}</select>
        <label class="k">Sector</label><select class="pa-btn" data-pfilt="sector" style="cursor:pointer">${selOpt([...new Set(P.map(b => b.sector))].sort(), PFILT.sector)}</select>
        <span class="k">${regRows.length} of ${P.length} bids</span></span></div>
      <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
      <table class="demo-tbl tbl-left">
        <thead><tr><th>Bid #</th><th>Project / Owner</th><th>Sector</th><th>Estimator</th><th>Bid Date</th><th style="text-align:right">Amount</th>${showMargin ? '<th style="text-align:right">Margin Bid</th>' : ''}<th>Status</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="8" style="padding:18px;color:var(--color-text-muted)">No bids match the current filters.</td></tr>`}</tbody>
      </table>
      </div>
    </div>
    <div class="demo-note">Demo environment · fictional data</div>`;

  $$('select[data-pfilt]').forEach(s => s.addEventListener('change', () => { PFILT[s.dataset.pfilt] = s.value; render(); }));

  /* sector win-rate chart */
  const sectors = [...new Set(BID_PIPELINE.filter(b => ['Won', 'Lost'].includes(b.status)).map(b => b.sector))];
  const rates = sectors.map(sec => {
    const w = BID_PIPELINE.filter(b => b.sector === sec && b.status === 'Won').length;
    const l = BID_PIPELINE.filter(b => b.sector === sec && b.status === 'Lost').length;
    return w / (w + l) * 100;
  });
  new Chart($('#ch-sector'), {
    type: 'bar',
    data: { labels: sectors, datasets: [{ label: 'Win rate', data: rates, backgroundColor: rates.map(r => r >= 60 ? '#4f7d5d' : r >= 40 ? '#b98a36' : '#b1503f') }] },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%', font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } } }
  });
}
</script>
</body>
</html>
