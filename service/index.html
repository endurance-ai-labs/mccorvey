<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabrication Division — MSM Operations Portal</title>
<meta name="description" content="McCorvey Sheet Metal Works, L.P. (MSM) — HVAC sheet metal ductwork: BIM design, pre-fabrication & installation. Jobs, billing, timesheets and forecasting in one operations portal. Demo environment.">
<meta property="og:site_name" content="MSM Operations Portal">
<meta property="og:title" content="McCorvey Sheet Metal Works, L.P. — Operations Portal">
<meta property="og:description" content="Leaders in the HVAC Industry — jobs, billing, timesheets and forecasting in one place. Demo environment, fictional data.">
<meta property="og:image" content="https://endurance-ai-labs.github.io/mccorvey/assets/brand/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://endurance-ai-labs.github.io/mccorvey/assets/brand/og-cover.png">
<link rel="icon" type="image/png" href="/mccorvey/assets/brand/mccorvey-mark.png">
<link rel="stylesheet" href="/mccorvey/css/theme.css?v=20260806a">
<link rel="stylesheet" href="/mccorvey/css/demo.css?v=20260806a">
<link rel="stylesheet" href="/mccorvey/css/mccorvey.css?v=20260806a">
<style>
  .eqp-chip { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.01em; padding: 3px 8px; border-radius: 3px; margin: 0 4px 5px 0; background: var(--color-bg-3); color: var(--color-text-muted); border: 1px solid var(--color-border-soft); white-space: normal; }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="app"></div></main>

<script src="/mccorvey/js/data.js?v=20260806a"></script>
<script src="/mccorvey/js/util.js?v=20260806a"></script>
<script src="/mccorvey/js/nav.js?v=20260806a"></script>
<script src="/mccorvey/vendor/chart.umd.min.js"></script>
<script src="/mccorvey/js/mccorvey-brain.js?v=20260806a" defer></script>
<script>
McCorveyNav.renderTopbar({ subtitle: 'Fabrication Division' });
var SFILT = { line: 'all', type: 'all', status: 'all' };
const me = currentPersona();
if (!me || me.perms.external) {
  if (isSignedIn()) $('#app').innerHTML = `<div class="demo-panel" style="margin-top:40px"><div class="demo-panel-head"><h2>Internal module</h2></div>
    <div class="ynote">The fabrication division board is internal. Duct Direct orders and releases are handled through your account manager.</div></div>`;
} else {
  render();
}


/* ---- construction -> Duct Direct account conversion pipeline ---- */
function firstTwo(s) { return s.split(/\s+/).slice(0, 2).join(' ').toLowerCase(); }
function convState() { try { return JSON.parse(localStorage.getItem('msm-svc-conv') || '[]'); } catch (e) { return []; } }
function convertJob(id) {
  const st = convState();
  if (!st.includes(id)) st.push(id);
  try { localStorage.setItem('msm-svc-conv', JSON.stringify(st)); } catch (e) {}
  render();
}
function conversionCandidates() {
  const covered = SERVICE_AGREEMENTS.map(a => firstTwo(a.client));
  return JOBS.map(j => ({ j, m: jobMetrics(j) }))
    .filter(({ j, m }) => m.pct >= 50 && !covered.includes(firstTwo(j.owner)))
    .map(({ j, m }) => {
      const sec = j.sector.toLowerCase();
      const tier = sec.includes('health') || sec.includes('mission') ? 'Standing PO' : (sec.includes('k-12') || sec.includes('municipal') || sec.includes('higher') ? 'On-Demand' : 'Custom');
      const monthly = Math.min(120000, Math.max(15000, Math.round(j.contract * 0.045 / 12 / 1000) * 1000));
      return { j, m, tier, monthly, converted: convState().includes(j.id) };
    });
}

/* ---- work order detail (modal) ---- */
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973; return h; }
function showCall(num) {
  const c = SERVICE_CALLS.find(x => x.num === num); if (!c) return;
  const h = hash(num);
  const ag = SERVICE_AGREEMENTS.find(a => firstTwo(a.client) === firstTwo(c.client));
  const sla = c.priority === 'Emergency' ? 'Same-week plant slot' : c.priority === 'High' ? '5-day plant turnaround' : 'Standard 10-day turnaround';
  const shopH = (4 + h % 20) + '.' + (h % 9);
  const timeline = [
    ['Order received — logged by T. Coy (Fab Coordinator)', c.opened + ' 07:4' + (h % 9)],
    ['Released to ' + c.tech + ' via STRATUS', c.opened + ' 08:1' + (h % 6)],
    c.status !== 'Queued' ? ['Coil stock staged — nesting & burn tables generated', c.opened + ' 09:3' + (h % 9)] : null,
    c.status === 'Cutting' ? ['On the plasma table — ' + c.issue.split('—')[0].trim().toLowerCase() + ' cutting in progress', 'today'] : null,
    c.status === 'In Fabrication' ? ['Forming, seaming & assembly in progress on the line', 'today'] : null,
    c.status === 'QC Hold' ? ['QC hold — seam & leakage-class inspection open, disposition pending', 'today'] : null,
    c.status === 'Shipped' ? ['Loaded & shipped — BOL issued, spool map in the trailer packet', 'yesterday'] : null,
  ].filter(Boolean);
  const materials = c.status === 'Queued' ? [
    ['COIL-26GA-G60', 'Galvanized coil stock, 26ga G60', 2],
    h % 2 ? ['LNR-1IN-ACST', 'Duct liner, 1" acoustic', 4] : ['SS-304-16GA', 'Stainless sheet 304, 16ga', 3],
  ] : [];

  const ov = document.createElement('div');
  ov.className = 'svc-modal';
  ov.innerHTML = `
    <div class="svc-card" onclick="event.stopPropagation()">
      <div class="svc-card-head">
        <div><b>${c.num}</b> · ${esc(c.client)}<div class="ynote">${esc(c.issue)}</div></div>
        <button class="pa-btn" style="cursor:pointer" onclick="this.closest('.svc-modal').remove()">✕</button>
      </div>
      <div class="svc-meta">
        <span>${c.priority} · ${sla}</span>
        <span>Cell: <b>${esc(c.tech)}</b></span>
        <span>Shop hrs logged: <b>${shopH} hrs</b></span>
        <span>Program: <b>${ag ? ag.tier + ' program' : 'One-off order — no program'}</b></span>
      </div>
      <div class="svc-sect">Production Timeline</div>
      ${timeline.map(x => `<div class="svc-tl"><span class="dot"></span><div><b>${esc(x[0])}</b><div class="ynote">${esc(x[1])}</div></div></div>`).join('')}
      ${materials.length ? `<div class="svc-sect">Material Staging</div>
      <table class="demo-tbl tbl-left"><thead><tr><th>SKU</th><th>Description</th><th style="text-align:right">Qty</th></tr></thead>
      <tbody>${materials.map(p => `<tr><td><b>${p[0]}</b></td><td>${esc(p[1])}</td><td style="text-align:right">${p[2]}</td></tr>`).join('')}</tbody></table>` : ''}
      <div class="ynote" style="margin-top:14px">Synced from STRATUS · demo simulation</div>
    </div>`;
  ov.addEventListener('click', () => ov.remove());
  document.body.appendChild(ov);
}

function render() {
  const showMoney = can('fin') || can('margins');
  const active = SERVICE_AGREEMENTS.filter(a => a.status === 'Active');
  const expiring = SERVICE_AGREEMENTS.filter(a => a.status === 'Expiring');
  const proposed = SERVICE_AGREEMENTS.filter(a => a.status === 'Proposed');
  const mrr = active.concat(expiring).reduce((s, a) => s + a.monthly, 0);
  const pipeMrr = proposed.reduce((s, a) => s + a.monthly, 0);
  const openCalls = SERVICE_CALLS.length;

  const tierPill = (t) => `<span class="ypill ${{ 'Standing PO': 'blue', 'Weekly Release': 'green', 'On-Demand': 'gray', Custom: 'amber' }[t] || 'gray'}">${t}</span>`;
  const stPill = (st) => `<span class="ypill ${{ Active: 'green', Expiring: 'amber', Proposed: 'blue' }[st] || 'gray'}">${st}</span>`;
  const prPill = (p) => `<span class="ypill ${{ Emergency: 'red', High: 'amber', Standard: 'gray' }[p]}">${p}</span>`;
  const callPill = (st) => `<span class="ypill ${{ 'In Fabrication': 'blue', Cutting: 'blue', Queued: 'gray', 'QC Hold': 'amber', Shipped: 'green' }[st] || 'gray'}">${st}</span>`;

  const tiers = ['Standing PO', 'Weekly Release', 'On-Demand', 'Custom'];
  const tierCounts = tiers.map(t => SERVICE_AGREEMENTS.filter(a => a.tier === t).length);
  const maxTier = Math.max(...tierCounts, 1);

  const convRows = conversionCandidates().filter(c => c.converted).map(c => ({
    client: c.j.owner, site: c.j.address, line: 'Rect', svcType: 'Duct Direct', tier: c.tier, monthly: c.monthly,
    renewal: '2027-08-01', status: 'Proposed', tech: '—',
  }));
  const allAgs = SERVICE_AGREEMENTS.concat(convRows);
  const agShown = allAgs.filter(a => (SFILT.line === 'all' || (a.line || 'Rect') === SFILT.line) && (SFILT.type === 'all' || (a.svcType || 'Duct Direct') === SFILT.type) && (SFILT.status === 'all' || a.status === SFILT.status));
  const agRows = agShown.slice().sort((a, b) => a.renewal.localeCompare(b.renewal)).map(a => `
    <tr>
      <td><b>${esc(a.client)}</b><div class="ynote">${esc(a.site)}</div></td>
      <td>${tierPill(a.tier)}<div class="ynote">${a.line || 'Rect'} · ${a.svcType || 'Duct Direct'}</div></td>
      ${showMoney ? `<td style="text-align:right">${fmt$(a.monthly)}/mo</td><td style="text-align:right">${fmt$(a.monthly * 12)}</td>` : ''}
      <td>${fmtDateShort(a.renewal)}, ${a.renewal.slice(0, 4)}</td>
      <td>${esc(a.tech)}</td>
      <td>${stPill(a.status)}</td>
    </tr>`).join('');

  const callRows = SERVICE_CALLS.map(c => `
    <tr class="yclick" onclick="showCall('${c.num}')">
      <td><b>${c.num}</b></td>
      <td>${esc(c.client)}</td>
      <td>${esc(c.issue)}</td>
      <td>${prPill(c.priority)}</td>
      <td>${esc(c.tech)}</td>
      <td>${callPill(c.status)}</td>
    </tr>`).join('');

  $('#app').innerHTML = `
    <div class="cmd-hero">
      <div class="cmd-head">
        <div>
          <div class="cmd-eyebrow">MSM — FABRICATION DIVISION · DUCT DIRECT &amp; SHOP FLOOR</div>
          <h1 class="cmd-title">Fabrication Command Center</h1>
          <div class="cmd-sub">Every external fabrication account and open work order in one board — Duct Direct programs for other mechanical contractors, the shop floor synced from STRATUS, and monthly fabrication volume rolled up for the CFO.</div>
        </div>
        <div class="cmd-side">
          <span class="cmd-range">FY2026 P8 · 07-06-2026 — 08-02-2026</span>
          <span class="demo-live"><span class="dot"></span> ${SERVICE_AGREEMENTS.length} ACCOUNTS · ${openCalls} OPEN WORK ORDERS</span>
          <div class="cmd-chips">${srcChip('st')} ${showMoney ? srcChip('qb') : ''}</div>
        </div>
      </div>
      <div class="cmd-tiles">
        <div class="cmd-tile"><div class="l">Active Fab Accounts</div><div class="v">${active.length + expiring.length}</div><span class="d up">▲ ${proposed.length} proposed</span><div class="s">Duct Direct · Fab Partner · OEM</div>${sparkSVG('fabacct', { up: true, color: '#14283c' })}</div>
        ${showMoney ? `
        <div class="cmd-tile"><div class="l">Monthly Fab Volume</div><div class="v">${fmtK(mrr)}</div><span class="d up">▲ ${fmtK(mrr * 12)} annualized</span><div class="s">external book, ex-construction</div>${sparkSVG('fabvol', { up: true })}</div>
        <div class="cmd-tile"><div class="l">Pipeline Volume</div><div class="v">${fmtK(pipeMrr)}</div><span class="d up">▲ conversion pipeline</span><div class="s">from active construction jobs</div>${sparkSVG('fabpipe', { up: true, color: '#14283c' })}</div>` : ''}
        <div class="cmd-tile ${expiring.length ? 'hot' : ''}"><div class="l">Renewals Next 90 Days</div><div class="v">${expiring.length}</div><span class="d ${expiring.length ? 'down' : 'up'}">${expiring.length ? '▼ act now' : '▲ none due'}</span><div class="s">${expiring.map(e => e.client.split(' ')[0]).join(', ') || 'book is current'}</div>${sparkSVG('renewals', { up: false, color: '#b98a36' })}</div>
        <div class="cmd-tile"><div class="l">Open Work Orders</div><div class="v">${openCalls}</div><span class="d ${SERVICE_CALLS.filter(c => c.priority === 'Emergency').length ? 'down' : 'up'}">${SERVICE_CALLS.filter(c => c.priority === 'Emergency').length ? '▼' : '▲'} ${SERVICE_CALLS.filter(c => c.priority === 'Emergency').length} emergency</span><div class="s">${SERVICE_CALLS.filter(c => c.priority === 'High').length} high priority in queue</div>${sparkSVG('workorders', { up: true, color: '#c8102e' })}</div>
      </div>
    </div>

    <div class="scope-bar">
      <span class="scope-chip">Period: <b>FY2026 P8</b></span>
      <span class="scope-chip">Plant: <b>all</b></span>
      <span class="scope-chip">Line: <b>${SFILT.line}</b></span>
      <span class="scope-chip">Program: <b>${SFILT.type}</b></span>
      <span class="scope-chip">Status: <b>${SFILT.status}</b></span>
      <span class="scope-note">${allAgs.length} accounts in scope · prepared for ${esc(currentPersona().name)}, ${esc(currentPersona().title)}</span>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Fab Book by Product Line &amp; Program</h2><span class="k">rect · spiral · welded × Duct Direct · fab partner · OEM</span></div>
      ${(() => {
        const lines = ['Rect', 'Spiral', 'Welded', 'Rect + Spiral'];
        const types = ['Duct Direct', 'Fab Partner', 'OEM Program'];
        const cell = (ln, ty) => SERVICE_AGREEMENTS.filter(a => a.line === ln && a.svcType === ty && a.status !== 'Proposed');
        return `<table class="demo-tbl tbl-left">
          <thead><tr><th>Product Line</th>${types.map(t => `<th style="text-align:right">${t}</th>`).join('')}<th style="text-align:right">Line Total</th></tr></thead>
          <tbody>${lines.map(ln => {
            const rowCells = types.map(ty => { const c = cell(ln, ty); return { n: c.length, mrr: c.reduce((x, a) => x + a.monthly, 0) }; });
            const tot = rowCells.reduce((x, c) => x + c.mrr, 0);
            return `<tr><td><b>${ln}</b></td>${rowCells.map(c => `<td style="text-align:right">${c.n ? c.n + ' · ' + (showMoney ? fmt$(c.mrr) + '/mo' : '') : '—'}</td>`).join('')}
              <td style="text-align:right;font-weight:700">${showMoney ? fmt$(tot) + '/mo' : rowCells.reduce((x, c) => x + c.n, 0) + ' accounts'}</td></tr>`;
          }).join('')}</tbody>
        </table>
        <div class="ynote" style="margin-top:8px">The OEM program is a single proposed account today — modeled as its own type so a dedicated production line (or a second plant shift) drops straight in.</div>`;
      })()}
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>The Plants — Houston &amp; Orlando</h2><span class="k">the manufacturing capacity behind every program</span></div>
      <div class="demo-two">
        ${PLANT_STATS.map(p => `
        <div>
          <div style="font-weight:800;margin-bottom:2px;color:var(--color-cloud-whisper)">${esc(p.name)}</div>
          <div class="ynote" style="margin-bottom:10px"><b>${p.sqft.toLocaleString()} sq ft</b> · ${p.employees} shop employees</div>
          <div>${p.equipment.map(e => `<span class="eqp-chip">${esc(e)}</span>`).join('')}</div>
        </div>`).join('')}
      </div>
      <div class="ynote" style="margin-top:12px;border-top:1px solid var(--color-border-soft);padding-top:10px"><b>${PLANT_TOTALS.sqft.toLocaleString()} sq ft combined</b> · ${PLANT_TOTALS.employees} shop employees across shifts · ${PLANT_TOTALS.piecesPerDay.toLocaleString()} pieces/day capacity · in-house accessory manufacturing (flanges, dampers, corners, clips, Unistrut)</div>
    </div>

    ${showMoney ? `
    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Renewal Control — Q3 2026 Batch</h2><span class="k">expiring fab programs require sign-off on renewal pricing</span></div>
      ${approvalChain('svc-renewals-2026-q3', [
        { role: 'svcmgr', label: 'Fab Ops — Renewal Pricing Proposed', doneLabel: 'Pricing Proposed' },
        { role: 'cfo',    label: 'CFO — Approve Renewal Terms',       doneLabel: 'CFO Approved' },
      ])}
    </div>` : ''}

    <div class="demo-two" style="margin-bottom:22px">
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Shop Floor Board</h2><span style="display:flex;gap:6px;align-items:center">${srcChip('st')}<span class="k">open work orders, live from STRATUS</span></span></div>
        <div class="demo-tbl-wrap" style="max-height:360px">
        <table class="demo-tbl tbl-left">
          <thead><tr><th>WO #</th><th>Client / Job</th><th>Fabrication Order</th><th>Priority</th><th>Plant · Cell</th><th>Status</th></tr></thead>
          <tbody>${callRows}</tbody>
        </table>
        </div>
        <div class="ynote" style="margin-top:8px">${openCalls} of 23 open work orders shown — the full production queue lives in STRATUS.</div>
      </div>
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Accounts by Program</h2><span class="k">the four MSM fab program tiers</span></div>
        <div class="demo-aging">${tiers.map((t, i) => `
          <div class="demo-aging-row">
            <div class="lab">${t}</div>
            <div class="bar"><i style="width:${tierCounts[i] / maxTier * 100}%;background:${['#14283c', '#4f7d5d', '#8a93a1', '#b98a36'][i]}"></i></div>
            <div class="amt">${tierCounts[i]}</div>
          </div>`).join('')}</div>
        <div class="demo-panel-head" style="margin-top:20px"><h2>Program Inclusions</h2></div>
        <div style="font-size:11.5px;line-height:1.7;color:var(--color-text-muted)">
          ${tiers.map(t => `<div style="margin-bottom:8px"><b style="color:var(--color-cloud-whisper)">${t}:</b> ${SERVICE_TIERS[t].join(' · ')}</div>`).join('')}
        </div>
      </div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px;border-left:3px solid var(--color-green)">
      <div class="demo-panel-head"><h2>Conversion Pipeline — Construction → Duct Direct</h2><span class="k">closing jobs without a fab account · the recurring-volume attach motion</span></div>
      <table class="demo-tbl tbl-left">
        <thead><tr><th>Job</th><th>Owner / GC</th><th style="text-align:right">% Complete</th><th>Proposed Program</th>${showMoney ? '<th style="text-align:right">Est. Monthly Volume</th>' : ''}<th style="width:190px"></th></tr></thead>
        <tbody>${conversionCandidates().map(c => `
          <tr>
            <td><a href="/mccorvey/jobs/job/?id=${c.j.id}" style="color:var(--color-blue);font-weight:700">${c.j.id}</a> · ${esc(c.j.name.split('—')[0].trim())}</td>
            <td>${esc(c.j.owner)}</td>
            <td style="text-align:right">${fmtPct(c.m.pct, 0)}</td>
            <td><span class="ypill ${{ 'Standing PO': 'blue', 'On-Demand': 'gray', Custom: 'amber' }[c.tier] || 'gray'}">${c.tier}</span></td>
            ${showMoney ? `<td style="text-align:right">${fmt$(c.monthly)}/mo</td>` : ''}
            <td>${c.converted
              ? '<span class="demo-chip ok">PROPOSAL ISSUED ✓</span>'
              : `<button class="pa-btn primary" style="cursor:pointer" onclick="convertJob('${c.j.id}')">→ Convert to Fab Account</button>`}</td>
          </tr>`).join('') || '<tr><td colspan="6" class="ynote">Every eligible construction client already holds a fabrication account.</td></tr>'}</tbody>
      </table>
      ${showMoney ? `<div class="ynote" style="margin-top:8px">Converting all candidates adds ${fmt$(conversionCandidates().filter(c => !c.converted).reduce((s, c) => s + c.monthly, 0))}/mo of pipeline fabrication volume. Issued proposals appear in the book below as Proposed.</div>` : ''}
    </div>

    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Fabrication Accounts (Duct Direct)</h2><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label class="k">Line</label><select class="pa-btn" data-sfilt="line" style="cursor:pointer">${['all', 'Rect', 'Spiral', 'Welded', 'Rect + Spiral'].map(v => `<option value="${v}" ${v === SFILT.line ? 'selected' : ''}>${v === 'all' ? 'All' : v}</option>`).join('')}</select>
        <label class="k">Type</label><select class="pa-btn" data-sfilt="type" style="cursor:pointer">${['all', 'Duct Direct', 'Fab Partner', 'OEM Program'].map(v => `<option value="${v}" ${v === SFILT.type ? 'selected' : ''}>${v === 'all' ? 'All' : v}</option>`).join('')}</select>
        <label class="k">Status</label><select class="pa-btn" data-sfilt="status" style="cursor:pointer">${['all', 'Active', 'Expiring', 'Proposed'].map(v => `<option value="${v}" ${v === SFILT.status ? 'selected' : ''}>${v === 'all' ? 'All' : v}</option>`).join('')}</select>
        ${showMoney ? srcChip('qb') : ''}<span class="k">${agShown.length} of ${allAgs.length} · sorted by renewal date</span></span></div>
      <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
      <table class="demo-tbl tbl-left">
        <thead><tr><th>Client / Territory</th><th>Program</th>${showMoney ? '<th style="text-align:right">Monthly Volume</th><th style="text-align:right">Annualized</th>' : ''}<th>Renewal</th><th>Plant · Cell</th><th>Status</th></tr></thead>
        <tbody>${agRows}
          ${showMoney ? `<tr style="font-weight:800;background:var(--color-bg-3)"><td colspan="2">Total (active + expiring)</td><td style="text-align:right">${fmt$(mrr)}/mo</td><td style="text-align:right">${fmt$(mrr * 12)}</td><td colspan="3"></td></tr>` : ''}
        </tbody>
      </table>
      </div>
    </div>
    <div class="demo-note">Demo environment · fictional data</div>`;
  $$('select[data-sfilt]').forEach(s => s.addEventListener('change', () => { SFILT[s.dataset.sfilt] = s.value; render(); }));
}
</script>
</body>
</html>
