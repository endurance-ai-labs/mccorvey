<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y8S — YATES Company Operations Portal</title>
<meta name="description" content="YATES Company, LLC (Y8S) — building automation & energy solutions. Jobs, billing, timesheets and forecasting in one operations portal. Demo environment.">
<meta property="og:site_name" content="Y8S Operations Portal">
<meta property="og:title" content="YATES Company, LLC — Operations Portal">
<meta property="og:description" content="Building Automation Systems Nurtured by Experience — jobs, billing, timesheets and forecasting in one place. Demo environment, fictional data.">
<meta property="og:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<link rel="icon" type="image/png" href="/yates/assets/brand/y8s-logo-transparent.png">
<link rel="stylesheet" href="/yates/css/theme.css">
<link rel="stylesheet" href="/yates/css/demo.css">
<link rel="stylesheet" href="/yates/css/yates.css">
</head>
<body>
<div id="topbar"></div>
<main class="page">
  <div class="demo-wrap" id="app"></div>
</main>

<script src="/yates/js/data.js"></script>
<script src="/yates/js/util.js"></script>
<script src="/yates/js/nav.js"></script>
<script src="/yates/vendor/chart.umd.min.js"></script>
<script src="/yates/js/yates-brain.js" defer></script>
<script>
YatesNav.renderTopbar({ subtitle: 'Operations Portal' });
const app = $('#app');
const internal = YatesMode.isInternal() && can('margins');

const M = JOBS.map(j => ({ j, m: jobMetrics(j) }));
const tot = f => M.reduce((s, x) => s + f(x), 0);
const backlog = tot(x => x.j.contract);
const earned  = tot(x => x.m.earned);
const costTD  = tot(x => x.m.cost);
const billed  = tot(x => x.m.billedAll);
const projMargin = tot(x => x.m.projMargin);
const overUnder = billed - earned;

if (internal) {
  /* ================= CFO EXECUTIVE DASHBOARD (collective) ================= */
  const rows = M.map(({ j, m }) => `
    <tr class="yclick" onclick="location.href='/yates/jobs/job/?id=${j.id}'">
      <td><b>${j.id}</b></td>
      <td>${esc(j.name)}<div class="ynote">${esc(j.pm)} · ${esc(j.sector)}</div></td>
      <td>${statusPill(j.status)}</td>
      <td style="text-align:right">${fmt$(j.contract)}</td>
      <td style="text-align:right">${fmt$(m.earned)}</td>
      <td><div class="ybar ${m.pct >= 100 ? 'g' : ''}"><i style="width:${Math.min(100, m.pct)}%"></i></div><div class="ynote">${fmtPct(m.pct, 0)}</div></td>
      <td style="text-align:right">${fmt$(m.cost)}</td>
      <td style="text-align:right;color:${m.marginToDate >= 0 ? 'var(--color-green)' : 'var(--color-red)'}">${fmt$(m.marginToDate)}</td>
      <td style="text-align:right">${fmt$(m.projMargin)} <span class="ynote">(${fmtPct(m.projMarginPct)})</span></td>
      <td style="text-align:right;color:${m.overUnder >= 0 ? 'var(--color-green)' : 'var(--color-amber)'}">${fmt$(m.overUnder)}</td>
    </tr>`).join('');

  const watch = M.filter(({ m }) => m.overUnder < -20000 || (m.pct > 5 && m.marginToDate / Math.max(1, m.earned) < 0.08))
    .map(({ j, m }) => `<li><a href="/yates/jobs/job/?id=${j.id}" style="color:var(--color-blue);font-weight:700">${j.id}</a> — ${
      m.overUnder < -20000 ? 'under-billed ' + fmt$(Math.abs(m.overUnder)) + '; accelerate the next pay application' : 'margin-to-date thin at ' + fmtPct(m.marginToDate / Math.max(1, m.earned) * 100) }.</li>`).join('')
    || '<li>No exceptions — all jobs inside billing and margin guardrails.</li>';

  app.innerHTML = `
    <div class="demo-hero">
      <div>
        <div class="demo-eyebrow">EXECUTIVE VIEW · ALL JOBS</div>
        <h1>The whole operation.<br><em>One picture.</em></h1>
        <div class="sub">One source of truth: QuickBooks financials, ServiceTitan field data, job costing and forecasting — no more exports, imports or spreadsheet rebuilds. Individual job drill-downs one click away.</div>
      </div>
      <div class="demo-hero-right">
        <span class="demo-live"><span class="dot"></span> LIVE · SYNCED ${fmtDate(todayISO()).toUpperCase()}</span>
        <span class="demo-src">Prepared for <b>${currentPersona().name}, ${currentPersona().title}</b></span>
        <span style="display:flex;gap:6px">${srcChip('qb')} ${srcChip('st')} ${srcChip('prop')}</span>
      </div>
    </div>

    <div class="ykpi-row">
      <div class="ykpi"><div class="l">Active Contract Backlog</div><div class="v">${fmtK(backlog)}</div><div class="s">${JOBS.length} active jobs</div></div>
      <div class="ykpi"><div class="l">Earned to Date</div><div class="v">${fmtK(earned)}</div><div class="s">${fmtPct(earned / backlog * 100)} of backlog</div></div>
      <div class="ykpi amber"><div class="l">Billed to Date</div><div class="v">${fmtK(billed)}</div><div class="s">${overUnder >= 0 ? 'over' : 'under'}-billed ${fmtK(Math.abs(overUnder))}</div></div>
      <div class="ykpi green"><div class="l">Margin to Date</div><div class="v">${fmtK(earned - costTD)}</div><div class="s">cost to date ${fmtK(costTD)}</div></div>
      <div class="ykpi red"><div class="l">Projected Gross Margin</div><div class="v">${fmtK(projMargin)}</div><div class="s">${fmtPct(projMargin / backlog * 100)} blended</div></div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Executive KPI Dashboard</h2><span class="k">a focused set — each tile is configurable per user</span></div>
      <div class="ykpi-row" style="margin-bottom:14px">
        <div class="ykpi"><div class="l">Utilization — Projects</div><div class="v">${UTILIZATION.current.projects}%</div><div class="s">${UTILIZATION.current.service}% service · ${UTILIZATION.current.overhead}% overhead</div></div>
        <div class="ykpi green"><div class="l">Service MRR</div><div class="v">${fmtK(SERVICE_AGREEMENTS.filter(a => a.status !== 'Proposed').reduce((s, a) => s + a.monthly, 0))}</div><div class="s">recurring, from the agreement book</div></div>
        <div class="ykpi"><div class="l">Cash on Hand</div><div class="v">${fmtK(KPI_SNAPSHOT.cashOnHand)}</div><div class="s">AR ${KPI_SNAPSHOT.arDays} days · AP ${KPI_SNAPSHOT.apDays} days</div></div>
        <div class="ykpi amber"><div class="l">Backlog Coverage</div><div class="v">${KPI_SNAPSHOT.backlogMonths} mo</div><div class="s">at current run-rate</div></div>
        <div class="ykpi"><div class="l">Bid Hit Rate</div><div class="v">${(() => { const w = BID_PIPELINE.filter(b => b.status === 'Won').length, l = BID_PIPELINE.filter(b => b.status === 'Lost').length; return Math.round(w / (w + l) * 100); })()}%</div><div class="s">trailing 6 months</div></div>
      </div>
      <div class="demo-aging">
        ${UTILIZATION.trend.slice(-4).map(t => `
        <div class="demo-aging-row" style="grid-template-columns:70px 1fr 150px">
          <div class="lab">${t.wk}</div>
          <div class="bar" style="display:flex;overflow:hidden">
            <i style="width:${t.projects}%;background:#083d75"></i><i style="width:${t.service}%;background:#2f9e6e"></i><i style="width:${t.overhead}%;background:#b98a36"></i>
          </div>
          <div class="amt" style="font-size:10.5px">${t.projects}% / ${t.service}% / ${t.overhead}%</div>
        </div>`).join('')}
      </div>
      <div class="ynote" style="margin-top:8px">Labor dollars costed to <b style="color:#4b86d1">projects</b> / <b style="color:#2f9e6e">service tickets</b> / <b style="color:#b98a36">overhead</b> — from timesheets + ServiceTitan, weekly.</div>
    </div>

    <div class="demo-two" style="margin-bottom:22px">
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Contract · Earned · Billed — Top 10 Jobs</h2><span class="k">$ thousands</span></div>
        <div class="demo-chart" style="height:280px"><canvas id="ch-jobs"></canvas></div>
      </div>
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Margin Bridge — Top 10 Jobs</h2><span class="k">projected at completion</span></div>
        <div class="demo-chart" style="height:280px"><canvas id="ch-margin"></canvas></div>
      </div>
    </div>

    <div class="demo-two" style="margin-bottom:22px">
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Monthly Budget vs Actual</h2><span style="display:flex;gap:8px;align-items:center">${srcChip('qb')}<a href="/yates/budget/" style="font-size:10px;font-weight:800;letter-spacing:0.08em;color:var(--color-blue);text-decoration:none">FULL REVIEW →</a></span></div>
        <div class="demo-chart" style="height:230px"><canvas id="ch-bva"></canvas></div>
        <div class="ynote" id="bva-note" style="margin-top:10px"></div>
      </div>
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>5-Year Growth Plan — Goals &amp; Hurdles</h2><span style="display:flex;gap:8px;align-items:center">${srcChip('prop')}<a href="/yates/forecast/" style="font-size:10px;font-weight:800;letter-spacing:0.08em;color:var(--color-blue);text-decoration:none">OPEN MODEL →</a></span></div>
        <div class="demo-chart" style="height:128px"><canvas id="ch-goal"></canvas></div>
        <div id="goal-hurdles" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>All Jobs — CFO Rollup</h2><span style="display:flex;gap:6px;align-items:center">${srcChip('qb')}${srcChip('st')}<span class="k">financials from QuickBooks · production from ServiceTitan</span></span></div>
      <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
        <table class="demo-tbl">
          <thead><tr><th>Job #</th><th>Project</th><th>Status</th><th style="text-align:right">Contract</th><th style="text-align:right">Earned</th><th>% Complete</th><th style="text-align:right">Cost to Date</th><th style="text-align:right">Margin to Date</th><th style="text-align:right">Projected Margin</th><th style="text-align:right">Over / (Under) Billed</th></tr></thead>
          <tbody>${rows}
            <tr style="font-weight:800;background:var(--color-bg-3)">
              <td colspan="3">Portfolio Total</td>
              <td style="text-align:right">${fmt$(backlog)}</td><td style="text-align:right">${fmt$(earned)}</td><td></td>
              <td style="text-align:right">${fmt$(costTD)}</td><td style="text-align:right">${fmt$(earned - costTD)}</td>
              <td style="text-align:right">${fmt$(projMargin)}</td><td style="text-align:right">${fmt$(overUnder)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Watch Items</h2><span class="k">auto-flagged</span></div>
      <ul style="font-size:13px;line-height:1.9;color:var(--color-cloud-whisper);padding-left:20px">${watch}</ul>
    </div>
    <div class="demo-note">Y8S Operations Portal — demo environment, fictional data · concept build by Endurance AI Labs</div>`;

  /* charts — top 10 jobs by contract for readability */
  const TOP = M.slice().sort((a, b) => b.j.contract - a.j.contract).slice(0, 10);
  const labels = TOP.map(x => x.j.id);
  const css = getComputedStyle(document.documentElement);
  const cBlue = css.getPropertyValue('--color-blue').trim() || '#005c97';
  const cGreen = css.getPropertyValue('--color-green').trim() || '#4f7d5d';
  new Chart($('#ch-jobs'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Contract', data: TOP.map(x => x.j.contract / 1e3), backgroundColor: 'rgba(27,34,48,0.16)' },
      { label: 'Earned', data: TOP.map(x => x.m.earned / 1e3), backgroundColor: cBlue },
      { label: 'Billed', data: TOP.map(x => x.m.billedAll / 1e3), backgroundColor: cGreen },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: { y: { ticks: { callback: v => '$' + v.toLocaleString() + 'K', font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
  });
  new Chart($('#ch-margin'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Budget Cost', data: M.map(x => x.m.budget / 1e3), backgroundColor: 'rgba(198,151,17,0.55)', stack: 's' },
      { label: 'Projected Margin', data: TOP.map(x => x.m.projMargin / 1e3), backgroundColor: cBlue, stack: 's' },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: { x: { stacked: true, ticks: { font: { size: 10 } } }, y: { stacked: true, ticks: { callback: v => '$' + v.toLocaleString() + 'K', font: { size: 10 } } } } }
  });


  /* ---------- Monthly Budget vs Actual (mirrors /budget/ series) ---------- */
  (function () {
    const season = [0.92, 0.95, 1.06, 1.10, 1.02, 0.88, 0.90, 0.97, 1.04, 1.08, 1.10, 1.05];
    const series = [];
    const start = new Date('2024-08-15T12:00:00');
    for (let i = 0; i < 24; i++) {
      const d = new Date(start); d.setMonth(d.getMonth() + i);
      const surge = (i >= 2 && i <= 4) ? 1.22 : 1;
      series.push({ lbl: d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }), rev: 1880000 * season[d.getMonth() % 12] * surge * Math.pow(1.006, i) });
    }
    const last6 = series.slice(18, 24);
    /* budget = same month prior year + 7% planned growth (how the plan is actually set) */
    const bud = last6.map((m, i) => series[18 + i - 12].rev * 1.07);
    const cBlue2 = getComputedStyle(document.documentElement).getPropertyValue('--color-blue').trim();
    new Chart($('#ch-bva'), {
      type: 'bar',
      data: { labels: last6.map(m => m.lbl), datasets: [
        { label: 'Budget', data: bud.map(v => v / 1e3), backgroundColor: 'rgba(27,34,48,0.18)' },
        { label: 'Actual', data: last6.map(m => m.rev / 1e3), backgroundColor: last6.map((m, i) => m.rev >= bud[i] ? '#2f9e6e' : '#b98a36') },
      ]},
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: { y: { ticks: { callback: v => '$' + v.toLocaleString() + 'K', font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
    });
    const cur = last6[5], curBud = bud[5];
    const varPct = (cur.rev - curBud) / curBud * 100;
    const onBudget = last6.filter((m, i) => Math.abs(m.rev - bud[i]) / bud[i] <= 0.05).length;
    $('#bva-note').innerHTML = `${cur.lbl}: actual <b>${fmtK(cur.rev)}</b> vs budget ${fmtK(curBud)} — <b style="color:${varPct >= 0 ? 'var(--color-green)' : 'var(--color-amber)'}">${varPct >= 0 ? '+' : ''}${varPct.toFixed(1)}%</b>. ${onBudget} of 6 months within ±5% of budget. Green = at/above budget, amber = below.`;
  })();

  /* ---------- 5-Year plan vs goal hurdles (reads the saved scenario) ---------- */
  (function () {
    const BASE_C = 24.6e6;
    const BASE_S = SERVICE_AGREEMENTS.filter(a => a.status !== 'Proposed').reduce((x, a) => x + a.monthly, 0) * 12;
    let P;
    try { P = JSON.parse(localStorage.getItem('yates-5yr') || 'null'); if (P && P.goal == 300) P.goal = 500; } catch (e) {}
    P = P || { constrGrowth: 8, svcGrowth: 20, escalation: 3, newClientsY1: 4, newClientsRamp: 2, newClientSize: 850000, newClientRepeat: 70, newSvcPerYear: 12, newSvcMRR: 1800, churn: 6, attachPct: 60, attachMRR: 2400, gmConstr: 24, gmSvc: 42, ohPct: 13, ohScale: 0.85, goal: 500, acq: [{ year: 2, revenue: 8e6, gm: 26, rec: 35, growth: 12 }, { year: 4, revenue: 20e6, gm: 24, rec: 30, growth: 10 }] };
    const esc2 = P.escalation / 100;
    const R = [1, 2, 3, 4, 5].map(y => {
      const co = BASE_C * Math.pow(1 + P.constrGrowth / 100 + esc2, y);
      let nc = 0;
      for (let c = 1; c <= y; c++) nc += (P.newClientsY1 + P.newClientsRamp * (c - 1)) * P.newClientSize * Math.pow(P.newClientRepeat / 100, y - c) * Math.pow(1 + esc2, y);
      const sb = BASE_S * Math.pow(1 + P.svcGrowth / 100, y);
      let sn = 0;
      for (let c = 1; c <= y; c++) sn += (P.newSvcPerYear * P.newSvcMRR * 12 + (P.newClientsY1 + P.newClientsRamp * (c - 1)) * (P.attachPct / 100) * P.attachMRR * 12) * Math.pow(1 - P.churn / 100, y - c);
      let ar = 0, arec = 0;
      (P.acq || []).forEach(q => { if (y >= q.year) { const r2 = q.revenue * Math.pow(1 + q.growth / 100, y - q.year); ar += r2; arec += r2 * q.rec / 100; } });
      const total = co + nc + sb + sn + ar;
      const gp = (co + nc) * P.gmConstr / 100 + (sb + sn) * P.gmSvc / 100 + ar * 0.24;
      const oh = total * (P.ohPct / 100) * Math.pow(P.ohScale, Math.log2(Math.max(1, total / (BASE_C + BASE_S))));
      return { y, total, recurring: sb + sn + arec, ebitda: gp - oh };
    });
    const goal = (P.goal || 500) * 1e6;
    const goalPath = [1, 2, 3, 4, 5].map(y => (BASE_C + BASE_S) * Math.pow(goal / (BASE_C + BASE_S), y / 5));
    new Chart($('#ch-goal'), {
      data: { labels: R.map(r => 'Y' + r.y), datasets: [
        { type: 'line', label: 'Plan', data: R.map(r => r.total / 1e6), borderColor: getComputedStyle(document.documentElement).getPropertyValue('--color-blue').trim(), pointRadius: 3, tension: 0.3 },
        { type: 'line', label: 'Goal path', data: goalPath.map(v => v / 1e6), borderColor: 'rgba(200,80,60,0.85)', borderDash: [6, 5], pointRadius: 0 },
      ]},
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9.5 } } } },
        scales: { y: { ticks: { callback: v => '$' + v + 'M', font: { size: 9.5 } } }, x: { ticks: { font: { size: 9.5 } } } } }
    });
    const chip = (ok, close) => ok ? '<span class="demo-chip ok">ON TRACK</span>' : close ? '<span class="demo-chip warn">AT RISK</span>' : '<span class="demo-chip bad">BEHIND</span>';
    const hurdles = [
      ['Year-1 revenue hurdle', fmtK(goalPath[0]), fmtK(R[0].total), R[0].total >= goalPath[0] * 0.95, R[0].total >= goalPath[0] * 0.8],
      ['Year-3 revenue hurdle', fmtK(goalPath[2]), fmtK(R[2].total), R[2].total >= goalPath[2] * 0.95, R[2].total >= goalPath[2] * 0.8],
      ['Recurring ≥ 15% of revenue by Y3', '15%', fmtPct(R[2].recurring / R[2].total * 100, 1), R[2].recurring / R[2].total >= 0.15, R[2].recurring / R[2].total >= 0.11],
      ['EBITDA ≥ 10% by Y5', '10%', fmtPct(R[4].ebitda / R[4].total * 100, 1), R[4].ebitda / R[4].total >= 0.10, R[4].ebitda / R[4].total >= 0.07],
      ['Acquisitions closed by Y3', '≥ 2', String((P.acq || []).filter(q => q.year <= 3).length), (P.acq || []).filter(q => q.year <= 3).length >= 2, (P.acq || []).filter(q => q.year <= 3).length >= 1],
    ];
    $('#goal-hurdles').innerHTML = `<table class="demo-tbl tbl-left" style="font-size:11px">
      <thead><tr><th>Performance Hurdle</th><th style="text-align:right">Target</th><th style="text-align:right">Plan</th><th style="width:90px">Status</th></tr></thead>
      <tbody>${hurdles.map(h => `<tr><td>${h[0]}</td><td style="text-align:right">${h[1]}</td><td style="text-align:right;font-weight:700">${h[2]}</td><td>${chip(h[3], h[4])}</td></tr>`).join('')}</tbody>
    </table>
    <div class="ynote" style="margin-top:6px">Hurdles derive from the $${P.goal || 500}M goal path — the current saved scenario in the 5-Year Growth Model drives this card live.</div>`;
  })();

} else {
  /* ================= CLIENT LANDING ================= */
  const cards = M.map(({ j, m }) => `
    <a class="demo-prop" href="/yates/jobs/job/?id=${j.id}" style="text-decoration:none">
      <div class="demo-prop-visual has-photo" style="background:${j.photos.length ? `url('${j.photos[Math.min(3, j.photos.length - 1)].src}') center/cover` : 'linear-gradient(135deg,#002944,#005c97)'};height:120px;position:relative">
        <span class="demo-prop-state" style="position:absolute;top:10px;right:10px">${statusPill(j.status)}</span>
      </div>
      <div class="demo-prop-body">
        <div class="demo-prop-name">${esc(j.name.split('—')[0].trim())}</div>
        <div class="demo-prop-loc">${esc(j.address)}</div>
        <div class="demo-prop-stats">
          <div><div class="v">${fmtPct(m.pct, 0)}</div><div class="l">Complete</div></div>
          <div><div class="v">${fmtDateShort(j.finish)}</div><div class="l">Target Finish</div></div>
          <div><div class="v">${j.reports.length}</div><div class="l">Reports</div></div>
        </div>
      </div>
    </a>`).join('');

  app.innerHTML = `
    <div class="demo-hero">
      <div>
        <div class="demo-eyebrow">CLIENT PORTAL</div>
        <h1>Your projects,<br><em>fully transparent.</em></h1>
        <div class="sub">Live progress, schedules, photo documentation and owner reports for every controls project YATES Company is delivering for you.</div>
      </div>
      <div class="demo-hero-right"><span class="demo-live"><span class="dot"></span> LIVE</span></div>
    </div>
    <div class="demo-props" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${cards}</div>
    <div class="demo-note">YATES Company, LLC · Building Automation Systems Nurtured by Experience — demo environment, fictional data</div>`;
}
</script>
</body>
</html>
