    else if (L[i + 1][j] >= L[i][j + 1]) x.push(`<del class="w">${esc(A[i++])}</del>`);
    else y.push(`<ins>${esc(B[j++])}</ins>`);
  }
  while (i < n) x.push(`<del class="w">${esc(A[i++])}</del>`);
  while (j < m) y.push(`<ins>${esc(B[j++])}</ins>`);
  /* merge runs so a changed phrase reads as one mark */
  return [x.join(' ').replace(/<\/del> <del class="w">/g, ' '), y.join(' ').replace(/<\/ins> <ins>/g, ' ')];
}

function checks() {
  const out = [];
  const add = (level, stepKey, msg, sub, fix, fixLbl) => out.push({ level, step: stepKey, msg, sub, fix, fixLbl });
  if (!META.gc) add('error', 'load', 'General contractor / CM is blank', 'Needed on the proposal and every RFI.', "go('load','gc')", 'Fill in');
  if (!META.bidNo) add('error', 'load', 'Bid number is blank', '', "go('load','bidNo')", 'Fill in');
  if (!META.due) add('error', 'load', 'Bid due date is blank', '', "go('load','due')", 'Fill in');
  else if (daysTo(META.due) < 0) add('error', 'load', 'Bid due date has passed', fmtDate(META.due), "go('load','due')", 'Fix date');
  else if (daysTo(META.due) <= 3) add('warn', 'load', `Bid due in ${daysTo(META.due)} day${daysTo(META.due) === 1 ? '' : 's'}`, fmtDate(META.due));

  /* bid form items the spec book cannot settle: one confirm each, checked before the proposal goes out */
  const F = FS();
  const hi = F.filter(f => f.sev === 'high' && !dec(f).ok);
  if (hi.length) add('error', 'decide', `${hi.length} high-severity finding${hi.length > 1 ? 's' : ''} not reviewed`, 'Each needs a Price / RFI / Qualify / Exclude decision.', "go('decide','needs')", 'Review');
  const rest = F.filter(f => f.sev !== 'high' && !dec(f).ok);
  if (rest.length) add('warn', 'decide', `${rest.length} medium/info finding${rest.length > 1 ? 's' : ''} will use the recommended decision`, '', 'acceptAll(true)', 'Accept all');
  const zero = F.filter(needsAmt);
  if (zero.length) add('error', 'decide', `${zero.length} priced finding${zero.length > 1 ? 's have' : ' has'} no dollar amount`, 'Enter the $, or carry it as an allowance (listed in the proposal as not included).', "go('decide','noamt')", 'Fix');
  const rx = F.filter(f => reqOf(f) === 'must' && dec(f).act === 'exclude');
  if (rx.length) add('warn', 'decide', `${rx.length} required item${rx.length > 1 ? 's are' : ' is'} excluded`, 'The spec says "shall". Excluding it makes the bid non-compliant unless the GC agrees.', "go('decide','req')", 'Review');
  const al = ALLOWS();
  if (al.length) add('warn', 'decide', `${al.length} item${al.length > 1 ? 's' : ''} carried as allowances (TBD)`, 'Listed in the proposal as not included in the base bid, to be priced.', "go('decide','allow')", 'Review');

  const noAmt = [], noText = [];
  DIFFS().forEach(d => d.changes.forEach((c, i) => { const r = chgResp(d, i); if (r.resp === 'add' && !r.amt) noAmt.push(d.sec); if (r.resp === 'qual' && !r.text.trim()) noText.push(d.sec); }));
  if (noAmt.length) add('warn', 'changes', `${noAmt.length} change${noAmt.length > 1 ? 's' : ''} marked Add $ with no amount`, [...new Set(noAmt)].join(' · '), "go('changes')", 'Fix');
  if (noText.length) add('warn', 'changes', `${noText.length} change qualification${noText.length > 1 ? 's are' : ' is'} blank`, '', "go('changes')", 'Fix');
  const un = DIFFS().filter(d => !acked(d));
  if (un.length) add('error', 'changes', `${un.length} changed section${un.length > 1 ? 's' : ''} not confirmed`, 'Confirm each change is in your number.', "go('changes')", 'Confirm');
  if (BOOK.local && !PRIOR && DIFFS().length) add('warn', 'changes', 'Line-level changes not compared', 'Load the prior issue PDF to see each changed sentence.', "$('#pick-prior').click()", 'Load prior');

  const C = CONFS();
  staleSecs().forEach(s => {
    const covered = C.some(c => inLog(c) && ['a', 'b', 'c'].some(k => c[k] && c[k].sec === s.id));
    if (!covered) add('error', 'rfis', `${s.id} is still at ${iss(s.issue)} with no RFI`, s.title, "go('rfis')", 'Add RFI');
  });
  const drafts = C.filter(c => inLog(c) && rs(c.id).status === 'draft');
  if (drafts.length) add('warn', 'rfis', `${drafts.length} RFI${drafts.length > 1 ? 's' : ''} not sent yet`, 'Open RFIs print as bid assumptions.', "go('rfis')", 'Send');

  const S = sheet();
  if (!META.pkgOk) add('error', 'proposal', 'Confirm the bid package items that are not in the spec book', `Bonds, insurance limits, bid validity, due time and delivery method: check the bid instructions from ${META.gc || 'the GC'}.`, "confirmPF('pkgOk')", 'Confirm');
  if (BOOK.inputs && !META.attachOk) add('error', 'proposal', 'Confirm the attachments the spec book requires with the bid', ATTACH().map(r => `${r.item} (${r.sec})`).join(' · '), "confirmPF('attachOk')", 'Confirm');
  if (!S) add('error', 'proposal', 'Bid sheet is not built from this spec book', BOOK.takeoff ? 'Review what will be built, then confirm.' : 'One click adds your priced adders to the current bid sheet.', 'buildSheet()', 'Build');
  else {
    const dif = BC.adderDiff(S, ADDERS());
    if (dif.length) add('error', 'proposal', `${dif.length} spec adder${dif.length > 1 ? 's' : ''} out of sync with the bid sheet`, dif.slice(0, 2).map(x => x.title + (x.kind === 'amount' ? ` (sheet ${money(x.sheet)}, spec ${money(x.spec)})` : ' (' + x.kind + ')')).join(' · '), 'syncSheet()', 'Sync');
    if (!S.lines.some(l => BC.inc(l) && !l.scope.startsWith(BC.ADDER))) add('error', 'proposal', 'Bid sheet has no base scope lines', '', "location.href='/mccorvey/bidmodel/'", 'Open sheet');
    const T = BC.totals(S);
    if (T.margin < BC.FLOOR) add('error', 'proposal', `Margin ${T.margin.toFixed(1)}% is below the ${BC.FLOOR}% walk-away floor`, '', "location.href='/mccorvey/bidmodel/'", 'Adjust');

    else if (T.mp === 'tight') add('warn', 'proposal', 'Crew check is tight (over 85% of available)', '');
  }
  return out;
}

  let S;
  const meta = { project: projName() + ' — ' + CO() + ' — ' + (META.lens === 'plumb' ? 'Plumbing' : META.lens === 'mech' ? 'Plumbing + HVAC' : META.lens === 'all' ? 'Mechanical' : 'HVAC Ductwork'), gc: META.gc, bidNo: META.bidNo, due: META.due, valid: +META.valid || 30, specKey: BOOK.key };
  if (BOOK.takeoff) { const src = takeoffFor(); S = BC.startSheet(meta, src); S.lines.forEach((l, i) => { const x = src[i] || {}; if (x.lens) l.lens = x.lens; if (x.aff) l.aff = true; if (x.bim) l.bim = true; }); }
  else { S = BC.load() || BC.startSheet(meta, []); Object.assign(S.meta, meta); }
  const r = BC.syncAdders(S, ADDERS()); recomputeBim(S); BC.save(S);
  if (quiet) return;
  rerender(); toast(`Bid sheet ${BOOK.takeoff ? 'built from the takeoff' : 'linked'} · ${r.added} spec adders added`);
}
function syncSheet() {
  const S = sheet(); if (!S) return buildSheet();
  Object.assign(S.meta, { gc: META.gc, bidNo: META.bidNo, due: META.due, valid: +META.valid || 30 });
  if (S.status === 'confirmed') S.status = 'draft';
  const r = BC.syncAdders(S, ADDERS()); recomputeBim(S); BC.save(S);

function issueProposal() { if (checks().some(c => c.level === 'error')) { toast('Fix the preflight issues first'); return; } window.print(); }
/* the proposal prints on its own: a copy goes into #print-root for the print, then comes out again.
   The document title becomes the saved PDF's file name. Works for the button and for Ctrl+P on this step. */
function buildPrintRoot() {
  const doc = document.getElementById('pdoc'); if (!doc) return false;
  clearPrintRoot();
  const draft = checks().some(c => c.level === 'error');
  const root = document.createElement('div'); root.id = 'print-root';
  const kw = doc.classList.contains('kw');
  if (kw) {
    const LH = letterhead();
    root.className = 'kwp';
    root.innerHTML = `<div class="kwp-bg">${LH.cont ? `<img src="${LH.cont}" alt="">` : '<i class="t"></i><i class="r"></i><i class="l"></i><i class="l2"></i><i class="f"></i>'}<span class="run">${esc(LH.run)}</span>${LH.art ? '' : `<div class="kwp-foot">${letterhead().foot || ''}</div>`}</div>
      <div class="kwp-first">${LH.firstArt ? `<img src="${LH.firstArt}" alt="">` : `<i class="t"></i><i class="r"></i><i class="l"></i><i class="l2"></i><i class="f"></i><div class="kwp-foot">${LH.foot}</div>`}</div>
      <table class="pr-t"><thead><tr><td class="kwp-th"></td></tr></thead><tbody><tr><td class="kwp-td"><div class="pdoc kw ${LH.art ? 'art' : 'drawn'} ${draft ? 'draft' : ''}">${doc.innerHTML}</div></td></tr></tbody><tfoot><tr><td class="kwp-tf"></td></tr></tfoot></table>`;
  } else root.innerHTML = `<table class="pr-t"><thead><tr><td></td></tr></thead><tbody><tr><td><div class="pdoc ${draft ? 'draft' : ''}">${doc.innerHTML}</div></td></tr></tbody><tfoot><tr><td></td></tr></tfoot></table>`;
  document.body.appendChild(root); document.body.classList.add('printing-proposal');
  const pc = document.createElement('style'); pc.id = 'print-page-css';
  const tag = `${propNo()} · Rev ${revOf()} · ${CONAME()}`.replace(/["\\]/g, '');
  if (kw) pc.textContent = `@page kwletter { size: letter; margin: 0 0 0.28in 0; @bottom-center { content: counter(page); font: 8.5pt 'Segoe UI', Arial, sans-serif; color: #404040; vertical-align: top; } } @page kwletter:first { @bottom-center { content: none; } }`; else
  pc.textContent = `@page proposal { size: letter; margin: 0 0 0.45in 0; @bottom-left { content: "${tag}"; font: 8pt Arial, sans-serif; color: #5a6676; margin-left: 0.7in; vertical-align: top; } @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt Arial, sans-serif; color: #5a6676; margin-right: 0.7in; vertical-align: top; } }`;
  document.head.appendChild(pc);
  window.__ptitle = document.title;
  document.title = [kw ? CO() + ' Proposal' : 'McCorvey Proposal', projName(), META.bidNo].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  return true;
}
function clearPrintRoot() {

function cp(txt, msg) { const done = () => toast(msg); if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fb(txt, done)); else fb(txt, done); }
function fb(txt, cb) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); cb(); }

function bind() {
  document.querySelectorAll('input[data-chgamt]').forEach(inp => {
    inp.oninput = () => {
      const k = inp.dataset.chgamt, v = +inp.value.replace(/[^\d.]/g, '') || 0, cov = inp.dataset.cov;
      if (cov) { DEC[cov] = Object.assign({}, DEC[cov], { act: 'price', amt: v, ok: true }); DEC[k] = Object.assign({}, DEC[k], { resp: 'add' }); }
      else DEC[k] = Object.assign({}, DEC[k], { resp: 'add', amt: inp.dataset.neg === '1' ? -v : v });
      saveDec(); liveChg(k); refreshChrome();
    };
    inp.onchange = () => { const v = +inp.value.replace(/[^\d.]/g, '') || 0; inp.value = v ? Math.round(v).toLocaleString() : ''; rerender(); toast(inp.dataset.cov ? `Finding priced at ${money(v)}` : `Change ${inp.dataset.neg === '1' ? 'credit' : 'adder'} of ${money(v)} on the bid sheet`); };
    inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  });
  document.querySelectorAll('textarea[data-chgtext]').forEach(t => { t.oninput = () => { const k = t.dataset.chgtext; DEC[k] = Object.assign({}, DEC[k], { resp: 'qual', text: t.value }); saveDec(); refreshPdoc(); }; });
  document.querySelectorAll('textarea[data-ftext]').forEach(t => { t.oninput = () => { const id = t.dataset.ftext; DEC[id] = Object.assign({}, DEC[id], { text: t.value }); saveDec(); refreshPdoc(); }; });
  document.querySelectorAll('textarea[data-std]').forEach(t => { t.oninput = () => { META.std = Object.assign({}, META.std, { [t.dataset.std]: t.value }); saveMeta(); refreshPdoc(); }; });
  document.querySelectorAll('textarea[data-rfiq]').forEach(t => { t.oninput = () => { const id = t.dataset.rfiq; RS[id] = Object.assign(rs(id), { q: t.value }); saveRS(); rfiLive(id); }; });
  document.querySelectorAll('textarea[data-rfia]').forEach(t => { t.oninput = () => { const id = t.dataset.rfia; RS[id] = Object.assign(rs(id), { assume: t.value }); saveRS(); rfiLive(id); }; });
  document.querySelectorAll('select[data-mx]').forEach(t => { t.onchange = () => { META.mx = Object.assign({}, META.mx, { [t.dataset.mx]: t.value }); saveMeta(); refreshPdoc(); }; });
  document.querySelectorAll('[data-meta]').forEach(inp => {
    inp.oninput = () => {
      const k = inp.dataset.meta; META[k] = inp.type === 'number' ? (+inp.value || '') : inp.value; saveMeta();
      if (['gc', 'bidNo', 'due'].includes(k)) inp.classList.toggle('miss', !inp.value);
      refreshChrome();
      if (step === 'proposal') { const S = sheet(); $('#pdoc').innerHTML = proposalHTML(S, S ? BC.totals(S) : null); }
    };
    if (step === 'proposal' && inp.tagName !== 'TEXTAREA') inp.onchange = () => rerender();
  });
  document.querySelectorAll('input[data-amt]').forEach(inp => {
    inp.oninput = () => {
      const v = +inp.value.replace(/[^\d.]/g, '') || 0, id = inp.dataset.amt, f = BOOK.findings.find(x => x.id === id), c = pbCalc(f);
      const D = Object.assign({}, DEC[id], { act: 'price', amt: v });
      if (!v && c && !c.L.fixed && c.qty > 0) delete D.amt;
      DEC[id] = D; saveDec(); inp.dataset.dirty = 1;
      inp.classList.toggle('miss', !(dec(f).amt > 0)); refreshChrome();
    };
    inp.onblur = () => {
      const id = inp.dataset.amt, f = BOOK.findings.find(x => x.id === id), a = dec(f).amt;
      inp.value = a ? Math.round(a).toLocaleString() : '';
      const was = (DEC[id] || {}).ok;
      if (a > 0 && !was) { DEC[id] = Object.assign({}, DEC[id], { ok: true }); saveDec(); }
      if ((a > 0 && !was) || (inp.dataset.dirty && pbCalc(f))) setTimeout(() => repaintCard(id), 0);
      delete inp.dataset.dirty;
    };
    inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  });
  document.querySelectorAll('input[data-qty]').forEach(inp => {
    inp.oninput = () => {
      const id = inp.dataset.qty, f = BOOK.findings.find(x => x.id === id), v = +inp.value.replace(/[^\d.]/g, '') || 0;
      const D = Object.assign({}, DEC[id], { act: 'price' }); delete D.amt;
      if (v > 0) D.qty = v; else delete D.qty;
      DEC[id] = D; saveDec(); inp.dataset.dirty = 1;
      const a = dec(f).amt, o = document.querySelector(`b[data-qamt="${id}"]`), ai = document.querySelector(`input[data-amt="${id}"]`);
      if (o) o.textContent = v > 0 ? money(a) : '—';
      if (ai) { ai.value = a ? Math.round(a).toLocaleString() : ''; ai.classList.toggle('miss', !(a > 0) && !dec(f).allow); }
      refreshChrome();
    };
    inp.onblur = () => {
      const id = inp.dataset.qty, f = BOOK.findings.find(x => x.id === id), q = +(DEC[id] || {}).qty || 0;
      inp.value = q ? q.toLocaleString() : '';
      if (!inp.dataset.dirty) return;
      delete inp.dataset.dirty;
      if (dec(f).amt > 0 && !(DEC[id] || {}).ok) { DEC[id] = Object.assign({}, DEC[id], { ok: true }); saveDec(); }
      setTimeout(() => repaintCard(id), 0);
    };
    inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  });
  const q = document.getElementById('fq');
  if (q) q.oninput = () => { UI.q = q.value; const pos = q.selectionStart; rerender(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(pos, pos); };
  const drop = document.getElementById('drop');
  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over'); }

/* ---------- load a real book (in-browser) ---------- */
function ov(show, h) { $('#ov').classList.toggle('show', show); if (h) $('#ov-h').textContent = h; }
function prog(msg, f) { $('#ov-st').textContent = msg; $('#ov-bar').style.width = Math.round(f * 100) + '%'; }
async function loadBook(file) {
  if (!file) return;
  ov(true, 'Reading ' + file.name); prog('Loading PDF reader…', 0.02);
  try {
    const t0 = performance.now();
    const r = await E.analyze(file, prog);
    BOOK = r.book; RAW = r.raw; PRIOR = null;
    setFile(file);
    if (window.Illustrative) {
      BOOK.projSF = Illustrative.projectSF(BOOK, RAW) || 0; applyProfile();
      leadPerRule(BOOK);
      Illustrative.prepare(BOOK, RAW, window.BuildUps);
      if (!BOOK.takeoff && window.SPECBOOK && window.SPECBOOK.takeoff) { const k = (BOOK.projSF || 1290000) / 1290000; BOOK.takeoff = window.SPECBOOK.takeoff.map(l => Object.assign({}, l, l.unit === 'LS' ? { qty: 1, mat: Math.round(l.mat * k / 1000) * 1000 } : { qty: Math.round(l.qty * k / 10) * 10 })); BOOK.takeoffIllustrative = true; }
      BOOK.diffs = Illustrative.diffs(BOOK, E.lensOf, E.YOURS);
    }
    BOOK.readSec = Math.max(1, Math.round((performance.now() - t0) / 1000)); BOOK._house = true;
    E.store.sset('msm-spec-local', BOOK); E.store.sset('msm-spec-active', 'local');
    step = 'load'; loadState(); applyHouse(); ov(false); render();
    toast(`Read ${pgs(BOOK.totalPages)} pages in ${((performance.now() - t0) / 1000).toFixed(0)}s — fill in the bid setup to start`);
  } catch (e) { ov(false); toast('Could not read that PDF: ' + e.message); console.error(e); }
}
async function loadPrior(file) {
  if (!file) return;
  if (!RAW) { toast('Reload your book first — its text is kept in memory only'); return; }
  ov(true, 'Comparing against ' + file.name); prog('Loading prior issue…', 0.02);
  try {
    const pages = await E.extract(file, (d, n) => prog('Reading prior page ' + pgs(d) + ' of ' + pgs(n), d / n * 0.9));
    prog('Comparing sentence by sentence', 0.94);
    PRIOR = E.buildSections(pages);
    BOOK.diffs = E.diffBooks(RAW, PRIOR, s => E.YOURS.includes(s.div) || E.HOOKS.includes(s.div));
    E.store.sset('msm-spec-local', BOOK);
    ov(false); go('changes'); toast(`${BOOK.diffs.length} sections changed versus ${file.name}`);
  } catch (e) { ov(false); toast('Could not compare: ' + e.message); console.error(e); }
}
function resetDemo() {
  if (!confirm('Reset this book to step 1? Every decision, confirmed change, RFI status and bid detail on it is cleared, and the bid sheet goes back to what it was before.')) return;
  ['msm-spec-dec-', 'msm-spec-meta-', 'msm-spec-rfi-', 'msm-spec-letter-'].forEach(k => { try { localStorage.removeItem(k + BOOK.key); } catch (e) {} });
  /* put back the bid sheet that was there before this book built one */
  try {
    const S = BC.load();
    if (S && S.meta.specKey === BOOK.key) {
      let bk = localStorage.getItem(BC.KEY_STATE + '-backup');
      try { const b = JSON.parse(bk || 'null'); if (b && b.meta && String(b.meta.project || '').startsWith(BOOK.name)) bk = null; } catch (e) { bk = null; }
      if (bk) { localStorage.setItem(BC.KEY_STATE, bk); localStorage.setItem(BC.KEY_REVS, localStorage.getItem(BC.KEY_REVS + '-backup') || '[]'); }
      else { localStorage.removeItem(BC.KEY_STATE); localStorage.setItem(BC.KEY_REVS, '[]'); }
    }
  } catch (e) {}
  Object.assign(UI, { filter: 'needs', q: '', showMatrix: false, showSecs: false, openRfi: null, rtype: null, cx: 'all', showPB: false, se: null, handoff: false, part: null, words: false });
  step = 'load'; history.replaceState(null, '', '#load');
  loadState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('Demo reset — back to step 1');
}
