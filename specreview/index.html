<html lang="en">

<meta name="description" content="McCorvey Sheet Metal — one guided flow from spec book to issued proposal: load, decide findings, confirm changes, send RFIs, preflight-checked proposal. Demo environment, fictional sample book.">

<style>
  .sb-mode { display:inline-flex; align-items:center; gap:7px; font-size:10px; font-weight:800; letter-spacing:.1em; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); }
  .sb-mode i { width:7px; height:7px; border-radius:50%; background:#f0b429; }
  .sb-mode.local i { background:#2f9e6e; }
  .sb-hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .sb-hbtns .pa-btn { background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.22); }
  .sb-hbtns .pa-btn:hover { background:rgba(255,255,255,.16); color:#fff; border-color:#fff; }

  .sb-steps { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; margin:0 0 18px; position:sticky; top:var(--sb-dock, 150px); z-index:40; background:var(--color-bg); padding:8px 0; }
  .sb-step { display:flex; gap:10px; align-items:center; text-align:left; font:inherit; border:1px solid var(--color-border); background:var(--color-bg-2); border-radius:12px; padding:10px 12px; cursor:pointer; min-width:0; }
  .sb-step:hover { border-color:var(--color-blue); }
  .sb-step .k { flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; background:var(--color-bg-3); color:var(--color-text-muted); }
  .sb-step .t { min-width:0; }
  .sb-step .t b { display:block; font-size:12.8px; color:var(--color-cloud-whisper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-step .t span { display:block; font-size:11px; color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-step.done .k { background:#2f9e6e; color:#fff; }
  .sb-step.err .k { background:#c8102e; color:#fff; }
  .sb-step.warn .k { background:var(--color-amber); color:#fff; }
  .sb-step.on { border-color:#14283c; box-shadow:0 0 0 2px #14283c inset; }

  .sb-nav { display:flex; justify-content:space-between; gap:10px; margin:22px 0 8px; flex-wrap:wrap; }
  .sb-nav .pa-btn { height:44px; padding:0 22px; font-size:13px; }

  .sb-src { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .sb-card { border:1px solid var(--color-border); border-radius:14px; padding:18px 20px; background:var(--color-bg-2); display:flex; flex-direction:column; gap:10px; }
  .sb-card.cur { border-color:#14283c; box-shadow:0 0 0 2px #14283c inset; }
  .sb-card h3 { margin:0; font-size:15px; color:var(--color-cloud-whisper); }
  .sb-card p { margin:0; font-size:12.5px; color:var(--color-text-muted); line-height:1.55; }
  .sb-card .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:auto; }
  .sb-drop { border:2px dashed var(--color-border); border-radius:12px; padding:14px; text-align:center; font-size:12px; color:var(--color-text-muted); cursor:pointer; }
  .sb-drop.over, .sb-drop:hover { border-color:var(--color-blue); background:var(--color-blue-pale); color:var(--color-blue); }
  .sb-tag { font-size:9.5px; font-weight:800; letter-spacing:.09em; padding:3px 8px; border-radius:5px; background:#2f9e6e; color:#fff; align-self:flex-start; }

  .sb-form { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px 14px; }
  .sb-f { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .sb-f > span { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--color-slate-hint); }
  .sb-f input, .sb-f select, .sb-f textarea { font:inherit; font-size:13.5px; font-weight:600; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); min-width:0; box-sizing:border-box; width:100%; }
  .sb-f input:focus, .sb-f select:focus, .sb-f textarea:focus { outline:none; border-color:var(--color-blue); }
  .sb-f input.miss { border-color:#c8102e; background:rgba(200,16,46,.05); }
  .sb-f.wide { grid-column:span 2; } .sb-f.full { grid-column:1 / -1; }
  .sb-lens { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .sb-lens button { font:inherit; font-size:12.5px; font-weight:700; padding:11px 10px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-muted); cursor:pointer; }
  .sb-lens button.on { background:#14283c; color:#fff; border-color:#14283c; }
  .sb-lens button:hover:not(.on) { border-color:var(--color-blue); color:var(--color-blue); }

  .sb-bars { display:flex; flex-direction:column; gap:9px; }
  .sb-bar { display:grid; grid-template-columns:210px 1fr 64px; gap:12px; align-items:center; font-size:12px; }
  .sb-bar .nm { color:var(--color-cloud-whisper); font-weight:700; }
  .sb-bar .nm span { display:block; font-size:10.5px; font-weight:600; color:var(--color-text-muted); }
  .sb-bar .tr { height:12px; border-radius:99px; background:var(--color-bg-3); overflow:hidden; }
  .sb-bar .tr i { display:block; height:100%; border-radius:99px; }
  .sb-bar .v { text-align:right; font-weight:800; color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }

  .sb-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .sb-tools input[type=search] { flex:1; min-width:200px; font:inherit; font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg-2); color:var(--color-cloud-whisper); }
  .sb-chip { font:inherit; font-size:12px; font-weight:700; padding:8px 13px; border-radius:999px; border:1px solid var(--color-border); background:var(--color-bg-2); color:var(--color-text-muted); cursor:pointer; white-space:nowrap; }
  .sb-chip b { margin-left:5px; }
  .sb-chip.on { background:#14283c; color:#fff; border-color:#14283c; }
  .sb-prog { display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:12px; color:var(--color-text-muted); }
  .sb-prog .tr { flex:1; height:8px; border-radius:99px; background:var(--color-bg-3); overflow:hidden; }
  .sb-prog .tr i { display:block; height:100%; background:#2f9e6e; border-radius:99px; transition:width .25s; }
  .sb-prog b { color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }

  .sb-grp { margin-bottom:16px; }
  .sb-grp-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 2px; border-bottom:2px solid var(--color-border); margin-bottom:8px; }
  .sb-grp-h b { font-size:13px; color:var(--color-cloud-whisper); }
  .sb-grp-h span { font-size:11.5px; color:var(--color-text-muted); }
  .sb-grp-h .pa-btn { margin-left:auto; height:30px; font-size:11.5px; }

  .fd { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:start; border:1px solid var(--color-border); border-left:4px solid var(--color-border); border-radius:11px; padding:12px 14px; margin-bottom:8px; background:var(--color-bg-2); }
  .fd.high { border-left-color:#c8102e; } .fd.med { border-left-color:var(--color-amber); }
  .fd.ok { background:var(--color-bg); }
  .fd.ok .fd-top b { color:var(--color-text-muted); }
  .fd-top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:4px; }
  .fd-top b { font-size:13.2px; color:var(--color-cloud-whisper); }
  .fd-imp { font-size:12px; line-height:1.5; color:var(--color-text-muted); }
  .fd details { margin-top:6px; }
  .fd summary { font-size:11px; font-weight:700; color:var(--color-blue); cursor:pointer; }
  .fd .says { font-size:12.2px; line-height:1.6; color:var(--color-cloud-whisper); padding:8px 12px; border-left:3px solid var(--color-border); background:var(--color-bg); border-radius:0 8px 8px 0; margin-top:6px; }
  .fd-side { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
  .cite { font-size:10.5px; font-weight:800; color:#14283c; background:#e8edf3; border-radius:5px; padding:3px 8px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  [data-theme="dark"] .cite { color:#cfe0f2; background:#1f3248; }
  .bdg { font-size:9.5px; font-weight:800; letter-spacing:.07em; padding:3px 8px; border-radius:5px; white-space:nowrap; }
  .bdg.d01 { background:#14283c; color:#fff; } .bdg.chg { background:var(--color-blue-pale); color:var(--color-blue); border:1px solid var(--color-blue); }
  .sev { font-size:9px; font-weight:800; letter-spacing:.09em; padding:3px 8px; border-radius:999px; }
  .sev.high { color:#fff; background:#c8102e; } .sev.med { color:var(--color-amber); background:var(--color-amber-bg); border:1px solid var(--color-amber); } .sev.info { color:var(--color-text-muted); background:var(--color-bg-3); border:1px solid var(--color-border); }
  .seg { display:inline-flex; border:1px solid var(--color-border); border-radius:10px; overflow:hidden; }
  .seg button { position:relative; font:inherit; font-size:11.5px; font-weight:700; padding:8px 11px; border:0; border-right:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-muted); cursor:pointer; white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--color-bg-3); color:var(--color-cloud-whisper); }
  .seg button.rec::after { content:'REC'; position:absolute; top:0; right:2px; font-size:7px; font-weight:800; color:var(--color-blue); }
  .seg button.on.price { background:#2f9e6e; color:#fff; } .seg button.on.rfi { background:#14283c; color:#fff; }
  .seg button.on.clarify { background:var(--color-amber); color:#fff; } .seg button.on.exclude { background:#6b7684; color:#fff; } .seg button.on.note { background:var(--color-bg-3); color:var(--color-cloud-whisper); }
  .seg button.on.rec::after { color:rgba(255,255,255,.85); }
  .amt { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--color-text-muted); }
  .amt input { width:120px; font:inherit; font-size:13px; font-weight:800; text-align:right; padding:6px 9px; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }
  .amt input.miss { border-color:#c8102e; background:rgba(200,16,46,.06); }
  .amt input:focus { outline:none; border-color:var(--color-blue); }
  .fd-ok { font-size:11px; font-weight:800; color:#2f9e6e; letter-spacing:.04em; }
  .fd-basis { font-size:10.5px; color:var(--color-slate-hint); text-align:right; max-width:260px; }

  .sb-kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .sb-kpi { border:1px solid var(--color-border); border-top:4px solid #14283c; border-radius:12px; padding:12px 15px; background:var(--color-bg-2); min-width:0; }
  .sb-kpi.red { border-top-color:#c8102e; } .sb-kpi.green { border-top-color:#2f9e6e; } .sb-kpi.amber { border-top-color:var(--color-amber); }
  .sb-kpi .l { font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--color-slate-hint); text-transform:uppercase; }
  .sb-kpi .v { font-size:23px; font-weight:800; color:var(--color-cloud-whisper); margin-top:4px; font-variant-numeric:tabular-nums; }
  .sb-kpi .s { font-size:11px; color:var(--color-text-muted); margin-top:2px; }
  .dsec { border:1px solid var(--color-border); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--color-bg-2); }
  .dsec.ok { border-color:#2f9e6e; }
  .dsec .hd { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:11px 15px; border-bottom:1px solid var(--color-border); background:var(--color-bg); }
  .dsec .hd b { font-size:13.3px; color:var(--color-cloud-whisper); }
  .dsec .hd .tot { margin-left:auto; font-weight:800; font-size:13px; font-variant-numeric:tabular-nums; }
  .ack { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--color-cloud-whisper); cursor:pointer; padding:6px 11px; border-radius:9px; border:1px solid var(--color-border); background:var(--color-bg-2); }
  .ack input { width:16px; height:16px; accent-color:#2f9e6e; }
  .dsec.ok .ack { border-color:#2f9e6e; color:#2f9e6e; }
  .chg { display:grid; grid-template-columns:1fr 1fr 118px; border-bottom:1px solid var(--color-border); }
  .chg:last-child { border-bottom:0; }
  .chg > div { padding:10px 14px; font-size:12.2px; line-height:1.55; }
  .chg .was { background:rgba(200,16,46,.045); color:var(--color-text-muted); border-right:1px solid var(--color-border); }
  .chg .was del { color:#a30d26; }
  .chg .now { background:rgba(47,158,110,.06); color:var(--color-cloud-whisper); }
  .chg .now ins { text-decoration:none; background:rgba(47,158,110,.16); border-radius:3px; padding:0 2px; }
  .chg .lab { font-size:9.5px; font-weight:800; letter-spacing:.09em; color:var(--color-slate-hint); text-transform:uppercase; display:block; margin-bottom:4px; }
  .chg .imp { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; border-left:1px solid var(--color-border); }
  .up { color:#c8102e; } .dn { color:#2f9e6e; }

  .rfi { border:1px solid var(--color-border); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--color-bg-2); }
  .rfi.off { opacity:.55; }
  .rfi-h { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .rfi-h b { font-size:13.2px; color:var(--color-cloud-whisper); }
  .rfi-h .no { font-weight:800; font-size:12px; color:#14283c; white-space:nowrap; }
  [data-theme="dark"] .rfi-h .no { color:#cfe0f2; }
  .rfi-h .sp { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .rfi-h select { font:inherit; font-size:12px; font-weight:700; padding:6px 8px; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); }
  .rfi-refs { margin:7px 0 0; display:flex; gap:5px; flex-wrap:wrap; }
  .rfi pre { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:11.5px; line-height:1.6; white-space:pre-wrap; background:#0d1826; color:#dbe5ef; border-radius:10px; padding:12px 14px; margin:10px 0 0; overflow-wrap:anywhere; }
  .rfi textarea { width:100%; box-sizing:border-box; margin-top:8px; font:inherit; font-size:12.5px; padding:9px 11px; border-radius:9px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); min-height:56px; }
  .tgl input { width:17px; height:17px; accent-color:#14283c; cursor:pointer; }

  .pf { display:flex; flex-direction:column; gap:8px; }
  .pf-row { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg-2); font-size:12.6px; color:var(--color-cloud-whisper); }
  .pf-row i { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:11px; font-weight:800; color:#fff; }
  .pf-row.error { border-color:#c8102e; background:rgba(200,16,46,.05); } .pf-row.error i { background:#c8102e; }
  .pf-row.warn i { background:var(--color-amber); } .pf-row.ok i { background:#2f9e6e; }
  .pf-row small { display:block; font-size:11px; color:var(--color-text-muted); margin-top:2px; }
  .pf-row .pa-btn { height:32px; font-size:11.5px; }
  .pf-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 16px; border-radius:12px; margin-bottom:12px; color:#fff; background:#c8102e; }
  .pf-head.ready { background:#2f9e6e; }
  .pf-head b { font-size:15px; } .pf-head span { font-size:12px; opacity:.92; }
  .pr-tiles { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:12px; }
  .pr-tiles .sb-kpi .v { font-size:19px; }

  .pdoc { position:relative; background:#fff; color:#1b2430; border:1px solid var(--color-border); border-radius:6px; padding:44px 52px 48px; max-width:880px; margin:0 auto; box-shadow:0 10px 30px rgba(10,22,38,.08); font-size:12.8px; line-height:1.6; }
  .pdoc.draft::before { content:'DRAFT — NOT READY TO ISSUE'; position:absolute; top:16px; right:22px; font-size:10px; font-weight:800; letter-spacing:.12em; color:#c8102e; border:1.5px solid #c8102e; padding:3px 9px; border-radius:4px; }
  .pdoc .lh { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid #c8102e; padding-bottom:12px; margin-bottom:18px; }
  .pdoc .lh img { height:40px; }
  .pdoc .lh .ad { text-align:right; font-size:10.8px; color:#5a6676; line-height:1.5; }
  .pdoc h2 { font-size:17px; margin:0 0 2px; color:#14283c; }
  .pdoc h3 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#c8102e; margin:20px 0 7px; }
  .pdoc .meta { display:grid; grid-template-columns:90px 1fr 80px 1fr; gap:3px 12px; font-size:12.2px; margin:12px 0 4px; }
  .pdoc .meta b { color:#5a6676; font-weight:700; }
  .pdoc table { width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  .pdoc th { text-align:right; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#5a6676; border-bottom:1.5px solid #14283c; padding:6px; }
  .pdoc td { text-align:right; padding:6px; border-bottom:1px solid #e3e8ee; font-variant-numeric:tabular-nums; }
  .pdoc th.l, .pdoc td.l { text-align:left; }
  .pdoc tr.sub td { font-weight:700; border-top:1px solid #9aa6b2; }
  .pdoc tr.grand td { font-weight:800; font-size:13.5px; color:#14283c; border-top:2px solid #14283c; border-bottom:0; }
  .pdoc ol { margin:0; padding-left:20px; } .pdoc li { margin:0 0 6px; }
  .pdoc .ref { color:#5a6676; font-size:11px; white-space:nowrap; }
  .pdoc .sig { display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:38px; font-size:11.2px; color:#5a6676; }
  .pdoc .sig div { border-top:1px solid #9aa6b2; padding-top:6px; }

  .sb-empty { padding:26px; text-align:center; color:var(--color-text-muted); font-size:12.5px; border:1px dashed var(--color-border); border-radius:12px; }
  .sb-ov { position:fixed; inset:0; background:rgba(8,16,28,.72); z-index:500; display:none; align-items:center; justify-content:center; }
  .sb-ov.show { display:flex; }
  .sb-ov .bx { width:min(460px, 92vw); background:#0d1826; color:#fff; border-radius:16px; padding:26px; }
  .sb-ov h3 { margin:0 0 4px; font-size:17px; } .sb-ov p { margin:0 0 16px; font-size:12px; color:rgba(255,255,255,.7); }
  .sb-ov .pg { height:8px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .sb-ov .pg i { display:block; height:100%; width:0; background:linear-gradient(90deg,#c8102e,#f0566e); transition:width .2s; }
  .sb-ov .st { margin-top:10px; font-size:12px; color:rgba(255,255,255,.85); }
  .sb-toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:#14283c; color:#fff; padding:11px 18px; border-radius:11px; font-size:12.5px; font-weight:700; opacity:0; transition:.25s; z-index:600; max-width:90vw; }
  .sb-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 1000px) {
    .sb-steps { grid-template-columns:repeat(5, minmax(128px,1fr)); overflow-x:auto; scrollbar-width:none; }
    .sb-form { grid-template-columns:1fr 1fr; }
    .sb-kpis, .pr-tiles { grid-template-columns:1fr 1fr; }
  }
  @media (max-width: 700px) {
    .sb-src, .sb-form, .sb-lens { grid-template-columns:1fr; }
    .sb-f.wide { grid-column:auto; }
    .sb-bar { grid-template-columns:110px 1fr 50px; }
    .fd { grid-template-columns:1fr; } .fd-side { align-items:flex-start; } .fd-basis { text-align:left; }
    .seg { flex-wrap:wrap; }
    .chg { grid-template-columns:1fr; } .chg .was { border-right:0; border-bottom:1px solid var(--color-border); } .chg .imp { text-align:left; border-left:0; }

<div class="sb-ov" id="ov"><div class="bx"><h3 id="ov-h">Reading spec book</h3><p>Processed entirely in this browser. Nothing is uploaded.</p><div class="pg"><i id="ov-bar"></i></div><div class="st" id="ov-st">Loading PDF reader…</div></div></div>
<div class="sb-toast" id="toast"></div>

<script src="/mccorvey/js/data.js?v=20261013h"></script>
<script src="/mccorvey/js/util.js?v=20261013h"></script>
<script src="/mccorvey/js/nav.js?v=20261013h"></script>
<script src="/mccorvey/js/specbook.js?v=20261013h"></script>
<script src="/mccorvey/js/spec-engine.js?v=20261013h"></script>

<script>
if (!isSignedIn() && !location.search.includes('enter')) location.replace('/mccorvey/welcome/');
McCorveyNav.renderTopbar({ subtitle: 'Preconstruction — Spec Book to Proposal' });
const app = $('#app');
const E = window.SpecEngine, BC = window.BidCalc;

/* ===================== STATE ===================== */
let BOOK = E.activeBook();
let RAW = null, PRIOR = null;           /* extracted text: memory only */
let DEC, META, RS;
const STEPS = [['load', 'Set up'], ['decide', 'Decide'], ['changes', 'Changes'], ['rfis', 'RFIs'], ['proposal', 'Proposal']];
const HASH_ALIAS = { triage: 'load', findings: 'decide', matrix: 'decide', adders: 'proposal', letter: 'proposal' };
let step = (() => { const h = (location.hash || '').slice(1); const k = HASH_ALIAS[h] || h; return STEPS.some(s => s[0] === k) ? k : null; })();
const UI = { filter: 'needs', q: '', showMatrix: false, showSecs: false, openRfi: null };

function loadState() {
  DEC = E.decisions(BOOK);
  META = Object.assign({ lens: E.store.get('msm-spec-lens', 'sm'), gc: (BOOK.bid && BOOK.bid.gc) || '', bidNo: (BOOK.bid && BOOK.bid.bidNo) || '', due: (BOOK.bid && BOOK.bid.due) || '', valid: 30, notes: '' },
    E.store.get('msm-spec-meta-' + BOOK.key, {}));
  RS = E.store.get('msm-spec-rfi-' + BOOK.key, null);
  if (!RS) {
    RS = {};
    if (BOOK.sample) {
      RS.C03 = { status: 'sent', sent: '2026-10-05' };
      RS.C06 = { status: 'sent', sent: '2026-10-08' };
      RS.C02 = { status: 'answered', sent: '2026-10-02', answer: 'Provide 12 ga sleeves through masonry and concrete per 23 0500; 22 ga elsewhere.' };
      RS.C08 = { status: 'closed', sent: '2026-10-01', answer: 'Fire pumps are electric drive. Disregard diesel exhaust insulation in 22 0719.' };
    }
    E.store.set('msm-spec-rfi-' + BOOK.key, RS);
  }
  if (!step) step = META.started ? 'decide' : 'load';
}
const saveDec = () => E.saveDecisions(BOOK, DEC);
const saveMeta = () => { E.store.set('msm-spec-meta-' + BOOK.key, META); E.store.set('msm-spec-lens', META.lens); };
const saveRS = () => E.store.set('msm-spec-rfi-' + BOOK.key, RS);
loadState();

/* ===================== HELPERS ===================== */
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const moneyK = n => { const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'K' : Math.round(a); return (n < 0 ? '−$' : '$') + s; };
const moneyU = n => '$' + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));
const pgs = n => Number(n).toLocaleString();
const iss = n => n == null ? '—' : 'Issue ' + String(n).padStart(2, '0');
const sevL = { high: 'HIGH', med: 'MEDIUM', info: 'INFO' };
const sevO = { high: 0, med: 1, info: 2 };
const ACTS = [['price', 'Price it'], ['rfi', 'RFI'], ['clarify', 'Qualify'], ['exclude', 'Exclude'], ['note', 'Noted']];
const today = () => new Date().toISOString().slice(0, 10);
const daysTo = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800); }

const lensOk = l => E.inLens(l || 'other', META.lens);
const fLens = f => f.lens || E.lensOf(f.sec);
const divRank = sec => { const d = sec.slice(0, 2); return d === '00' || d === '01' ? 0 : d === '23' ? 1 : d === '25' ? 2 : d === '22' ? 3 : 4; };
const FS = () => BOOK.findings.filter(f => lensOk(fLens(f))).sort((a, b) => divRank(a.sec) - divRank(b.sec) || a.page - b.page);
const dec = f => { const d = DEC[f.id] || {}; return { act: d.act || f.act, amt: d.amt != null ? +d.amt : (f.amt || 0), ok: !!d.ok }; };
const CONFS = () => BOOK.conflicts.filter(c => lensOk(c.lens));
const inLog = c => (DEC[c.id] || {}).act !== 'off';
const rs = id => Object.assign({ status: 'draft', sent: '', answer: '' }, RS[id]);
const DIFFS = () => BOOK.diffs.filter(d => lensOk(d.lens));
const acked = d => !!(DEC['chg:' + d.sec] || {}).ack;
const isYours = s => E.YOURS.includes(s.div);
function rfiNums() { const N = {}; let n = 0; BOOK.conflicts.forEach(c => { if (inLog(c)) N[c.id] = ++n; }); return N; }
const ADDERS = () => FS().filter(f => dec(f).act === 'price').map(f => ({ id: f.id, title: f.title, amt: +dec(f).amt || 0, tag: 'Spec · ' + E.cite(f.sec, f.para, f.page) }));
const staleSecs = () => BOOK.sections.filter(s => isYours(s) && s.id !== '00 0000' && s.issue != null && s.issue < BOOK.pricedIssue && lensOk(E.lensOf(s.id)));
const SCOPE = { sm: 'HVAC sheet metal ductwork and accessories', hvac: 'Division 23 HVAC', plumb: 'Division 22 plumbing', all: 'Divisions 22 and 23 mechanical' };
function sheet() { const S = BC.load(); return S && S.meta.specKey === BOOK.key ? S : null; }

/* customer-facing wording for Qualify / Exclude decisions (sample book) */
const QUAL = {
  F02: 'Equipment short-circuit current ratings will be coordinated with the electrical gear as submitted. Upgrades required by a revised available fault current after bid are not included.',
  F03: 'Electrical feeder or breaker changes resulting from Owner-directed equipment changes are not included.',
  F05: 'Coordination drawings are carried as a separate schedule-of-values line. Progress payments for fabricated and stored material are requested as coordination areas are signed.',
  F06: 'Relocation of ductwork installed in accordance with signed coordination drawings is not included.',
  F13: 'Retainage, liquidated damages, bond and insurance requirements and warranty duration are not stated in the specifications. This proposal is subject to mutually agreeable subcontract terms.',
  F17: 'Sheave and drive changes recommended by the TAB contractor after initial balancing are not included.',
  P07: 'Plumbing pump VFDs are furnished only; installation and power wiring by Division 26.',
  H12: 'Grease duct warranty is the manufacturer\'s warranty as passed through; McCorvey workmanship warranty is one year.',
  H17: 'HVAC VFDs are furnished only, delivered to Division 26 for installation and wiring. Start-up by manufacturer.',
  H25: 'Ductwork will be delivered and installed clean and capped per SMACNA IAQ guidelines. NADCA cleaning is not included.',
  H27: 'Division 40 process piping (PCC-9) is excluded.',
};
const qualText = f => QUAL[f.id] || `${f.title}: pricing is limited to the requirement as written in Section ${f.sec}; costs beyond it are excluded until confirmed at award.`;

/* ===================== PREFLIGHT ===================== */
function checks() {
  const out = [];
  const add = (level, stepKey, msg, sub, fix, fixLbl) => out.push({ level, step: stepKey, msg, sub, fix, fixLbl });
  if (!META.gc) add('error', 'load', 'General contractor / CM is blank', 'Needed on the proposal and every RFI.', "go('load','gc')", 'Fill in');
  if (!META.bidNo) add('error', 'load', 'Bid number is blank', '', "go('load','bidNo')", 'Fill in');
  if (!META.due) add('error', 'load', 'Bid due date is blank', '', "go('load','due')", 'Fill in');
  else if (daysTo(META.due) < 0) add('error', 'load', 'Bid due date has passed', fmtDate(META.due), "go('load','due')", 'Fix date');
  else if (daysTo(META.due) <= 3) add('warn', 'load', `Bid due in ${daysTo(META.due)} day${daysTo(META.due) === 1 ? '' : 's'}`, fmtDate(META.due));

  const F = FS();
  const hi = F.filter(f => f.sev === 'high' && !dec(f).ok);
  if (hi.length) add('error', 'decide', `${hi.length} high-severity finding${hi.length > 1 ? 's' : ''} not reviewed`, 'Each needs a Price / RFI / Qualify / Exclude decision.', "go('decide','needs')", 'Review');
  const rest = F.filter(f => f.sev !== 'high' && !dec(f).ok);
  if (rest.length) add('warn', 'decide', `${rest.length} medium/info finding${rest.length > 1 ? 's' : ''} will use the recommended decision`, '', 'acceptAll(true)', 'Accept all');
  const zero = F.filter(f => dec(f).act === 'price' && !(dec(f).amt > 0));
  if (zero.length) add('error', 'decide', `${zero.length} priced finding${zero.length > 1 ? 's have' : ' has'} no dollar amount`, zero.slice(0, 3).map(f => f.title).join(' · '), "go('decide','noamt')", 'Enter $');

  const un = DIFFS().filter(d => !acked(d));
  if (un.length) add('error', 'changes', `${un.length} changed section${un.length > 1 ? 's' : ''} not confirmed`, 'Confirm each change is in your number.', "go('changes')", 'Confirm');
  if (BOOK.local && !PRIOR && DIFFS().length) add('warn', 'changes', 'Line-level changes not compared', 'Load the prior issue PDF to see each changed sentence.', "$('#pick-prior').click()", 'Load prior');

  const C = CONFS();
  staleSecs().forEach(s => {
    const covered = C.some(c => inLog(c) && ['a', 'b', 'c'].some(k => c[k] && c[k].sec === s.id));
    if (!covered) add('error', 'rfis', `${s.id} is still at ${iss(s.issue)} with no RFI`, s.title, "go('rfis')", 'Add RFI');
  });
  const drafts = C.filter(c => inLog(c) && rs(c.id).status === 'draft');
  if (drafts.length) add('warn', 'rfis', `${drafts.length} RFI${drafts.length > 1 ? 's' : ''} not sent yet`, 'Open RFIs print as bid assumptions.', "go('rfis')", 'Send');

  const S = sheet();
  if (!S) add('error', 'proposal', 'Bid sheet is not built from this spec book', BOOK.takeoff ? 'One click builds it from the takeoff plus your priced adders.' : 'One click adds your priced adders to the current bid sheet.', 'buildSheet()', 'Build');
  else {
    const dif = BC.adderDiff(S, ADDERS());
    if (dif.length) add('error', 'proposal', `${dif.length} spec adder${dif.length > 1 ? 's' : ''} out of sync with the bid sheet`, dif.slice(0, 2).map(x => x.title + (x.kind === 'amount' ? ` (sheet ${money(x.sheet)}, spec ${money(x.spec)})` : ' (' + x.kind + ')')).join(' · '), 'syncSheet()', 'Sync');
    if (!S.lines.some(l => BC.inc(l) && !l.scope.startsWith(BC.ADDER))) add('error', 'proposal', 'Bid sheet has no base scope lines', '', "location.href='/mccorvey/bidmodel/'", 'Open sheet');
    const T = BC.totals(S);
    if (T.margin < BC.FLOOR) add('error', 'proposal', `Margin ${T.margin.toFixed(1)}% is below the ${BC.FLOOR}% walk-away floor`, '', "location.href='/mccorvey/bidmodel/'", 'Adjust');
    else if (T.margin < BC.TARGET) add('warn', 'proposal', `Margin ${T.margin.toFixed(1)}% is under the ${BC.TARGET}% target`, '');
    if (T.mp === 'over') add('error', 'proposal', 'Not enough crew to staff this job on the bid schedule', `${T.fieldNeed.toFixed(0)} field / ${T.shopNeed.toFixed(0)} shop needed`, "location.href='/mccorvey/bidmodel/'", 'Adjust');
    else if (T.mp === 'tight') add('warn', 'proposal', 'Crew check is tight (over 85% of available)', '');
  }
  return out;
}
function stepState(k, CK) {
  const mine = k === 'proposal' ? CK : CK.filter(c => c.step === k);
  if (mine.some(c => c.level === 'error')) return 'err';
  if (mine.some(c => c.level === 'warn')) return 'warn';
  if (k === 'load' && !META.started) return '';
  return 'done';
}

/* ===================== RENDER ===================== */
function render() {
  const CK = checks(), errs = CK.filter(c => c.level === 'error').length;
  const F = FS(), rev = F.filter(f => dec(f).ok).length, hi = F.filter(f => f.sev === 'high').length;
  const D = DIFFS(), net = D.reduce((a, d) => a + d.changes.reduce((b, c) => b + (c.amt || 0), 0), 0);
  const yoursPages = BOOK.sections.filter(isYours).reduce((a, s) => a + s.pages, 0);
  const nLog = CONFS().filter(inLog).length;
  app.innerHTML = `
    <div class="cmd-hero">
      <div class="cmd-head">
        <div>
          <div class="cmd-eyebrow">MSM BRAIN — SPEC BOOK TO PROPOSAL · PRECONSTRUCTION</div>
          <h1 class="cmd-title">${esc(BOOK.name)}</h1>
          <div class="cmd-sub">${esc(BOOK.sub)}. Five steps from spec book to an issued proposal: every finding decided, every change confirmed, every open question an RFI, and a preflight check that will not let a proposal go out with a gap.</div>
        </div>
        <div class="cmd-side">
          <span class="sb-mode ${BOOK.local ? 'local' : ''}"><i></i>${BOOK.local ? 'YOUR BOOK · LOCAL ONLY' : 'SAMPLE BOOK · FICTIONAL'}</span>
          <span class="cmd-range">${iss(BOOK.bookIssue)}${BOOK.bookDate ? ' · ' + fmtDate(BOOK.bookDate) : ''} · priced at ${iss(BOOK.pricedIssue)}</span>
          <div class="sb-hbtns"><button class="pa-btn" onclick="$('#pick-cur').click()">Load a spec book (PDF)</button>${BOOK.local ? '<button class="pa-btn" onclick="useSample()">Back to sample</button>' : ''}</div>
        </div>
      </div>
      <div class="cmd-tiles">
        <div class="cmd-tile"><div class="l">Pages in Book</div><div class="v">${pgs(BOOK.totalPages)}</div><span class="d up">▲ ${BOOK.sections.length} sections</span><div class="s">every page read and cited</div>${sparkSVG('sb-p', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile"><div class="l">Pages That Matter</div><div class="v">${pgs(yoursPages)}</div><span class="d up">▲ ${Math.round(yoursPages / BOOK.totalPages * 100)}% of the book</span><div class="s">Div 00/01 + 22 + 23</div>${sparkSVG('sb-m', { up: true })}</div>
        <div class="cmd-tile ${D.some(d => !acked(d)) ? 'hot' : ''}"><div class="l">Changed Since Priced</div><div class="v">${D.length}</div><span class="d ${D.every(acked) ? 'up' : 'down'}">${D.every(acked) ? '▲ all confirmed' : '▼ ' + D.filter(d => !acked(d)).length + ' to confirm'}</span><div class="s">${BOOK.sample ? (net >= 0 ? '+' : '') + moneyK(net) + ' net' : iss(BOOK.pricedIssue) + ' → ' + iss(BOOK.bookIssue)}</div>${sparkSVG('sb-c', { up: false, color: '#c8102e' })}</div>
        <div class="cmd-tile"><div class="l">Findings Reviewed</div><div class="v">${rev}<span style="font-size:.55em;color:#7b8794"> / ${F.length}</span></div><span class="d ${rev === F.length ? 'up' : 'down'}">${rev === F.length ? '▲ all decided' : '▼ ' + hi + ' high in this trade'}</span><div class="s">${esc(E.LENSES[META.lens].label)}</div>${sparkSVG('sb-f', { up: true, color: '#b98a36' })}</div>
        <div class="cmd-tile"><div class="l">RFIs in Log</div><div class="v">${nLog}</div><span class="d up">▲ CM format</span><div class="s">${CONFS().filter(c => inLog(c) && rs(c.id).status === 'draft').length} not sent</div>${sparkSVG('sb-r', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile ${errs ? 'hot' : ''}"><div class="l">Proposal</div><div class="v" style="${errs ? '' : 'color:#2f9e6e'}">${errs ? errs + ' to fix' : 'Ready'}</div><span class="d ${errs ? 'down' : 'up'}">${errs ? '▼ preflight' : '▲ preflight passed'}</span><div class="s">${moneyK(ADDERS().reduce((a, x) => a + x.amt, 0))} spec adders</div>${sparkSVG('sb-x', { up: !errs })}</div>
      </div>
    </div>
    <div class="sb-steps" id="steps">${stepsHTML(CK)}</div>
    <div id="pane">${pane(CK)}</div>
    <div id="sbnav">${navHTML()}</div>
    <div class="demo-note">${BOOK.local ? 'Your book was read in this browser tab; the PDF and its text never left this machine. Findings are rule-based first-pass flags, each cited to its page for estimator sign-off.' : 'Sample spec book is fictional — Project Bluebonnet, its owner, CM, design team and clause wording are illustrative. Load your own PDF to run the same flow on a real book.'} · concept build by Endurance AI Labs</div>`;
  bind(); dock();
}
function stepsHTML(CK) {
  const F = FS(), rev = F.filter(f => dec(f).ok).length, D = DIFFS();
  const e = CK.filter(c => c.level === 'error').length;
  const sub = {
    load: META.started ? E.LENSES[META.lens].label : 'Book, trade, bid info',
    decide: `${rev} of ${F.length} reviewed`,
    changes: `${D.filter(acked).length} of ${D.length} confirmed`,
    rfis: `${CONFS().filter(inLog).length} in log`,
    proposal: e ? e + ' to fix' : 'Ready to issue',
  };
  return STEPS.map(([k, l], i) => {
    const st = stepState(k, CK);
    return `<button class="sb-step ${st} ${step === k ? 'on' : ''}" onclick="go('${k}')"><span class="k">${st === 'done' ? '✓' : i + 1}</span><span class="t"><b>${l}</b><span>${sub[k]}</span></span></button>`;
  }).join('');
}
function navHTML() {
  const i = STEPS.findIndex(s => s[0] === step), prev = STEPS[i - 1], next = STEPS[i + 1];
  return `<div class="sb-nav">${prev ? `<button class="pa-btn" onclick="go('${prev[0]}')">← ${prev[1]}</button>` : '<span></span>'}${next ? `<button class="pa-btn primary" onclick="${step === 'load' ? 'startReview()' : `go('${next[0]}')`}">${step === 'load' ? 'Start review' : 'Next: ' + next[1]} →</button>` : ''}</div>`;
}
function pane(CK) {
  if (step === 'decide') return paneDecide();
  if (step === 'changes') return paneChanges();
  if (step === 'rfis') return paneRfis();
  if (step === 'proposal') return paneProposal(CK);
  return paneLoad();
}
/* light refresh: steps + hero tiles without touching the pane (keeps focus and scroll) */
function refreshChrome() {
  const CK = checks();
  $('#steps').innerHTML = stepsHTML(CK);
  const F = FS(), rev = F.filter(f => dec(f).ok).length, errs = CK.filter(c => c.level === 'error').length;
  const t = document.querySelectorAll('.cmd-tile');
  if (t[3]) t[3].querySelector('.v').innerHTML = `${rev}<span style="font-size:.55em;color:#7b8794"> / ${F.length}</span>`;
  if (t[4]) t[4].querySelector('.s').textContent = CONFS().filter(c => inLog(c) && rs(c.id).status === 'draft').length + ' not sent';
  if (t[5]) { const v = t[5].querySelector('.v'); v.textContent = errs ? errs + ' to fix' : 'Ready'; v.style.color = errs ? '' : '#2f9e6e'; t[5].classList.toggle('hot', !!errs); t[5].querySelector('.s').textContent = moneyK(ADDERS().reduce((a, x) => a + x.amt, 0)) + ' spec adders'; }
  const pr = document.getElementById('prog'); if (pr) pr.outerHTML = progHTML();
}

/* ---------- 1 · load & set up ---------- */
function paneLoad() {
  const secs = BOOK.sections;
  const groups = [
    ['Div 00/01 — Project requirements', ['00', '01'], '#c8102e', 'the rules everyone follows'],
    ['Div 23 — HVAC', ['23'], '#c8102e', 'yours'],
    ['Div 22 — Plumbing', ['22'], '#c8102e', 'yours'],
    ['Div 21/25/26/28/40 — Hooks', E.HOOKS, '#14283c', 'scanned for scope that lands on you'],
    ['Everything else', null, '#9aa6b2', 'indexed, not read'],
  ].map(([k, d, c, n]) => { const ss = secs.filter(s => d ? d.includes(s.div) : !(E.YOURS.includes(s.div) || E.HOOKS.includes(s.div))); return { k, c, n, cnt: ss.length, pages: ss.reduce((a, s) => a + s.pages, 0) }; });
  const max = Math.max(...groups.map(g => g.pages));
  const issues = [...new Set(secs.map(s => s.issue).filter(x => x != null))].sort((a, b) => a - b);
  if (!issues.includes(BOOK.pricedIssue)) issues.push(BOOK.pricedIssue);
  const miss = k => !META[k] ? 'miss' : '';
  return `
    <div class="sb-src">
      <div class="sb-card ${BOOK.sample ? 'cur' : ''}">
        ${BOOK.sample ? '<span class="sb-tag">IN USE</span>' : ''}
        <h3>Sample book — Project Bluebonnet</h3>
        <p>A fictional ${pgs(window.SPECBOOK.totalPages)}-page campus spec book with findings, changes and RFIs already mapped. Use it to learn the flow or to demo it.</p>
        <div class="row">${BOOK.sample ? '<span class="ynote">Loaded</span>' : '<button class="pa-btn" onclick="useSample()">Use the sample book</button>'}</div>
      </div>
      <div class="sb-card ${BOOK.local ? 'cur' : ''}">
        ${BOOK.local ? '<span class="sb-tag">IN USE</span>' : ''}
        <h3>Your spec book</h3>
        <p>Drop the combined spec PDF. A 2,000-page book is read in this browser in about 15 seconds; nothing is uploaded.</p>
        <div class="sb-drop" id="drop" onclick="$('#pick-cur').click()">${BOOK.local ? 'Loaded: <b>' + esc(BOOK.name) + '</b> — drop another PDF to replace' : 'Drop a PDF here or click to choose'}</div>
      </div>
    </div>
    <div class="demo-panel" style="margin-bottom:18px">
      <div class="demo-panel-head"><h2>Bid setup</h2><span class="k">used on the proposal and every RFI</span></div>
      <div class="sb-f full" style="margin-bottom:14px"><span>Trade you are bidding</span>
        <div class="sb-lens">${Object.entries(E.LENSES).map(([k, v]) => `<button class="${META.lens === k ? 'on' : ''}" onclick="setLens('${k}')">${v.label}</button>`).join('')}</div>
      </div>
      <div class="sb-form">
        <label class="sb-f wide"><span>General contractor / CM</span><input id="m-gc" data-meta="gc" class="${miss('gc')}" value="${esc(META.gc)}" placeholder="Who the proposal goes to"></label>
        <label class="sb-f"><span>Bid number</span><input id="m-bidNo" data-meta="bidNo" class="${miss('bidNo')}" value="${esc(META.bidNo)}" placeholder="MSM-2026-…"></label>

function secTable() {

  return `<div class="demo-tbl-wrap grid-scroll" style="max-height:480px;margin-top:16px"><table class="demo-tbl tbl-left">
    <thead><tr><th>Section</th><th>Title</th><th style="text-align:right">Pages</th><th>Stamp</th><th style="text-align:right">Findings</th></tr></thead>
    <tbody>${rows.map(s => { const stale = !re.has(s.id) && s.issue != null && s.issue < BOOK.pricedIssue; return `<tr><td><b>${s.id}</b></td><td>${esc(s.title)}</td><td style="text-align:right;white-space:nowrap">pp. ${pgs(s.start)}–${pgs(s.end)}</td>
      <td><span class="bdg ${re.has(s.id) ? 'chg' : ''}" style="${stale ? 'background:var(--color-amber-bg);color:var(--color-amber)' : ''}">${re.has(s.id) ? 'REISSUED · ' : stale ? 'STALE · ' : ''}${iss(s.issue)}</span></td>

/* ---------- 2 · decide findings ---------- */
function progHTML() {
  const F = FS(), rev = F.filter(f => dec(f).ok).length;
  return `<div class="sb-prog" id="prog"><b>${rev} of ${F.length}</b> reviewed<div class="tr"><i style="width:${F.length ? rev / F.length * 100 : 0}%"></i></div><span>${F.filter(f => f.sev === 'high' && !dec(f).ok).length} high left</span></div>`;
}
function fdHTML(f) {
  const d = dec(f), d01 = /^0[01]/.test(f.sec);
  return `<div class="fd ${f.sev} ${d.ok ? 'ok' : ''}" id="f-${f.id}">
    <div>
      <div class="fd-top"><span class="sev ${f.sev}">${sevL[f.sev]}</span><b>${esc(f.title)}</b><span class="cite">${E.cite(f.sec, f.para, f.page)}</span>
        ${d01 ? '<span class="bdg d01">FROM DIV 01</span>' : ''}${f.chg ? `<span class="bdg chg">CHANGED ${iss(f.chg).toUpperCase()}</span>` : ''}</div>
      <div class="fd-imp">${esc(f.impact)}</div>
      <details><summary>Show the clause</summary><div class="says">“${esc(f.says)}”</div></details>
    </div>
    <div class="fd-side">
      <span class="seg">${ACTS.map(([k, l]) => `<button class="${k} ${d.act === k ? 'on' : ''} ${f.act === k ? 'rec' : ''}" title="${f.act === k ? 'Recommended' : ''}" onclick="setAct('${f.id}','${k}')">${l}</button>`).join('')}</span>
      ${d.act === 'price' ? `<label class="amt">Adder $<input data-amt="${f.id}" class="${d.amt > 0 ? '' : 'miss'}" value="${d.amt ? Math.round(d.amt).toLocaleString() : ''}" placeholder="required" inputmode="decimal"></label>${f.basis ? `<span class="fd-basis">${esc(f.basis)}</span>` : ''}` : ''}
      ${d.ok ? '<span class="fd-ok">✓ REVIEWED</span>' : `<button class="pa-btn primary" style="height:30px;font-size:11.5px" onclick="confirmF('${f.id}')">Confirm: ${ACTS.find(a => a[0] === d.act)[1]}</button>`}
    </div>
  </div>`;
}
function paneDecide() {
  const F = FS(), q = UI.q.toLowerCase();
  const isK = (k, f) => k === 'needs' ? !dec(f).ok : k === 'high' ? f.sev === 'high' : k === 'price' ? dec(f).act === 'price' : k === 'noamt' ? dec(f).act === 'price' && !(dec(f).amt > 0) : true;
  const list = F.filter(f => isK(UI.filter, f) && (!q || (f.title + ' ' + f.says + ' ' + f.sec + ' ' + f.cat).toLowerCase().includes(q)));
  const groups = []; list.forEach(f => { let g = groups.find(x => x.sec === f.sec); if (!g) groups.push(g = { sec: f.sec, items: [] }); g.items.push(f); });
  const cnt = k => F.filter(f => isK(k, f)).length;
  const mx = BOOK.matrix.filter(m => lensOk(m.lens));
  const shownOpen = list.filter(f => !dec(f).ok).length;
  return `
    ${progHTML()}
    <div class="sb-tools">
      ${[['needs', 'Needs review'], ['high', 'High'], ['price', 'Priced'], ['noamt', 'Missing $'], ['all', 'All']].filter(([k]) => k !== 'noamt' || cnt('noamt') || UI.filter === 'noamt').map(([k, l]) => `<button class="sb-chip ${UI.filter === k ? 'on' : ''}" onclick="UI.filter='${k}';rerender()">${l}<b>${cnt(k)}</b></button>`).join('')}
      <input type="search" id="fq" placeholder="Search — hanger, warranty, 23 3113…" value="${esc(UI.q)}">
      <button class="pa-btn" onclick="UI.showMatrix=!UI.showMatrix;rerender()">${UI.showMatrix ? 'Hide who does what' : 'Who does what'}</button>
      ${shownOpen ? `<button class="pa-btn primary" onclick="acceptShown()">Accept recommended (${shownOpen})</button>` : ''}
    </div>
    <div class="ynote" style="margin:-2px 0 14px">Every finding comes with a recommended decision (marked REC). Confirm it in one click or pick another. <b>Price it</b> adds a line to the bid, <b>RFI</b> drafts a question to the CM, <b>Qualify</b> and <b>Exclude</b> write the proposal terms.</div>
    ${UI.showMatrix ? matrixHTML(mx) : ''}
    ${groups.length ? groups.map(g => {
      const s = BOOK.sections.find(x => x.id === g.sec) || { title: '', start: '', end: '' };
      const open = g.items.filter(f => !dec(f).ok).length;
      return `<div class="sb-grp"><div class="sb-grp-h"><b>${g.sec} ${esc(s.title)}</b><span>pp. ${pgs(s.start)}–${pgs(s.end)} · ${g.items.length} finding${g.items.length > 1 ? 's' : ''}</span>${open ? `<button class="pa-btn" onclick="acceptSec('${g.sec}')">Accept section (${open})</button>` : ''}</div>${g.items.map(fdHTML).join('')}</div>`;
    }).join('') : `<div class="sb-empty">${UI.filter === 'needs' ? 'Every finding in this trade is reviewed. Next: confirm what changed.' : 'No findings match.'}</div>`}`;
}
function matrixHTML(rows) {

  const cell = v => `<td style="font-size:12px;${/Gap:/.test(v) ? 'background:var(--color-amber-bg);color:var(--color-amber);font-weight:700' : ''}">${esc(v)}</td>`;
  return `<div class="demo-panel" style="margin-bottom:16px"><div class="demo-panel-head"><h2>Who does what</h2><span class="k">amber = unassigned or contradicted in the book</span></div><div class="demo-tbl-wrap grid-scroll" style="max-height:none"><table class="demo-tbl tbl-left"><thead><tr><th>Item</th><th>Furnish</th><th>Install</th><th>Wire / power</th><th>Test / witness</th><th>Watch</th></tr></thead><tbody>${rows.map(m => `<tr><td style="font-weight:700;font-size:12px">${esc(m.item)}</td>${cell(m.f)}${cell(m.i)}${cell(m.w)}${cell(m.t)}${cell(m.note || '')}</tr>`).join('')}</tbody></table></div></div>`;

function paneChanges() {
  const D = DIFFS();
  const up = D.reduce((a, d) => a + d.changes.reduce((b, c) => b + Math.max(0, c.amt || 0), 0), 0);
  const dn = D.reduce((a, d) => a + d.changes.reduce((b, c) => b + Math.min(0, c.amt || 0), 0), 0);

    <div class="sb-kpis">

      <div class="sb-kpi amber"><div class="l">Added cost</div><div class="v">${BOOK.sample ? '+' + moneyK(up) : '—'}</div><div class="s">${BOOK.sample ? 'already in your adders' : 'price it through findings'}</div></div>
      <div class="sb-kpi"><div class="l">Credits</div><div class="v">${BOOK.sample ? moneyK(dn) : '—'}</div><div class="s">${BOOK.sample ? 'incl. one in Div 07' : ''}</div></div>
    </div>
    <div class="sb-tools">
      ${D.some(d => !acked(d)) ? `<button class="pa-btn primary" onclick="ackAll()">Confirm all ${D.filter(d => !acked(d)).length} remaining</button>` : (D.length ? '<span class="fd-ok">✓ ALL CHANGES CONFIRMED</span>' : '')}
      ${BOOK.local ? `<button class="pa-btn" onclick="$('#pick-prior').click()">${PRIOR ? 'Compare a different prior issue' : 'Load prior issue to see each sentence'}</button>` : ''}
      <span class="ynote" style="margin-left:auto">Reissued sections only carry a new header date. Nothing in the text marks what moved.</span>
    </div>
    ${D.length ? D.map(d => {
      const tot = d.changes.reduce((a, c) => a + (c.amt || 0), 0), ok = acked(d);

        <div class="hd"><span class="bdg chg">${d.isNew ? 'NEW SECTION' : iss(d.from) + ' → ' + iss(d.to)}</span><b>${d.sec} — ${esc(E.secTitle(BOOK, d.sec))}</b>${d.crossDiv ? '<span class="bdg d01">OUTSIDE YOUR DIVISION</span>' : ''}
          <span class="tot ${tot > 0 ? 'up' : tot < 0 ? 'dn' : ''}">${BOOK.sample ? (tot > 0 ? '+' : '') + money(tot) : ''}</span>

        ${d.stampOnly && !d.changes.length ? `<div style="padding:11px 15px;font-size:12.2px;color:var(--color-text-muted)">Header stamp moved from ${iss(d.from)} to ${iss(d.to)}. ${PRIOR ? 'No sentence-level differences found against the prior issue.' : 'Load the prior issue to see exactly what changed, or read the section before confirming.'}</div>` : ''}
        ${d.changes.map(c => `<div class="chg">
          <div class="was"><span class="lab">Was${c.para ? ' · ¶' + c.para : ''}</span>${c.before ? `<del>${esc(c.before)}</del>` : '<i>Not in prior issue</i>'}</div>
          <div class="now"><span class="lab">Now${c.page ? ' · p.' + pgs(c.page) : ''}</span>${c.after ? `<ins>${esc(c.after)}</ins>` : '<i>Deleted</i>'}${c.note ? `<div class="ynote" style="margin-top:5px">${esc(c.note)}</div>` : ''}</div>
          <div class="imp ${c.amt > 0 ? 'up' : c.amt < 0 ? 'dn' : ''}">${BOOK.sample ? (c.amt ? (c.amt > 0 ? '+' : '') + money(c.amt) : '$0') : '—'}${c.find ? `<div style="font-size:10.5px;font-weight:600;margin-top:3px"><a href="javascript:void 0" onclick="jumpFinding('${c.find}')">see finding</a></div>` : ''}</div>
        </div>`).join('')}

}

    <div class="sb-tools">

          ${on ? `<span class="no">${E.rfiNo(N[c.id])}</span>` : ''}<span class="sev ${c.sev}">${sevL[c.sev]}</span><b>${esc(c.title)}</b>
          <span class="sp">${on ? `<select onchange="setStatus('${c.id}',this.value)">${ST.map(([k, l]) => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : '<span class="ynote">not in log</span>'}

      </div>`;
    }).join('') : '<div class="sb-empty">No conflicts or open questions in this trade.</div>'}`;
}

        : `<div class="ynote" style="margin-bottom:12px">${BOOK.takeoff ? 'Build a bid sheet from this book: the base takeoff plus every priced spec adder, each tagged with its spec cite.' : 'Add every priced spec adder to your current bid sheet and link it to this book.'} Your current sheet is kept as a backup.</div>
          <button class="pa-btn primary" style="height:42px" onclick="buildSheet()">${BOOK.takeoff ? 'Build bid sheet from this book' : 'Link current bid sheet + add adders'}</button>`}

}
function proposalHTML(S, T) {
  const F = FS(), N = rfiNums();
  const priced = F.filter(f => dec(f).act === 'price');
  const quals = F.filter(f => dec(f).act === 'clarify'), excl = F.filter(f => dec(f).act === 'exclude');
  const C = CONFS().filter(inLog);
  const answered = C.filter(c => ['answered', 'closed'].includes(rs(c.id).status) && rs(c.id).answer);
  const pending = C.filter(c => !answered.includes(c));
  const D = DIFFS().filter(acked);
  const p = currentPersona() || { name: 'Preconstruction', title: '' };
  const assume = c => (c.q.match(/(Bid (assumes|excludes|includes|is based)[^.]*\.)/) || [])[1] || 'Bid is based on the documents as issued pending response.';
  const cite = f => `<span class="ref">(${E.cite(f.sec, f.para, f.page)})</span>`;
  const due = META.due ? new Date(META.due + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '—';
  const hasAlts = !!(S && T && S.lines.some(l => !BC.inc(l)));
  let schedule = '<p style="color:#c8102e;font-weight:700">Pricing appears here once the bid sheet is built (see Pricing above).</p>';
  if (S && T) {
    const rows = S.lines.map((l, i) => ({ l, c: T.L[i] }));
    const base = rows.filter(x => BC.inc(x.l) && !x.l.scope.startsWith(BC.ADDER)), adds = rows.filter(x => BC.inc(x.l) && x.l.scope.startsWith(BC.ADDER));
    const alts = rows.filter(x => !BC.inc(x.l));
    schedule = `<table><thead><tr><th class="l" style="width:30px">Item</th><th class="l">Description</th><th>Qty</th><th class="l">Unit</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>
      ${base.map((x, i) => `<tr><td class="l">${i + 1}</td><td class="l">${esc(x.l.scope)}</td><td>${Math.round(x.l.qty).toLocaleString()}</td><td class="l">${esc(x.l.unit)}</td><td>${moneyU(x.c.unitSell)}</td><td>${money(x.c.sell)}</td></tr>`).join('')}
      ${adds.length ? `<tr><td class="l">${base.length + 1}</td><td class="l">Project specification requirements (itemized in section ${hasAlts ? 3 : 2})</td><td>1</td><td class="l">LS</td><td></td><td>${money(adds.reduce((a, x) => a + x.c.sell, 0))}</td></tr>` : ''}
      <tr class="sub"><td></td><td class="l">Subtotal</td><td colspan="3"></td><td>${money(T.sell)}</td></tr>
      <tr><td></td><td class="l">Bond, general liability insurance &amp; contingency</td><td colspan="3"></td><td>${money(T.addons)}</td></tr>
      <tr class="grand"><td></td><td class="l">BASE BID</td><td colspan="3"></td><td>${money(T.client)}</td></tr></tbody></table>
      ${alts.length ? `<h3>2. Alternates — not included in base bid</h3><table><thead><tr><th class="l" style="width:30px">Alt</th><th class="l">Description</th><th>Add to base bid</th></tr></thead><tbody>${alts.map((x, i) => `<tr><td class="l">A${i + 1}</td><td class="l">${esc(x.l.scope.replace(BC.ADDER, ''))}</td><td>+ ${money(x.c.sell * (1 + T.a))}</td></tr>`).join('')}</tbody></table>` : ''}`;
  }
  let n = hasAlts ? 2 : 1;
  const h = t => `<h3>${++n}. ${t}</h3>`;
  const notes = (META.notes || '').split('\n').map(s => s.trim()).filter(Boolean);
  const scope = SCOPE[META.lens];
  return `
    <div class="lh"><img src="/mccorvey/assets/brand/mccorvey-logo.png" alt="McCorvey Sheet Metal Works"><div class="ad">McCorvey Sheet Metal Works, L.P.<br>8610 Wallisville Road, Houston, TX 77029<br>(713) 672-7545</div></div>
    <h2>Proposal — ${esc(BOOK.name)}</h2>
    <div class="meta">
      <b>To</b><span>${esc(META.gc || '—')}</span><b>Bid No.</b><span>${esc(META.bidNo || '—')}</span>
      <b>Scope</b><span>${scope}</span><b>Date</b><span>${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</span>
      <b>Documents</b><span>Specifications ${iss(BOOK.bookIssue)}${BOOK.bookDate ? ', ' + fmtDate(BOOK.bookDate) : ''}</span><b>Bid due</b><span>${due} · valid ${esc(META.valid)} days</span>
    </div>
    <p style="margin:12px 0 0">McCorvey Sheet Metal Works is pleased to submit this proposal to furnish, fabricate, deliver and install the ${scope} scope for ${esc(BOOK.name)}, in accordance with the specifications listed above and the qualifications below.</p>
    <h3>1. Base bid</h3>
    ${schedule}
    ${h('Specification requirements included')}
    <p style="margin:0 0 6px">The base bid includes the following requirements, called out because they go beyond typical practice:</p>
    <ol>${priced.map(f => `<li>${esc(f.title)} ${cite(f)}</li>`).join('') || '<li>Per plans and specifications.</li>'}</ol>
    ${D.length ? `${h('Changes reviewed and included')}<ol>${D.map(d => `<li>Section ${d.sec} ${esc(E.secTitle(BOOK, d.sec))} — ${d.isNew ? 'new section' : iss(d.from) + ' to ' + iss(d.to)}, reviewed and included.</li>`).join('')}</ol>` : ''}
    ${pending.length ? `${h('Assumptions pending RFI responses')}<ol>${pending.map(c => `<li>${esc(assume(c))} <span class="ref">(${E.rfiNo(N[c.id])})</span></li>`).join('')}</ol>` : ''}
    ${answered.length ? `${h('RFI responses incorporated')}<ol>${answered.map(c => `<li>${esc(rs(c.id).answer)} <span class="ref">(${E.rfiNo(N[c.id])})</span></li>`).join('')}</ol>` : ''}
    ${h('Clarifications')}
    <ol>${quals.map(f => `<li>${esc(qualText(f))} ${cite(f)}</li>`).join('')}${notes.map(t => `<li>${esc(t)}</li>`).join('')}
      <li>Testing, adjusting and balancing by others. McCorvey provides access, duct leakage testing and one set of drives as furnished.</li></ol>
    ${h('Exclusions')}
    <ol>${excl.map(f => `<li>${esc(qualText(f))} ${cite(f)}</li>`).join('')}
      <li>HVAC equipment, controls and control wiring, electrical power wiring, and painting of exposed ductwork unless listed above.</li>
      <li>Firestopping of penetrations (single-source firestop contractor).</li>
      <li>Work required by specification sections referenced but not issued with the bid documents.</li></ol>
    ${h('Commercial terms')}
    <ol><li>Proposal valid ${esc(META.valid)} days from the date above. Steel pricing subject to mill surcharge adjustment after validity.</li>
      <li>Progress billing monthly on AIA G702/G703. Retainage, liquidated damages, bonds, insurance and warranty terms subject to mutually agreeable subcontract terms.</li></ol>
    <div class="sig"><div>${esc(p.name)}${p.title ? ', ' + esc(p.title) : ''}<br>McCorvey Sheet Metal Works, L.P.</div><div>Accepted — ${esc(META.gc || 'Contractor')}<br>Name, title &amp; date</div></div>`;
}

/* ===================== ACTIONS ===================== */
function go(k, focus) {
  if (focus === 'needs' || focus === 'noamt') { UI.filter = focus; k = 'decide'; }
  step = k; history.replaceState(null, '', '#' + k); render();
  const top = document.getElementById('steps');
  window.scrollTo({ top: Math.max(0, top.getBoundingClientRect().top + window.scrollY - 170), behavior: 'smooth' });
  if (focus && document.getElementById('m-' + focus)) setTimeout(() => document.getElementById('m-' + focus).focus(), 300);
}
function rerender() { const y = window.scrollY; $('#pane').innerHTML = pane(checks()); $('#sbnav').innerHTML = navHTML(); refreshChrome(); bind(); window.scrollTo(0, y); }
function startReview() {
  const miss = ['gc', 'bidNo', 'due'].filter(k => !META[k]);
  if (miss.length) { toast('Fill in the bid setup first'); const el = document.getElementById('m-' + miss[0]); if (el) { el.focus(); el.classList.add('miss'); } return; }
  META.started = true; saveMeta(); go('decide');
}
function setLens(k) { META.lens = k; saveMeta(); render(); }
function setPriced(v) {
  BOOK.pricedIssue = +v;
  if (BOOK.local) {
    if (!PRIOR) BOOK.diffs = E.stampDiffs(BOOK);
    BOOK.conflicts = E.staleRfis(BOOK).concat(BOOK.conflicts.filter(c => c.kind !== 'stale'));
    E.store.sset('msm-spec-local', BOOK);
  }
  render(); toast('Priced at ' + iss(+v));
}
function setAct(id, act) {
  const f = BOOK.findings.find(x => x.id === id);
  const amt = dec(f).amt;
  DEC[id] = Object.assign({}, DEC[id], { act, ok: act !== 'price' || amt > 0 });
  if (act === 'rfi' && f.rfi) DEC[f.rfi] = Object.assign({}, DEC[f.rfi], { act: 'on' });
  saveDec(); repaintCard(id);
  if (act === 'price' && !(amt > 0)) setTimeout(() => { const i = document.querySelector(`input[data-amt="${id}"]`); if (i) i.focus(); }, 30);
}
function confirmF(id) {
  const f = BOOK.findings.find(x => x.id === id), d = dec(f);
  if (d.act === 'price' && !(d.amt > 0)) { toast('Enter the adder amount first'); const i = document.querySelector(`input[data-amt="${id}"]`); if (i) i.focus(); return; }
  DEC[id] = Object.assign({}, DEC[id], { act: d.act, ok: true }); saveDec(); repaintCard(id);
}
function repaintCard(id) { const el = document.getElementById('f-' + id); const f = BOOK.findings.find(x => x.id === id); if (el && f) { el.outerHTML = fdHTML(f); bind(); } refreshChrome(); }
function acceptList(list) {
  let n = 0, skipped = 0;
  list.forEach(f => { const d = dec(f); if (d.ok) return; if (d.act === 'price' && !(d.amt > 0)) { skipped++; return; } DEC[f.id] = Object.assign({}, DEC[f.id], { act: d.act, ok: true }); n++; });
  saveDec(); rerender();
  toast(`${n} accepted as recommended${skipped ? ` · ${skipped} still need a dollar amount` : ''}`);
}
function acceptAll(nonHighOnly) { acceptList(FS().filter(f => !nonHighOnly || f.sev !== 'high')); }
function acceptShown() {
  const q = UI.q.toLowerCase();
  acceptList(FS().filter(f => (UI.filter === 'all' || (UI.filter === 'needs' && !dec(f).ok) || (UI.filter === 'high' && f.sev === 'high') || (UI.filter === 'price' && dec(f).act === 'price')) && (!q || (f.title + ' ' + f.says + ' ' + f.sec + ' ' + f.cat).toLowerCase().includes(q))));
}
function acceptSec(sec) { acceptList(FS().filter(f => f.sec === sec)); }
function jumpFinding(id) { UI.filter = 'all'; UI.q = ''; go('decide'); setTimeout(() => { const el = document.getElementById('f-' + id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.outline = '2px solid #c8102e'; setTimeout(() => el.style.outline = '', 1800); } }, 350); }
function ack(sec, on) { DEC['chg:' + sec] = { ack: on }; saveDec(); rerender(); }
function ackAll() { DIFFS().forEach(d => DEC['chg:' + d.sec] = { ack: true }); saveDec(); rerender(); toast('All changes confirmed in price'); }
function toggleRfi(id, on) { DEC[id] = Object.assign({}, DEC[id], { act: on ? 'on' : 'off' }); saveDec(); rerender(); }
function setStatus(id, s) { RS[id] = Object.assign(rs(id), { status: s, sent: s === 'draft' ? '' : (rs(id).sent || today()) }); saveRS(); refreshChrome(); toast(E.rfiNo(rfiNums()[id]) + ' marked ' + s); }
function setAnswer(id, v) { RS[id] = Object.assign(rs(id), { answer: v, status: v && rs(id).status !== 'closed' ? 'answered' : rs(id).status }); saveRS(); }
function rfiBook() { return Object.assign({}, BOOK, { cm: META.gc || BOOK.cm, bid: { bidNo: META.bidNo } }); }
function copyDrafts() { const N = rfiNums(); cp(CONFS().filter(c => inLog(c) && rs(c.id).status === 'draft').map(c => E.rfiText(rfiBook(), c, N[c.id])).join('\n\n' + '-'.repeat(60) + '\n\n'), 'Draft RFIs copied — paste into the CM\'s RFI log or email'); }
function markSent() { CONFS().filter(c => inLog(c) && rs(c.id).status === 'draft').forEach(c => RS[c.id] = Object.assign(rs(c.id), { status: 'sent', sent: today() })); saveRS(); rerender(); toast('Marked as sent today'); }
function buildSheet() {
  let S;
  const meta = { project: BOOK.name + ' — ' + (META.lens === 'plumb' ? 'Plumbing' : 'HVAC Ductwork'), gc: META.gc, bidNo: META.bidNo, due: META.due, valid: +META.valid || 30, specKey: BOOK.key };
  if (BOOK.takeoff) S = BC.startSheet(meta, BOOK.takeoff);
  else { S = BC.load() || BC.startSheet(meta, []); Object.assign(S.meta, meta); }
  const r = BC.syncAdders(S, ADDERS()); BC.save(S);
  rerender(); toast(`Bid sheet ${BOOK.takeoff ? 'built from the takeoff' : 'linked'} · ${r.added} spec adders added`);
}
function syncSheet() {
  const S = sheet(); if (!S) return buildSheet();
  Object.assign(S.meta, { gc: META.gc, bidNo: META.bidNo, due: META.due, valid: +META.valid || 30 });
  if (S.status === 'confirmed') S.status = 'draft';
  const r = BC.syncAdders(S, ADDERS()); BC.save(S);
  rerender(); toast(`Synced · ${r.added} added, ${r.updated} updated, ${r.removed} removed`);
}
function issueProposal() { if (checks().some(c => c.level === 'error')) { toast('Fix the preflight issues first'); return; } window.print(); }
function copyProposal() { cp($('#pdoc').innerText, 'Proposal text copied'); }
function cp(txt, msg) { const done = () => toast(msg); if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fb(txt, done)); else fb(txt, done); }
function fb(txt, cb) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); cb(); }

function bind() {
  document.querySelectorAll('[data-meta]').forEach(inp => {
    inp.oninput = () => {
      const k = inp.dataset.meta; META[k] = inp.type === 'number' ? (+inp.value || '') : inp.value; saveMeta();
      if (['gc', 'bidNo', 'due'].includes(k)) inp.classList.toggle('miss', !inp.value);
      refreshChrome();
      if (step === 'proposal') { const S = sheet(); $('#pdoc').innerHTML = proposalHTML(S, S ? BC.totals(S) : null); }
    };
    if (step === 'proposal' && inp.tagName !== 'TEXTAREA') inp.onchange = () => rerender();
  });
  document.querySelectorAll('input[data-amt]').forEach(inp => {
    inp.oninput = () => {
      const v = +inp.value.replace(/[^\d.]/g, '') || 0, id = inp.dataset.amt;
      DEC[id] = Object.assign({}, DEC[id], { act: 'price', amt: v }); saveDec();
      inp.classList.toggle('miss', !(v > 0)); refreshChrome();
    };
    inp.onblur = () => {
      const id = inp.dataset.amt, v = +inp.value.replace(/[^\d.]/g, '') || 0;
      inp.value = v ? Math.round(v).toLocaleString() : '';
      if (v > 0 && !(DEC[id] || {}).ok) { DEC[id] = Object.assign({}, DEC[id], { ok: true }); saveDec(); setTimeout(() => repaintCard(id), 0); }
    };
    inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  });
  const q = document.getElementById('fq');
  if (q) q.oninput = () => { UI.q = q.value; const pos = q.selectionStart; rerender(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(pos, pos); };
  const drop = document.getElementById('drop');
  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over'); }
}
function dock() {
  const sub = document.querySelector('.section-subnav');
  if (sub) document.documentElement.style.setProperty('--sb-dock', ((parseFloat(getComputedStyle(sub).top) || 0) + sub.getBoundingClientRect().height) + 'px');
}
window.addEventListener('resize', dock);

/* ---------- load a real book (in-browser) ---------- */
function ov(show, h) { $('#ov').classList.toggle('show', show); if (h) $('#ov-h').textContent = h; }
function prog(msg, f) { $('#ov-st').textContent = msg; $('#ov-bar').style.width = Math.round(f * 100) + '%'; }
async function loadBook(file) {
  if (!file) return;
  ov(true, 'Reading ' + file.name); prog('Loading PDF reader…', 0.02);
  try {
    const t0 = performance.now();
    const r = await E.analyze(file, prog);
    BOOK = r.book; RAW = r.raw; PRIOR = null;
    E.store.sset('msm-spec-local', BOOK); E.store.sset('msm-spec-active', 'local');
    step = 'load'; loadState(); ov(false); render();
    toast(`Read ${pgs(BOOK.totalPages)} pages in ${((performance.now() - t0) / 1000).toFixed(0)}s — fill in the bid setup to start`);
  } catch (e) { ov(false); toast('Could not read that PDF: ' + e.message); console.error(e); }
}
async function loadPrior(file) {
  if (!file) return;
  if (!RAW) { toast('Reload your book first — its text is kept in memory only'); return; }
  ov(true, 'Comparing against ' + file.name); prog('Loading prior issue…', 0.02);
  try {
    const pages = await E.extract(file, (d, n) => prog('Reading prior page ' + pgs(d) + ' of ' + pgs(n), d / n * 0.9));
    prog('Comparing sentence by sentence', 0.94);
    PRIOR = E.buildSections(pages);
    BOOK.diffs = E.diffBooks(RAW, PRIOR, s => E.YOURS.includes(s.div) || E.HOOKS.includes(s.div));
    E.store.sset('msm-spec-local', BOOK);
    ov(false); go('changes'); toast(`${BOOK.diffs.length} sections changed versus ${file.name}`);
  } catch (e) { ov(false); toast('Could not compare: ' + e.message); console.error(e); }
}
function useSample() { E.store.sset('msm-spec-active', 'sample'); BOOK = window.SPECBOOK; RAW = PRIOR = null; step = null; loadState(); render(); toast('Sample book loaded'); }
$('#pick-cur').onchange = e => { loadBook(e.target.files[0]); e.target.value = ''; };
$('#pick-prior').onchange = e => { loadPrior(e.target.files[0]); e.target.value = ''; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = [...(e.dataTransfer.files || [])].find(x => /pdf$/i.test(x.type) || /\.pdf$/i.test(x.name)); if (f) loadBook(f); });

if (BOOK.local) setTimeout(() => toast('Your book\'s decisions are restored; reload the PDF to compare issues'), 600);
render();
</script>
