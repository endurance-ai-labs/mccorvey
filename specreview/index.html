<!DOCTYPE html>

<style>
  .sb-mode { display:inline-flex; align-items:center; gap:7px; font-size:10px; font-weight:800; letter-spacing:.1em; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); }
  .sb-mode i { width:7px; height:7px; border-radius:50%; background:#f0b429; }
  .sb-mode.local i { background:#2f9e6e; }
  .sb-hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .sb-hbtns .pa-btn { background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.22); }
  .sb-hbtns .pa-btn:hover { background:rgba(255,255,255,.16); color:#fff; border-color:#fff; }

  .sb-steps { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; margin:0 0 18px; position:sticky; top:var(--sb-dock, 150px); z-index:40; background:var(--color-bg); padding:8px 0; }
  .sb-step { display:flex; gap:10px; align-items:center; text-align:left; font:inherit; border:1px solid var(--color-border); background:var(--color-bg-2); border-radius:12px; padding:10px 12px; cursor:pointer; min-width:0; }
  .sb-step:hover { border-color:var(--color-blue); }
  .sb-step .k { flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; background:var(--color-bg-3); color:var(--color-text-muted); }
  .sb-step .t { min-width:0; }
  .sb-step .t b { display:block; font-size:12.8px; color:var(--color-cloud-whisper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-step .t span { display:block; font-size:11px; color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-step.done .k { background:#2f9e6e; color:#fff; }
  .sb-step.err .k { background:#c8102e; color:#fff; }
  .sb-step.warn .k { background:var(--color-amber); color:#fff; }
  .sb-step.on { border-color:#14283c; box-shadow:0 0 0 2px #14283c inset; }

  .sb-nav { display:flex; justify-content:space-between; gap:10px; margin:22px 0 8px; flex-wrap:wrap; }
  .sb-nav .pa-btn { height:44px; padding:0 22px; font-size:13px; }

  .sb-src { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .sb-card { border:1px solid var(--color-border); border-radius:14px; padding:18px 20px; background:var(--color-bg-2); display:flex; flex-direction:column; gap:10px; }
  .sb-card.cur { border-color:#14283c; box-shadow:0 0 0 2px #14283c inset; }
  .sb-card h3 { margin:0; font-size:15px; color:var(--color-cloud-whisper); }
  .sb-card p { margin:0; font-size:12.5px; color:var(--color-text-muted); line-height:1.55; }
  .sb-card .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:auto; }
  .sb-drop { border:2px dashed var(--color-border); border-radius:12px; padding:14px; text-align:center; font-size:12px; color:var(--color-text-muted); cursor:pointer; }
  .sb-drop.over, .sb-drop:hover { border-color:var(--color-blue); background:var(--color-blue-pale); color:var(--color-blue); }
  .sb-tag { font-size:9.5px; font-weight:800; letter-spacing:.09em; padding:3px 8px; border-radius:5px; background:#2f9e6e; color:#fff; align-self:flex-start; }

  .sb-form { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px 14px; }
  .sb-f { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .sb-f > span { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--color-slate-hint); }
  .sb-f input, .sb-f select, .sb-f textarea { font:inherit; font-size:13.5px; font-weight:600; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); min-width:0; box-sizing:border-box; width:100%; }
  .sb-f input:focus, .sb-f select:focus, .sb-f textarea:focus { outline:none; border-color:var(--color-blue); }
  .sb-f input.miss { border-color:#c8102e; background:rgba(200,16,46,.05); }
  .sb-f.wide { grid-column:span 2; } .sb-f.full { grid-column:1 / -1; }
  .sb-lens { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
  .sb-lens button { font:inherit; font-size:12.5px; font-weight:700; padding:11px 10px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-muted); cursor:pointer; }
  .sb-lens button.on { background:#14283c; color:#fff; border-color:#14283c; }
  .sb-lens button { padding:10px 8px; }
  .sb-lens button b { display:block; font-size:13px; line-height:1.25; }
  .sb-lens button span { display:block; font-size:10.5px; font-weight:600; opacity:.75; margin-top:2px; white-space:nowrap; }
  .sb-lens button:hover:not(.on) { border-color:var(--color-blue); color:var(--color-blue); }

  .sb-bars { display:flex; flex-direction:column; gap:9px; }
  .sb-bar.off { opacity:.38; }
  .sb-scope { margin-top:10px; border:1px solid var(--color-border); border-radius:12px; padding:10px 12px; background:var(--color-bg); }
  .sb-scope .h { display:block; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--color-slate-hint); margin-bottom:8px; }
  .sb-scope > div { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
  .sb-scope button { font:inherit; text-align:left; border:1px solid var(--color-border); border-radius:9px; padding:8px 10px; background:var(--color-bg-2); cursor:pointer; min-width:0; }
  .sb-scope button:hover { border-color:var(--color-blue); }
  .sb-scope b { display:block; font-size:17px; color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }
  .sb-scope span { display:block; font-size:11px; color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-hint { font-size:11px; color:var(--color-text-muted); line-height:1.45; }
  @media (max-width:700px) { .sb-scope > div { grid-template-columns:1fr 1fr; } }
  .sb-bar { display:grid; grid-template-columns:210px 1fr 64px; gap:12px; align-items:center; font-size:12px; }
  .sb-bar .nm { color:var(--color-cloud-whisper); font-weight:700; }
  .sb-bar .nm span { display:block; font-size:10.5px; font-weight:600; color:var(--color-text-muted); }
  .sb-bar .tr { height:12px; border-radius:99px; background:var(--color-bg-3); overflow:hidden; }
  .sb-bar .tr i { display:block; height:100%; border-radius:99px; }
  .sb-bar .v { text-align:right; font-weight:800; color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }

  .sb-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .sb-tools input[type=search] { flex:1; min-width:200px; font:inherit; font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg-2); color:var(--color-cloud-whisper); }
  .sb-chip { font:inherit; font-size:12px; font-weight:700; padding:8px 13px; border-radius:999px; border:1px solid var(--color-border); background:var(--color-bg-2); color:var(--color-text-muted); cursor:pointer; white-space:nowrap; }
  .sb-chip b { margin-left:5px; }
  .sb-chip.on { background:#14283c; color:#fff; border-color:#14283c; }
  .sb-prog { display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:12px; color:var(--color-text-muted); }
  .sb-prog .tr { flex:1; height:8px; border-radius:99px; background:var(--color-bg-3); overflow:hidden; }
  .sb-prog .tr i { display:block; height:100%; background:#2f9e6e; border-radius:99px; transition:width .25s; }
  .sb-prog b { color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }

  .sb-grp { margin-bottom:16px; }
  .sb-grp-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 2px; border-bottom:2px solid var(--color-border); margin-bottom:8px; }
  .sb-grp-h b { font-size:13px; color:var(--color-cloud-whisper); }
  .sb-grp-h span { font-size:11.5px; color:var(--color-text-muted); }
  .sb-grp-h .pa-btn { margin-left:auto; height:30px; font-size:11.5px; }

  .fd { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:start; border:1px solid var(--color-border); border-left:4px solid var(--color-border); border-radius:11px; padding:12px 14px; margin-bottom:8px; background:var(--color-bg-2); }
  .fd.high { border-left-color:#c8102e; } .fd.med { border-left-color:var(--color-amber); }
  .fd.ok { background:var(--color-bg); }
  .fd.ok .fd-top b { color:var(--color-text-muted); }
  .fd-top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:4px; }
  .fd-top b { font-size:13.2px; color:var(--color-cloud-whisper); }
  .fd-imp { font-size:12px; line-height:1.5; color:var(--color-text-muted); }
  .fd details { margin-top:6px; }
  .fd summary { font-size:11px; font-weight:700; color:var(--color-blue); cursor:pointer; }
  .fd .says { font-size:12.2px; line-height:1.6; color:var(--color-cloud-whisper); padding:8px 12px; border-left:3px solid var(--color-border); background:var(--color-bg); border-radius:0 8px 8px 0; margin-top:6px; }
  .fd-side { display:flex; flex-direction:column; align-items:flex-end; gap:7px; max-width:min(360px, 52vw); min-width:0; }
  .cite { font-size:10.5px; font-weight:800; color:#14283c; background:#e8edf3; border-radius:5px; padding:3px 8px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  [data-theme="dark"] .cite { color:#cfe0f2; background:#1f3248; }
  .bdg { font-size:9.5px; font-weight:800; letter-spacing:.07em; padding:3px 8px; border-radius:5px; white-space:nowrap; }
  .bdg.d01 { background:#14283c; color:#fff; } .bdg.chg { display:inline-block; background:var(--color-blue-pale); color:var(--color-blue); border:1px solid var(--color-blue); }
  .sev { font-size:9px; font-weight:800; letter-spacing:.09em; padding:3px 8px; border-radius:999px; }
  .sev.high { color:#fff; background:#c8102e; } .sev.med { color:var(--color-amber); background:var(--color-amber-bg); border:1px solid var(--color-amber); } .sev.info { color:var(--color-text-muted); background:var(--color-bg-3); border:1px solid var(--color-border); }
  .seg { display:inline-flex; border:1px solid var(--color-border); border-radius:10px; overflow:hidden; }
  .seg button { position:relative; font:inherit; font-size:11.5px; font-weight:700; padding:8px 11px; border:0; border-right:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-muted); cursor:pointer; white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--color-bg-3); color:var(--color-cloud-whisper); }
  .seg button.rec::after { content:'REC'; position:absolute; top:0; right:2px; font-size:7px; font-weight:800; color:var(--color-blue); }
  .seg button.on.price { background:#2f9e6e; color:#fff; } .seg button.on.rfi { background:#14283c; color:#fff; }
  .seg button.on.clarify { background:var(--color-amber); color:#fff; } .seg button.on.exclude { background:#6b7684; color:#fff; } .seg button.on.note { background:var(--color-bg-3); color:var(--color-cloud-whisper); }
  .seg button.on.rec::after { color:rgba(255,255,255,.85); }
  .amt { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--color-text-muted); }
  .amt input { width:120px; font:inherit; font-size:13px; font-weight:800; text-align:right; padding:6px 9px; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); font-variant-numeric:tabular-nums; }
  .amt input.miss { border-color:#c8102e; background:rgba(200,16,46,.06); }
  .amt input:focus { outline:none; border-color:var(--color-blue); }
  .fd-ok { font-size:11px; font-weight:800; color:#2f9e6e; letter-spacing:.04em; }
  .fd-basis { font-size:10.5px; color:var(--color-slate-hint); text-align:right; max-width:260px; }

  .sb-kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .sb-kpi { border:1px solid var(--color-border); border-top:4px solid #14283c; border-radius:12px; padding:12px 15px; background:var(--color-bg-2); min-width:0; }
  .sb-kpi.red { border-top-color:#c8102e; } .sb-kpi.green { border-top-color:#2f9e6e; } .sb-kpi.amber { border-top-color:var(--color-amber); }
  .sb-kpi .l { font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--color-slate-hint); text-transform:uppercase; }
  .sb-kpi .v { font-size:23px; font-weight:800; color:var(--color-cloud-whisper); margin-top:4px; font-variant-numeric:tabular-nums; }
  .sb-kpi .s { font-size:11px; color:var(--color-text-muted); margin-top:2px; }
  .dsec { border:1px solid var(--color-border); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--color-bg-2); }
  .dsec.ok { border-color:#2f9e6e; }
  .dsec .hd { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:11px 15px; border-bottom:1px solid var(--color-border); background:var(--color-bg); }
  .dsec .hd b { font-size:13.3px; color:var(--color-cloud-whisper); }
  .dsec .hd .tot { margin-left:auto; font-weight:800; font-size:13px; font-variant-numeric:tabular-nums; }
  .ack { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--color-cloud-whisper); cursor:pointer; padding:6px 11px; border-radius:9px; border:1px solid var(--color-border); background:var(--color-bg-2); }
  .ack input { width:16px; height:16px; accent-color:#2f9e6e; }
  .dsec.ok .ack { border-color:#2f9e6e; color:#2f9e6e; }
  .chg { display:grid; grid-template-columns:1fr 1fr 118px; border-bottom:1px solid var(--color-border); }
  .chg:last-child { border-bottom:0; }
  .chg > div { padding:10px 14px; font-size:12.2px; line-height:1.55; }
  .chg .was { background:rgba(200,16,46,.045); color:var(--color-text-muted); border-right:1px solid var(--color-border); }
  .chg .was del { color:#a30d26; }
  .chg .now { background:rgba(47,158,110,.06); color:var(--color-cloud-whisper); }
  .chg .now ins { text-decoration:none; background:rgba(47,158,110,.16); border-radius:3px; padding:0 2px; }
  .chg .lab { font-size:9.5px; font-weight:800; letter-spacing:.09em; color:var(--color-slate-hint); text-transform:uppercase; display:block; margin-bottom:4px; }
  .chg .imp { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; border-left:1px solid var(--color-border); }
  .up { color:#c8102e; } .dn { color:#2f9e6e; }

  .rfi { border:1px solid var(--color-border); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--color-bg-2); }
  .rfi.off { opacity:.55; }
  .rfi-h { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .rfi-h b { font-size:13.2px; color:var(--color-cloud-whisper); }
  .rfi-h .no { font-weight:800; font-size:12px; color:#14283c; white-space:nowrap; }
  [data-theme="dark"] .rfi-h .no { color:#cfe0f2; }
  .rfi-h .sp { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .rfi-h select { font:inherit; font-size:12px; font-weight:700; padding:6px 8px; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); }
  .rfi-refs { margin:7px 0 0; display:flex; gap:5px; flex-wrap:wrap; }
  .rfi pre { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:11.5px; line-height:1.6; white-space:pre-wrap; background:#0d1826; color:#dbe5ef; border-radius:10px; padding:12px 14px; margin:10px 0 0; overflow-wrap:anywhere; }
  .rfi textarea { width:100%; box-sizing:border-box; margin-top:8px; font:inherit; font-size:12.5px; padding:9px 11px; border-radius:9px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); min-height:56px; }
  .tgl input { width:17px; height:17px; accent-color:#14283c; cursor:pointer; }

  .pf { display:flex; flex-direction:column; gap:8px; }
  .pf-row { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg-2); font-size:12.6px; color:var(--color-cloud-whisper); }
  .pf-row i { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:11px; font-weight:800; color:#fff; }
  .pf-row.error { border-color:#c8102e; background:rgba(200,16,46,.05); } .pf-row.error i { background:#c8102e; }
  .pf-row.warn i { background:var(--color-amber); } .pf-row.ok i { background:#2f9e6e; }
  .pf-row small { display:block; font-size:11px; color:var(--color-text-muted); margin-top:2px; }
  .pf-row .pa-btn { height:32px; font-size:11.5px; }
  .pf-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 16px; border-radius:12px; margin-bottom:12px; color:#fff; background:#c8102e; }
  .pf-head.ready { background:#2f9e6e; }
  .pf-head b { font-size:15px; } .pf-head span { font-size:12px; opacity:.92; }
  .pr-tiles { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:12px; }
  .pr-tiles .sb-kpi .v { font-size:19px; }

  .pdoc { position:relative; background:#fff; color:#1b2430; border:1px solid var(--color-border); border-radius:6px; padding:44px 52px 48px; max-width:880px; margin:0 auto; box-shadow:0 10px 30px rgba(10,22,38,.08); font-size:12.8px; line-height:1.6; }
  .pdoc.draft::before { content:'DRAFT — NOT READY TO ISSUE'; position:absolute; top:16px; right:22px; font-size:10px; font-weight:800; letter-spacing:.12em; color:#c8102e; border:1.5px solid #c8102e; padding:3px 9px; border-radius:4px; }
  .pdoc .lh { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid #c8102e; padding-bottom:12px; margin-bottom:18px; }
  .pdoc .lh img { height:40px; }
  .pdoc .lh .ad { text-align:right; font-size:10.8px; color:#5a6676; line-height:1.5; }
  .pdoc h2 { font-size:17px; margin:0 0 2px; color:#14283c; }
  .pdoc h3 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#c8102e; margin:20px 0 7px; }
  .pdoc .meta { display:grid; grid-template-columns:90px 1fr 80px 1fr; gap:3px 12px; font-size:12.2px; margin:12px 0 4px; }
  .pdoc .meta b { color:#5a6676; font-weight:700; }
  .pdoc table { width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  .pdoc th { text-align:right; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#5a6676; border-bottom:1.5px solid #14283c; padding:6px; }
  .pdoc td { text-align:right; padding:6px; border-bottom:1px solid #e3e8ee; font-variant-numeric:tabular-nums; }
  .pdoc th.l, .pdoc td.l { text-align:left; }
  .pdoc tr.sub td { font-weight:700; border-top:1px solid #9aa6b2; }
  .pdoc tr.grand td { font-weight:800; font-size:13.5px; color:#14283c; border-top:2px solid #14283c; border-bottom:0; }
  .pdoc .pd-ill { margin:0 0 6px; font-size:11px; color:#a86b00; font-weight:700; }
  .pdoc p.sys { margin:10px 0 3px; font-weight:800; font-size:11.5px; color:#14283c; }
  .pdoc ul { margin:0; padding-left:20px; } .pdoc ul li { margin:0 0 4px; }
  .pdoc ol { margin:0; padding-left:20px; } .pdoc li { margin:0 0 6px; }
  .pdoc .ref { color:#5a6676; font-size:11px; white-space:nowrap; }
  .pdoc .sig { display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:38px; font-size:11.2px; color:#5a6676; }
  .pdoc .sig div { border-top:1px solid #9aa6b2; padding-top:6px; }
  .pdoc .sig .sig-on { border-top-color:#14283c; }
  .pdoc .sig .sig-meta { display:block; margin-top:4px; }

<script>
if (!isSignedIn() && !location.search.includes('enter')) location.replace('/mccorvey/welcome/');
McCorveyNav.renderTopbar({ subtitle: 'Preconstruction — Spec Book to Proposal' });
const app = $('#app');
const E = window.SpecEngine, BC = window.BidCalc;

/* ===================== STATE ===================== */
let BOOK = E.activeBook();
/* illustrative build-ups scale to the project's size: read from the book's Summary when it states one */
/* a build-up prices a project-wide scope: price it once per rule, under its main section, and
   recommend the repeats as Noted with a pointer, so the same scope is never counted twice */
function leadPerRule(book) {
  if (!window.BuildUps) return;
  const home = r => { const L = (E.RULES.find(x => x.id === r) || {}).lens; return L === 'plumb' ? '22' : L === 'sm' || L === 'hvac' ? '23' : '01'; };
  const sevN = { high: 0, med: 1, info: 2 };
  const by = {};
  book.findings.filter(f => f.act === 'price' && BuildUps.has(f)).forEach(f => (by[f.rule] = by[f.rule] || []).push(f));
  Object.entries(by).forEach(([r, L]) => {
    if (L.length < 2) return;
    L.sort((a, b) => (a.sec.slice(0, 2) === home(r) ? 0 : 1) - (b.sec.slice(0, 2) === home(r) ? 0 : 1) || sevN[a.sev] - sevN[b.sev] || a.page - b.page);
    const lead = L[0];
    L.slice(1).forEach(f => { f.act = 'note'; f.dupOf = lead.id; f.impact = `${f.impact} Priced once for the project, under ${E.cite(lead.sec, lead.para, lead.page)}.`; });
  });
}
function applyProfile() { if (!window.BuildUps) return; BuildUps.profile.sf = BOOK.projSF || 1290000; BuildUps.profile.src = BOOK.projSF ? 'book' : 'assumed'; }
applyProfile();
let RAW = null, PRIOR = null;           /* extracted text: memory only */
let DEC, META, RS;
const STEPS = [['load', 'Set up'], ['decide', 'Decide'], ['changes', 'Changes'], ['rfis', 'RFIs'], ['proposal', 'Proposal']];
const HASH_ALIAS = { inputs: 'load', triage: 'load', findings: 'decide', matrix: 'decide', adders: 'proposal', letter: 'proposal' };
let step = (() => { const h = (location.hash || '').slice(1); const k = HASH_ALIAS[h] || h; return STEPS.some(s => s[0] === k) ? k : null; })();
const UI = { filter: 'needs', q: '', showMatrix: false, showSecs: false, openRfi: null, rtype: null, cx: 'all', showPB: false, se: null, handoff: false, part: null, words: false };

function loadState() {
  DEC = E.decisions(BOOK);
  META = Object.assign({ lens: E.store.get('msm-spec-lens', 'sm'), gc: (BOOK.bid && BOOK.bid.gc) || '', bidNo: (BOOK.bid && BOOK.bid.bidNo) || '', due: (BOOK.bid && BOOK.bid.due) || '', valid: 30, notes: '' },
    E.store.get('msm-spec-meta-' + BOOK.key, {}));
  RS = E.store.get('msm-spec-rfi-' + BOOK.key, null);
  if (!RS) {
    RS = {};
    if (BOOK.sample) {
      RS.C03 = { status: 'sent', sent: '2026-10-05' };
      RS.C06 = { status: 'sent', sent: '2026-10-08' };
      RS.C02 = { status: 'answered', sent: '2026-10-02', answer: 'Provide 12 ga sleeves through masonry and concrete per 23 0500; 22 ga elsewhere.' };
      RS.C08 = { status: 'closed', sent: '2026-10-01', answer: 'Fire pumps are electric drive. Disregard diesel exhaust insulation in 22 0719.' };
    }
    E.store.set('msm-spec-rfi-' + BOOK.key, RS);
  }
  if (!step) step = META.started ? 'decide' : 'load';
}
const saveDec = () => E.saveDecisions(BOOK, DEC);
const saveMeta = () => { E.store.set('msm-spec-meta-' + BOOK.key, META); E.store.set('msm-spec-lens', META.lens); };
const saveRS = () => E.store.set('msm-spec-rfi-' + BOOK.key, RS);
loadState();

/* ===================== HELPERS ===================== */
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const moneyK = n => { const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'K' : Math.round(a); return (n < 0 ? '−$' : '$') + s; };
const moneyU = n => '$' + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));
const pgs = n => Number(n).toLocaleString();
const pad2 = n => String(n).padStart(2, '0');
const iss = n => n == null ? '—' : 'Issue ' + String(n).padStart(2, '0');
const sevL = { high: 'HIGH', med: 'MEDIUM', info: 'INFO' };
const sevO = { high: 0, med: 1, info: 2 };
const ACTS = [['price', 'Price it'], ['rfi', 'RFI'], ['clarify', 'Qualify'], ['exclude', 'Exclude'], ['note', 'Noted']];
const today = () => new Date().toISOString().slice(0, 10);
const daysTo = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800); }

const lensOk = l => E.inLens(l || 'other', META.lens);
const fLens = f => f.lens || E.lensOf(f.sec);
const divRank = sec => { const d = sec.slice(0, 2); return d === '00' || d === '01' ? 0 : d === '23' ? 1 : d === '25' ? 2 : d === '22' ? 3 : 4; };
const FS = () => BOOK.findings.filter(f => lensOk(fLens(f))).sort((a, b) => divRank(a.sec) - divRank(b.sec) || a.page - b.page);
const dec = f => { const d = DEC[f.id] || {}; const amt = E.amtOf(f, d); return { act: d.act || f.act, amt, ok: !!d.ok, allow: !!d.allow && !(amt > 0) }; };
const REQS = {
  must: ['REQUIRED TO BID', 'Spec says "shall". Leave it out and the bid is non-compliant.'],
  call: ['YOUR CALL', 'Commercial or risk term. Carry, qualify or exclude: the bid stays compliant.'],
  open: ['NEEDS RFI ANSWER', 'Book is unclear or blank. Bid the stated assumption until the CM answers.'],
  not: ['NOT REQUIRED', 'Not clearly your trade. Exclude unless invited to bid it.'],
  info: ['INFO ONLY', 'No effect on price or scope.'],
};
/* sample findings carry f.req; engine findings fall back on their recommended action */
const reqOf = f => f.req || (f.act === 'rfi' ? 'open' : f.act === 'exclude' ? 'not' : f.act === 'clarify' ? 'call' : 'must');
const needsAmt = f => { const d = dec(f); return d.act === 'price' && !(d.amt > 0) && !d.allow; };
const ALLCONFS = () => BOOK.conflicts.concat(BOOK.diffs ? changeRfis() : []);
const CONFS = () => ALLCONFS().filter(c => lensOk(c.lens));
const inLog = c => (DEC[c.id] || {}).act !== 'off';
const rs = id => Object.assign({ status: 'draft', sent: '', answer: '' }, RS[id]);
/* CSI Parts: what each one drives in the estimate */
const PARTN = { 1: 'General', 2: 'Products', 3: 'Execution' };
const PART_DRIVES = { 1: 'submittals, warranties, coordination, commercial terms', 2: 'materials, named makers, vendor quotes', 3: 'installation, testing, field labor' };
const partOf = f => f.part || (/^[123]\./.test(f.para || '') ? +f.para[0] : null);
/* field hours behind a finding: its build-up on your own book, the price book line on the sample */
function laborHrsOf(f) {
  if (window.BuildUps && BuildUps.has(f) && dec(f).act === 'price') return BuildUps.build(f).laborHrs || 0;
  if (f.pb && window.PRICEBOOK && dec(f).act === 'price') { const it = PRICEBOOK.BY[f.pb.code]; return it && it.hrs ? it.hrs * f.pb.qty : 0; }
  return 0;
}
function goPart(n) { UI.part = n; UI.filter = 'all'; go('decide'); }
const HASAMT = () => BOOK.sample || BOOK.diffs.some(d => d.illustrative);
const ILLUS = () => !BOOK.sample && DIFFS().some(d => d.illustrative);
const DIFFS = () => BOOK.diffs.filter(d => lensOk(d.lens));
/* McCorvey's response to each changed sentence: already in price / add (or deduct) $ / RFI / qualify */
const chgKey = (d, i) => 'chgc:' + d.sec + ':' + i;
const chgCovered = c => { const f = c.find && BOOK.findings.find(x => x.id === c.find); return f && dec(f).act === 'price' && dec(f).amt > 0 ? f : null; };
const chgQualText = (d, c) => `Section ${d.sec}${c.para ? ' ¶' + c.para : ''} is priced as reissued in ${iss(d.to)}. Any later revision to it is excluded.`;
function chgResp(d, i) {
  const c = d.changes[i], st = DEC[chgKey(d, i)] || {};
  const def = chgCovered(c) ? 'in' : c.amt ? 'add' : 'in';
  return { resp: st.resp || def, set: !!st.resp, amt: st.amt != null ? +st.amt : (c.amt || 0), text: st.text != null ? st.text : chgQualText(d, c) };
}
/* the dollars a change carries now: the finding that prices it (incl. McCorvey's override), McCorvey's own Add $, else the estimate */
function chgEff(d, i) {
  const c = d.changes[i], r = chgResp(d, i), cov = chgCovered(c);
  if (cov && (DEC[cov.id] || {}).amt != null && r.resp === 'add') return { amt: dec(cov).amt, src: 'yours', cov };
  if (cov) return { amt: c.amt || 0, src: c.amt && Math.round(c.amt) === Math.round(dec(cov).amt) ? 'finding' : c.illustrative ? 'illustrative' : 'estimate', cov };
  if (r.resp === 'add') return { amt: r.amt, src: (DEC[chgKey(d, i)] || {}).amt != null ? 'yours' : c.illustrative ? 'illustrative' : 'estimate' };
  return { amt: c.amt || 0, src: c.illustrative ? 'illustrative' : 'estimate' };
}
const secEff = d => d.changes.reduce((a, c, i) => a + chgEff(d, i).amt, 0);
const effId = (d, i) => 'imp-' + chgKey(d, i).replace(/\W/g, '_');
function impHTML(d, i) {
  const c = d.changes[i], e = chgEff(d, i);
  const lab = e.src === 'yours' ? 'your number' : e.src === 'finding' ? 'from its finding' : e.src === 'illustrative' ? 'illustrative' : '';
  return `${HASAMT() || e.src === 'yours' ? (e.amt ? (e.amt > 0 ? '+' : '') + money(e.amt) : '$0') : '—'}${lab ? `<small class="isrc ${e.src}">${lab}</small>` : ''}${c.find ? `<div style="font-size:10.5px;font-weight:600;margin-top:3px"><a href="javascript:void 0" onclick="jumpFinding('${c.find}')">see finding</a></div>` : ''}`;
}
/* while typing, update the amount column and the section total in place (keeps focus) */
function liveChg(k) {
  const m = k.match(/^chgc:(.+):(\d+)$/); if (!m) return;
  const d = BOOK.diffs.find(x => x.sec === m[1]); if (!d) return;
  const i = +m[2], el = document.getElementById(effId(d, i)), e = chgEff(d, i);
  if (el) { el.innerHTML = impHTML(d, i); el.className = 'imp ' + (e.amt > 0 ? 'up' : e.amt < 0 ? 'dn' : ''); }
  const t = document.getElementById('tot-' + d.sec.replace(/\W/g, '')); if (t) { const v = secEff(d); t.textContent = (v > 0 ? '+' : '') + money(v); t.className = 'tot ' + (v > 0 ? 'up' : v < 0 ? 'dn' : ''); }
}
/* a section is confirmed when it is ticked, or when every changed sentence in it has a response */
const acked = d => !!(DEC['chg:' + d.sec] || {}).ack || (d.changes.length > 0 && d.changes.every((c, i) => (DEC[chgKey(d, i)] || {}).resp));
function chgAdders() {
  const out = [];
  DIFFS().forEach(d => d.changes.forEach((c, i) => { const r = chgResp(d, i); if (r.resp === 'add' && r.amt && !chgCovered(c) && (r.set || acked(d))) out.push({ id: chgKey(d, i), title: `Change ${d.sec}${c.para ? ' ¶' + c.para : ' #' + (i + 1)} (${iss(d.from)} → ${iss(d.to)})`, amt: r.amt, tag: 'Change · ' + E.cite(d.sec, c.para, c.page) }); }));
  return out;
}
/* a change sent to RFI joins the RFI log; it quotes only the current (real) wording */
function changeRfis() {
  const out = [];
  BOOK.diffs.forEach(d => d.changes.forEach((c, i) => {

function wdiff(a, b) {
  const A = String(a).split(/\s+/).filter(Boolean), B = String(b).split(/\s+/).filter(Boolean);
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const x = [], y = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { x.push(esc(A[i])); y.push(esc(B[j])); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) x.push(`<del class="w">${esc(A[i++])}</del>`);
    else y.push(`<ins>${esc(B[j++])}</ins>`);
  }
  while (i < n) x.push(`<del class="w">${esc(A[i++])}</del>`);
  while (j < m) y.push(`<ins>${esc(B[j++])}</ins>`);
  /* merge runs so a changed phrase reads as one mark */
  return [x.join(' ').replace(/<\/del> <del class="w">/g, ' '), y.join(' ').replace(/<\/ins> <ins>/g, ' ')];
}

  if (BOOK.inputs && !META.attachOk) add('error', 'proposal', 'Confirm the attachments the spec book requires with the bid', ATTACH().map(r => `${r.item} (${r.sec})`).join(' · '), "confirmPF('attachOk')", 'Confirm');
  if (!S) add('error', 'proposal', 'Bid sheet is not built from this spec book', BOOK.takeoff ? 'Review what will be built, then confirm.' : 'One click adds your priced adders to the current bid sheet.', 'buildSheet()', 'Build');
  else {
    const dif = BC.adderDiff(S, ADDERS());
    if (dif.length) add('error', 'proposal', `${dif.length} spec adder${dif.length > 1 ? 's' : ''} out of sync with the bid sheet`, dif.slice(0, 2).map(x => x.title + (x.kind === 'amount' ? ` (sheet ${money(x.sheet)}, spec ${money(x.spec)})` : ' (' + x.kind + ')')).join(' · '), 'syncSheet()', 'Sync');
    if (!S.lines.some(l => BC.inc(l) && !l.scope.startsWith(BC.ADDER))) add('error', 'proposal', 'Bid sheet has no base scope lines', '', "location.href='/mccorvey/bidmodel/'", 'Open sheet');
    const T = BC.totals(S);
    if (T.margin < BC.FLOOR) add('error', 'proposal', `Margin ${T.margin.toFixed(1)}% is below the ${BC.FLOOR}% walk-away floor`, '', "location.href='/mccorvey/bidmodel/'", 'Adjust');
    else if (T.margin < BC.TARGET) add('warn', 'proposal', `Margin ${T.margin.toFixed(1)}% is under the ${BC.TARGET}% target`, '');
    if (T.mp === 'over') add('error', 'proposal', 'Not enough crew to staff this job on the bid schedule', `${T.fieldNeed.toFixed(0)} field / ${T.shopNeed.toFixed(0)} shop needed`, "location.href='/mccorvey/bidmodel/'", 'Adjust');
    else if (T.mp === 'tight') add('warn', 'proposal', 'Crew check is tight (over 85% of available)', '');
  }
  return out;
}

function paneChanges() {
  const D = DIFFS();
  const up = D.reduce((a, d) => a + d.changes.reduce((b, c, i) => b + Math.max(0, chgEff(d, i).amt), 0), 0);
  const dn = D.reduce((a, d) => a + d.changes.reduce((b, c, i) => b + Math.min(0, chgEff(d, i).amt), 0), 0);
  const secTot = secEff;
  const nChg = D.reduce((a, d) => a + d.changes.length, 0);
  const issNos = Object.keys(BOOK.issues || {}).map(Number).sort((a, b) => a - b);
  const byIssue = n => D.filter(d => d.to === n).length;
  let big = null; D.forEach(d => d.changes.forEach((c, i) => { const a = chgEff(d, i).amt; if (!big || a > big.a) big = { d, c, a }; }));
  const maxAbs = Math.max(1, ...D.map(d => Math.abs(secTot(d))));
  const bars = D.slice().sort((a, b) => Math.abs(secTot(b)) - Math.abs(secTot(a)));
  const CXF = [['all', 'All', () => true], ['cost', 'Adds cost', d => secTot(d) > 0], ['credit', 'Credits', d => secTot(d) < 0], ['out', 'Outside your division', d => d.crossDiv || /^0[01]/.test(d.sec)], ['open', 'Not confirmed', d => !acked(d)]];
  const fx = (CXF.find(x => x[0] === UI.cx) || CXF[0])[2];
  const DS = D.filter(fx);
  const illus = ILLUS();
  const hero = HASAMT() && D.length ? `
    ${illus ? `<div class="cx-illus"><b>Illustrative redlines, for illustration only.</b> The prior issue PDF is not loaded, so the earlier wording, the issue labels and dates for Issues 01–${pad2(BOOK.bookIssue - 1)} and the dollar figures are simulated. Which sections were reissued and their current wording are real, from this book. Load the prior issue to replace them with the real comparison.</div>` : ''}
    <div class="cx-hero">
      <h3>The book changed ${issNos.filter(n => n > BOOK.pricedIssue).length} times after you priced it. Nothing in it says what moved.</h3>
      <p>${D.length} sections were reissued with a new header date only: no clouds, no deltas, no narrative.${illus ? ' Shown here with simulated earlier wording.' : ''} The engine compares every sentence against the issue you priced and puts a dollar figure on each change, so the estimator confirms ${nChg} specific edits instead of rereading ${pgs(D.reduce((a, d) => a + ((BOOK.sections.find(s => s.id === d.sec) || {}).pages || 0), 0))} pages.</p>
      <div class="cx-tl">${issNos.map(n => `<div class="cx-ti ${n === BOOK.pricedIssue ? 'priced' : ''} ${n === BOOK.bookIssue ? 'cur' : ''} ${n > BOOK.pricedIssue && n !== BOOK.bookIssue ? 'after' : ''}"><i></i><b>${iss(n)}</b>${fmtDate(BOOK.issues[n].date)}<br>${esc(BOOK.issues[n].label.split('— ')[1] || '')}${n === BOOK.pricedIssue ? '<br><span class="c">YOU PRICED</span>' : byIssue(n) ? `<br><span class="c">${byIssue(n)} changed</span>` : ''}</div>`).join('')}</div>
      ${big && big.a > 0 ? `<div class="cx-big"><span class="v">+${money(big.a)}</span><span>from one sentence in ${big.d.sec}${big.c.para ? ' ¶' + esc(big.c.para) : ''}: ${esc(big.c.after)}</span><a href="javascript:void 0" onclick="openDoc('${big.d.sec}',${big.c.page},'d-${big.d.sec}-${big.d.changes.indexOf(big.c)}')">Open the page ↗</a></div>` : ''}
    </div>
    <div class="demo-panel" style="margin-bottom:14px">
      <div class="demo-panel-head"><h2>Where the money moved</h2><span class="k">net ${(up + dn) >= 0 ? '+' : ''}${money(up + dn)} · click a row to jump to it</span></div>
      <div class="cx-bars">${bars.map(d => { const t = secTot(d), w = Math.abs(t) / maxAbs * 100; return `<div class="cx-bar ${acked(d) ? 'ok' : ''}" onclick="jumpChg('${d.sec}')"><div class="nm">${d.sec} <span>${esc(E.secTitle(BOOK, d.sec))}</span></div><div class="l">${t < 0 ? `<i style="width:${Math.max(2, w)}%"></i>` : ''}</div><div class="r">${t > 0 ? `<i style="width:${Math.max(2, w)}%"></i>` : ''}</div><div class="v ${t > 0 ? 'up' : t < 0 ? 'dn' : ''}">${t ? (t > 0 ? '+' : '') + moneyK(t) : '$0'}</div></div>`; }).join('')}</div>
    </div>` : '';
  return `${hero}
    <div class="sb-kpis">
      <div class="sb-kpi red"><div class="l">Sections changed</div><div class="v">${D.length}</div><div class="s">${iss(BOOK.pricedIssue)} → ${iss(BOOK.bookIssue)}</div></div>
      <div class="sb-kpi green"><div class="l">Confirmed</div><div class="v">${D.filter(acked).length} / ${D.length}</div><div class="s">each must be confirmed</div></div>
      <div class="sb-kpi amber"><div class="l">Added cost</div><div class="v">${HASAMT() ? '+' + moneyK(up) : '—'}</div><div class="s">${illus ? 'illustrative' : BOOK.sample ? 'already in your adders' : 'price it through findings'}</div></div>
      <div class="sb-kpi"><div class="l">Credits</div><div class="v">${HASAMT() ? moneyK(dn) : '—'}</div><div class="s">${BOOK.sample ? 'incl. one in Div 07' : illus ? 'illustrative' : ''}</div></div>
    </div>
    ${respSummary(D)}
    <div class="sb-tools">
      ${D.some(d => !acked(d)) ? `<button class="pa-btn primary" onclick="ackAll()">Confirm all ${D.filter(d => !acked(d)).length} remaining</button>` : (D.length ? '<span class="fd-ok">✓ ALL CHANGES CONFIRMED</span>' : '')}
      ${BOOK.local ? `<button class="pa-btn" onclick="$('#pick-prior').click()">${PRIOR ? 'Compare a different prior issue' : 'Load prior issue to see each sentence'}</button>` : ''}
      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">${CXF.filter(x => x[0] === 'all' || D.some(x[2]) || UI.cx === x[0]).map(([k, l, f]) => `<button class="sb-chip ${UI.cx === k ? 'on' : ''}" onclick="UI.cx='${k}';rerender()">${l}<b>${D.filter(f).length}</b></button>`).join('')}</span>
    </div>
    ${DS.length ? DS.map(d => {
      const tot = secEff(d), ok = acked(d);
      return `<div class="dsec ${ok ? 'ok' : ''}" id="x-${d.sec.replace(/\W/g, '')}">
        <div class="hd"><span class="bdg chg">${d.isNew ? 'NEW SECTION' : iss(d.from) + ' → ' + iss(d.to)}</span><b>${d.sec} — ${esc(E.secTitle(BOOK, d.sec))}</b>${d.crossDiv ? '<span class="bdg d01">OUTSIDE YOUR DIVISION</span>' : ''}
          <span class="tot ${tot > 0 ? 'up' : tot < 0 ? 'dn' : ''}" id="tot-${d.sec.replace(/\W/g, '')}">${HASAMT() ? (tot > 0 ? '+' : '') + money(tot) : ''}</span>${d.illustrative ? '<span class="bdg ill">ILLUSTRATIVE</span>' : ''}
          <label class="ack"><input type="checkbox" ${ok ? 'checked' : ''} onchange="ack('${d.sec}',this.checked)">${ok ? 'Confirmed in price' : 'Confirm in price'}</label></div>
        ${d.stampOnly && !d.changes.length ? `<div style="padding:11px 15px;font-size:12.2px;color:var(--color-text-muted)">Header stamp moved from ${iss(d.from)} to ${iss(d.to)}. ${PRIOR ? 'No sentence-level differences found against the prior issue.' : 'Load the prior issue to see exactly what changed, or read the section before confirming.'}</div>` : ''}
        ${d.changes.map((c, ci) => { const w = c.before && c.after ? wdiff(c.before, c.after) : null; return `<div class="chg ${(DEC[chgKey(d, ci)] || {}).resp ? 'r-' + chgResp(d, ci).resp : ''}">
          <div class="was ${w ? 'word' : ''}"><span class="lab">Was · ${iss(d.from)}${c.para ? ' · ¶' + c.para : ''}${c.illustrative ? ' · simulated' : ''}</span>${w ? w[0] : c.before ? `<del>${esc(c.before)}</del>` : '<i>Not in prior issue</i>'}</div>
          <div class="now"><span class="lab">Now · ${iss(d.to)}${c.page ? ` · <a href="javascript:void 0" onclick="openDoc('${d.sec}',${c.page},'d-${d.sec}-${ci}')">p. ${pgs(c.page)} ↗</a>` : ''}${chgPill(d, ci)}</span>${w ? w[1] : c.after ? `<ins>${esc(c.after)}</ins>` : '<i>Deleted</i>'}${c.note ? `<div class="ynote" style="margin-top:5px">${esc(c.note)}</div>` : ''}</div>
          ${chgRespHTML(d, ci)}
          <div class="imp ${chgEff(d, ci).amt > 0 ? 'up' : chgEff(d, ci).amt < 0 ? 'dn' : ''}" id="${effId(d, ci)}">${impHTML(d, ci)}</div>
        </div>`; }).join('')}
      </div>`;
    }).join('') : `<div class="sb-empty">${D.length ? 'No changes match this filter.' : 'Nothing in this trade changed after the issue you priced.'}</div>`}`;
}

function chgRespHTML(d, i) {
  const c = d.changes[i], r = chgResp(d, i), k = chgKey(d, i), cov = chgCovered(c), neg = (c.amt || 0) < 0;
  const opts = [['in', 'Already in my price'], ['add', neg ? 'Deduct $' : 'Add $'], ['rfi', 'RFI to the CM'], ['qual', 'Qualify in proposal']];
  return `<div class="resp">
    <span class="rl">Your response${r.set ? '' : ' · suggested'}</span>
    <span class="seg">${opts.map(([v, l]) => `<button class="${v} ${r.resp === v ? 'on' : ''}" onclick="setChg('${d.sec}',${i},'${v}')">${l}</button>`).join('')}</span>
    ${r.resp === 'in' ? `<span class="rn">${cov ? `→ Already priced through <a href="javascript:void 0" onclick="jumpFinding('${cov.id}')">${esc(cov.title)}</a> (${money(dec(cov).amt)}). Nothing else changes.` : '→ Confirmed: the change is already in your number. Nothing else changes.'}</span>` : ''}
    ${r.resp === 'add' ? (cov
      ? `<label class="amt">Price $<input data-chgamt="${k}" data-cov="${cov.id}" value="${Math.round(dec(cov).amt).toLocaleString()}" placeholder="amount" inputmode="decimal"></label><span class="rn">Sets the price of its finding, <a href="javascript:void 0" onclick="jumpFinding('${cov.id}')">${esc(cov.title)}</a>, so it is counted once${(DEC[cov.id] || {}).amt != null && window.BuildUps && BuildUps.has(cov) ? ` (build-up was ${money(BuildUps.recommend(cov))})` : ''}.</span>`
      : `<label class="amt">${neg ? 'Deduct' : 'Add'} $<input data-chgamt="${k}" data-neg="${neg ? 1 : 0}" value="${r.amt ? Math.round(Math.abs(r.amt)).toLocaleString() : ''}" placeholder="amount" inputmode="decimal"></label><span class="rn">Goes to the bid sheet as a change ${neg ? 'credit' : 'adder'}.${c.illustrative && r.amt === c.amt ? ' Illustrative amount.' : ''}</span>`) : ''}
    ${r.resp === 'rfi' ? `<span class="rn">→ <b>${E.rfiNo(rfiNums()['CH-' + d.sec.replace(/\W/g, '') + '-' + i] || 0)}</b> drafted for the CM, citing p. ${pgs(c.page || 0)}. Until answered it prints in the proposal as a bid assumption. <a href="javascript:void 0" onclick="openRfi('CH-${d.sec.replace(/\W/g, '')}-${i}')">Open the RFI ↗</a></span>` : ''}
    ${r.resp === 'qual' ? `<textarea data-chgtext="${k}" rows="2" aria-label="Qualification wording">${esc(r.text)}</textarea><span class="rn">→ Prints in the proposal under Clarifications, in these words. <a href="javascript:void 0" onclick="viewProposalLine()">See it in the proposal ↗</a></span>` : ''}
  </div>`;
}
function respSummary(D) {
  const n = { in: 0, add: 0, rfi: 0, qual: 0 }; let addAmt = 0, set = 0;
  D.forEach(d => d.changes.forEach((c, i) => { if (!(DEC[chgKey(d, i)] || {}).resp) return; set++; const r = chgResp(d, i); n[r.resp]++; if (r.resp === 'add') addAmt += chgEff(d, i).amt; }));
  const total = D.reduce((a, d) => a + d.changes.length, 0);
  return `<div class="resp-sum"><b>Your responses: ${set} of ${total} changes</b>
    <span class="rpill in">${n.in} in your price</span>
    <span class="rpill add">${n.add} priced${addAmt ? ' · ' + (addAmt > 0 ? '+' : '−') + money(Math.abs(addAmt)).replace('−', '') : ''}</span>
    <span class="rpill rfi">${n.rfi} RFI${n.rfi === 1 ? '' : 's'}</span>${n.rfi ? ` <a href="javascript:void 0" onclick="go('rfis')">RFI log ↗</a>` : ''}
    <span class="rpill qual">${n.qual} qualified</span>${n.qual ? ` <a href="javascript:void 0" onclick="viewProposalLine()">proposal ↗</a>` : ''}
    <span class="resp-why">The spec wording is the design team's and never changes here. Your response decides what it does to the bid: nothing, a price, a question to the CM, or a line in the proposal.</span></div>`;
}
function chgPill(d, i) {
  if (!(DEC[chgKey(d, i)] || {}).resp) return '';
  const r = chgResp(d, i), e = chgEff(d, i);
  const t = r.resp === 'rfi' ? E.rfiNo(rfiNums()['CH-' + d.sec.replace(/\W/g, '') + '-' + i] || 0) : r.resp === 'qual' ? 'QUALIFIED IN PROPOSAL' : r.resp === 'add' ? (e.amt ? (e.amt > 0 ? '+' : '−') + money(Math.abs(e.amt)).replace('−', '') + ' IN THE BID' : 'ADD $ · NO AMOUNT') : 'IN YOUR PRICE';
  return `<span class="rpill ${r.resp}">${t}</span>`;
}
function openRfi(id) { UI.openRfi = id; UI.rtype = null; go('rfis'); setTimeout(() => { const el = document.getElementById('c-' + id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.outline = '2px solid #c8102e'; setTimeout(() => el.style.outline = '', 1800); } }, 350); }
function viewProposalLine() { go('proposal'); setTimeout(() => { const h = [...document.querySelectorAll('#pdoc h3')].find(x => /Clarifications/.test(x.textContent)); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 350); }
function setChg(sec, i, resp) {
  const d = BOOK.diffs.find(x => x.sec === sec); if (!d) return;
  const k = chgKey(d, i); DEC[k] = Object.assign({}, DEC[k], { resp }); saveDec(); rerender();
  toast(resp === 'rfi' ? 'Added to the RFI log' : resp === 'qual' ? 'Qualification added to the proposal; edit the wording here' : resp === 'add' ? 'Goes to the bid sheet as a change adder' : 'Marked as already in your price');
}
function refreshPdoc() { const el = document.getElementById('pdoc'); if (el) { const S = sheet(); el.innerHTML = proposalHTML(S, S ? BC.totals(S) : null); } }
function resetWord(id) { if (DEC[id]) delete DEC[id].text; saveDec(); rerender(); toast('Back to the suggested wording'); }
function resetStd(k) { if (META.std) delete META.std[k]; saveMeta(); rerender(); }

/* ---------- 4 · RFIs ---------- */
function paneRfis() {
  const C = CONFS().slice().sort((a, b) => (inLog(b) - inLog(a)) || sevO[a.sev] - sevO[b.sev]);
  const N = rfiNums();
  const ST = [['draft', 'Draft'], ['sent', 'Sent to CM'], ['answered', 'Answered'], ['closed', 'Closed']];
  const drafts = C.filter(c => inLog(c) && rs(c.id).status === 'draft');
  const L = C.filter(inLog), cntS = s => L.filter(c => s.includes(rs(c.id).status)).length;
  const types = Object.keys(RTYPES).filter(t => C.some(c => rtype(c) === t));
  const shown = C.filter(c => !UI.rtype || rtype(c) === UI.rtype);
  const sideLbl = ['Section A says', 'Section B says', 'Also cited'];
  return `
    <div class="rx-flow">
      <div><span class="n">1 · Found in the book</span><b>Questions you cannot price around</b><p>Places where the book contradicts itself, points to a section that doesn't cover it, leaves work with no trade, or still says TBD. Each card shows the exact clauses side by side.</p></div>
      <div><span class="n">2 · Sent through the CM</span><b>Numbered RFIs, ready to send</b><p>Each one is drafted in the CM's format with page cites. Sub RFIs go through the CM because ones sent directly come back unanswered.</p></div>
      <div><span class="n">3 · Locked into the proposal</span><b>Answered or assumed, never silent</b><p>An answer prints in the proposal. Anything still open on bid day prints as the stated bid assumption, so the number is defined either way.</p></div>
    </div>
    <div class="sb-kpis">
      <div class="sb-kpi"><div class="l">In RFI log</div><div class="v">${L.length}</div><div class="s">${C.length - L.length ? C.length - L.length + ' dropped' : 'from ' + C.length + ' found'}</div></div>
      <div class="sb-kpi amber"><div class="l">Drafted, not sent</div><div class="v">${cntS(['draft'])}</div><div class="s">send before bid day</div></div>
      <div class="sb-kpi"><div class="l">Awaiting CM</div><div class="v">${cntS(['sent'])}</div><div class="s">print as assumptions if open</div></div>
      <div class="sb-kpi green"><div class="l">Answered</div><div class="v">${cntS(['answered', 'closed'])}</div><div class="s">answer prints in proposal</div></div>
    </div>
    <div class="sb-tools">
      <button class="sb-chip ${!UI.rtype ? 'on' : ''}" onclick="UI.rtype=null;rerender()">All<b>${C.length}</b></button>
      ${types.map(t => `<button class="sb-chip ${UI.rtype === t ? 'on' : ''}" title="${esc(RTYPES[t][1])}" onclick="UI.rtype='${t}';rerender()">${RTYPES[t][0]}<b>${C.filter(c => rtype(c) === t).length}</b></button>`).join('')}
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${drafts.length ? `<button class="pa-btn primary" onclick="copyDrafts()">Copy ${drafts.length} draft RFI${drafts.length > 1 ? 's' : ''} for the CM</button><button class="pa-btn" onclick="markSent()">Mark ${drafts.length} as sent today</button>` : '<span class="fd-ok">✓ NO UNSENT RFIS</span>'}</span>
    </div>
    ${shown.length ? shown.map(c => {
      const on = inLog(c), r = rs(c.id), open = UI.openRfi === c.id, t = rtype(c);
      const sides = ['a', 'b', 'c'].map(k => c[k]).filter(Boolean);
      const age = r.sent ? -daysTo(r.sent) : null;
      return `<div class="rfi ${on ? '' : 'off'}" id="c-${c.id}">
        <div class="rfi-h">
          <label class="tgl" title="${on ? 'In the RFI log — uncheck to drop' : 'Add to the RFI log'}"><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleRfi('${c.id}',this.checked)"></label>
          ${on ? `<span class="no">${E.rfiNo(N[c.id])}</span>` : ''}<span class="sev ${c.sev}">${sevL[c.sev]}</span><span class="rtype" title="${esc(RTYPES[t][1])}">${RTYPES[t][0]}</span><b>${esc(c.title)}</b>
          <span class="sp">${on && r.status !== 'draft' && age != null ? `<span class="rfi-age">sent ${fmtDate(r.sent)} · ${age} day${age === 1 ? '' : 's'}</span>` : ''}${on ? `<select onchange="setStatus('${c.id}',this.value)">${ST.map(([k, l]) => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : '<span class="ynote">not in log</span>'}
            <button class="pa-btn" style="height:30px;font-size:11.5px" onclick="UI.openRfi=UI.openRfi==='${c.id}'?null:'${c.id}';rerender()">${open ? 'Hide RFI text' : 'RFI text + answer'}</button></span>
        </div>
        <div class="rx-sides">${sides.map((x, i) => `<div class="rx-side"><div class="h">${x.sec && x.sec !== '—' ? sideLbl[i] + ' ' + citeBtn(x.sec, x.para, x.page, 'c-' + c.id + ['a', 'b', 'c'][i]) : 'Rest of the book'}</div>${esc(x.says)}</div>`).join('')}</div>
        <div class="rx-meta"><div><b>What's at stake</b>${esc(c.cost || 'To be determined.')}</div>${['answered', 'closed'].includes(r.status) && r.answer ? `<div class="ans"><b>CM answer · prints in proposal</b>${esc(r.answer)}</div>` : `<div><b>Until answered, the proposal says</b>${esc(assumeOf(c))}</div>`}</div>
        ${open ? `<pre>${esc(E.rfiText(rfiBook(), c, N[c.id] || 0))}</pre>
          <textarea placeholder="CM's answer — once entered, it prints in the proposal instead of an assumption" oninput="setAnswer('${c.id}',this.value)">${esc(r.answer || '')}</textarea>` : ''}
      </div>`;
    }).join('') : '<div class="sb-empty">No conflicts or open questions in this trade.</div>'}`;
}

/* ---------- 5 · proposal ---------- */
function paneProposal(CK) {
  const errs = CK.filter(c => c.level === 'error'), warns = CK.filter(c => c.level === 'warn');
  const S = sheet(), T = S ? BC.totals(S) : null;
  return `
    <div class="demo-two" style="margin-bottom:18px;align-items:start">
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Preflight</h2><span class="k">${errs.length} to fix · ${warns.length} to note</span></div>
        <div class="pf-head ${errs.length ? '' : 'ready'}"><b>${errs.length ? errs.length + ' issue' + (errs.length > 1 ? 's' : '') + ' before this can go out' : 'Ready to issue'}</b><span>${errs.length ? 'Each one has a fix button.' : 'Every finding decided, every change confirmed, pricing in sync.'}</span></div>
        <div class="pf">${CK.map(c => `<div class="pf-row ${c.level}"><i>${c.level === 'error' ? '!' : '•'}</i><div>${esc(c.msg)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</div>${c.fix ? `<button class="pa-btn ${c.level === 'error' ? 'primary' : ''}" onclick="${c.fix}">${c.fixLbl}</button>` : '<span></span>'}</div>`).join('')}
          ${!CK.length ? '<div class="pf-row ok"><i>✓</i><div>All checks passed</div><span></span></div>' : ''}</div>
      </div>
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Pricing</h2><span class="k">${S ? 'bid sheet linked to this book' : 'no bid sheet yet'}</span></div>
        ${S ? `<div class="pr-tiles">
            <div class="sb-kpi"><div class="l">Base bid</div><div class="v">${moneyK(T.client)}</div><div class="s">${money(T.client)}</div></div>
            <div class="sb-kpi amber"><div class="l">Cost</div><div class="v">${moneyK(T.cost)}</div><div class="s">to McCorvey</div></div>
            <div class="sb-kpi ${T.margin >= BC.TARGET ? 'green' : T.margin >= BC.FLOOR ? 'amber' : 'red'}"><div class="l">Margin</div><div class="v">${T.margin.toFixed(1)}%</div><div class="s">target ${BC.TARGET}% · floor ${BC.FLOOR}%</div></div>
            <div class="sb-kpi ${T.mp === 'ok' ? 'green' : T.mp === 'tight' ? 'amber' : 'red'}"><div class="l">Crew</div><div class="v">${T.mp === 'ok' ? 'Staffable' : T.mp === 'tight' ? 'Tight' : 'Over'}</div><div class="s">${T.fieldNeed.toFixed(0)} field · ${T.shopNeed.toFixed(0)} shop</div></div>
          </div>

  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over'); }
}
function dock() {
  const sub = document.querySelector('.section-subnav');
  if (sub) document.documentElement.style.setProperty('--sb-dock', ((parseFloat(getComputedStyle(sub).top) || 0) + sub.getBoundingClientRect().height) + 'px');
}
window.addEventListener('resize', dock);

/* ---------- load a real book (in-browser) ---------- */
function ov(show, h) { $('#ov').classList.toggle('show', show); if (h) $('#ov-h').textContent = h; }
function prog(msg, f) { $('#ov-st').textContent = msg; $('#ov-bar').style.width = Math.round(f * 100) + '%'; }
async function loadBook(file) {
  if (!file) return;
  ov(true, 'Reading ' + file.name); prog('Loading PDF reader…', 0.02);
  try {
    const t0 = performance.now();
    const r = await E.analyze(file, prog);
    BOOK = r.book; RAW = r.raw; PRIOR = null;
    setFile(file);
    if (window.Illustrative) {
      BOOK.projSF = Illustrative.projectSF(BOOK, RAW) || 0; applyProfile();
      leadPerRule(BOOK);
      Illustrative.prepare(BOOK, RAW, window.BuildUps);
      if (!BOOK.takeoff && window.SPECBOOK && window.SPECBOOK.takeoff) { const k = (BOOK.projSF || 1290000) / 1290000; BOOK.takeoff = window.SPECBOOK.takeoff.map(l => Object.assign({}, l, { qty: l.unit === 'LS' ? Math.round(l.mat * k / 1000) * 1000 / l.mat : Math.round(l.qty * k / 10) * 10 })); BOOK.takeoffIllustrative = true; }
      BOOK.diffs = Illustrative.diffs(BOOK, E.lensOf, E.YOURS);
    }
    E.store.sset('msm-spec-local', BOOK); E.store.sset('msm-spec-active', 'local');
    step = 'load'; loadState(); ov(false); render();
    toast(`Read ${pgs(BOOK.totalPages)} pages in ${((performance.now() - t0) / 1000).toFixed(0)}s — fill in the bid setup to start`);
  } catch (e) { ov(false); toast('Could not read that PDF: ' + e.message); console.error(e); }
}
async function loadPrior(file) {
  if (!file) return;
  if (!RAW) { toast('Reload your book first — its text is kept in memory only'); return; }
  ov(true, 'Comparing against ' + file.name); prog('Loading prior issue…', 0.02);
  try {
    const pages = await E.extract(file, (d, n) => prog('Reading prior page ' + pgs(d) + ' of ' + pgs(n), d / n * 0.9));
    prog('Comparing sentence by sentence', 0.94);
    PRIOR = E.buildSections(pages);
    BOOK.diffs = E.diffBooks(RAW, PRIOR, s => E.YOURS.includes(s.div) || E.HOOKS.includes(s.div));
    E.store.sset('msm-spec-local', BOOK);
    ov(false); go('changes'); toast(`${BOOK.diffs.length} sections changed versus ${file.name}`);
  } catch (e) { ov(false); toast('Could not compare: ' + e.message); console.error(e); }
}
function resetDemo() {
  if (!confirm('Reset this book to step 1? Every decision, confirmed change, RFI status and bid detail on it is cleared, and the bid sheet goes back to what it was before.')) return;
  ['msm-spec-dec-', 'msm-spec-meta-', 'msm-spec-rfi-', 'msm-spec-letter-'].forEach(k => { try { localStorage.removeItem(k + BOOK.key); } catch (e) {} });
  /* put back the bid sheet that was there before this book built one */
  try {
    const S = BC.load();
    if (S && S.meta.specKey === BOOK.key) {
      let bk = localStorage.getItem(BC.KEY_STATE + '-backup');
      try { const b = JSON.parse(bk || 'null'); if (b && b.meta && String(b.meta.project || '').startsWith(BOOK.name)) bk = null; } catch (e) { bk = null; }
      if (bk) { localStorage.setItem(BC.KEY_STATE, bk); localStorage.setItem(BC.KEY_REVS, localStorage.getItem(BC.KEY_REVS + '-backup') || '[]'); }
      else { localStorage.removeItem(BC.KEY_STATE); localStorage.setItem(BC.KEY_REVS, '[]'); }
    }
  } catch (e) {}
  Object.assign(UI, { filter: 'needs', q: '', showMatrix: false, showSecs: false, openRfi: null, rtype: null, cx: 'all', showPB: false, se: null, handoff: false, part: null, words: false });
  step = 'load'; history.replaceState(null, '', '#load');
  loadState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('Demo reset — back to step 1');
}
function useSample() { E.store.sset('msm-spec-active', 'sample'); BOOK = window.SPECBOOK; RAW = PRIOR = null; step = null; applyProfile(); loadState(); render(); toast('Sample book loaded'); }
$('#pick-cur').onchange = e => { loadBook(e.target.files[0]); e.target.value = ''; };
$('#pick-prior').onchange = e => { loadPrior(e.target.files[0]); e.target.value = ''; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = [...(e.dataTransfer.files || [])].find(x => /pdf$/i.test(x.type) || /\.pdf$/i.test(x.name)); if (!f) return; if (DV && BOOK.local && !FILE && f.name.replace(/\.pdf$/i, '') === BOOK.name) reattach(f); else loadBook(f); });

if (BOOK.local) setTimeout(() => toast('Your book\'s decisions are restored; reload the PDF to compare issues'), 600);
render();
</script>
</body>
</html>
