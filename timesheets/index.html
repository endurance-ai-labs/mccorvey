<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheets — Y8S Operations Portal</title>
<meta name="description" content="YATES Company, LLC (Y8S) — building automation & energy solutions. Jobs, billing, timesheets and forecasting in one operations portal. Demo environment.">
<meta property="og:site_name" content="Y8S Operations Portal">
<meta property="og:title" content="YATES Company, LLC — Operations Portal">
<meta property="og:description" content="Building Automation Systems Nurtured by Experience — jobs, billing, timesheets and forecasting in one place. Demo environment, fictional data.">
<meta property="og:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<link rel="icon" type="image/png" href="/yates/assets/brand/y8s-logo-transparent.png">
<link rel="stylesheet" href="/yates/css/theme.css">
<link rel="stylesheet" href="/yates/css/demo.css">
<link rel="stylesheet" href="/yates/css/yates.css">
<style>
  .ts-grid input { width: 52px; text-align: center; }
  .ts-src { font-size: 8.5px; font-weight: 800; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; }
  .ts-src.st { color: #f04e23; background: rgba(240,78,35,0.10); }
  .ts-src.fld { color: var(--color-blue); background: var(--color-blue-pale); }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="app"></div></main>

<script src="/yates/js/data.js"></script>
<script src="/yates/js/util.js"></script>
<script src="/yates/js/nav.js"></script>
<script src="/yates/js/yates-brain.js" defer></script>
<script>
YatesNav.renderTopbar({ subtitle: 'Timesheets' });
if (!YatesMode.isInternal() || !can('fin')) {
  if (isSignedIn()) $('#app').innerHTML = `<div class="demo-panel" style="margin-top:40px"><div class="demo-panel-head"><h2>Restricted module</h2></div>
    <div class="ynote">Timesheets & payroll require financial access (Owner, CFO, Controller or Office Manager). Your current user does not have rights to this module.</div></div>`;
} else {
  buildTimesheets();
}

function buildTimesheets() {
/* Week of Jul 20–26, 2026 — construction crews entered in the field app
   (replacing the old Excel sheets); service techs flow in from ServiceTitan. */
const DAYS = ['Mon 7/20', 'Tue 7/21', 'Wed 7/22', 'Thu 7/23', 'Fri 7/24', 'Sat 7/25'];
const CREW = [
  { name: 'R. Trejo',        role: 'Field Lead',        job: 'HMP-2502', src: 'fld', hrs: [8, 8, 8, 8, 8, 4] },
  { name: 'D. Vasquez',      role: 'Controls Tech II',  job: 'HMP-2502', src: 'fld', hrs: [8, 8, 8, 8, 8, 0] },
  { name: 'K. Nguyen',       role: 'Controls Tech I',   job: 'HMP-2502', src: 'fld', hrs: [8, 8, 6, 8, 8, 0] },
  { name: 'C. Delgado',      role: 'Field Lead',        job: 'HPL-2506', src: 'fld', hrs: [10, 10, 10, 10, 8, 0] },
  { name: 'J. Barnes',       role: 'Controls Tech II',  job: 'HPL-2506', src: 'fld', hrs: [10, 10, 10, 10, 8, 0] },
  { name: 'A. Osei',         role: 'Apprentice',        job: 'HPL-2506', src: 'fld', hrs: [8, 8, 8, 8, 8, 0] },
  { name: 'S. Whitmore',     role: 'Field Lead',        job: 'RCI-2507', src: 'fld', hrs: [8, 6, 8, 8, 8, 0] },
  { name: 'M. Ibarra',       role: 'Service Tech III',  job: 'SERVICE',  src: 'st',  hrs: [8, 9, 8, 10, 8, 0] },
  { name: 'T. Coleman',      role: 'Service Tech II',   job: 'SERVICE',  src: 'st',  hrs: [8, 8, 8, 8, 9, 4] },
  { name: 'L. Fuentes',      role: 'Service Tech I',    job: 'SERVICE',  src: 'st',  hrs: [8, 8, 8, 8, 8, 0] },
];

function render() {
  const rows = CREW.map((c, ci) => {
    const tot = c.hrs.reduce((a, b) => a + b, 0);
    const ot = Math.max(0, tot - 40);
    return `
      <tr>
        <td><b>${esc(c.name)}</b><div class="ynote">${esc(c.role)}</div></td>
        <td>${c.job === 'SERVICE' ? '<span class="ypill blue">Service Division</span>' : `<a href="/yates/jobs/job/?id=${c.job}" style="color:var(--color-blue);font-weight:700">${c.job}</a>`}</td>
        <td><span class="ts-src ${c.src}">${c.src === 'st' ? 'SERVICETITAN' : 'FIELD APP'}</span></td>
        ${c.hrs.map((h, di) => `<td class="ts-grid" style="text-align:center">${c.src === 'st'
          ? `<span style="font-variant-numeric:tabular-nums">${h}</span>`
          : `<input class="yin num" type="number" min="0" max="16" value="${h}" onchange="updHr(${ci},${di},this.value)">`}</td>`).join('')}
        <td style="text-align:right;font-weight:700">${tot}</td>
        <td style="text-align:right;color:${ot ? 'var(--color-amber)' : 'var(--color-text-muted)'}">${ot || '—'}</td>
      </tr>`;
  }).join('');

  const totalHrs = CREW.reduce((a, c) => a + c.hrs.reduce((x, y) => x + y, 0), 0);
  const otHrs = CREW.reduce((a, c) => a + Math.max(0, c.hrs.reduce((x, y) => x + y, 0) - 40), 0);
  const byJob = {};
  CREW.forEach(c => { byJob[c.job] = (byJob[c.job] || 0) + c.hrs.reduce((x, y) => x + y, 0); });
  const svcHrs = byJob['SERVICE'] || 0;

  $('#app').innerHTML = `
    <div class="demo-hero" style="padding-bottom:16px">
      <div>
        <div class="demo-eyebrow">PAYROLL · WEEK OF JUL 20, 2026</div>
        <h1>Time<em>sheets</em></h1>
        <div class="sub">Construction crews enter time in the field app; service techs flow in automatically from ServiceTitan dispatch. One approval chain, one export to payroll — the Excel timesheet is retired.</div>
      </div>
      <div class="demo-hero-right">
        <span class="demo-live"><span class="dot"></span> ${CREW.length} EMPLOYEES · ${totalHrs} HRS</span>
        <span style="display:flex;gap:6px">${srcChip('st')} ${srcChip('qb')}</span>
      </div>
    </div>

    <div class="ykpi-row">
      <div class="ykpi"><div class="l">Total Hours</div><div class="v">${totalHrs}</div><div class="s">week of Jul 20</div></div>
      <div class="ykpi amber"><div class="l">Overtime Hours</div><div class="v">${otHrs}</div><div class="s">auto-flagged over 40</div></div>
      <div class="ykpi"><div class="l">Construction Hours</div><div class="v">${totalHrs - svcHrs}</div><div class="s">job-costed to ${Object.keys(byJob).length - 1} jobs</div></div>
      <div class="ykpi green"><div class="l">Service Hours</div><div class="v">${svcHrs}</div><div class="s">synced from ServiceTitan</div></div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Payroll Approval — Week of Jul 20</h2><span class="k">role-gated · export unlocks when fully executed</span></div>
      ${approvalChain('ts-2026-07-20', [
        { role: 'conmgr',     label: 'Construction Manager — Certify Crew Time', doneLabel: 'Crew Time Certified' },
        { role: 'office',     label: 'Office Manager — Payroll Prepared',        doneLabel: 'Payroll Prepared' },
        { role: 'controller', label: 'Controller — Post to QuickBooks',          doneLabel: 'Posted to QuickBooks' },
      ])}
      <div class="ytoolrow" style="margin-top:12px;margin-bottom:0">
        <span class="ynote">${apprComplete('ts-2026-07-20', 3) ? 'Approved — payroll batch ready.' : 'Export locks until the approval chain is complete.'}</span>
        <div class="spacer"></div>
        <button class="pa-btn primary" style="cursor:pointer;${apprComplete('ts-2026-07-20', 3) ? '' : 'opacity:.45;pointer-events:none'}" onclick="alert('Demo: payroll batch exported to QuickBooks (IIF/API).')">⇪ Export Payroll Batch to QuickBooks</button>
      </div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Weekly Time Grid</h2><span style="display:flex;gap:6px;align-items:center">${srcChip('st')}<span class="k">service rows locked (system of record: ServiceTitan) · field rows editable</span></span></div>
      <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
        <table class="demo-tbl">
          <thead><tr><th>Employee</th><th>Job / Division</th><th>Source</th>${DAYS.map(d => `<th style="text-align:center">${d}</th>`).join('')}<th style="text-align:right">Total</th><th style="text-align:right">OT</th></tr></thead>
          <tbody>${rows}
            <tr style="font-weight:800;background:var(--color-bg-3)">
              <td colspan="3">Total</td>
              ${DAYS.map((d, di) => `<td style="text-align:center">${CREW.reduce((a, c) => a + c.hrs[di], 0)}</td>`).join('')}
              <td style="text-align:right">${totalHrs}</td><td style="text-align:right">${otHrs}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Hours by Job — Labor Cost Allocation</h2><span style="display:flex;gap:6px;align-items:center">${srcChip('qb')}<span class="k">flows into job costing automatically</span></span></div>
      <table class="demo-tbl">
        <thead><tr><th>Job / Division</th><th style="text-align:right">Hours</th><th style="text-align:right">Burdened Labor @ $68/hr</th></tr></thead>
        <tbody>${Object.entries(byJob).map(([j, h]) => `
          <tr><td>${j === 'SERVICE' ? 'Service Division (ServiceTitan)' : j + ' · ' + esc((JOBS.find(x => x.id === j) || { name: '' }).name.split('—')[0].trim())}</td>
          <td style="text-align:right">${h}</td><td style="text-align:right">${fmt$(h * 68)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="demo-note">Demo environment · fictional data</div>`;
}

window.updHr = function (ci, di, v) {
  CREW[ci].hrs[di] = Math.max(0, Math.min(16, parseFloat(v) || 0));
  render();
};

render();
}
</script>
</body>
</html>
