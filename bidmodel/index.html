<script>
if (!isSignedIn() && !location.search.includes('enter')) location.replace('/mccorvey/welcome/');
McCorveyNav.renderTopbar({ subtitle: 'Preconstruction — Adjustable Bid Modeler' });

/* =====================================================================
   BID SHEET
   line cost  = qty × (material×esc + shop hrs × shop rate + field hrs × field rate)
   line sell  = cost × (1 + markup)          (markup per line; blank = default)
   client     = Σ included sell × (1 + bond + GL + contingency)
   Price-side cells (unit price, client price) are editable too — typing
   one back-solves that line's markup.
   ===================================================================== */
const KEY_STATE = 'msm-bidsheet-v3', KEY_REVS = 'msm-bidsheet-revs-v3';
const FIELD_POOL = 340, SHOP_POOL = 580, UTIL = 0.9, HRSWK = 40, TARGET = 13, FLOOR = 11;

const CATALOG = [
  { scope: 'Rectangular duct — galvanized, per SMACNA', unit: 'lbs', qty: 100000, mat: 0.72, shopUPH: 75, fieldUPH: 42, rx: /rect/i },
  { scope: 'Spiral & round duct', unit: 'LF', qty: 5000, mat: 9.40, shopUPH: 9, fieldUPH: 6.5, rx: /spiral|round/i },
  { scope: 'Oval duct', unit: 'LF', qty: 1000, mat: 14.0, shopUPH: 6, fieldUPH: 4.5, rx: /oval/i },
  { scope: 'Welded stainless exhaust — NFPA 96', unit: 'LF', qty: 500, mat: 46, shopUPH: 1.6, fieldUPH: 2.2, rx: /weld|316|fume|kitchen exhaust/i },
  { scope: 'Aluminum duct — natatorium / corrosive', unit: 'lbs', qty: 20000, mat: 2.60, shopUPH: 40, fieldUPH: 30, rx: /alumin/i },
  { scope: 'Double-wall insulated duct', unit: 'lbs', qty: 50000, mat: 1.35, shopUPH: 45, fieldUPH: 35, rx: /double.?wall/i },
  { scope: 'Air devices (GRDs) — furnish & install', unit: 'ea', qty: 200, mat: 74, shopUPH: 0, fieldUPH: 1.43, rx: /air device|grd/i },
  { scope: 'Fire/smoke dampers & accessories', unit: 'ea', qty: 50, mat: 410, shopUPH: 0, fieldUPH: 0.5, rx: /damper/i },
  { scope: 'Volume dampers & access doors', unit: 'ea', qty: 200, mat: 38, shopUPH: 0, fieldUPH: 3, rx: /volume damper|access door/i },
  { scope: 'Flex duct & connections', unit: 'LF', qty: 2000, mat: 4.20, shopUPH: 0, fieldUPH: 25, rx: /flex/i },
  { scope: 'Destratification / HVLS adapters', unit: 'ea', qty: 20, mat: 380, shopUPH: 0, fieldUPH: 0.5, rx: /destrat|hvls/i },
  { scope: 'Duct liner & external wrap (insulation sub)', unit: 'LS', qty: 1, mat: 250000, shopUPH: 0, fieldUPH: 0, rx: /liner|insulation/i },
  { scope: 'Rigging, lifts & equipment', unit: 'LS', qty: 1, mat: 150000, shopUPH: 0, fieldUPH: 0, rx: /rigging|lift/i },
  { scope: 'BIM coordination & shop drawings (LOD 400)', unit: 'LS', qty: 1, mat: 180000, shopUPH: 0, fieldUPH: 0, rx: /bim|detailing|shop drawing/i },
  { scope: 'Duct leakage testing (SMACNA)', unit: 'LS', qty: 1, mat: 60000, shopUPH: 0, fieldUPH: 0, rx: /leakage/i },
];

const DEFAULT_TERMS = {
  incl: 'Detailing & LOD 400 coordination, fabrication at McCorvey plants, delivery, installation, hangers & supports, TAB support. Quantities per the bid documents and addenda as reviewed.',
  excl: 'HVAC equipment, controls, electrical, TAB (by others), painting of exposed duct. Progress billing monthly via AIA G702/G703, 5% retainage. Steel surcharge applies after validity.',
  valid: 30,
};
const DEFAULT_STATE = {
  meta: Object.assign({ project: 'Memorial City Medical Office Tower — HVAC Ductwork', gc: 'Harmon Construction', bidNo: 'MSM-2026-1214', due: '2026-10-21' }, DEFAULT_TERMS),
  g: { shopRate: 62, fieldRate: 78, escPct: 1.0, defMkup: 15.5, ohPct: 6.0, bondPct: 1.0, glPct: 0.85, contPct: 0.5,
       weeks: 40, otPct: 0, fieldCommitPct: 78, shopCommitPct: 82 },
  lines: [
    { scope: 'Rectangular duct — galvanized, per SMACNA', unit: 'lbs', qty: 1420000, mat: 0.72, shopUPH: 75, fieldUPH: 42, mkup: null },
    { scope: 'Spiral & round duct', unit: 'LF', qty: 38000, mat: 9.40, shopUPH: 9, fieldUPH: 6.5, mkup: null },
    { scope: 'Welded stainless exhaust — NFPA 96', unit: 'LF', qty: 2100, mat: 46, shopUPH: 1.6, fieldUPH: 2.2, mkup: null },
    { scope: 'Air devices (GRDs) — furnish & install', unit: 'ea', qty: 2140, mat: 74, shopUPH: 0, fieldUPH: 1.43, mkup: null },
    { scope: 'Fire/smoke dampers & accessories', unit: 'ea', qty: 480, mat: 410, shopUPH: 0, fieldUPH: 0.5, mkup: null },
    { scope: 'Duct liner & external wrap (insulation sub)', unit: 'LS', qty: 1, mat: 290000, shopUPH: 0, fieldUPH: 0, mkup: 8 },
    { scope: 'Rigging, lifts & equipment', unit: 'LS', qty: 1, mat: 180000, shopUPH: 0, fieldUPH: 0, mkup: null },
  ],
  status: 'draft',
};
let S = JSON.parse(JSON.stringify(DEFAULT_STATE));
try { const sv = JSON.parse(localStorage.getItem(KEY_STATE) || 'null'); if (sv && sv.lines) { S = sv; S.meta = Object.assign({}, DEFAULT_TERMS, S.meta); } } catch (e) {}
function revsAll() { try { return JSON.parse(localStorage.getItem(KEY_REVS) || '[]'); } catch (e) { return []; } }
let viewRev = null;
const inc = l => l.inc !== false;

/* ---------------- calc ---------------- */
function lineCost(l) {
  const G = S.g, em = 1 + G.escPct / 100, otX = 1 + (G.otPct / (100 + G.otPct)) * 0.5;
  const shopH = l.shopUPH > 0 ? l.qty / l.shopUPH : 0, fieldH = l.fieldUPH > 0 ? l.qty / l.fieldUPH : 0;
  const mat = l.qty * l.mat * em, shop = shopH * G.shopRate * otX, field = fieldH * G.fieldRate * otX;
  return { shopH, fieldH, mat, shop, field, cost: mat + shop + field };
}
function lineCalc(l) {
  const b = lineCost(l);
  const mk = l.mkup != null ? l.mkup : S.g.defMkup;
  const sell = b.cost * (1 + mk / 100), oh = b.cost * S.g.ohPct / 100;
  return Object.assign(b, { unitCost: l.qty ? b.cost / l.qty : 0, mk, sell, unitSell: l.qty ? sell / l.qty : 0, oh, profit: sell - b.cost - oh, margin: sell ? (sell - b.cost) / sell * 100 : 0 });
}
function totals() {
  const G = S.g;
  const L = S.lines.map(lineCalc);
  const sum = k => L.reduce((a, x, i) => a + (inc(S.lines[i]) ? x[k] : 0), 0);
  const cost = sum('cost'), sell = sum('sell'), oh = sum('oh'), profit = sum('profit'), shopH = sum('shopH'), fieldH = sum('fieldH'), mat = sum('mat'), lab = sum('shop') + sum('field');
  const a = (G.bondPct + G.glPct + G.contPct) / 100;
  const addons = sell * a, cont$ = sell * G.contPct / 100, client = sell + addons;
  const margin = client ? (sell - cost + cont$) / client * 100 : 0;
  const sellAt = m => cost / Math.max(0.05, (1 + G.contPct / 100) - m / 100 * (1 + a));
  const floor$ = sellAt(FLOOR) * (1 + a), target$ = sellAt(TARGET) * (1 + a);
  const weeks = Math.max(4, G.weeks), hpw = weeks * HRSWK * UTIL * (1 + G.otPct / 100);
  const fieldNeed = fieldH / hpw, shopNeed = shopH / hpw;
  const fieldAvail = FIELD_POOL * (1 - G.fieldCommitPct / 100), shopAvail = SHOP_POOL * (1 - G.shopCommitPct / 100);
  const fLoad = fieldNeed / Math.max(0.1, fieldAvail) * 100, sLoad = shopNeed / Math.max(0.1, shopAvail) * 100;
  const st = l => l <= 85 ? 'ok' : l <= 100 ? 'tight' : 'over';
  return { L, cost, sell, oh, profit, mat, lab, shopH, fieldH, addons, cont$, client, margin, floor$, target$, a,
           weeks, fieldNeed, shopNeed, fieldAvail, shopAvail, fLoad, sLoad, mp: st(Math.max(fLoad, sLoad)) };
}

/* ---------------- undo / redo ---------------- */
const UNDO = [], REDO = [];
let editSnap = null;
function checkpoint() { UNDO.push(JSON.stringify(S)); if (UNDO.length > 100) UNDO.shift(); REDO.length = 0; undoBtns(); }
function undo() { if (locked() || !UNDO.length) return; REDO.push(JSON.stringify(S)); S = JSON.parse(UNDO.pop()); render(true); toast('Undone'); }
function redo() { if (locked() || !REDO.length) return; UNDO.push(JSON.stringify(S)); S = JSON.parse(REDO.pop()); render(true); toast('Redone'); }
function undoBtns() { const u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo'); if (u) u.disabled = !UNDO.length || locked(); if (r) r.disabled = !REDO.length || locked(); }

/* ---------------- solvers ---------------- */
function shiftMarkups(d) { S.lines.forEach(l => { if (inc(l)) l.mkup = Math.round(((l.mkup != null ? l.mkup : S.g.defMkup) + d) * 100) / 100; }); }
function solveSell(req) { const T = totals(); if (T.cost > 0) shiftMarkups((req - T.sell) / T.cost * 100); }
function bidAtPrice(v, quiet) { const X = num(v); if (!(X > 0)) return; if (!quiet) checkpoint(); solveSell(X / (1 + totals().a)); syncInputs(); refresh(); toast('Markups solved to ' + money(X)); }
function bidAtMargin(v) { const m = num(v); if (!(m > 0 && m < 60)) return; checkpoint(); const T = totals(), c = S.g.contPct / 100; solveSell(T.cost / ((1 + c) - m / 100 * (1 + T.a))); syncInputs(); refresh(); toast('Markups solved to ' + m + '% margin'); }
function nudgeAll(d) { checkpoint(); shiftMarkups(d); syncInputs(); refresh(); }
function roundTotal(step) { checkpoint(); bidAtPrice(Math.round(totals().client / step) * step, true); }
function resetMarkups() { checkpoint(); S.lines.forEach(l => { l.mkup = null; }); syncInputs(); refresh(); toast('Markups reset to default'); }

function addFromCatalog(idx) {

  S.lines.push({ scope: c.scope, unit: c.unit, qty: c.qty, mat: c.mat, shopUPH: c.shopUPH, fieldUPH: c.fieldUPH, mkup: null });
  render(true);
  const n = document.querySelector(`input[data-i="${S.lines.length - 1}"][data-f="${idx === 'blank' ? 'scope' : 'qty'}"]`); if (n) { n.focus(); n.select(); }
}
function dupLine(i) { checkpoint(); const c = JSON.parse(JSON.stringify(S.lines[i])); c.scope += ' (copy)'; delete c.tag; S.lines.splice(i + 1, 0, c); render(true); }
function moveLine(i, d) { const j = i + d; if (j < 0 || j >= S.lines.length) return; checkpoint(); [S.lines[i], S.lines[j]] = [S.lines[j], S.lines[i]]; render(true); }
function delLine(i) { checkpoint(); const s = S.lines[i].scope; S.lines.splice(i, 1); render(true); toast('Removed "' + s.slice(0, 40) + '" — Ctrl+Z to undo'); }
function toggleInc(i, on) { checkpoint(); S.lines[i].inc = on ? undefined : false; render(true); }

/* ---------------- load quantities from AI Bid Review ---------------- */
function reviewSets() { return (window.DOCREVIEW && DOCREVIEW.queue || []).filter(q => q.quantities && q.quantities.length); }
function loadFromReview(bid) {
  const q = reviewSets().find(x => x.bid === bid); if (!q) return;
  checkpoint();
  let matched = 0, added = 0, flags = 0;
  q.quantities.forEach(x => {
    const nums = String(x.qty).match(/[\d,]+(?:\.\d+)?/g); if (!nums) return;
    const qty = num(nums[nums.length - 1]);
    const tpl = CATALOG.find(c => c.rx.test(x.item));
    let line = tpl ? S.lines.find(l => tpl.rx.test(l.scope)) : null;
    if (!line) {
      const base = tpl || { scope: x.item, unit: x.unit === 'lbs' ? 'lbs' : x.unit, qty, mat: 0, shopUPH: 0, fieldUPH: 0 };
      line = { scope: base.scope, unit: base.unit, qty, mat: base.mat, shopUPH: base.shopUPH, fieldUPH: base.fieldUPH, mkup: null };
      S.lines.push(line); added++;
    } else matched++;
    line.qty = qty; line.tag = 'AI takeoff · ' + q.bid + ' · ' + x.conf + '% conf.';
  });
  /* flagged spec adders with a $ impact → optional lines, excluded until the bidder ticks them */
  (q.findings || []).forEach(f => {
    const m = String(f.detail).match(/\$\s?(\d+(?:\.\d+)?)K/i); if (!m || f.sev === 'info') return;
    const title = 'Spec adder — ' + f.title;
    if (S.lines.some(l => l.scope === title)) return;
    S.lines.push({ scope: title, unit: 'LS', qty: 1, mat: num(m[1]) * 1000, shopUPH: 0, fieldUPH: 0, mkup: null, inc: false, tag: 'AI flag · ' + f.sev.toUpperCase() + ' · ' + f.clause, flag: 1 });
    flags++;
  });
  S.meta.project = q.project; S.meta.gc = q.gc; S.meta.bidNo = 'MSM-' + q.bid.replace('B-', '2026-'); S.meta.due = q.due;
  render(true);
  toast(`Loaded ${matched + added} quantities from ${q.bid}${flags ? ' + ' + flags + ' flagged adders (unchecked — tick to include)' : ''}`);
}

function refresh() {
  const T = totals();
  const revs = revsAll(), last = revs.length ? revs[revs.length - 1] : null;
  let changes = 0;
  T.L.forEach((c, i) => {
    const l = S.lines[i];
    setH('o-' + i + '-uc', moneyU(c.unitCost));
    setH('o-' + i + '-cost', money(c.cost));
    setV(`input[data-i="${i}"][data-f="usell"]`, fmtF('usell', c.unitSell));
    setV(`input[data-i="${i}"][data-f="sell"]`, fmtF('sell', c.sell));
    setH('o-' + i + '-profit', `<span style="color:${c.profit < 0 ? '#c8102e' : 'inherit'}">${money(c.profit)}</span>`);
    setH('o-' + i + '-mg', `<span class="bs-mg ${band(c.margin)}">${c.margin.toFixed(1)}%</span>`);
    const mk = document.querySelector(`input[data-i="${i}"][data-f="mkup"]`); if (mk) mk.placeholder = fmtN(S.g.defMkup, 1);
    /* change markers vs the last confirmed revision (only while drafting a revision) */
    const row = document.getElementById('row-' + i);
    if (last && !locked()) {
      const r = last.lines.find(x => x.scope === l.scope);
      const qEl = document.querySelector(`input[data-i="${i}"][data-f="qty"]`), sEl = document.querySelector(`input[data-i="${i}"][data-f="sell"]`);
      if (!r) { if (row) row.classList.add('newline'); changes++; }
      else {
        if (row) row.classList.remove('newline');
        const qc = r.qty !== l.qty, sc = Math.abs((r.inc === false ? 0 : r.sell) - (inc(l) ? c.sell : 0)) > 1;
        if (qEl) { qEl.classList.toggle('chg', qc); qEl.title = qc ? 'Rev ' + last.rev + ': ' + fmtN(r.qty, 0) : ''; }
        if (sEl) { sEl.classList.toggle('chg', sc); sEl.title = sc ? 'Rev ' + last.rev + ': ' + money(r.sell) : 'Type a line price — markup back-solves'; }
        if (qc || sc) changes++;
      }
    }
  });
  if (last && !locked()) changes += last.lines.filter(r => !S.lines.some(l => l.scope === r.scope)).length;
  const nIn = S.lines.filter(inc).length, nOut = S.lines.length - nIn;
  setH('sheet-k', locked() ? 'locked — confirmed bid · revise to make changes' : (last ? `<b style="color:var(--color-amber)">${changes} change${changes === 1 ? '' : 's'} since Rev ${last.rev}</b> · ` : '') + 'type in any shaded cell · totals update as you type');
  const blended = T.cost ? (T.sell / T.cost - 1) * 100 : 0;
  setH('f-label', `Subtotal — ${nIn} line${nIn === 1 ? '' : 's'} in bid${nOut ? ' · ' + nOut + ' priced out' : ''}`);
  setH('f-cost', money(T.cost)); setH('f-mk', blended.toFixed(1) + '%'); setH('f-sell', money(T.sell));
  setH('f-profit', `<span style="color:${T.profit < 0 ? '#c8102e' : 'inherit'}">${money(T.profit)}</span>`);
  setH('f-mg', `<span class="bs-mg ${band(T.margin)}">${T.margin.toFixed(1)}%</span>`);
  setH('f-addons', money(T.addons)); setH('f-client', money(T.client));
  /* tiles */
  setH('t-client', fmtK(T.client));
  setH('t-client-s', money(T.client) + '<br>walk-away floor <b>' + fmtK(T.floor$) + '</b> at ' + FLOOR + '% margin');
  setH('t-cost', fmtK(T.cost));
  setH('t-cost-s', 'material ' + fmtK(T.mat) + ' · labor ' + fmtK(T.lab) + '<br>' + Math.round(T.shopH + T.fieldH).toLocaleString() + ' man-hours');
  setH('t-profit', fmtK(T.profit + T.oh));
  setH('t-profit-s', 'margin <b>' + T.margin.toFixed(1) + '%</b> · target ' + TARGET + '%<br>profit ' + fmtK(T.profit) + ' · overhead ' + fmtK(T.oh) + (T.profit < 0 ? ' · <b style="color:#c8102e">UNDERWATER</b>' : ''));
  const pt = document.getElementById('t-profit-tile'); if (pt) pt.className = 'bs-tile ' + band(T.margin);
  setH('t-mp', T.mp === 'ok' ? 'STAFFABLE' : T.mp === 'tight' ? 'TIGHT' : 'OVER CAPACITY');
  setH('t-mp-s', 'field <b>' + T.fieldNeed.toFixed(0) + '</b> of ' + T.fieldAvail.toFixed(0) + ' available · shop <b>' + T.shopNeed.toFixed(0) + '</b> of ' + T.shopAvail.toFixed(0) + '<br>' + T.weeks + ' weeks' + (S.g.otPct ? ' · ' + S.g.otPct + '% OT' : ''));
  const mt = document.getElementById('t-mp-tile'); if (mt) mt.className = 'bs-tile ' + T.mp;
  /* talk-track strip */
  const onePct = T.cost * 0.01 * (1 + T.a);
  const room = T.client - T.floor$;
  const biggest = T.L.map((c, i) => ({ c, l: S.lines[i] })).filter(x => inc(x.l)).sort((a, b) => b.c.cost - a.c.cost)[0];
  const rectI = S.lines.findIndex(l => inc(l) && l.fieldUPH > 0 && /rect/i.test(l.scope));
  let prodTxt = '';
  if (rectI > -1) { const l = S.lines[rectI], c = T.L[rectI]; const dH = l.qty / l.fieldUPH - l.qty / (l.fieldUPH + 1); prodTxt = `<span><span class="k">PRODUCTIVITY</span> +1 lb/hr in the field on rect duct saves <b>${fmtK(dH * S.g.fieldRate * (1 + c.mk / 100) * (1 + T.a))}</b></span>`; }
  setH('bs-facts', `<span><span class="k">TALK TRACK</span> each 1% of markup = <b>${fmtK(onePct)}</b></span>
    <span>${room >= 0 ? 'room above the ' + FLOOR + '% floor <b>' + fmtK(room) + '</b>' : '<b style="color:#ef6a76">' + fmtK(-room) + ' below the ' + FLOOR + '% floor</b>'}</span>
    <span>${TARGET}% target price <b>${fmtK(T.target$)}</b></span>
    ${biggest ? `<span>largest cost: <b>${esc(biggest.l.scope.split('—')[0].trim())}</b> (${(biggest.c.cost / T.cost * 100).toFixed(0)}%)</span>` : ''}
    ${prodTxt}`);
  /* gauges */
  const gauge = (k, load, need, avail, hrs) => {
    const b = load <= 85 ? 'ok' : load <= 100 ? 'tight' : 'over';
    const i = document.getElementById('g-' + k + '-i'); if (i) { i.style.width = Math.min(100, load) + '%'; i.style.background = BC[b]; }
    setH('g-' + k, '<b style="color:' + BC[b] + '">' + need.toFixed(1) + ' heads</b> of ' + avail.toFixed(0) + ' available · ' + Math.round(hrs).toLocaleString() + ' hrs · ' + load.toFixed(0) + '%');
  };
  gauge('field', T.fLoad, T.fieldNeed, T.fieldAvail, T.fieldH);
  gauge('shop', T.sLoad, T.shopNeed, T.shopAvail, T.shopH);
  const note = document.getElementById('mp-note');
  if (note) {
    if (T.mp === 'ok') { note.style.borderLeftColor = '#2f9e6e'; note.innerHTML = '<b>Staffable as bid.</b> ' + T.fieldNeed.toFixed(0) + ' field + ' + T.shopNeed.toFixed(0) + ' shop heads over ' + T.weeks + ' weeks stays inside the 85% line on uncommitted crews.'; }
    else {
      const load = Math.max(T.fLoad, T.sLoad), who = T.fLoad >= T.sLoad ? 'Field crew' : 'Fab shop';
      note.style.borderLeftColor = BC[T.mp];
      note.innerHTML = '<b>' + who + ' at ' + load.toFixed(0) + '% of available heads.</b> To staff it: extend to <b>' + Math.ceil(T.weeks * load / 85) + ' weeks</b>, or carry about <b>' + Math.min(25, Math.ceil((load / 85 - 1) * 100)) + '% OT</b> (labor reprices at 1.5× automatically), or free crews from backlog first.';
    }
  }
  /* composition */
  const comp = [['Material', T.mat, '#14283c'], ['Labor', T.lab, '#6b7685'], ['Overhead', T.oh, '#cf4a57'], ['Profit', Math.max(0, T.profit), '#2f9e6e'], ['Bond · GL · contingency', T.addons, '#b98a36']];
  setH('bs-comp', '<div style="display:flex;height:16px;border-radius:99px;overflow:hidden">' + comp.map(c => `<i title="${c[0]}" style="display:block;width:${T.client ? (c[1] / T.client * 100).toFixed(2) : 0}%;background:${c[2]}"></i>`).join('') + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px;font-size:11px;color:var(--color-text-muted)">' + comp.map(c => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c[2]};margin-right:5px;vertical-align:-1px"></i>${c[0]} <b style="color:var(--color-cloud-whisper)">${fmtK(c[1])}</b> · ${T.client ? (c[1] / T.client * 100).toFixed(1) : 0}%</span>`).join('') + '</div>');
  /* live delta vs last rev */
  const dl = document.getElementById('rev-delta');
  if (dl && last && !locked()) {
    const R = last.totals, dd = T.client - R.client;
    dl.innerHTML = `Revising from <b>Rev ${last.rev}</b>: price <b style="color:${dd >= 0 ? '#2f9e6e' : '#c8102e'}">${dd >= 0 ? '+' : '−'}${fmtK(Math.abs(dd))}</b> · margin ${R.margin.toFixed(1)}% → <b>${T.margin.toFixed(1)}%</b> · profit ${fmtK(R.profit + R.oh)} → <b>${fmtK(T.profit + T.oh)}</b> · ${changes} line change${changes === 1 ? '' : 's'}`;
  }
  try { localStorage.setItem(KEY_STATE, JSON.stringify(S)); } catch (e) {}
}

/* ---------------- edit plumbing ---------------- */
function syncInputs() {
  document.querySelectorAll('input[data-f]').forEach(inp => {
    if (inp === document.activeElement) return;
    const l = S.lines[+inp.dataset.i], f = inp.dataset.f; if (!l) return;
    if (f === 'mkup') { inp.value = l.mkup == null ? '' : fmtF('mkup', l.mkup); inp.classList.toggle('dflt', l.mkup == null); }
    else if (['qty', 'mat', 'shopUPH', 'fieldUPH'].includes(f)) inp.value = fmtF(f, l[f]);
  });
  document.querySelectorAll('input[data-g]').forEach(inp => { if (inp !== document.activeElement && inp.dataset.g) inp.value = fmtN(S.g[inp.dataset.g]); });
}
function priceToMarkup(l, f, v) {
  const b = lineCost(l); if (b.cost <= 0) return;
  const target = f === 'usell' ? v * l.qty : v;
  l.mkup = Math.round((target / b.cost - 1) * 10000) / 100;
  const mk = document.querySelector(`input[data-i="${S.lines.indexOf(l)}"][data-f="mkup"]`);
  if (mk) { mk.value = fmtF('mkup', l.mkup); mk.classList.remove('dflt'); }
}
app.addEventListener('focusin', e => {
  const t = e.target;
  if (t.matches && t.matches('.cell, .bs-ta, input[data-g], input[data-m]')) editSnap = JSON.stringify(S);
  if (t.classList && t.classList.contains('cell') && t.dataset.f !== 'scope') setTimeout(() => t.select(), 0);
});
app.addEventListener('input', e => {
  const t = e.target;
  if (!(t.matches && t.matches('.cell, .bs-ta, input[data-g], input[data-m]'))) return;
  if (editSnap) { UNDO.push(editSnap); if (UNDO.length > 100) UNDO.shift(); REDO.length = 0; editSnap = null; undoBtns(); }
  if (t.dataset.f != null) {
    const l = S.lines[+t.dataset.i], f = t.dataset.f;
    if (f === 'scope' || f === 'unit') l[f] = t.value;
    else if (f === 'mkup') { l.mkup = t.value.trim() === '' ? null : num(t.value); t.classList.toggle('dflt', l.mkup == null); }
    else if (f === 'usell' || f === 'sell') { if (t.value.trim() !== '') priceToMarkup(l, f, num(t.value)); }
    else l[f] = num(t.value);
    refresh();
  } else if (t.dataset.g) { S.g[t.dataset.g] = num(t.value); refresh(); }
  else if (t.dataset.m != null) { S.meta[t.dataset.m] = t.dataset.m === 'valid' ? num(t.value) : t.value; refresh(); }
});
app.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset.f != null && NUMF.includes(t.dataset.f)) {
    const l = S.lines[+t.dataset.i], f = t.dataset.f; if (!l) return;
    if (f === 'mkup') { if (l.mkup != null) t.value = fmtF('mkup', l.mkup); return; }
    if (f === 'usell' || f === 'sell') { refresh(); const c = lineCalc(l); t.value = fmtF(f, f === 'sell' ? c.sell : c.unitSell); return; }
    t.value = fmtF(f, l[f]);
  }
  if (t.dataset.g) t.value = fmtN(S.g[t.dataset.g]);
});
app.addEventListener('keydown', e => {
  const t = e.target;
  if (!(t.classList && t.classList.contains('cell'))) return;
  const f = t.dataset.f;
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && ['qty', 'mat', 'shopUPH', 'fieldUPH', 'mkup'].includes(f)) {
    e.preventDefault();
    if (!editSnap) checkpoint(); else { UNDO.push(editSnap); REDO.length = 0; editSnap = null; undoBtns(); }
    const l = S.lines[+t.dataset.i];
    const base = { qty: Math.max(1, Math.pow(10, Math.floor(Math.log10(Math.max(1, l.qty))) - 2)), mat: 0.01, shopUPH: 0.5, fieldUPH: 0.5, mkup: 0.5 }[f];
    const step = base * (e.shiftKey ? 10 : 1) * (e.key === 'ArrowUp' ? 1 : -1);
    const cur = f === 'mkup' ? (l.mkup != null ? l.mkup : S.g.defMkup) : l[f];
    l[f] = Math.max(0, Math.round((cur + step) * 10000) / 10000);
    t.value = fmtF(f, l[f]); if (f === 'mkup') t.classList.remove('dflt');
    refresh();
  } else if (e.key === 'Enter' && f != null) {
    e.preventDefault();
    const next = document.querySelector(`input[data-i="${+t.dataset.i + 1}"][data-f="${f}"]`);
    if (next) { next.focus(); next.select(); } else t.blur();
  } else if (e.key === 'Escape') t.blur();
});
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
});
function stepG(k, dlt) {
  checkpoint();
  if (k === '__valid') { S.meta.valid = Math.max(0, (S.meta.valid || 0) + dlt); const vi = document.querySelector('input[data-m="valid"]'); if (vi) vi.value = S.meta.valid; refresh(); return; }
  S.g[k] = Math.max(0, Math.round((S.g[k] + dlt) * 1000) / 1000); syncInputs(); refresh();
}

/* ---------------- confirm / revise (same page) ---------------- */
function confirmBid() {
  const T = totals(), revs = revsAll(), rev = String.fromCharCode(65 + revs.length);
  revs.push({
    rev, ts: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }),
    by: (currentPersona() || {}).name || 'MSM',
    meta: JSON.parse(JSON.stringify(S.meta)),
    lines: S.lines.map((l, i) => ({ scope: l.scope, unit: l.unit, qty: l.qty, unitSell: T.L[i].unitSell, sell: T.L[i].sell, cost: T.L[i].cost, inc: inc(l) })),
    totals: { client: T.client, sell: T.sell, addons: T.addons, cost: T.cost, profit: T.profit, oh: T.oh, margin: T.margin, mp: T.mp, fieldNeed: T.fieldNeed, shopNeed: T.shopNeed, weeks: T.weeks, hours: T.shopH + T.fieldH, a: T.a },
  });
  try { localStorage.setItem(KEY_REVS, JSON.stringify(revs)); } catch (e) {}
  S.status = 'confirmed'; viewRev = revs.length - 1;
  render();
  toast('Rev ' + rev + ' confirmed — ' + money(T.client));
  setTimeout(() => { const el = document.getElementById('confirmed'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
}
function reviseBid() { S.status = 'draft'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function clearRevs() { try { localStorage.removeItem(KEY_REVS); } catch (e) {} S.status = 'draft'; viewRev = null; render(true); }
function showRev(i) { viewRev = i; renderConfirmed(); }
function renderConfirmed() {
  const host = document.getElementById('confirmed'); if (!host) return;
  const revs = revsAll();
  if (!revs.length) { host.innerHTML = ''; return; }
  if (viewRev == null || viewRev >= revs.length) viewRev = revs.length - 1;
  const R = revs[viewRev], T = R.totals, M = Object.assign({}, DEFAULT_TERMS, R.meta);
  const due = M.due ? new Date(M.due + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '—';
  const prev = viewRev > 0 ? revs[viewRev - 1].totals : null;
  const inL = R.lines.filter(l => l.inc !== false), outL = R.lines.filter(l => l.inc === false);
  const altX = 1 + (T.a || 0);
  host.innerHTML = `
  <div class="demo-panel" style="margin-bottom:22px;border-left:4px solid #2f9e6e">
    <div class="demo-panel-head"><h2>Confirmed Bid</h2>
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${revs.map((r, i) => `<span class="rev-chip ${i === viewRev ? 'on' : ''}" onclick="showRev(${i})"><b>Rev ${r.rev}</b> ${fmtK(r.totals.client)} · ${r.totals.margin.toFixed(1)}%</span>`).join('')}
        <button class="pa-btn primary" onclick="window.print()">Print / PDF</button>
        <button class="pa-btn" onclick="copySummary()">⧉ Copy summary</button>
        <button class="pa-btn" onclick="clearRevs()" title="Clear revision history (demo)">Clear history</button>
      </span></div>
    ${!locked() ? '<div class="bs-note" id="rev-delta" style="margin:0 0 14px;border-left-color:var(--color-amber)"></div>' : ''}
    <div class="cdoc" id="cdoc">
      <div class="cdoc-head">
        <div><img src="/mccorvey/assets/brand/mccorvey-logo.png" alt="McCorvey Sheet Metal Works, L.P."><div class="co">McCorvey Sheet Metal Works, L.P. · 8610 Wallisville Road, Houston, TX 77029 · (713) 672-7545</div></div>
        <div class="cdoc-meta">Bid <b>${esc(M.bidNo)}</b> · Rev <b>${R.rev}</b><br>Issued ${esc(R.ts)}<br>Bid due <b>${due}</b> · valid ${esc(M.valid)} days</div>
      </div>
      <div class="cdoc-title">${esc(M.project)}</div>
      <div class="cdoc-sub">HVAC sheet metal ductwork — fabricate, deliver &amp; install · Submitted to <b>${esc(M.gc)}</b></div>
      <table class="cdoc-tbl">
        <thead><tr><th class="l" style="width:34px">Item</th><th class="l">Description</th><th>Qty</th><th class="l">Unit</th><th>Unit price</th><th>Amount</th></tr></thead>
        <tbody>
          ${inL.map((l, i) => `<tr><td class="l">${i + 1}</td><td class="l">${esc(l.scope)}</td><td>${fmtN(l.qty, 0)}</td><td class="l">${esc(l.unit)}</td><td>${moneyU(l.unitSell)}</td><td>${money(l.sell)}</td></tr>`).join('')}
          <tr class="sub"><td></td><td class="l">Subtotal</td><td colspan="3"></td><td>${money(T.sell)}</td></tr>
          <tr><td></td><td class="l">Payment &amp; performance bond, GL insurance &amp; contingency</td><td colspan="3"></td><td>${money(T.addons)}</td></tr>
          <tr class="grand"><td></td><td class="l">BASE BID</td><td colspan="3"></td><td>${money(T.client)}</td></tr>
        </tbody>
      </table>
      ${outL.length ? `<div class="cdoc-h">Alternates — not included in base bid</div>
      <table class="cdoc-tbl"><thead><tr><th class="l" style="width:34px">Alt</th><th class="l">Description</th><th>Qty</th><th class="l">Unit</th><th>Add to base bid</th></tr></thead>
        <tbody>${outL.map((l, i) => `<tr><td class="l">A${i + 1}</td><td class="l">${esc(l.scope.replace(/^Spec adder — /, ''))}</td><td>${fmtN(l.qty, 0)}</td><td class="l">${esc(l.unit)}</td><td>+ ${money(l.sell * altX)}</td></tr>`).join('')}</tbody></table>` : ''}
      <div class="cdoc-terms">
        <div><b>Inclusions</b>${esc(M.incl)}</div>
        <div><b>Exclusions &amp; terms</b>${esc(M.excl)}</div>
      </div>
      <div class="cdoc-sign"><div>McCorvey Sheet Metal Works, L.P. — authorized signature &amp; date</div><div>${esc(M.gc)} — acceptance &amp; date</div></div>
    </div>
    <div class="cdoc-int">
      <div style="font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--color-slate-hint);margin-bottom:8px">INTERNAL — NOT ON THE CUSTOMER COPY</div>
      <div class="ykpi-row" style="margin:0">
        <div class="ykpi"><div class="l">Cost to McCorvey</div><div class="v">${fmtK(T.cost)}</div><div class="s">${Math.round(T.hours).toLocaleString()} man-hours</div></div>
        <div class="ykpi ${T.margin >= TARGET ? 'green' : T.margin >= FLOOR ? 'amber' : 'red'}"><div class="l">Profit + OH · Margin</div><div class="v">${fmtK(T.profit + T.oh)}</div><div class="s">${T.margin.toFixed(1)}% margin${prev ? ' · was ' + prev.margin.toFixed(1) + '% at Rev ' + revs[viewRev - 1].rev : ''}</div></div>
        <div class="ykpi"><div class="l">Crews Committed</div><div class="v" style="color:${BC[T.mp]}">${T.mp === 'ok' ? 'STAFFABLE' : T.mp.toUpperCase()}</div><div class="s">${T.fieldNeed.toFixed(0)} field · ${T.shopNeed.toFixed(0)} shop · ${T.weeks} wks</div></div>
        <div class="ykpi"><div class="l">Confirmed By</div><div class="v" style="font-size:15px;line-height:1.4">${esc(R.by)}</div><div class="s">${esc(R.ts)}</div></div>
      </div>
    </div>
  </div>`;
  if (!locked()) refresh();
}

function dock() {
  const roll = document.getElementById('bs-roll'), sub = document.querySelector('.section-subnav');
  if (roll && sub) roll.style.top = ((parseFloat(getComputedStyle(sub).top) || 0) + sub.getBoundingClientRect().height) + 'px';
}
window.addEventListener('resize', dock);
render();
</script>
