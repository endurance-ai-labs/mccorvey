<style>
  /* sticky rollup — big, readable */
  .bm-roll { position: sticky; top: 0; z-index: 60; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 12px 0 10px; background: var(--color-bg); }
  .bm-tile { border-radius: 14px; padding: 18px 22px 16px; background: var(--color-bg-2); border: 1px solid var(--color-border); border-top: 4px solid var(--color-slate-hint); box-shadow: var(--shadow-md); min-width: 0; min-height: 128px; }
  .bm-tile .l { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--color-slate-hint); margin-bottom: 9px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm-tile .v { font-size: clamp(26px, 2.4vw, 34px); font-weight: 800; letter-spacing: -.02em; color: var(--color-cloud-whisper); line-height: 1.02; font-variant-numeric: tabular-nums; }
  .bm-tile .s { font-size: 11.5px; color: var(--color-text-muted); margin-top: 9px; line-height: 1.6; }
  .bm-tile.client { border-top-color: #14283c; }
  .bm-tile.cost { border-top-color: var(--color-amber); }
  .bm-tile.profit.ok { border-top-color: #2f9e6e; }
  .bm-tile.profit.watch { border-top-color: var(--color-amber); }
  .bm-tile.profit.bad { border-top-color: #c8102e; }
  .bm-tile.mp.ok { border-top-color: #2f9e6e; } .bm-tile.mp.tight { border-top-color: var(--color-amber); } .bm-tile.mp.over { border-top-color: #c8102e; }
  /* action bar: confirm + scenarios */
  .bm-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 4px 0 18px; }
  .bm-scn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--color-border); background: var(--color-bg-2); border-radius: 10px; padding: 8px 12px; font-size: 11px; color: var(--color-text-muted); }
  .bm-scn b { color: var(--color-cloud-whisper); font-size: 11.5px; }
  .bm-scn a { font-size: 10px; font-weight: 800; letter-spacing: .05em; color: var(--color-blue); cursor: pointer; text-decoration: none; }
  .bm-scn a.mut { color: var(--color-slate-hint); }
  /* slider rows */
  .bm-row { display: grid; grid-template-columns: minmax(170px, 215px) 1fr 156px; gap: 8px 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--color-border-soft); }
  .bm-row:last-child { border-bottom: none; }

  .bm-row input[type=range] { width: 100%; accent-color: #c8102e; height: 22px; cursor: pointer; }
  .bm-row .nm { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .bm-row .nm input { width: 116px; font: inherit; font-size: 12.5px; font-weight: 700; text-align: right; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--color-border); background: var(--color-bg-3); color: var(--color-cloud-whisper); outline: none; font-variant-numeric: tabular-nums; }
  .bm-row .nm input:focus { border-color: var(--color-blue); }
  .bm-row .nm span { font-size: 10px; font-weight: 700; color: var(--color-slate-hint); width: 30px; }
  /* cost composition */
  .bm-comp { display: grid; grid-template-columns: 170px 1fr 130px; gap: 7px 12px; align-items: center; font-size: 11.5px; color: var(--color-text-muted); }
  .bm-comp .bar { height: 15px; border-radius: 99px; background: var(--color-bg-3); overflow: hidden; }
  .bm-comp .bar i { display: block; height: 100%; border-radius: 99px; }
  .bm-comp b { text-align: right; color: var(--color-cloud-whisper); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* manpower gauges */
  .bm-gauge { margin-bottom: 15px; }
  .bm-gauge .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 11.5px; color: var(--color-text-muted); margin-bottom: 6px; flex-wrap: wrap; }
  .bm-gauge .gh b { color: var(--color-cloud-whisper); font-size: 12.5px; }
  .bm-gauge .track { height: 20px; border-radius: 99px; background: var(--color-bg-3); position: relative; overflow: hidden; }
  .bm-gauge .track i { display: block; height: 100%; border-radius: 99px; transition: width .18s ease; }
  .bm-gauge .track .cap { position: absolute; top: -3px; bottom: -3px; width: 2.5px; background: var(--color-cloud-whisper); opacity: .55; }
  .bm-remedy { border: 1px solid var(--color-border); border-left: 4px solid var(--color-amber); border-radius: 10px; padding: 12px 15px; font-size: 12px; line-height: 1.65; color: var(--color-text-muted); background: var(--color-bg-3); }
  .bm-remedy b { color: var(--color-cloud-whisper); }
  @media (max-width: 1280px) { .bm-roll { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 960px) { .bm-roll { position: static; } .bm-row { grid-template-columns: 1fr; } .bm-row .nm { justify-content: flex-start; } }
  @media (max-width: 640px) { .bm-roll { grid-template-columns: 1fr; } }

<main class="page">

<script src="/mccorvey/js/data.js?v=20261007c"></script>

<script>
if (!isSignedIn() && !location.search.includes('enter')) location.replace('/mccorvey/welcome/');
McCorveyNav.renderTopbar({ subtitle: 'Preconstruction — Adjustable Bid Modeler' });

/* ================= MODEL STATE (everything adjustable; autosaved) ================= */
const DEFAULTS = {
  scope: { rectLbs: 1420000, spiralLF: 38000, weldLF: 2100, grd: 2140, damp: 480 },
  rates: {
    matLb: 0.72, spiralMatLF: 9.4, weldMatLF: 46, grdEa: 74, dampEa: 410,
    shopRate: 62, fieldRate: 78,
    shopLbsHr: 75, fieldLbsHr: 42,
    spiralShopLFHr: 9, spiralFieldLFHr: 6.5,
    weldShopLFHr: 1.6, weldFieldLFHr: 2.2,
    grdFieldHrEa: 0.7,
    subsPct: 4.0, equipPct: 2.5,
  },
  levers: { ohPct: 6.0, profitPct: 9.0, bondPct: 1.0, glPct: 0.85, contPct: 0.5, escPct: 1.0 },
  priceOverride: null,
  mp: { weeks: 40, otPct: 0, fieldCommitPct: 78, shopCommitPct: 82 },
};
let M = JSON.parse(JSON.stringify(DEFAULTS));
try {
  const sv = JSON.parse(localStorage.getItem('msm-bidmodel-state') || 'null');
  if (sv) { ['scope', 'rates', 'levers', 'mp'].forEach(k => Object.assign(M[k], sv[k] || {})); M.priceOverride = sv.priceOverride != null ? sv.priceOverride : null; }
} catch (e) {}
const FIELD_POOL = 340, SHOP_POOL = 580, UTIL = 0.9, HRSWK = 40, FLOOR_MARGIN = 11;

function calc() {
  const s = M.scope, r = M.rates, L = M.levers, mp = M.mp;
  const shopHrs  = s.rectLbs / r.shopLbsHr + s.spiralLF / r.spiralShopLFHr + s.weldLF / r.weldShopLFHr;
  const fieldHrs = s.rectLbs / r.fieldLbsHr + s.spiralLF / r.spiralFieldLFHr + s.weldLF / r.weldFieldLFHr + s.grd * r.grdFieldHrEa;
  const otCostX = 1 + (mp.otPct / (100 + mp.otPct)) * 0.5;          /* OT share of hours at 1.5x */
  const material = s.rectLbs * r.matLb + s.spiralLF * r.spiralMatLF + s.weldLF * r.weldMatLF + s.grd * r.grdEa + s.damp * r.dampEa;
  const esc$ = material * L.escPct / 100;
  const shopLab = shopHrs * r.shopRate * otCostX;
  const fieldLab = fieldHrs * r.fieldRate * otCostX;
  const directBase = material + esc$ + shopLab + fieldLab;
  const subs = directBase * r.subsPct / 100;
  const equip = directBase * r.equipPct / 100;
  const cogs = directBase + subs + equip;
  const oh = cogs * L.ohPct / 100;
  let profit = (cogs + oh) * L.profitPct / 100;
  let sellSub = cogs + oh + profit;
  const addonPct = (L.bondPct + L.glPct + L.contPct) / 100;
  let client = sellSub * (1 + addonPct);
  if (M.priceOverride != null && M.priceOverride > 0) {
    client = M.priceOverride;
    sellSub = client / (1 + addonPct);
    profit = sellSub - cogs - oh;
  }
  const cont$ = sellSub * L.contPct / 100;
  const marginPct = client ? (oh + profit + cont$) / client * 100 : 0;
  /* walk-away floor: client price where blended margin = FLOOR_MARGIN%
     margin = (1+cont%)/(1+addons) − cogs/client  →  floor = cogs / ((1+cont%)/(1+addons) − F) */
  const floorK = (1 + L.contPct / 100) / (1 + addonPct) - FLOOR_MARGIN / 100;
  const floor$ = floorK > 0.05 ? cogs / floorK : 0;
  const weeks = Math.max(4, mp.weeks);
  const hrsPerHead = weeks * HRSWK * UTIL * (1 + mp.otPct / 100);
  const fieldNeed = fieldHrs / hrsPerHead, shopNeed = shopHrs / hrsPerHead;
  const fieldAvail = FIELD_POOL * (1 - mp.fieldCommitPct / 100);
  const shopAvail = SHOP_POOL * (1 - mp.shopCommitPct / 100);
  const fLoad = fieldNeed / Math.max(0.1, fieldAvail) * 100;
  const sLoad = shopNeed / Math.max(0.1, shopAvail) * 100;
  const status = l => l <= 85 ? 'ok' : l <= 100 ? 'tight' : 'over';
  return { shopHrs, fieldHrs, material, esc$, shopLab, fieldLab, subs, equip, cogs, oh, profit, sellSub, cont$, client, marginPct, floor$, otCostX,
           weeks, fieldNeed, shopNeed, fieldAvail, shopAvail, fLoad, sLoad, fStatus: status(fLoad), sStatus: status(sLoad), overall: status(Math.max(fLoad, sLoad)) };
}

/* ================= helpers ================= */
const fmtNum = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const parseNum = v => parseFloat(String(v).replace(/[, ]/g, '')) || 0;
const GROUPS = {};
function bindGroups() { GROUPS.s = M.scope; GROUPS.r = M.rates; GROUPS.l = M.levers; GROUPS.m = M.mp; }
bindGroups();
function row(gk, key, label, sub, min, max, step, unit) {
  const v = GROUPS[gk][key];
  const id = 'bm-' + gk + '-' + key;
  return `<div class="bm-row">
    <div class="lb"><b>${label}</b>${sub || ''}</div>
    <input type="range" id="${id}-rg" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setVal('${id}', this.value)">
    <span class="nm"><input id="${id}-nm" type="text" inputmode="decimal" value="${fmtNum(v)}" onchange="setVal('${id}', this.value)"><span>${unit}</span></span>
  </div>`;
}
function setVal(id, v) {
  const parts = id.split('-');
  const g = GROUPS[parts[1]], key = parts.slice(2).join('-');
  g[key] = parseNum(v);
  const rg = document.getElementById(id + '-rg'), nm = document.getElementById(id + '-nm');
  if (rg) rg.value = g[key];
  if (nm) nm.value = fmtNum(g[key]);
  refresh();
}
function setOverride(v) { const n = parseNum(v); M.priceOverride = n > 0 ? n : null; refresh(); }
function clearOverride() { M.priceOverride = null; const i = document.getElementById('bm-ovr'); if (i) i.value = ''; refresh(); }
function resetModel() { M = JSON.parse(JSON.stringify(DEFAULTS)); bindGroups(); try { localStorage.removeItem('msm-bidmodel-state'); } catch (e) {} buildShell(); }

/* ---- scenarios: memory for the back-and-forth ---- */
function scnAll() { try { return JSON.parse(localStorage.getItem('msm-bidmodel-scn') || '{}'); } catch (e) { return {}; } }
function saveScn(slot) {
  const c = calc();
  const all = scnAll();
  all[slot] = { state: JSON.parse(JSON.stringify(M)), summary: fmtK(c.client) + ' · ' + c.marginPct.toFixed(1) + '% · ' + (c.overall === 'ok' ? 'staffable' : c.overall === 'tight' ? 'tight' : 'over cap.') };
  try { localStorage.setItem('msm-bidmodel-scn', JSON.stringify(all)); } catch (e) {}
  renderScn();
}
function loadScn(slot) {
  const all = scnAll(); if (!all[slot]) return;
  M = JSON.parse(JSON.stringify(all[slot].state)); bindGroups(); buildShell();
}
function dropScn(slot) { const all = scnAll(); delete all[slot]; try { localStorage.setItem('msm-bidmodel-scn', JSON.stringify(all)); } catch (e) {} renderScn(); }
function renderScn() {
  const all = scnAll();
  const el = document.getElementById('bm-scns'); if (!el) return;
  el.innerHTML = ['A', 'B', 'C'].map(k => all[k]
    ? `<span class="bm-scn"><b>${k}</b> ${all[k].summary} <a onclick="loadScn('${k}')">LOAD</a> <a onclick="saveScn('${k}')" class="mut" title="overwrite with current numbers">SAVE</a> <a onclick="dropScn('${k}')" class="mut">✕</a></span>`
    : `<span class="bm-scn"><b>${k}</b> <span style="color:var(--color-slate-hint)">empty</span> <a onclick="saveScn('${k}')">SAVE CURRENT</a></span>`).join('');
}

/* ---- Confirm → convert to a line-item bid in the Bid Builder ---- */
function convertToBid() {
  const s = M.scope, r = M.rates, L = M.levers, c = calc();
  const em = 1 + L.escPct / 100;
  const dur = Math.max(20, Math.round(c.weeks * 5));
  const mk = (trade, csi, desc, qty, unit, cost$, sub, offset, d) => ({ trade, csi, desc, qty, unit, unitCost: qty ? Math.round(cost$ / qty * 10000) / 10000 : 0, sub, offset, dur: d });
  const rectCost = s.rectLbs * r.matLb * em + (s.rectLbs / r.shopLbsHr) * r.shopRate * c.otCostX + (s.rectLbs / r.fieldLbsHr) * r.fieldRate * c.otCostX;
  const spiralCost = s.spiralLF * r.spiralMatLF * em + (s.spiralLF / r.spiralShopLFHr) * r.shopRate * c.otCostX + (s.spiralLF / r.spiralFieldLFHr) * r.fieldRate * c.otCostX;
  const weldCost = s.weldLF * r.weldMatLF * em + (s.weldLF / r.weldShopLFHr) * r.shopRate * c.otCostX + (s.weldLF / r.weldFieldLFHr) * r.fieldRate * c.otCostX;
  const grdCost = s.grd * (r.grdEa * em + r.grdFieldHrEa * r.fieldRate * c.otCostX);
  const dampCost = s.damp * r.dampEa * em;
  const lines = [
    s.rectLbs > 0 ? mk('Rectangular Duct', '23 31 13', 'Galvanized rectangular duct per SMACNA — fab, deliver & install (from Bid Modeler)', s.rectLbs, 'lbs', rectCost, 'MSM Fab — Houston Plant (Wallisville)', 30, Math.round(dur * 0.7)) : null,
    s.spiralLF > 0 ? mk('Spiral & Round Duct', '23 31 13', 'Spiral & round duct — fab, deliver & install (from Bid Modeler)', s.spiralLF, 'LF', spiralCost, 'MSM Fab — Orlando Plant (Rocket Blvd)', 45, Math.round(dur * 0.6)) : null,
    s.weldLF > 0 ? mk('Welded Exhaust', '23 38 13', 'Welded stainless exhaust, liquid-tight per NFPA 96 (from Bid Modeler)', s.weldLF, 'LF', weldCost, 'MSM Fab — Houston Plant (Wallisville)', Math.round(dur * 0.3), Math.round(dur * 0.45)) : null,
    s.grd > 0 ? mk('Air Devices', '23 37 13', 'Diffusers, registers & grilles per GRD schedule — furnish & install (from Bid Modeler)', s.grd, 'GRD', grdCost, 'MSM Field Crew — Self-Perform', Math.round(dur * 0.55), Math.round(dur * 0.35)) : null,
    s.damp > 0 ? mk('Dampers & Accessories', '23 33 00', 'Fire/smoke dampers & duct accessories (from Bid Modeler)', s.damp, 'ea', dampCost, 'MSM Field Crew — Self-Perform', Math.round(dur * 0.35), Math.round(dur * 0.45)) : null,
    c.subs > 0 ? mk('Duct Liner & Wrap', '23 07 13', 'Subs & bought-out — insulation, rigging, freight (modeled ' + r.subsPct + '%)', 1, 'LS', c.subs, 'Gulf Coast Insulation Partners', 60, Math.round(dur * 0.5)) : null,
    c.equip > 0 ? mk('General Conditions', '01 31 00', 'Equipment, lifts & consumables (modeled ' + r.equipPct + '%)', 1, 'LS', c.equip, 'MSM Field Crew — Self-Perform', 0, dur) : null,
  ].filter(Boolean);
  const effProfitPct = (M.priceOverride != null && M.priceOverride > 0) ? Math.round(c.profit / Math.max(1, c.cogs + c.oh) * 10000) / 100 : L.profitPct;
  const handoff = {
    lines,
    levers: { overheadPct: L.ohPct, profitPct: effProfitPct, contingencyPct: L.contPct, bondPct: L.bondPct, glPct: L.glPct, escalationPct: 0, taxPct: 0, retainagePct: 5 },
    project: 'Modeled Bid — ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
    summary: { client: c.client, cogs: c.cogs, marginPct: c.marginPct, weeks: c.weeks, fieldNeed: c.fieldNeed, shopNeed: c.shopNeed, overall: c.overall, pinned: !!(M.priceOverride && M.priceOverride > 0) },
    ts: Date.now(),
  };
  try { localStorage.setItem('msm-bidmodel-handoff', JSON.stringify(handoff)); } catch (e) {}
  location.href = '/mccorvey/bids/?from=model';
}

/* ================= SHELL (built once; values update in place) ================= */
const app = $('#app');
function buildShell() {
  app.innerHTML = `
  <div class="demo-hero" style="padding-bottom:8px">
    <div>
      <div class="demo-eyebrow">PRECONSTRUCTION · DEAL SHAPING</div>
      <h1>Adjustable <em>Bid Modeler</em></h1>
      <div class="sub">Every lever on one screen — scope, productivity, rates, markups, schedule. Cost to client, cost to McCorvey and profit move together, and the manpower governor keeps the number honest against the crews actually available. When the shape is right, confirm it and it becomes a line-item estimate in the <a href="/mccorvey/bids/" style="color:var(--color-blue);font-weight:700">Bid Builder</a>.</div>
    </div>
    <div class="demo-hero-right">
      <span class="demo-live"><span class="dot"></span> LIVE RECALC · AUTOSAVED</span>
      <span style="display:flex;gap:6px">${srcChip('prop')} ${srcChip('st')}</span>
    </div>
  </div>

  <div class="bm-roll" id="bm-roll">
    <div class="bm-tile client"><div class="l">Cost to Client — Base Bid</div><div class="v" id="o-client">—</div><div class="s" id="o-client-s">—</div></div>
    <div class="bm-tile cost"><div class="l">Cost to McCorvey</div><div class="v" id="o-cogs">—</div><div class="s" id="o-cogs-s">—</div></div>
    <div class="bm-tile profit ok" id="t-profit"><div class="l">Profit + Overhead</div><div class="v" id="o-profit">—</div><div class="s" id="o-profit-s">—</div></div>
    <div class="bm-tile mp ok" id="t-mp"><div class="l">Manpower Check</div><div class="v" id="o-mp">—</div><div class="s" id="o-mp-s">—</div></div>
  </div>

  <div class="bm-actions">
    <button class="pa-btn primary" onclick="convertToBid()">Confirm bid → convert to line-item estimate</button>
    <span id="bm-scns" style="display:inline-flex;gap:8px;flex-wrap:wrap"></span>
    <span style="flex:1"></span>
    <button class="pa-btn" onclick="resetModel()" title="Back to the standard template assumptions">Reset to defaults</button>
  </div>

  <div class="demo-two" style="margin-bottom:22px">
    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Scope &amp; Quantities</h2><span class="k">what we're bidding</span></div>
      ${row('s', 'rectLbs', 'Rectangular duct', '<span style="font-size:10px">galvanized, per SMACNA</span>', 100000, 4000000, 10000, 'lbs')}
      ${row('s', 'spiralLF', 'Spiral & round duct', '', 0, 120000, 500, 'LF')}
      ${row('s', 'weldLF', 'Welded exhaust', '<span style="font-size:10px">304SS, NFPA 96</span>', 0, 12000, 100, 'LF')}
      ${row('s', 'grd', 'Air devices (GRDs)', '', 0, 8000, 10, 'ea')}
      ${row('s', 'damp', 'Fire/smoke dampers', '', 0, 2000, 10, 'ea')}
    </div>
    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Cost to McCorvey — Rates &amp; Productivity</h2><span class="k">our actual cost basis</span></div>
      ${row('r', 'matLb', 'Galv material', '<span style="font-size:10px">coil incl. scrap</span>', 0.4, 1.4, 0.01, '$/lb')}
      ${row('r', 'shopRate', 'Shop labor rate', '', 45, 95, 1, '$/hr')}
      ${row('r', 'fieldRate', 'Field labor rate', '', 55, 120, 1, '$/hr')}
      ${row('r', 'shopLbsHr', 'Shop productivity', '<span style="font-size:10px">lbs per man-hour</span>', 40, 120, 1, 'lb/h')}
      ${row('r', 'fieldLbsHr', 'Field productivity', '<span style="font-size:10px">lbs hung per man-hour</span>', 20, 70, 1, 'lb/h')}
      ${row('r', 'subsPct', 'Subs & bought-out', '<span style="font-size:10px">insulation, rigging, freight</span>', 0, 15, 0.5, '%')}
      ${row('r', 'equipPct', 'Equipment & consumables', '', 0, 8, 0.5, '%')}
    </div>
  </div>

  <div class="demo-two" style="margin-bottom:22px">
    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Commercial Levers → Client Price</h2><span class="k">markups — or pin the market price</span></div>
      ${row('l', 'ohPct', 'Overhead', '', 0, 15, 0.25, '%')}
      ${row('l', 'profitPct', 'Profit', '', 0, 20, 0.25, '%')}
      ${row('l', 'contPct', 'Contingency', '', 0, 5, 0.25, '%')}
      ${row('l', 'escPct', 'Steel escalation', '<span style="font-size:10px">on material</span>', 0, 8, 0.25, '%')}
      <div class="bm-row" style="border-top:1px dashed var(--color-border);margin-top:4px;padding-top:13px">
        <div class="lb"><b>Market price override</b><span style="font-size:10px">pin what the job will take — profit absorbs the difference</span></div>
        <div></div>
        <span class="nm"><input id="bm-ovr" type="text" inputmode="decimal" placeholder="e.g. 6,800,000" value="${M.priceOverride ? fmtNum(M.priceOverride) : ''}" onchange="setOverride(this.value)"><span>$</span></span>
      </div>
      <div style="margin-top:9px"><button class="pa-btn" onclick="clearOverride()">Clear override — price from levers</button></div>
      <div style="margin-top:18px">
        <div style="font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--color-slate-hint);margin-bottom:9px">WHERE THE CLIENT DOLLAR GOES</div>
        <div class="bm-comp" id="bm-comp"></div>
      </div>
    </div>
    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Manpower Governor</h2><span class="k">can we actually build it?</span></div>
      ${row('m', 'weeks', 'Project duration', '', 8, 120, 1, 'wks')}
      ${row('m', 'otPct', 'Overtime allowance', '<span style="font-size:10px">adds capacity · OT hours cost 1.5×</span>', 0, 25, 1, '%')}
      ${row('m', 'fieldCommitPct', 'Field pool committed elsewhere', '<span style="font-size:10px">of 340 installers, current backlog</span>', 50, 95, 1, '%')}
      ${row('m', 'shopCommitPct', 'Plant capacity committed', '<span style="font-size:10px">of 580 shop employees, both plants</span>', 50, 95, 1, '%')}
      <div style="margin-top:17px">
        <div class="bm-gauge">
          <div class="gh"><b>Field crew</b><span id="g-field-t">—</span></div>
          <div class="track"><i id="g-field-i" style="width:0%;background:#2f9e6e"></i><span class="cap" style="left:85%"></span></div>
        </div>
        <div class="bm-gauge">
          <div class="gh"><b>Fab shop</b><span id="g-shop-t">—</span></div>
          <div class="track"><i id="g-shop-i" style="width:0%;background:#2f9e6e"></i><span class="cap" style="left:85%"></span></div>
        </div>
        <div id="bm-remedy"></div>
      </div>
    </div>
  </div>

  <div class="demo-note">MSM Operations Portal — demo environment, fictional data · rates and productivities are placeholders for MSM's historical cost database · concept build by Endurance AI Labs</div>`;
  renderScn();
  refresh();
  dockRollup();
}
/* dock the rollup directly under the portal's sticky header stack */
function dockRollup() {
  const roll = document.getElementById('bm-roll'); if (!roll) return;
  const sub = document.querySelector('.section-subnav');
  if (sub) { const cs = getComputedStyle(sub); roll.style.top = ((parseFloat(cs.top) || 0) + sub.getBoundingClientRect().height) + 'px'; }
}
window.addEventListener('resize', dockRollup);

/* ================= LIVE REFRESH (in-place updates — keeps slider focus) ================= */
const sc = { ok: '#2f9e6e', tight: 'var(--color-amber)', over: '#c8102e' };
const scTxt = { ok: 'OK', tight: 'TIGHT', over: 'OVER CAPACITY' };
function refresh() {
  const c = calc();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
  set('o-client', fmtK(c.client));
  set('o-client-s', (M.priceOverride ? '<b style="color:var(--color-amber)">MARKET-PINNED</b>' : 'priced from levers') + ' · ' + fmt$(Math.round(c.client)) + '<br>walk-away floor <b>' + (c.floor$ ? fmtK(c.floor$) : '—') + '</b> at ' + FLOOR_MARGIN + '% margin');
  set('o-cogs', fmtK(c.cogs));
  set('o-cogs-s', 'material ' + fmtK(c.material + c.esc$) + ' · shop ' + fmtK(c.shopLab) + '<br>field ' + fmtK(c.fieldLab) + ' · subs/equip ' + fmtK(c.subs + c.equip));
  set('o-profit', fmtK(c.profit + c.oh));
  set('o-profit-s', 'margin <b>' + c.marginPct.toFixed(1) + '%</b> vs 13% target<br>profit ' + fmtK(c.profit) + (c.profit < 0 ? ' — <b style="color:#c8102e">UNDERWATER</b>' : '') + ' · OH ' + fmtK(c.oh));
  const pBand = c.marginPct >= 13 ? 'ok' : c.marginPct >= 11 ? 'watch' : 'bad';
  document.getElementById('t-profit').className = 'bm-tile profit ' + pBand;
  set('o-mp', scTxt[c.overall]);
  set('o-mp-s', 'field <b>' + c.fieldNeed.toFixed(0) + '</b> of ' + c.fieldAvail.toFixed(0) + ' avail · shop <b>' + c.shopNeed.toFixed(0) + '</b> of ' + c.shopAvail.toFixed(0) + '<br>' + c.weeks + ' weeks · ' + Math.round(c.fieldHrs + c.shopHrs).toLocaleString() + ' total man-hours');
  document.getElementById('t-mp').className = 'bm-tile mp ' + c.overall;
  const g = (p, load, need, avail, hrs) => {
    const band = load <= 85 ? 'ok' : load <= 100 ? 'tight' : 'over';
    document.getElementById('g-' + p + '-i').style.width = Math.min(100, load) + '%';
    document.getElementById('g-' + p + '-i').style.background = sc[band];
    set('g-' + p + '-t', '<b style="color:' + sc[band] + '">' + need.toFixed(1) + ' heads</b> of ' + avail.toFixed(0) + ' available · ' + Math.round(hrs).toLocaleString() + ' hrs · ' + load.toFixed(0) + '% loaded');
  };
  g('field', c.fLoad, c.fieldNeed, c.fieldAvail, c.fieldHrs);
  g('shop', c.sLoad, c.shopNeed, c.shopAvail, c.shopHrs);
  let rem;
  if (c.overall !== 'ok') {
    const worst = c.fLoad >= c.sLoad ? 'Field crew' : 'Fab shop';
    const load = Math.max(c.fLoad, c.sLoad);
    const weeksNeeded = Math.ceil(c.weeks * load / 85);
    const otNeeded = Math.min(25, Math.ceil((load / 85 - 1) * 100));
    rem = '<div class="bm-remedy" style="border-left-color:' + sc[c.overall] + '"><b>' + worst + ' is the constraint at ' + load.toFixed(0) + '% of available heads.</b> Get back inside the 85% guardrail: extend to <b>' + weeksNeeded + ' weeks</b>, raise OT to about <b>' + otNeeded + '%</b> (adds ' + fmtK((c.shopLab + c.fieldLab) * 0.5 * otNeeded / (100 + otNeeded)) + ' labor premium), or free crews from current backlog before committing this schedule.</div>';
  } else {
    rem = '<div class="bm-remedy" style="border-left-color:#2f9e6e"><b>Staffable as modeled.</b> ' + c.fieldNeed.toFixed(0) + ' field + ' + c.shopNeed.toFixed(0) + ' shop heads over ' + c.weeks + ' weeks sits inside the 85% guardrail of uncommitted capacity — the margin above is not being bought with crews we do not have.</div>';
  }
  set('bm-remedy', rem);
  const comp = [
    ['Material + escalation', c.material + c.esc$, '#14283c'],
    ['Shop labor', c.shopLab, '#5b6472'],
    ['Field labor', c.fieldLab, '#8a93a1'],
    ['Subs & equipment', c.subs + c.equip, 'var(--color-amber)'],
    ['Overhead', c.oh, '#cf4a57'],
    ['Profit' + (c.profit < 0 ? ' (negative)' : ''), Math.max(0, c.profit), '#2f9e6e'],
    ['Bond · GL · contingency', Math.max(0, c.client - c.sellSub), '#b98a36'],
  ];
  const mx = Math.max(...comp.map(x => x[1]), 1);
  set('bm-comp', comp.map(x => '<span>' + x[0] + '</span><div class="bar"><i style="width:' + (x[1] / mx * 100) + '%;background:' + x[2] + '"></i></div><b>' + fmtK(x[1]) + ' · ' + (x[1] / c.client * 100).toFixed(1) + '%</b>').join(''));
  try { localStorage.setItem('msm-bidmodel-state', JSON.stringify(M)); } catch (e) {}
}
buildShell();
</script>
