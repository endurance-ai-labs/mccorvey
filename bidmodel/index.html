<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjustable Bid Modeler — MSM Operations Portal</title>
<meta name="description" content="McCorvey Sheet Metal — type-in bid sheet: every change reprices cost to client, cost to McCorvey and profit instantly, with a manpower check and same-page bid confirmation. Demo environment, fictional data.">
<link rel="icon" type="image/png" href="/mccorvey/assets/brand/mccorvey-mark.png">
<link rel="stylesheet" href="/mccorvey/css/theme.css?v=20261007d">
<link rel="stylesheet" href="/mccorvey/css/demo.css?v=20261007d">
<link rel="stylesheet" href="/mccorvey/css/mccorvey.css?v=20261007d">
<style>
  /* ---------- summary bar ---------- */
  .bs-roll { position: sticky; z-index: 60; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 12px 0 10px; background: var(--color-bg); }
  .bs-tile { border-radius: 14px; padding: 17px 22px 15px; background: var(--color-bg-2); border: 1px solid var(--color-border); border-top: 4px solid var(--color-slate-hint); box-shadow: var(--shadow-md); min-width: 0; }
  .bs-tile .l { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--color-slate-hint); margin-bottom: 8px; text-transform: uppercase; }
  .bs-tile .v { font-size: clamp(26px, 2.4vw, 34px); font-weight: 800; letter-spacing: -.02em; color: var(--color-cloud-whisper); line-height: 1.02; font-variant-numeric: tabular-nums; }
  .bs-tile .s { font-size: 11.5px; color: var(--color-text-muted); margin-top: 8px; line-height: 1.6; }
  .bs-tile.client { border-top-color: #14283c; } .bs-tile.cost { border-top-color: var(--color-amber); }
  .bs-tile.ok { border-top-color: #2f9e6e; } .bs-tile.watch, .bs-tile.tight { border-top-color: var(--color-amber); } .bs-tile.bad, .bs-tile.over { border-top-color: #c8102e; }

  /* ---------- pricing toolbar ---------- */
  .bs-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; margin: 6px 0 16px; }
  .bs-solve { display: flex; align-items: center; gap: 8px; background: var(--color-bg-2); border: 1px solid var(--color-border); border-radius: 12px; padding: 8px 10px 8px 14px; }
  .bs-solve label { font-size: 10px; font-weight: 800; letter-spacing: .09em; color: var(--color-slate-hint); text-transform: uppercase; white-space: nowrap; }
  .bs-solve input { width: 132px; font: inherit; font-size: 14px; font-weight: 800; text-align: right; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--color-border); background: var(--color-bg-3); color: var(--color-cloud-whisper); outline: none; font-variant-numeric: tabular-nums; }
  .bs-solve input:focus { border-color: var(--color-blue); }
  .bs-solve .pa-btn { height: 34px; }
  .bs-status { display: inline-flex; align-items: center; gap: 8px; height: 42px; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; padding: 0 14px; border-radius: 12px; border: 1px solid var(--color-border); background: var(--color-bg-2); color: var(--color-text-muted); }
  .bs-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--color-amber); }
  .bs-status.done i { background: #2f9e6e; }

  /* ---------- the bid sheet (spreadsheet-style) ---------- */
  .bs-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-bg-2); }
  table.bs { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; min-width: 1240px; table-layout: fixed; }
  table.bs th { position: sticky; top: 0; background: #14283c; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; padding: 10px 7px; text-align: right; white-space: normal; line-height: 1.25; vertical-align: bottom; }
  table.bs th.l, table.bs td.l { text-align: left; }
  table.bs th.grp-cost { background: #3a4a5c; } table.bs th.grp-client { background: #7a1420; }
  table.bs td { padding: 5px 6px; border-bottom: 1px solid var(--color-border-soft); text-align: right; color: var(--color-cloud-whisper); font-variant-numeric: tabular-nums; vertical-align: middle; white-space: nowrap; }
  table.bs tr:hover td { background: var(--color-bg-3); }
  table.bs td.calc { color: var(--color-text-muted); }
  table.bs td.strong { font-weight: 800; color: var(--color-cloud-whisper); }
  table.bs td.client { background: rgba(200,16,46,.035); }
  table.bs tr:hover td.client { background: rgba(200,16,46,.07); }
  .cell { width: 100%; min-width: 0; font: inherit; font-size: 12.5px; font-weight: 700; text-align: right; padding: 7px 8px; border-radius: 7px; border: 1px solid transparent; background: var(--color-bg-3); color: var(--color-cloud-whisper); outline: none; font-variant-numeric: tabular-nums; }
  .cell:hover { border-color: var(--color-border); }
  .cell:focus { border-color: var(--color-blue); background: var(--color-bg-2); box-shadow: 0 0 0 3px rgba(200,16,46,.12); }
  .cell.txt { text-align: left; font-weight: 600; }
  .cell.unit { text-align: center; }
  .cell.mk { color: #7a1420; }
  .cell.dflt { color: var(--color-slate-hint); font-weight: 600; }
  .cell:disabled { background: transparent; border-color: transparent; color: var(--color-cloud-whisper); cursor: default; }
  .bs-total td { font-weight: 800; background: var(--color-bg-3) !important; border-top: 2px solid var(--color-border); font-size: 13px; }
  .bs-x { border: none; background: none; color: var(--color-slate-hint); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  .bs-x:hover { color: #c8102e; background: rgba(200,16,46,.08); }
  .bs-mg { display: inline-block; min-width: 50px; font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-align: center; }
  .bs-mg.ok { color: #2f9e6e; background: var(--color-green-bg); } .bs-mg.watch { color: var(--color-amber); background: var(--color-amber-bg); } .bs-mg.bad { color: #c8102e; background: var(--color-red-bg); }
  .bs-hint { font-size: 11px; color: var(--color-slate-hint); margin-top: 9px; line-height: 1.6; }
  .bs-hint kbd { font: inherit; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--color-border); background: var(--color-bg-3); color: var(--color-text-muted); }

  /* ---------- settings grids (no sliders) ---------- */
  .bs-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
  .bs-f { display: flex; flex-direction: column; gap: 5px; }
  .bs-f > span { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--color-slate-hint); text-transform: uppercase; }
  .bs-f > span i { font-style: normal; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--color-slate-hint); }
  .bs-step { display: flex; align-items: stretch; border: 1px solid var(--color-border); border-radius: 9px; overflow: hidden; background: var(--color-bg-3); }
  .bs-step button { width: 32px; border: none; background: transparent; color: var(--color-text-muted); font-size: 15px; font-weight: 700; cursor: pointer; }
  .bs-step button:hover { background: var(--color-bg-2); color: var(--color-blue); }
  .bs-step input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 13px; font-weight: 800; text-align: center; color: var(--color-cloud-whisper); outline: none; padding: 8px 4px; font-variant-numeric: tabular-nums; }
  .bs-step em { font-style: normal; font-size: 10px; font-weight: 700; color: var(--color-slate-hint); align-self: center; padding-right: 9px; }
  .bs-step:focus-within { border-color: var(--color-blue); }

  /* ---------- manpower ---------- */
  .bs-gauge { margin-top: 14px; }
  .bs-gauge .gh { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--color-text-muted); margin-bottom: 6px; flex-wrap: wrap; }
  .bs-gauge .gh b { color: var(--color-cloud-whisper); }
  .bs-gauge .track { height: 18px; border-radius: 99px; background: var(--color-bg-3); position: relative; overflow: hidden; }
  .bs-gauge .track i { display: block; height: 100%; border-radius: 99px; transition: width .18s ease; }
  .bs-gauge .track .cap { position: absolute; top: -3px; bottom: -3px; left: 85%; width: 2.5px; background: var(--color-cloud-whisper); opacity: .55; }
  .bs-note { border: 1px solid var(--color-border); border-left: 4px solid #2f9e6e; border-radius: 10px; padding: 11px 14px; font-size: 12px; line-height: 1.6; color: var(--color-text-muted); background: var(--color-bg-3); margin-top: 14px; }
  .bs-note b { color: var(--color-cloud-whisper); }

  /* ---------- confirmed bid document ---------- */
  .cdoc { background: #fff; color: #1b2230; border: 1px solid var(--color-border); border-radius: 14px; padding: 34px 38px 30px; box-shadow: var(--shadow-md); }
  .cdoc-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; border-bottom: 3px solid #14283c; padding-bottom: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .cdoc-head img { height: 44px; }
  .cdoc-head .co { font-size: 10.5px; color: #5b6472; line-height: 1.6; margin-top: 6px; }
  .cdoc-meta { text-align: right; font-size: 11.5px; color: #5b6472; line-height: 1.7; }
  .cdoc-meta b { color: #14283c; }
  .cdoc-title { font-size: 20px; font-weight: 800; color: #14283c; letter-spacing: -.01em; margin-bottom: 4px; }
  .cdoc-sub { font-size: 12px; color: #5b6472; margin-bottom: 16px; }
  table.cdoc-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.cdoc-tbl th { text-align: right; font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: #fff; background: #14283c; padding: 9px 10px; }
  table.cdoc-tbl th.l, table.cdoc-tbl td.l { text-align: left; }
  table.cdoc-tbl td { padding: 8px 10px; border-bottom: 1px solid #e7eaf0; text-align: right; font-variant-numeric: tabular-nums; }
  table.cdoc-tbl tr.sub td { font-weight: 700; border-top: 1px solid #c9ced8; }
  table.cdoc-tbl tr.grand td { font-weight: 800; font-size: 14px; color: #14283c; background: #f3f5f9; border-top: 2px solid #14283c; }
  .cdoc-terms { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; font-size: 11px; color: #5b6472; line-height: 1.65; }
  .cdoc-terms b { display: block; color: #14283c; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 4px; }
  .cdoc-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 26px; }
  .cdoc-sign div { border-top: 1px solid #1b2230; padding-top: 6px; font-size: 10.5px; color: #5b6472; }
  .cdoc-int { margin-top: 16px; border: 1px dashed var(--color-border); border-radius: 12px; padding: 13px 16px; background: var(--color-bg-3); }
  .rev-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--color-border); border-radius: 10px; padding: 7px 12px; font-size: 11px; color: var(--color-text-muted); background: var(--color-bg-2); cursor: pointer; }
  .rev-chip b { color: var(--color-cloud-whisper); }
  .rev-chip.on { border-color: #14283c; box-shadow: inset 0 0 0 1px #14283c; }

  @media (max-width: 1280px) { .bs-roll { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 960px) { .bs-roll { position: static; } .cdoc-terms, .cdoc-sign { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .bs-roll { grid-template-columns: 1fr; } .cdoc { padding: 22px 18px; } }
  @media print {
    body * { visibility: hidden !important; }
    #cdoc, #cdoc * { visibility: visible !important; }
    #cdoc { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="page">
  <div class="demo-wrap" id="app"></div>
</main>

<script src="/mccorvey/js/data.js?v=20261007d"></script>
<script src="/mccorvey/js/util.js?v=20261007d"></script>
<script src="/mccorvey/js/nav.js?v=20261007d"></script>
<script src="/mccorvey/js/mccorvey-brain.js?v=20261007d" defer></script>
<script>
if (!isSignedIn() && !location.search.includes('enter')) location.replace('/mccorvey/welcome/');
McCorveyNav.renderTopbar({ subtitle: 'Preconstruction — Adjustable Bid Modeler' });

/* =====================================================================
   BID SHEET MODEL
   Each line: qty × (material + shop hrs × shop rate + field hrs × field rate)
   = cost to McCorvey; × (1 + markup) = sell. Markup per line (blank = default).
   Bond / GL / contingency ride on the sell subtotal → cost to client.
   ===================================================================== */
const KEY_STATE = 'msm-bidsheet-v3', KEY_REVS = 'msm-bidsheet-revs-v3';
const FIELD_POOL = 340, SHOP_POOL = 580, UTIL = 0.9, HRSWK = 40, TARGET = 13, FLOOR = 11;

const DEFAULT_STATE = {
  meta: { project: 'Memorial City Medical Office Tower — HVAC Ductwork', gc: 'Harmon Construction', bidNo: 'MSM-2026-1214', due: '2026-10-21' },
  g: { shopRate: 62, fieldRate: 78, escPct: 1.0, defMkup: 15.5, ohPct: 6.0, bondPct: 1.0, glPct: 0.85, contPct: 0.5,
       weeks: 40, otPct: 0, fieldCommitPct: 78, shopCommitPct: 82 },
  lines: [
    { scope: 'Rectangular duct — galvanized, per SMACNA', unit: 'lbs', qty: 1420000, mat: 0.72, shopUPH: 75, fieldUPH: 42, mkup: null },
    { scope: 'Spiral & round duct', unit: 'LF', qty: 38000, mat: 9.40, shopUPH: 9, fieldUPH: 6.5, mkup: null },
    { scope: 'Welded stainless exhaust — NFPA 96', unit: 'LF', qty: 2100, mat: 46, shopUPH: 1.6, fieldUPH: 2.2, mkup: null },
    { scope: 'Air devices (GRDs) — furnish & install', unit: 'ea', qty: 2140, mat: 74, shopUPH: 0, fieldUPH: 1.43, mkup: null },
    { scope: 'Fire/smoke dampers & accessories', unit: 'ea', qty: 480, mat: 410, shopUPH: 0, fieldUPH: 0.5, mkup: null },
    { scope: 'Duct liner & external wrap (insulation sub)', unit: 'LS', qty: 1, mat: 290000, shopUPH: 0, fieldUPH: 0, mkup: 8 },
    { scope: 'Rigging, lifts & equipment', unit: 'LS', qty: 1, mat: 180000, shopUPH: 0, fieldUPH: 0, mkup: null },
  ],
  status: 'draft',
};
let S = JSON.parse(JSON.stringify(DEFAULT_STATE));
try { const sv = JSON.parse(localStorage.getItem(KEY_STATE) || 'null'); if (sv && sv.lines) S = sv; } catch (e) {}
function revsAll() { try { return JSON.parse(localStorage.getItem(KEY_REVS) || '[]'); } catch (e) { return []; } }
let viewRev = null;   /* index of the revision shown in the confirmed panel */

/* ---------------- calc ---------------- */
function lineCalc(l) {
  const G = S.g;
  const em = 1 + G.escPct / 100;
  const otX = 1 + (G.otPct / (100 + G.otPct)) * 0.5;
  const shopH = l.shopUPH > 0 ? l.qty / l.shopUPH : 0;
  const fieldH = l.fieldUPH > 0 ? l.qty / l.fieldUPH : 0;
  const mat = l.qty * l.mat * em, shop = shopH * G.shopRate * otX, field = fieldH * G.fieldRate * otX;
  const cost = mat + shop + field;
  const mk = l.mkup != null ? l.mkup : G.defMkup;
  const sell = cost * (1 + mk / 100);
  const oh = cost * G.ohPct / 100;
  const profit = sell - cost - oh;
  return { shopH, fieldH, mat, shop, field, cost, unitCost: l.qty ? cost / l.qty : 0, mk, sell, unitSell: l.qty ? sell / l.qty : 0, oh, profit, margin: sell ? (sell - cost) / sell * 100 : 0 };
}
function totals() {
  const G = S.g;
  const L = S.lines.map(lineCalc);
  const sum = k => L.reduce((a, x) => a + x[k], 0);
  const cost = sum('cost'), sell = sum('sell'), oh = sum('oh'), profit = sum('profit'), shopH = sum('shopH'), fieldH = sum('fieldH'), mat = sum('mat'), lab = sum('shop') + sum('field');
  const a = (G.bondPct + G.glPct + G.contPct) / 100;
  const addons = sell * a, cont$ = sell * G.contPct / 100;
  const client = sell + addons;
  const margin = client ? (sell - cost + cont$) / client * 100 : 0;
  const sFloor = cost / Math.max(0.05, (1 + G.contPct / 100) - FLOOR / 100 * (1 + a));
  const floor$ = sFloor * (1 + a);
  const weeks = Math.max(4, G.weeks);
  const hpw = weeks * HRSWK * UTIL * (1 + G.otPct / 100);
  const fieldNeed = fieldH / hpw, shopNeed = shopH / hpw;
  const fieldAvail = FIELD_POOL * (1 - G.fieldCommitPct / 100), shopAvail = SHOP_POOL * (1 - G.shopCommitPct / 100);
  const fLoad = fieldNeed / Math.max(0.1, fieldAvail) * 100, sLoad = shopNeed / Math.max(0.1, shopAvail) * 100;
  const st = l => l <= 85 ? 'ok' : l <= 100 ? 'tight' : 'over';
  return { L, cost, sell, oh, profit, mat, lab, shopH, fieldH, addons, cont$, client, margin, floor$, a,
           weeks, fieldNeed, shopNeed, fieldAvail, shopAvail, fLoad, sLoad, fSt: st(fLoad), sSt: st(sLoad), mp: st(Math.max(fLoad, sLoad)) };
}
const band = m => m >= TARGET ? 'ok' : m >= FLOOR ? 'watch' : 'bad';

/* ---------------- solvers: type a target, markups move ---------------- */
function applyUniformDelta(dPct) { S.lines.forEach(l => { l.mkup = Math.round(((l.mkup != null ? l.mkup : S.g.defMkup) + dPct) * 100) / 100; }); }
function solveSell(sellReq) { const T = totals(); if (T.cost <= 0) return; applyUniformDelta((sellReq - T.sell) / T.cost * 100); }
function bidAtPrice(v) { const X = num(v); if (!(X > 0)) return; solveSell(X / (1 + totals().a)); syncInputs(); refresh(); }
function bidAtMargin(v) { const m = num(v); if (!(m > 0 && m < 60)) return; const T = totals(), c = S.g.contPct / 100; solveSell(T.cost / ((1 + c) - m / 100 * (1 + T.a))); syncInputs(); refresh(); }
function nudgeAll(d) { applyUniformDelta(d); syncInputs(); refresh(); }
function roundTotal(step) { const T = totals(); bidAtPrice(Math.round(T.client / step) * step); }
function resetMarkups() { S.lines.forEach(l => { l.mkup = null; }); syncInputs(); refresh(); }

/* ---------------- formatting / parsing ---------------- */
const num = v => { const n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return isFinite(n) ? n : 0; };
const fmtN = (n, d) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d == null ? 2 : d });
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const money2 = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const FIELD_DEC = { qty: 0, mat: 2, shopUPH: 2, fieldUPH: 2, mkup: 2 };
const fmtF = (f, v) => f === 'mat' ? fmtN(v, v >= 1000 ? 0 : 2) : (f === 'shopUPH' || f === 'fieldUPH' || f === 'mkup') ? fmtN(v) : fmtN(v, FIELD_DEC[f]);
const moneyU = n => Math.abs(n) >= 1000 ? money(n) : money2(n);
const locked = () => S.status === 'confirmed';

/* ---------------- render ---------------- */
const app = $('#app');
function stepField(key, label, unit, step, hint) {
  return `<label class="bs-f"><span>${label}${hint ? ' <i>' + hint + '</i>' : ''}</span>
    <div class="bs-step"><button type="button" onclick="stepG('${key}',-${step})" ${locked() ? 'disabled' : ''}>−</button>
      <input data-g="${key}" value="${fmtN(S.g[key])}" inputmode="decimal" ${locked() ? 'disabled' : ''}>
      <em>${unit}</em><button type="button" onclick="stepG('${key}',${step})" ${locked() ? 'disabled' : ''}>+</button></div></label>`;
}
function rowsHTML() {
  const dis = locked() ? 'disabled' : '';
  return S.lines.map((l, i) => `
    <tr>
      <td class="l" style="color:var(--color-slate-hint);font-weight:700">${i + 1}</td>
      <td class="l"><input class="cell txt" data-i="${i}" data-f="scope" value="${esc(l.scope)}" ${dis}></td>
      <td><input class="cell" data-i="${i}" data-f="qty" value="${fmtN(l.qty, 0)}" inputmode="decimal" ${dis}></td>
      <td><input class="cell unit" data-i="${i}" data-f="unit" value="${esc(l.unit)}" ${dis}></td>
      <td><input class="cell" data-i="${i}" data-f="mat" value="${fmtF('mat', l.mat)}" inputmode="decimal" ${dis} title="Material $ per unit (escalation applied in settings)"></td>
      <td><input class="cell" data-i="${i}" data-f="shopUPH" value="${fmtF('shopUPH', l.shopUPH)}" inputmode="decimal" ${dis} title="Shop productivity — units per man-hour (0 = no shop labor)"></td>
      <td><input class="cell" data-i="${i}" data-f="fieldUPH" value="${fmtF('fieldUPH', l.fieldUPH)}" inputmode="decimal" ${dis} title="Field productivity — units per man-hour (0 = no field labor)"></td>
      <td class="calc" id="o-${i}-uc">—</td>
      <td class="strong" id="o-${i}-cost">—</td>
      <td class="client"><input class="cell mk ${l.mkup == null ? 'dflt' : ''}" data-i="${i}" data-f="mkup" value="${l.mkup == null ? '' : fmtF('mkup', l.mkup)}" placeholder="${fmtN(S.g.defMkup, 1)}" inputmode="decimal" ${dis} title="Markup % on cost — blank uses the default"></td>
      <td class="client calc" id="o-${i}-us">—</td>
      <td class="client strong" id="o-${i}-sell">—</td>
      <td class="client" id="o-${i}-profit">—</td>
      <td class="client" id="o-${i}-mg">—</td>
      <td>${locked() ? '' : `<button class="bs-x" onclick="delLine(${i})" title="Remove line">✕</button>`}</td>
    </tr>`).join('');
}
function render() {
  const revs = revsAll();
  const nextRev = String.fromCharCode(65 + revs.length);
  app.innerHTML = `
  <div class="demo-hero" style="padding-bottom:6px">
    <div>
      <div class="demo-eyebrow">PRECONSTRUCTION · BID SHEET</div>
      <h1>Adjustable <em>Bid Modeler</em></h1>
      <div class="sub">Type it like a spreadsheet. Every quantity, unit cost, productivity or markup you change reprices <b>cost to client</b>, <b>cost to McCorvey</b> and <b>profit</b> instantly — and the crew check runs on the same hours. Type a price or a margin and the markups solve themselves. Confirm the bid right here when it's done.</div>
    </div>
    <div class="demo-hero-right">

/* ---------------- live refresh (no re-render → typing never loses focus) ---------------- */
const BC = { ok: '#2f9e6e', watch: 'var(--color-amber)', bad: '#c8102e', tight: 'var(--color-amber)', over: '#c8102e' };
function setH(id, v) { const el = document.getElementById(id); if (el) el.innerHTML = v; }
function refresh() {
  const T = totals();
  T.L.forEach((c, i) => {
    setH('o-' + i + '-uc', moneyU(c.unitCost));
    setH('o-' + i + '-cost', money(c.cost));
    setH('o-' + i + '-us', moneyU(c.unitSell));
    setH('o-' + i + '-sell', money(c.sell));
    setH('o-' + i + '-profit', `<span style="color:${c.profit < 0 ? '#c8102e' : 'inherit'}">${money(c.profit)}</span>`);
    setH('o-' + i + '-mg', `<span class="bs-mg ${band(c.margin)}">${c.margin.toFixed(1)}%</span>`);
    const mk = document.querySelector(`input[data-i="${i}"][data-f="mkup"]`); if (mk) mk.placeholder = fmtN(S.g.defMkup, 1);
  });
  const blended = T.cost ? (T.sell / T.cost - 1) * 100 : 0;
  setH('f-cost', money(T.cost)); setH('f-mk', blended.toFixed(1) + '%'); setH('f-sell', money(T.sell));
  setH('f-profit', `<span style="color:${T.profit < 0 ? '#c8102e' : 'inherit'}">${money(T.profit)}</span>`);
  setH('f-mg', `<span class="bs-mg ${band(T.margin)}">${T.margin.toFixed(1)}%</span>`);
  setH('f-addons', money(T.addons)); setH('f-client', money(T.client));
  /* tiles */
  setH('t-client', fmtK(T.client));
  setH('t-client-s', money(T.client) + '<br>walk-away floor <b>' + fmtK(T.floor$) + '</b> at ' + FLOOR + '% margin');
  setH('t-cost', fmtK(T.cost));
  setH('t-cost-s', 'material ' + fmtK(T.mat) + ' · labor ' + fmtK(T.lab) + '<br>' + Math.round(T.shopH + T.fieldH).toLocaleString() + ' man-hours');
  setH('t-profit', fmtK(T.profit + T.oh));
  setH('t-profit-s', 'margin <b>' + T.margin.toFixed(1) + '%</b> · target ' + TARGET + '%<br>profit ' + fmtK(T.profit) + ' · overhead ' + fmtK(T.oh) + (T.profit < 0 ? ' · <b style="color:#c8102e">UNDERWATER</b>' : ''));
  document.getElementById('t-profit-tile').className = 'bs-tile ' + band(T.margin);
  setH('t-mp', T.mp === 'ok' ? 'STAFFABLE' : T.mp === 'tight' ? 'TIGHT' : 'OVER CAPACITY');
  setH('t-mp-s', 'field <b>' + T.fieldNeed.toFixed(0) + '</b> of ' + T.fieldAvail.toFixed(0) + ' available · shop <b>' + T.shopNeed.toFixed(0) + '</b> of ' + T.shopAvail.toFixed(0) + '<br>' + T.weeks + ' weeks' + (S.g.otPct ? ' · ' + S.g.otPct + '% OT' : ''));
  document.getElementById('t-mp-tile').className = 'bs-tile ' + T.mp;
  /* gauges */
  const gauge = (k, load, need, avail, hrs) => {
    const b = load <= 85 ? 'ok' : load <= 100 ? 'tight' : 'over';
    const i = document.getElementById('g-' + k + '-i'); if (i) { i.style.width = Math.min(100, load) + '%'; i.style.background = BC[b]; }
    setH('g-' + k, '<b style="color:' + BC[b] + '">' + need.toFixed(1) + ' heads</b> of ' + avail.toFixed(0) + ' available · ' + Math.round(hrs).toLocaleString() + ' hrs · ' + load.toFixed(0) + '%');
  };
  gauge('field', T.fLoad, T.fieldNeed, T.fieldAvail, T.fieldH);
  gauge('shop', T.sLoad, T.shopNeed, T.shopAvail, T.shopH);
  const note = document.getElementById('mp-note');
  if (note) {
    if (T.mp === 'ok') { note.style.borderLeftColor = '#2f9e6e'; note.innerHTML = '<b>Staffable as bid.</b> ' + T.fieldNeed.toFixed(0) + ' field + ' + T.shopNeed.toFixed(0) + ' shop heads over ' + T.weeks + ' weeks stays inside the 85% line on uncommitted crews.'; }
    else {
      const load = Math.max(T.fLoad, T.sLoad), who = T.fLoad >= T.sLoad ? 'Field crew' : 'Fab shop';
      const wk = Math.ceil(T.weeks * load / 85), ot = Math.min(25, Math.ceil((load / 85 - 1) * 100));
      note.style.borderLeftColor = BC[T.mp];
      note.innerHTML = '<b>' + who + ' at ' + load.toFixed(0) + '% of available heads.</b> To staff it: extend to <b>' + wk + ' weeks</b>, or carry about <b>' + ot + '% OT</b> (the sheet reprices labor at 1.5× automatically), or free crews from backlog before you commit this schedule.';
    }
  }
  /* composition */
  const comp = [['Material', T.mat, '#14283c'], ['Labor', T.lab, '#6b7685'], ['Overhead', T.oh, '#cf4a57'], ['Profit', Math.max(0, T.profit), '#2f9e6e'], ['Bond · GL · contingency', T.addons, '#b98a36']];
  setH('bs-comp', '<div style="display:flex;height:16px;border-radius:99px;overflow:hidden">' + comp.map(c => `<i title="${c[0]}" style="display:block;width:${(c[1] / T.client * 100).toFixed(2)}%;background:${c[2]}"></i>`).join('') + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px;font-size:11px;color:var(--color-text-muted)">' + comp.map(c => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c[2]};margin-right:5px;vertical-align:-1px"></i>${c[0]} <b style="color:var(--color-cloud-whisper)">${fmtK(c[1])}</b> · ${(c[1] / T.client * 100).toFixed(1)}%</span>`).join('') + '</div>');
  /* live delta vs last confirmed rev while revising */
  const revs = revsAll();
  const dl = document.getElementById('rev-delta');
  if (dl && revs.length && !locked()) {
    const R = revs[revs.length - 1].totals, d = T.client - R.client;
    dl.innerHTML = `Revising from <b>Rev ${revs[revs.length - 1].rev}</b>: price <b style="color:${d >= 0 ? '#2f9e6e' : '#c8102e'}">${d >= 0 ? '+' : '−'}${fmtK(Math.abs(d))}</b> · margin ${R.margin.toFixed(1)}% → <b>${T.margin.toFixed(1)}%</b> · profit ${fmtK(R.profit + R.oh)} → <b>${fmtK(T.profit + T.oh)}</b>`;
  }
  try { localStorage.setItem(KEY_STATE, JSON.stringify(S)); } catch (e) {}
}

/* ---------------- edit plumbing ---------------- */
function syncInputs() {
  document.querySelectorAll('input[data-f]').forEach(inp => {
    if (inp === document.activeElement) return;
    const l = S.lines[+inp.dataset.i]; const f = inp.dataset.f; if (!l) return;
    if (f === 'mkup') { inp.value = l.mkup == null ? '' : fmtF('mkup', l.mkup); inp.classList.toggle('dflt', l.mkup == null); }
    else if (f in FIELD_DEC) inp.value = fmtF(f, l[f]);
  });
  document.querySelectorAll('input[data-g]').forEach(inp => { if (inp !== document.activeElement) inp.value = fmtN(S.g[inp.dataset.g]); });
}
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f != null) {
    const l = S.lines[+t.dataset.i], f = t.dataset.f;
    if (f === 'scope' || f === 'unit') l[f] = t.value;
    else if (f === 'mkup') { l.mkup = t.value.trim() === '' ? null : num(t.value); t.classList.toggle('dflt', l.mkup == null); }
    else l[f] = num(t.value);
    refresh();
  } else if (t.dataset.g != null) { S.g[t.dataset.g] = num(t.value); refresh(); }
  else if (t.dataset.m != null) { S.meta[t.dataset.m] = t.value; refresh(); }
});
app.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset.f != null && t.dataset.f in FIELD_DEC) { const l = S.lines[+t.dataset.i]; if (t.dataset.f === 'mkup' && l.mkup == null) return; t.value = fmtF(t.dataset.f, l[t.dataset.f]); }
  if (t.dataset.g != null) t.value = fmtN(S.g[t.dataset.g]);
});
app.addEventListener('keydown', e => {
  const t = e.target;
  if (!(t.classList && (t.classList.contains('cell')))) return;
  const f = t.dataset.f;
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && f in FIELD_DEC) {
    e.preventDefault();
    const l = S.lines[+t.dataset.i];
    const base = { qty: Math.max(1, Math.pow(10, Math.floor(Math.log10(Math.max(1, l.qty))) - 2)), mat: 0.01, shopUPH: 0.5, fieldUPH: 0.5, mkup: 0.5 }[f];
    const step = base * (e.shiftKey ? 10 : 1) * (e.key === 'ArrowUp' ? 1 : -1);
    const cur = f === 'mkup' ? (l.mkup != null ? l.mkup : S.g.defMkup) : l[f];
    l[f] = Math.max(0, Math.round((cur + step) * 10000) / 10000);
    t.value = fmtF(f, l[f]); if (f === 'mkup') t.classList.remove('dflt');
    refresh();
  } else if (e.key === 'Enter' && f != null) {
    e.preventDefault();
    const next = document.querySelector(`input[data-i="${+t.dataset.i + 1}"][data-f="${f}"]`);
    if (next) { next.focus(); next.select(); } else t.blur();
  }
});
app.addEventListener('focusin', e => { const t = e.target; if (t.classList && t.classList.contains('cell') && t.dataset.f !== 'scope') setTimeout(() => t.select(), 0); });
function stepG(k, d) { S.g[k] = Math.max(0, Math.round((S.g[k] + d) * 1000) / 1000); syncInputs(); refresh(); }
function addLine() { S.lines.push({ scope: 'New scope item', unit: 'LS', qty: 1, mat: 0, shopUPH: 0, fieldUPH: 0, mkup: null }); render(); const n = document.querySelector(`input[data-i="${S.lines.length - 1}"][data-f="scope"]`); if (n) { n.focus(); n.select(); } }
function delLine(i) { S.lines.splice(i, 1); render(); }

  });

          ${R.lines.map((l, i) => `<tr><td class="l">${i + 1}</td><td class="l">${esc(l.scope)}</td><td>${fmtN(l.qty, 0)}</td><td class="l">${esc(l.unit)}</td><td>${moneyU(l.unitSell)}</td><td>${money(l.sell)}</td></tr>`).join('')}
          <tr class="sub"><td></td><td class="l">Subtotal</td><td colspan="3"></td><td>${money(T.sell)}</td></tr>
          <tr><td></td><td class="l">Payment &amp; performance bond, GL insurance &amp; contingency</td><td colspan="3"></td><td>${money(T.addons)}</td></tr>
          <tr class="grand"><td></td><td class="l">BASE BID</td><td colspan="3"></td><td>${money(T.client)}</td></tr>
        </tbody>
      </table>
      <div class="cdoc-terms">
        <div><b>Inclusions</b>Detailing &amp; LOD 400 coordination, fabrication at McCorvey plants, delivery, installation, hangers &amp; supports, TAB support. Quantities per the bid documents and addenda as reviewed.</div>
        <div><b>Exclusions &amp; terms</b>HVAC equipment, controls, electrical, TAB (by others), painting of exposed duct. Progress billing monthly via AIA G702/G703, 5% retainage. Steel surcharge applies after validity.</div>
      </div>
      <div class="cdoc-sign"><div>McCorvey Sheet Metal Works, L.P. — authorized signature &amp; date</div><div>${esc(R.meta.gc)} — acceptance &amp; date</div></div>
    </div>
    <div class="cdoc-int">
      <div style="font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--color-slate-hint);margin-bottom:8px">INTERNAL — NOT ON THE CUSTOMER COPY</div>
      <div class="ykpi-row" style="margin:0">
        <div class="ykpi"><div class="l">Cost to McCorvey</div><div class="v">${fmtK(T.cost)}</div><div class="s">${Math.round(T.hours).toLocaleString()} man-hours</div></div>
        <div class="ykpi ${T.margin >= TARGET ? 'green' : T.margin >= FLOOR ? 'amber' : 'red'}"><div class="l">Profit + OH · Margin</div><div class="v">${fmtK(T.profit + T.oh)}</div><div class="s">${T.margin.toFixed(1)}% margin${prev ? ' · was ' + prev.margin.toFixed(1) + '% at Rev ' + revs[viewRev - 1].rev : ''}</div></div>
        <div class="ykpi"><div class="l">Crews Committed</div><div class="v" style="color:${BC[T.mp]}">${T.mp === 'ok' ? 'STAFFABLE' : T.mp.toUpperCase()}</div><div class="s">${T.fieldNeed.toFixed(0)} field · ${T.shopNeed.toFixed(0)} shop · ${T.weeks} wks</div></div>
        <div class="ykpi"><div class="l">Confirmed By</div><div class="v" style="font-size:15px;line-height:1.4">${esc(R.by)}</div><div class="s">${esc(R.ts)}</div></div>
      </div>
    </div>
  </div>`;
  refresh();
}

/* dock the summary bar under the portal's sticky header */
function dock() {
  const roll = document.getElementById('bs-roll'), sub = document.querySelector('.section-subnav');
  if (roll && sub) roll.style.top = ((parseFloat(getComputedStyle(sub).top) || 0) + sub.getBoundingClientRect().height) + 'px';
}
window.addEventListener('resize', dock);
render();
</script>
</body>
</html>
