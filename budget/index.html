<script>
McCorveyNav.renderTopbar({ subtitle: 'Monthly Budget vs Actual' });
if (!McCorveyMode.isInternal() || !can('margins')) {
  $('#app').innerHTML = `<div class="demo-panel" style="margin-top:40px"><div class="demo-panel-head"><h2>Internal module</h2></div>
    <div class="ynote">Budgeting &amp; forecasting requires full financial access (Owner, CFO or Controller). Your current user does not have rights to this module.</div></div>`;
} else {
  buildForecast();
}

function buildForecast() {
/* =============================================================
   MSM BUDGETING & FORECASTING — CFO console
   T-3 / T-6 / T-12 trailing actuals → editable In-Place run-rate
   → Years 1-5 compounded monthly by a tiered growth schedule.
   ============================================================= */

/* ---- 24 months of division actuals (fictional, deterministic) ---- */
const MONTHS = [];
(function () {
  const start = new Date('2024-08-15T12:00:00');
  // seasonal profile + growth; data-center schedule accelerations Oct-Dec 24
  for (let i = 0; i < 24; i++) {
    const d = new Date(start); d.setMonth(d.getMonth() + i);
    const season = [0.92, 0.95, 1.06, 1.10, 1.02, 0.88, 0.90, 0.97, 1.04, 1.08, 1.10, 1.05][d.getMonth() % 12];
    const surge = (i >= 2 && i <= 4) ? 1.22 : 1;             // Oct-Dec 24 mission-critical accelerations
    const grow = Math.pow(1.006, i);
    const rev = 20500000 * season * surge * grow;
    const subs = rev * 0.40, labor = rev * 0.30, mat = rev * 0.09, equip = rev * 0.04;
    const m = {
      m: d.toISOString().slice(0, 7),
      revenue: rev,
      cost: { subs, labor, mat, equip },
      oh: { salaries: 985000 * Math.pow(1.004, i), office: 145000, insurance: 260000 * Math.pow(1.005, i), it: 60000, bd: 55000, vehicles: 165000, other: 72000 },
    };
    MONTHS.push(m);
  }
})();
const CK = ['subs', 'labor', 'mat', 'equip'];
const OK = ['salaries', 'office', 'insurance', 'it', 'bd', 'vehicles', 'other'];
const mLong = (ym) => { const d = new Date(ym + '-15T12:00:00'); return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }); };

/* ---- state ---- */
let asOf = MONTHS.length - 1;
let avbIdx = MONTHS.length - 1;   // Actual-vs-Budget month under review
const mFull = (ym) => new Date(ym + '-15T12:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
let fbasis = 12;
let view = 'annual';
let svcGrowth = 25;   // external fab volume growth %/yr (new Duct Direct accounts + program upgrades)
const A = { newAwards: 6.0, contingency: 1.0, tax: 21.0, distribution: 40.0 };  // ratio levers
const G = { rev: [{ f: 1, t: 60, r: 7.0 }], cost: [{ f: 1, t: 60, r: 6.5 }], oh: [{ f: 1, t: 60, r: 3.5 }] };
let ovrInplace = {};   // key -> override value (annual $)

function baseFrom(idx, win) {
  const w = MONTHS.slice(Math.max(0, idx - win + 1), idx + 1);
  const ann = 12 / w.length;
  const S = f => w.reduce((a, m) => a + f(m), 0) * ann;
  const b = { revenue: S(m => m.revenue) };
  CK.forEach(k => b['c_' + k] = S(m => m.cost[k]));
  OK.forEach(k => b['o_' + k] = S(m => m.oh[k]));
  return b;
}
let base = baseFrom(asOf, fbasis);
let inplace = Object.assign({}, base);

const rateAt = (list, m) => { for (let i = 0; i < list.length; i++) if (m >= list[i].f && m <= list[i].t) return list[i].r; return list[list.length - 1].r; };
let CUM = {};
function buildCum() {
  ['rev', 'cost', 'oh'].forEach(k => {
    const arr = [1];
    for (let m = 1; m <= 60; m++) arr[m] = arr[m - 1] * Math.pow(1 + (rateAt(G[k], m) || 0) / 100, 1 / 12);
    CUM[k] = arr;
  });
}
buildCum();

function derive(b) {
  const totCost = CK.reduce((s, k) => s + b['c_' + k], 0);
  const gross = b.revenue - totCost;
  const totOh = OK.reduce((s, k) => s + b['o_' + k], 0);
  const conting = b.revenue * A.contingency / 100;
  const ebitda = gross - totOh - conting;
  const tax = Math.max(0, ebitda) * A.tax / 100;
  const net = ebitda - tax;
  const dist = Math.max(0, net) * A.distribution / 100;
  return Object.assign({}, b, { totCost, gross, grossPct: b.revenue ? gross / b.revenue * 100 : 0, totOh, conting, ebitda, ebitdaPct: b.revenue ? ebitda / b.revenue * 100 : 0, tax, net, dist, retained: net - dist });
}
function yearCol(y) {
  const out = { revenue: 0 };
  CK.forEach(k => out['c_' + k] = 0); OK.forEach(k => out['o_' + k] = 0);
  for (let m = (y - 1) * 12 + 1; m <= y * 12; m++) {
    out.revenue += inplace.revenue / 12 * CUM.rev[m];
    CK.forEach(k => out['c_' + k] += inplace['c_' + k] / 12 * CUM.cost[m]);
    OK.forEach(k => out['o_' + k] += inplace['o_' + k] / 12 * CUM.oh[m]);
  }
  return derive(out);
}
/* ---- 2026 Budget column: calendar-2025 actuals grown 7%, locked at the January cycle ---- */
const BUD26 = (() => {
  const w = MONTHS.filter(m => m.m.startsWith('2025'));
  const S = f => w.reduce((a, m) => a + f(m), 0) * 1.07;
  const b = { revenue: S(m => m.revenue) };
  CK.forEach(k => b['c_' + k] = S(m => m.cost[k]));
  OK.forEach(k => b['o_' + k] = S(m => m.oh[k]));
  return b;
})();
function colData() {
  return [derive(baseFrom(asOf, 3)), derive(baseFrom(asOf, 6)), derive(baseFrom(asOf, 12)),
          derive(BUD26), derive(inplace), yearCol(1), yearCol(2), yearCol(3), yearCol(4), yearCol(5)];
}

const LINES = [
  ['h', 'CONSTRUCTION REVENUE'],
  ['revenue', 'Contract revenue (earned)', 0, 'revenue'],
  ['h', 'COST OF CONSTRUCTION'],
  ['c_subs', 'Sheet metal & raw materials (coil, spiral, liner)', 1, 'c_subs'], ['c_labor', 'Self-perform labor (shop + field)', 1, 'c_labor'],
  ['c_mat', 'Subcontractors & bought-out (insulation, rigging)', 1, 'c_mat'], ['c_equip', 'Equipment, lifts & tools', 1, 'c_equip'],
  ['totCost', 'Total cost of construction', 'sub', null, 0, 1],
  ['gross', 'Gross profit', 'noi'], ['grossPct', 'Gross margin', 0, null, 'pct'],
  ['h', 'DIVISION OVERHEAD'],
  ['o_salaries', 'Office salaries, PM & detailing staff', 1, 'o_salaries'], ['o_office', 'Office & plant facilities', 1, 'o_office'],
  ['o_insurance', 'Insurance & bonding', 1, 'o_insurance'], ['o_it', 'Software & IT', 1, 'o_it'],
  ['o_bd', 'Sales & business development', 1, 'o_bd'], ['o_vehicles', 'Fleet & field trucks', 1, 'o_vehicles'],
  ['o_other', 'Other G&A', 1, 'o_other'],
  ['totOh', 'Total overhead', 'sub', null, 0, 1],
  ['conting', 'Warranty & contingency reserve', 1],
  ['ebitda', 'Company EBITDA', 'noi'], ['ebitdaPct', 'EBITDA margin', 0, null, 'pct'],
  ['h', 'BELOW THE LINE'],
  ['tax', 'Income tax provision', 1], ['net', 'Net income', 'sub'],
  ['dist', 'Owner distribution', 'div'], ['retained', 'Retained for working capital'],
];
const COLS = ['T-3', 'T-6', 'T-12', '2026 Budget', 'In-Place', 'Year 1', 'Year 2', 'Year 3', 'Year 4', 'Year 5'];
const Mfmt = n => '$' + Math.round(n).toLocaleString();
function cellFmt(v, neg, pct) {
  if (pct) return (isFinite(v) ? v.toFixed(1) : '0.0') + '%';
  return (neg && Math.round(v) !== 0) ? '<span class="dim">($' + Math.abs(Math.round(v)).toLocaleString() + ')</span>' : Mfmt(v);
}

const A_FIELDS = [['newAwards', 'New award growth', '%'], ['contingency', 'Contingency /rev', '%'], ['tax', 'Tax rate', '%'], ['distribution', 'Distribution payout', '%']];

function monthOpts() {
  return MONTHS.map((m, i) => `<option value="${i}" ${i === asOf ? 'selected' : ''}>${mLong(m.m)}</option>`).join('');
}

/* ---- backlog coverage (from live jobs data) ---- */
const MJOBS = JOBS.map(x => ({ x, mm: jobMetrics(x) }));
const backlogRemaining = MJOBS.reduce((s, { x, mm }) => s + mm.remaining, 0);


/* ---- monthly forward value (month m = 1..60) ---- */
function monthVal(m) {
  const b = { revenue: inplace.revenue / 12 * CUM.rev[m] };
  CK.forEach(k => b['c_' + k] = inplace['c_' + k] / 12 * CUM.cost[m]);
  OK.forEach(k => b['o_' + k] = inplace['o_' + k] / 12 * CUM.oh[m]);
  return derive(b);
}
const fwdLabel = (m) => { const d = new Date(MONTHS[asOf].m + '-15T12:00:00'); d.setMonth(d.getMonth() + m); return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }); };
const M$ = (n) => '$' + Math.round(n).toLocaleString();

/* ---- hover explanations: the exact logic behind every number ---- */
const LABELS = {};
LINES.forEach(L => { if (L[0] !== 'h') LABELS[L[0]] = L[1]; });
const INPUT_KEYS = new Set(['revenue'].concat(CK.map(k => 'c_' + k), OK.map(k => 'o_' + k)));
const growthOf = (key) => key === 'revenue' ? G.rev[0].r : key.startsWith('c_') ? G.cost[0].r : G.oh[0].r;

function explDerived(key, d, per) {
  switch (key) {
    case 'totCost': return 'Sum of the four construction cost lines:\n' + CK.map(k => LABELS['c_' + k].split('(')[0].trim() + ' ' + M$(d['c_' + k])).join(' + ') + '\n= ' + M$(d.totCost);
    case 'gross': return 'Gross profit = revenue − total cost of construction\n' + M$(d.revenue) + ' − ' + M$(d.totCost) + ' = ' + M$(d.gross);
    case 'grossPct': return 'Gross margin = gross profit ÷ revenue\n' + M$(d.gross) + ' ÷ ' + M$(d.revenue) + ' = ' + d.grossPct.toFixed(1) + '%';
    case 'totOh': return 'Sum of the seven overhead lines = ' + M$(d.totOh);
    case 'conting': return 'Warranty & contingency reserve = revenue × ' + A.contingency + '%\n' + M$(d.revenue) + ' × ' + A.contingency + '% = ' + M$(d.conting);
    case 'ebitda': return 'EBITDA = gross profit − overhead − contingency\n' + M$(d.gross) + ' − ' + M$(d.totOh) + ' − ' + M$(d.conting) + ' = ' + M$(d.ebitda);
    case 'ebitdaPct': return 'EBITDA margin = EBITDA ÷ revenue\n' + M$(d.ebitda) + ' ÷ ' + M$(d.revenue) + ' = ' + d.ebitdaPct.toFixed(1) + '%';
    case 'tax': return 'Income tax provision = max(0, EBITDA) × ' + A.tax + '%\n' + M$(Math.max(0, d.ebitda)) + ' × ' + A.tax + '% = ' + M$(d.tax);
    case 'net': return 'Net income = EBITDA − tax\n' + M$(d.ebitda) + ' − ' + M$(d.tax) + ' = ' + M$(d.net);
    case 'dist': return 'Owner distribution = net income × ' + A.distribution + '% payout\n' + M$(Math.max(0, d.net)) + ' × ' + A.distribution + '% = ' + M$(d.dist);
    case 'retained': return 'Retained for working capital = net income − distribution\n' + M$(d.net) + ' − ' + M$(d.dist) + ' = ' + M$(d.retained);
  }
  return '';
}
function explAnnual(key, c, cd) {
  const lab = LABELS[key] || key;
  const d = cd[c];
  if (INPUT_KEYS.has(key)) {
    if (c <= 2) { const win = [3, 6, 12][c];
      return '<b>' + lab + ' — T-' + win + ' basis</b>\nSum of the last ' + win + ' months of Vista actuals × ' + (12 / win).toFixed(win === 12 ? 0 : 1) + ' to annualize.\n= ' + M$(d[key]) + '/yr run-rate'; }
    if (c === 3) return '<b>' + lab + ' — 2026 Budget</b>\nLocked at the January budget cycle: calendar-2025 actuals × 1.07.\n= ' + M$(d[key]) + '/yr — does not move with the levers.';
    if (c === 4) return '<b>' + lab + ' — In-Place</b>\nEditable annual run-rate, seeded from the T-' + fbasis + ' trailing basis (' + M$(base[key]) + ').\nEdits ripple through every Year 1–5 and monthly figure.';
    const y = c - 4, r = growthOf(key);
    return '<b>' + lab + ' — Year ' + y + '</b>\nIn-Place ' + M$(inplace[key]) + ' ÷ 12, grown at ' + r + '%/yr (compounded monthly), summed over months ' + ((y - 1) * 12 + 1) + '–' + (y * 12) + '.\n= ' + M$(d[key]);
  }
  const head = c <= 2 ? 'T-' + [3, 6, 12][c] + ' basis' : c === 3 ? '2026 Budget' : c === 4 ? 'In-Place' : 'Year ' + (c - 4);
  return '<b>' + lab + ' — ' + head + '</b>\n' + explDerived(key, d);
}
function explMonthly(key, m, d) {
  const lab = LABELS[key] || key;
  if (INPUT_KEYS.has(key)) {
    const r = growthOf(key), cum = (key === 'revenue' ? CUM.rev : key.startsWith('c_') ? CUM.cost : CUM.oh)[m];
    return '<b>' + lab + ' — ' + fwdLabel(m) + ' (month ' + m + ')</b>\nIn-Place ' + M$(inplace[key]) + '/yr ÷ 12 = ' + M$(inplace[key] / 12) + '/mo\n× growth factor ' + cum.toFixed(4) + ' (' + r + '%/yr compounded monthly for ' + m + ' months)\n= ' + M$(d[key]);
  }
  return '<b>' + lab + ' — ' + fwdLabel(m) + ' (month ' + m + ')</b>\n' + explDerived(key, d);
}
const expAttr = (txt) => ' data-exp="' + txt.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '&#10;') + '"';

/* ---- table renderers ---- */
function annualTable(cd) {
  return `<div class="demo-tbl-wrap grid-scroll" style="max-height:none">
        <table class="fc-tbl">
          <thead><tr><th>Line item · $/yr</th>${COLS.map(cc => `<th>${cc}</th>`).join('')}</tr></thead>
          <tbody id="fc-body">${LINES.map(Lr => {
            if (Lr[0] === 'h') return `<tr class="head"><td colspan="11">${Lr[1]}</td></tr>`;
            const key = Lr[0], lab = Lr[1];
            const cls = (Lr[2] === 'sub' || Lr[2] === 'noi' || Lr[2] === 'div') ? Lr[2] : '';
            const neg = Lr[2] === 1 || Lr[5] === 1;
            const editK = Lr[3], pct = Lr[4] === 'pct';
            let cells = '';
            for (let cc = 0; cc < 10; cc++) {
              if (editK && cc === 4) cells += `<td class="fc-ipcol"${expAttr(explAnnual(key, 4, cd))}><input class="fc-cell" data-base="${editK}" value="${Math.round(inplace[editK]).toLocaleString('en-US')}" inputmode="numeric"></td>`;
              else cells += `<td${cc === 4 ? ' class="fc-ipcol"' : ''}${expAttr(explAnnual(key, cc, cd))}>${cellFmt(cd[cc][key], neg, pct)}</td>`;
            }
            return `<tr class="${cls}"><td>${lab}</td>${cells}</tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
}
function monthlyTable() {
  const mv = []; for (let m = 1; m <= 60; m++) mv.push(monthVal(m));
  return `<div class="fc-mwrap grid-scroll">
        <table class="fc-tbl">
          <thead><tr><th>Line item · $/mo</th>${mv.map((_, i) => `<th>${fwdLabel(i + 1)}</th>`).join('')}</tr></thead>
          <tbody>${LINES.map(Lr => {
            if (Lr[0] === 'h') return `<tr class="head"><td colspan="61">${Lr[1]}</td></tr>`;
            const key = Lr[0], lab = Lr[1];
            const cls = (Lr[2] === 'sub' || Lr[2] === 'noi' || Lr[2] === 'div') ? Lr[2] : '';
            const neg = Lr[2] === 1 || Lr[5] === 1;
            const pct = Lr[4] === 'pct';
            const cells = mv.map((d, i) => `<td${expAttr(explMonthly(key, i + 1, d))}>${cellFmt(d[key], neg, pct)}</td>`).join('');
            return `<tr class="${cls}"><td>${lab}</td>${cells}</tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      <div class="fc-inplace-note">Monthly · 60-month view — every forward month compounds the In-Place run-rate at the growth schedule. Hover any figure for the exact calculation behind it.</div>`;
}

function gsummary() {
  const seg = list => list.map(t => 'mo ' + t.f + '-' + t.t + ': ' + t.r + '%').join(' · ');
  return `<b style="color:var(--color-blue)">Growth schedule</b> — Revenue [${seg(G.rev)}] &nbsp; Construction cost [${seg(G.cost)}] &nbsp; Overhead [${seg(G.oh)}]`;
}

function render() {
  const cd = colData();
  const t12 = cd[2], y1 = cd[5];
  $('#app').innerHTML = `
    <div class="cmd-hero">
      <div class="cmd-head">
        <div>
          <div class="cmd-eyebrow">MSM — CFO CONSOLE · MONTHLY FINANCIAL REVIEW</div>
          <h1 class="cmd-title">Budget Command Center</h1>
          <div class="cmd-sub">The monthly financial review, without the spreadsheet: Viewpoint Vista actuals against budget by line, the booked forecast with <b style="color:#fff">external fab revenue finally in the picture</b>, and the staffing implication of the plan. The long-range plan lives in the <a href="/mccorvey/forecast/" style="color:#ef6a76;font-weight:700">5-Year Growth Model</a>.</div>
        </div>
        <div class="cmd-side">
          <span class="cmd-range">FY2026 P8 · 07-06-2026 — 08-02-2026</span>
          <span class="demo-live"><span class="dot"></span> HOUSTON, TX</span>
          <div class="cmd-chips">${srcChip('qb')} ${srcChip('st')}</div>
        </div>
      </div>
      <div class="cmd-tiles">
        <div class="cmd-tile"><div class="l">T-12 Revenue</div><div class="v">${fmtK(t12.revenue)}</div><span class="d up">▲ trailing run-rate</span><div class="s">construction + external fab</div>${sparkSVG('t12rev', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile"><div class="l">T-12 Gross Margin</div><div class="v">${fmtPct(t12.grossPct)}</div><span class="d up">▲ ${fmtK(t12.gross)} gross</span><div class="s">blended field + shop</div>${sparkSVG('t12gm', { up: true })}</div>
        <div class="cmd-tile"><div class="l">T-12 EBITDA</div><div class="v">${fmtK(t12.ebitda)}</div><span class="d up">▲ ${fmtPct(t12.ebitdaPct)} margin</span><div class="s">after overhead</div>${sparkSVG('t12eb', { up: true, color: '#b98a36' })}</div>
        <div class="cmd-tile"><div class="l">Year-1 Forecast Revenue</div><div class="v">${fmtK(y1.revenue)}</div><span class="d up">▲ ${fmtPct((y1.revenue / t12.revenue - 1) * 100)} vs T-12</span><div class="s">booked + weighted pipeline</div>${sparkSVG('y1rev', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile"><div class="l">Year-1 Forecast EBITDA</div><div class="v">${fmtK(y1.ebitda)}</div><span class="d up">▲ ${fmtPct(y1.ebitdaPct)} margin</span><div class="s">at current growth levers</div>${sparkSVG('y1eb', { up: true })}</div>
        <div class="cmd-tile hot"><div class="l">$500M Goal — Req. CAGR</div><div class="v">${fmtPct((Math.pow(500e6 / t12.revenue, 1 / 5) - 1) * 100, 1)}</div><span class="d down">▼ vs ${fmtPct(G.rev[0].r, 1)} organic</span><div class="s">gap closed by acquisitions + fab growth</div>${sparkSVG('cagr', { up: false, color: '#c8102e' })}</div>
      </div>
    </div>

    <div class="scope-bar">
      <span class="scope-chip">Period: <b>FY2026 P8</b></span>
      <span class="scope-chip">Entity: <b>consolidated</b></span>
      <span class="scope-chip">Division: <b>all</b></span>
      <span class="scope-chip">vs <b>budget + prior year</b></span>
      <span class="scope-note">Backlog coverage ${fmtK(backlogRemaining)} unearned · prepared for ${esc(currentPersona().name)}, ${esc(currentPersona().title)}</span>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>${mFull(MONTHS[avbIdx].m)} — Actual vs Budget</h2><span style="display:flex;gap:10px;align-items:center">
        <select id="avb-month" class="pa-btn" style="cursor:pointer">${MONTHS.map((m, i) => i >= MONTHS.length - 12 ? `<option value="${i}" ${i === avbIdx ? 'selected' : ''}>${mFull(m.m)}</option>` : '').join('')}</select>
        ${srcChip('qb')}<span class="k">variance flags over ±5%</span></span></div>
      ${(() => {
        const bud = baseFrom(avbIdx - 1, 3);         /* budget = trailing run-rate set last cycle */
        const act = MONTHS[avbIdx];
        const prev = MONTHS[avbIdx - 1];
        /* sub-item composition per line — deterministic monthly wiggle, always sums exactly to the line total */
        const hsh = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 99991; return h; };
        const subSplit = (line, items, total, mi) => {
          const ws = items.map(it => it.w * (1 + (((hsh(line + it.n + mi) % 29) - 14) / 100) * 1.6));
          const sum = ws.reduce((a, b) => a + b, 0);
          return items.map((it, i) => ({ n: it.n, v: total * ws[i] / sum }));
        };
        const topJobs = JOBS.slice().sort((a, b) => b.contract - a.contract).slice(0, 4);
        const jobsSum = topJobs.reduce((s, j) => s + j.contract, 0);
        const REV_ITEMS = topJobs.map(j => ({ n: j.id + ' · ' + j.name.split('—')[0].trim(), w: j.contract / jobsSum * 0.78 })).concat([{ n: 'All other jobs', w: 0.22 }]);
        const rows = [
          ['Contract revenue', act.revenue, bud.revenue / 12, prev.revenue, REV_ITEMS],
          ['Sheet metal & raw materials', act.cost.subs, bud.c_subs / 12, prev.cost.subs, [
            { n: 'Galvanized coil & liner', w: 0.34 }, { n: 'Spiral pipe & fittings', w: 0.22 }, { n: 'Stainless & welded stock', w: 0.18 }, { n: 'Hangers & supports', w: 0.14 }, { n: 'Fire/smoke dampers, GRDs & misc', w: 0.12 }]],

          ['Subcontractors & bought-out', act.cost.mat, bud.c_mat / 12, prev.cost.mat, [
            { n: 'Insulation subcontract', w: 0.42 }, { n: 'Crane, rigging & hoisting', w: 0.26 }, { n: 'Freight & hauling', w: 0.18 }, { n: 'Scaffolding & access', w: 0.14 }]],
          ['Office salaries, PM & detailing', act.oh.salaries, bud.o_salaries / 12, prev.oh.salaries, [
            { n: 'Project management staff', w: 0.44 }, { n: 'Detailing & BIM coordination', w: 0.38 }, { n: 'Admin & coordination', w: 0.18 }]],
          ['Insurance & bonding', act.oh.insurance, bud.o_insurance / 12, prev.oh.insurance, [
            { n: 'General liability premium', w: 0.52 }, { n: 'Performance & payment bonds', w: 0.28 }, { n: 'Auto & fleet coverage', w: 0.20 }]],
        ];
        const gmAct = (act.revenue - act.cost.subs - act.cost.labor - act.cost.mat - act.cost.equip) / act.revenue * 100;
        return `<table class="demo-tbl tbl-left">
          <thead><tr><th>Line</th><th style="text-align:right">Actual (${mLong(act.m)})</th><th style="text-align:right">Budget</th><th style="text-align:right">Variance</th><th style="width:110px">Flag</th></tr></thead>
          <tbody>${rows.map(r => {
            const v = r[1] - r[2], pct = v / r[2] * 100;
            const bad = (r[0] === 'Contract revenue') ? pct < -5 : pct > 5;
            const cur = subSplit(r[0], r[4], r[1], avbIdx);
            const pri = subSplit(r[0], r[4], r[3], avbIdx - 1);
            const movers = cur.map((c, i) => ({ n: c.n, c: c.v, p: pri[i].v, d: c.v - pri[i].v, chg: (c.v / pri[i].v - 1) * 100 }))
              .sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 3);
            const drv = movers.map(m2 => `<span class="avb-drv-item"><span style="color:${m2.d >= 0 ? 'var(--color-green)' : 'var(--color-red)'}">${m2.d >= 0 ? '▲' : '▼'}</span> ${esc(m2.n)} (${fmt$(m2.c)} vs. ${fmt$(m2.p)} in ${mLong(prev.m)}, ${Math.abs(m2.chg).toFixed(1)}% ${m2.chg >= 0 ? 'increase' : 'decrease'})</span>`).join('');
            return `<tr><td>${r[0]}</td><td style="text-align:right">${fmt$(r[1])}</td><td style="text-align:right">${fmt$(r[2])}</td>
              <td style="text-align:right;color:${bad ? 'var(--color-red)' : 'var(--color-green)'}">${v < 0 ? '(' + fmt$(Math.abs(v)) + ')' : fmt$(v)} · ${fmtPct(Math.abs(pct))}</td>
              <td>${Math.abs(pct) <= 5 ? '<span class="demo-chip ok">ON BUDGET</span>' : bad ? '<span class="demo-chip bad">REVIEW</span>' : '<span class="demo-chip ok">FAVORABLE</span>'}</td></tr>
            <tr class="avb-drv"><td colspan="5">↳ Drivers: ${drv}</td></tr>`;
          }).join('')}</tbody>
        </table>
        <div class="ynote" style="margin-top:8px">Gross margin this month: <b>${fmtPct(gmAct)}</b>. Staffing implication of the current plan lives in <a href="/mccorvey/manpower/" style="color:var(--color-blue);font-weight:700">Manpower &amp; EAC</a> — the plan currently calls for <b>+45 field installers by Q4</b>.</div>`;

function wire() {
  $('#avb-month').addEventListener('change', e => { avbIdx = +e.target.value; render(); });
  $('#fc-month').addEventListener('change', e => { asOf = +e.target.value; base = baseFrom(asOf, fbasis); inplace = Object.assign({}, base); render(); });
  $$('#fc-basis button').forEach(b => b.addEventListener('click', () => { fbasis = +b.dataset.b; base = baseFrom(asOf, fbasis); inplace = Object.assign({}, base); render(); }));
  $$('#fc-view button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; render(); }));
  $$('input[data-svcg]').forEach(inp => inp.addEventListener('change', () => { const v = parseFloat(inp.value); if (!isNaN(v)) svcGrowth = v; render(); }));
  $$('input[data-g]').forEach(inp => inp.addEventListener('change', () => {
    const v = parseFloat(inp.value); if (!isNaN(v)) G[inp.dataset.g] = [{ f: 1, t: 60, r: v }];
    buildCum(); render();
  }));
  $$('input[data-a]').forEach(inp => inp.addEventListener('change', () => {
    const v = parseFloat(inp.value); if (!isNaN(v)) A[inp.dataset.a] = v;
    render();
  }));
  $$('input[data-base]').forEach(inp => inp.addEventListener('change', () => {
    const v = parseFloat(inp.value.replace(/[,$]/g, ''));
    if (!isNaN(v)) inplace[inp.dataset.base] = v;
    render();
  }));
}

function drawCharts(cd) {

  new Chart($('#ch-path'), {
    data: {
      labels: years,
      datasets: [
        { type: 'bar', label: 'Revenue', data: cd.slice(5).map(c => c.revenue / 1e6), backgroundColor: 'rgba(0,92,151,0.30)', yAxisID: 'y' },
        { type: 'line', label: 'EBITDA', data: cd.slice(5).map(c => c.ebitda / 1e6), borderColor: cBlue, pointRadius: 3, tension: 0.3, yAxisID: 'y' },
      ],
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: { y: { ticks: { callback: v => '$' + v.toFixed(0) + 'M', font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } } }
  });
  const chSvc = $('#ch-service');
  if (chSvc) {
    const mrr0 = SERVICE_AGREEMENTS.filter(a => a.status !== 'Proposed').reduce((x, a) => x + a.monthly, 0) * 12;
    new Chart(chSvc, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [
          { label: 'Construction packages', data: cd.slice(5).map(c => c.revenue / 1e6), backgroundColor: 'rgba(8,61,117,0.30)', stack: 's' },
          { label: 'External fab (Duct Direct)', data: [1, 2, 3, 4, 5].map(y => mrr0 * Math.pow(1 + svcGrowth / 100, y) / 1e6), backgroundColor: '#2f9e6e', stack: 's' },
        ],
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: { x: { stacked: true, ticks: { font: { size: 10 } } }, y: { stacked: true, ticks: { callback: v => '$' + v.toFixed(1) + 'M', font: { size: 10 } } } } }
    });
  }
  new Chart($('#ch-backlog'), {
    type: 'doughnut',
    data: {
      labels: ['Unearned backlog', 'New awards required'],
      datasets: [{ data: [backlogRemaining, Math.max(0, cd[4].revenue - backlogRemaining)], backgroundColor: [cBlue, 'rgba(198,151,17,0.55)'], borderWidth: 0 }],

  });
}

/* ---- hover tooltip (single element, delegated, 250ms delay — non-invasive) ---- */
(function () {
  const tip = document.createElement('div'); tip.id = 'fc-tip'; document.body.appendChild(tip);
  let timer = null;
  function show(el, x, y) {
    tip.innerHTML = el.getAttribute('data-exp').replace(/&#10;/g, '\n');
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = x + 14, top = y + 16;
    if (left + w > innerWidth - 10) left = x - w - 14;
    if (top + h > innerHeight - 10) top = y - h - 12;
    tip.style.left = Math.max(6, left) + 'px'; tip.style.top = Math.max(6, top) + 'px';
  }
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-exp]');
    clearTimeout(timer);
    if (!el) { tip.style.display = 'none'; return; }
    timer = setTimeout(() => show(el, e.clientX, e.clientY), 250);
  });
  document.addEventListener('mouseout', (e) => { if (!e.relatedTarget || !e.relatedTarget.closest('[data-exp]')) { clearTimeout(timer); tip.style.display = 'none'; } });
  document.addEventListener('scroll', () => { clearTimeout(timer); tip.style.display = 'none'; }, true);
})();

render();
}
