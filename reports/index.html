<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Reports — Y8S Operations Portal</title>
<meta name="description" content="YATES Company, LLC (Y8S) — building automation & energy solutions. Jobs, billing, timesheets and forecasting in one operations portal. Demo environment.">
<meta property="og:site_name" content="Y8S Operations Portal">
<meta property="og:title" content="YATES Company, LLC — Operations Portal">
<meta property="og:description" content="Building Automation Systems Nurtured by Experience — jobs, billing, timesheets and forecasting in one place. Demo environment, fictional data.">
<meta property="og:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<link rel="icon" type="image/png" href="/yates/assets/brand/y8s-logo-transparent.png">
<link rel="stylesheet" href="/yates/css/theme.css">
<link rel="stylesheet" href="/yates/css/demo.css">
<link rel="stylesheet" href="/yates/css/yates.css">
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="app"></div></main>

<script src="/yates/js/data.js"></script>
<script src="/yates/js/util.js"></script>
<script src="/yates/js/nav.js"></script>
<script src="/yates/js/yates-brain.js" defer></script>
<script>
YatesNav.renderTopbar({ subtitle: 'Progress Reports' });
let jobId = qs('id') || 'CTX-2410';


/* ---------- e-signature engine (localStorage, role-matched) ---------- */
function sigState(key) { try { return JSON.parse(localStorage.getItem('yates-sign:' + key) || 'null'); } catch (e) { return null; } }
function signDoc(key, roles) {
  roles = roles.split('|');
  const now = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  let rec = null;
  if (roles[0] === 'ownerext') {
    const name = prompt('Owner / authorized agent — type your full name to sign electronically:');
    if (!name || !name.trim()) return;
    const title = prompt('Title (optional):') || 'Authorized Agent';
    rec = { name: name.trim(), title: title.trim(), at: now };
  } else {
    const me = currentPersona();
    if (!me || !roles.includes(me.id)) {
      const who = PERSONAS.filter(p => roles.includes(p.id)).map(p => p.name + ' (' + p.title + ')').join(' or ');
      alert('This line must be signed by ' + who + '.\n\nSwitch user via the account menu (top right).');
      return;
    }
    rec = { name: me.name, title: me.title, at: now };
  }
  try { localStorage.setItem('yates-sign:' + key, JSON.stringify(rec)); } catch (e) {}
  render();
}
function clearSig(key) { try { localStorage.removeItem('yates-sign:' + key); } catch (e) {} render(); }
function sigBlock(key, cap, roles) {
  const s = sigState(key);
  if (s) return `<div class="sig signed"><span class="sig-script">${esc(s.name)}</span><div class="sig-meta">Digitally signed — ${esc(s.title)} · ${esc(s.at)} <a href="#" class="no-print" style="color:#97a0ad;font-weight:400" onclick="event.preventDefault();clearSig('${key}')" title="Clear signature (demo)">↺</a></div><div class="sig-cap">${cap}</div></div>`;
  return `<div class="sig"><button class="sig-btn" onclick="signDoc('${key}','${roles}')">✍ Sign electronically</button><div class="sig-cap">${cap}</div></div>`;
}

function render() {
  const j = JOBS.find(x => x.id === jobId) || JOBS[0];
  const m = jobMetrics(j);
  const jobOpts = JOBS.map(x => `<option value="${x.id}" ${x.id === j.id ? 'selected' : ''}>${x.id} — ${esc(x.name)}</option>`).join('');
  const donePhases = j.phases.filter(p => p.pct >= 100);
  const activePhases = j.phases.filter(p => p.pct > 0 && p.pct < 100);
  const nextPhases = j.phases.filter(p => p.pct === 0);

  /* ---- payment ledger (G702-style application summary) ---- */
  const coApproved = (j.changeOrders || []).filter(c => c.status === 'Approved').reduce((s, c) => s + (c.amount || 0), 0);
  const contractToDate = j.contract + coApproved;
  const retReleased = j.payApps.some(p => p.num.includes('RET'));
  const retHeld = retReleased ? 0 : m.earned * j.retainagePct / 100;
  const earnedLessRet = m.earned - retHeld;
  const paidApps = j.payApps.filter(p => p.status === 'Paid');
  const paidToDate = paidApps.reduce((s, p) => s + p.certified, 0);
  const pendingApps = j.payApps.filter(p => p.status !== 'Paid');
  const currentDue = pendingApps.reduce((s, p) => s + p.certified, 0);
  const balanceToFinish = Math.max(0, contractToDate - earnedLessRet);
  const payRef = (p, i) => p.status === 'Paid' ? 'ACH ••' + String(4200 + ((p.num.charCodeAt(0) * 7 + i * 13) % 780)).padStart(4, '0') : '—';
  let runPaid = 0;
  const payRows = j.payApps.map((p, i) => {
    if (p.status === 'Paid') runPaid += p.certified;
    return `<tr>
      <td><b>${esc(p.num)}</b></td><td>${esc(p.label)}</td><td>${fmtDate(p.period)}</td>
      <td class="num">${fmt$2(p.certified)}</td>
      <td>${p.status === 'Paid' ? 'Paid · ' + payRef(p, i) : esc(p.status)}</td>
      <td class="num">${fmt$2(runPaid)}</td>
      <td class="num">${fmt$2(Math.max(0, contractToDate - runPaid - (p.status === 'Paid' ? 0 : 0)))}</td>
    </tr>`;
  }).join('');
  const waiverFinal = retReleased && m.pct >= 100;
  const waiverAmount = currentDue > 0 ? currentDue : (j.payApps.length ? j.payApps[j.payApps.length - 1].certified : 0);

  $('#app').innerHTML = `
    <div class="ytoolrow" style="margin-top:24px">
      <label class="yfld" style="min-width:420px">Job
        <select class="yin" id="rep-job">${jobOpts}</select>
      </label>
      <div class="spacer"></div>
      <button class="pa-btn primary" style="cursor:pointer" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>

    <div class="demo-panel no-print" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Issue Control — ${j.id}</h2><span class="k">owner-facing documents require sign-off before issue</span></div>
      ${approvalChain('rep-' + j.id + '-2026-07', [
        { role: 'conmgr', label: 'PM — Report Prepared',                 doneLabel: 'PM Prepared' },
        { role: 'owner',  label: 'Owner — Approve for Issue',            doneLabel: 'Approved for Issue' },
      ])}
    </div>

    <div class="demo-panel no-print" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Report History — ${j.id}</h2><span style="display:flex;gap:6px;align-items:center">${srcChip('st')}<span class="k">photo reports synced from ServiceTitan</span></span></div>
      <table class="demo-tbl tbl-left">
        <thead><tr><th>Date</th><th>Report</th><th>Author</th><th style="text-align:right">Photos</th><th>Status</th></tr></thead>
        <tbody>${j.reports.map(r => `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.title)}</td><td>${esc(r.author)}</td><td style="text-align:right">${r.photos}</td><td><span class="demo-chip ok">Issued</span></td></tr>`).join('') || '<tr><td colspan="5" class="ynote">No reports issued yet for this job.</td></tr>'}</tbody>
      </table>
    </div>

    <!-- ============ owner progress report document ============ -->
    <div class="ydoc">
      <div class="ydoc-head">
        <div><img src="/yates/assets/brand/y8s-logo.png" alt="Y8S — YATES Company, LLC" class="y8s-logo"><div class="sub" style="margin-top:8px">YATES Company, LLC · Building Automation &amp; Energy Solutions</div></div>
        <div class="right"><b>Owner Progress Report</b><br>Report date: ${fmtDate(todayISO())}<br>Job #: ${j.id}<br>Prepared by: ${esc(j.pm)}, Project Manager</div>
      </div>

      <div class="big-title">${esc(j.name)}</div>
      <div class="subtitle">${esc(j.address)} · Prepared for ${esc(j.owner)}</div>

      <h3 class="sect">Executive Summary</h3>
      <p>
        Work is <b>${fmtPct(m.pct, 1)} complete</b> against a contract value of <b>${fmt$2(j.contract)}</b>.
        Earned value to date is <b>${fmt$2(m.earned)}</b>, with <b>${fmt$2(m.billedAll)}</b> certified across
        ${j.payApps.length} payment application(s). The project ${m.pct >= 100 ? 'is complete and in closeout' : 'remains on schedule'}
        with a contract completion date of <b>${fmtDate(j.finish)}</b>.
        ${j.insurance ? `This is an insurance restoration project (${esc(j.insurance.carrier)} — ${esc(j.insurance.approval)}).` : ''}
      </p>

      <h3 class="sect">Contract &amp; Payment Status</h3>
      <table>
        <tbody>
          <tr><td>1. Original contract sum</td><td class="num">${fmt$2(j.contract)}</td></tr>
          <tr><td>2. Net change by approved change orders</td><td class="num">${fmt$2(coApproved)}</td></tr>
          <tr><td>3. Contract sum to date</td><td class="num">${fmt$2(contractToDate)}</td></tr>
          <tr><td>4. Total completed &amp; stored to date</td><td class="num">${fmt$2(m.earned)}</td></tr>
          <tr><td>5. Retainage (${j.retainagePct}% of completed work)${retReleased ? ' — <b>released at final completion</b>' : ' — held'}</td><td class="num">${fmt$2(retHeld)}</td></tr>
          <tr><td>6. Total earned less retainage</td><td class="num">${fmt$2(earnedLessRet)}</td></tr>
          <tr><td>7. Payments received to date</td><td class="num">${fmt$2(paidToDate)}</td></tr>
          <tr style="font-weight:800"><td>8. CURRENT AMOUNT DUE (applications in process)</td><td class="num">${fmt$2(currentDue)}</td></tr>
          <tr><td>9. Balance to finish, including retainage</td><td class="num">${fmt$2(balanceToFinish)}</td></tr>
        </tbody>
      </table>

      <h3 class="sect">Payment History &amp; Balances</h3>
      <table>
        <thead><tr><th>App #</th><th>Description</th><th>Period To</th><th class="num">Amount Certified</th><th>Status / Ref</th><th class="num">Paid to Date</th><th class="num">Balance to Finish</th></tr></thead>
        <tbody>${payRows || '<tr><td colspan="7">No payment applications issued yet — first application follows mobilization.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="3">Totals</td><td class="num">${fmt$2(m.billedAll)}</td><td></td><td class="num">${fmt$2(paidToDate)}</td><td class="num">${fmt$2(Math.max(0, contractToDate - m.billedAll))}</td></tr></tfoot>
      </table>
      <p style="font-size:11px;color:#5b6472">All amounts reconcile to the AIA G702/G703 applications on file. Retainage ${retReleased ? 'has been released with final completion.' : 'is held at ' + j.retainagePct + '% until final completion, lien waivers and closeout documentation.'}</p>

      <h3 class="sect">Work Completed</h3>
      <ul>${donePhases.map(p => `<li><b>${esc(p.name)}</b> — complete (${fmtDate(p.start)} – ${fmtDate(p.finish)})</li>`).join('') || '<li>Mobilization underway.</li>'}</ul>

      ${activePhases.length ? `<h3 class="sect">Work In Progress</h3>
      <ul>${activePhases.map(p => `<li><b>${esc(p.name)}</b> — ${p.pct}% complete, tracking to ${fmtDate(p.finish)}</li>`).join('')}</ul>` : ''}

      ${nextPhases.length ? `<h3 class="sect">Upcoming Work</h3>
      <ul>${nextPhases.map(p => `<li><b>${esc(p.name)}</b> — scheduled ${fmtDate(p.start)} – ${fmtDate(p.finish)}</li>`).join('')}</ul>` : ''}

      <h3 class="sect">Progress by Schedule of Values</h3>
      <table>
        <thead><tr><th>Item</th><th>Description</th><th class="num">Scheduled Value</th><th style="width:140px">Progress</th><th class="num">%</th></tr></thead>
        <tbody>${j.sov.map(r => `
          <tr><td>${r.item}</td><td>${esc(r.desc)}</td><td class="num">${fmt$2(r.scheduled)}</td>
          <td><div class="ybar ${r.pct >= 100 ? 'g' : ''}"><i style="width:${r.pct}%"></i></div></td><td class="num">${r.pct}%</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="num">${fmt$2(j.contract)}</td><td></td><td class="num">${fmtPct(m.pct, 1)}</td></tr></tfoot>
      </table>

      ${j.photos.length ? `
      <h3 class="sect page-break">Photo Documentation (${j.photos.length})</h3>
      <div class="yphoto-grid" style="grid-template-columns:repeat(3,1fr)">${j.photos.map(photoCard).join('')}</div>` : ''}

<!-- ============ page: confirmation of payments received ============ -->
      <h3 class="sect page-break">Confirmation of Payments Received</h3>
      <p>${YATES.company} confirms receipt of the following payments from <b>${esc(j.owner)}</b> for the project referenced above. Each payment has been applied against the corresponding application for payment, and all amounts received have been or will be used to promptly pay in full all laborers, subcontractors and suppliers for work performed on this project.</p>
      <table>
        <thead><tr><th>App #</th><th>Payment Reference</th><th>Date Applied</th><th class="num">Amount Received</th></tr></thead>
        <tbody>${paidApps.map((p, i) => `<tr><td><b>${esc(p.num)}</b></td><td>${payRef(p, i)}</td><td>${fmtDate(p.period)}</td><td class="num">${fmt$2(p.certified)}</td></tr>`).join('') || '<tr><td colspan="4">No payments received to date.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="3">Total payments received to date</td><td class="num">${fmt$2(paidToDate)}</td></tr></tfoot>
      </table>
      ${pendingApps.length ? `<p><b>Open items:</b> ${pendingApps.map(p => esc(p.num) + ' (' + esc(p.status) + ', ' + fmt$2(p.certified) + ')').join(' · ')} — total <b>${fmt$2(currentDue)}</b> pending owner certification and payment.</p>` : `<p>There are no open payment applications on this project${retReleased ? '; retainage has been released and the account is paid in full' : ''}.</p>`}
      <div class="sig-row">
        ${sigBlock(j.id + ':conf:office', 'Claudia Chavez — Office Manager, Billing &amp; Payroll, ' + YATES.company, 'office')}
        ${sigBlock(j.id + ':conf:cfo', 'Lisa Jilek — Chief Financial Officer, ' + YATES.company, 'cfo')}
      </div>

<!-- ============ page: conditional waiver & release ============ -->
      <h3 class="sect page-break">Conditional Waiver and Release on ${waiverFinal ? 'Final' : 'Progress'} Payment</h3>
      <p>On receipt by the signer of this document of a check from <b>${esc(j.owner)}</b> (maker of check) in the sum of <b>${fmt$2(waiverAmount)}</b> payable to <b>${YATES.company}</b> (payee), and when the check has been properly endorsed and has been paid by the bank on which it is drawn, this document becomes effective to release any mechanic's lien right, any right arising from a payment bond that complies with a state or federal statute, any common-law payment bond right, any claim for payment, and any rights under any similar ordinance, rule, or statute related to claim or payment rights for persons in the signer's position, that the signer has on the property of <b>${esc(j.owner)}</b> located at <b>${esc(j.address)}</b>, to the following extent: <b>building automation and controls work per the contract dated ${fmtDate(j.contractDate)}</b>.</p>
      <p>This release covers a ${waiverFinal ? 'final' : 'progress'} payment for all labor, services, equipment, or materials furnished to the property${waiverFinal ? '' : ', except for unpaid retention, pending modifications and changes, or other items furnished'}. Before any recipient of this document relies on it, the recipient should verify evidence of payment to the signer.</p>
      <p>The signer warrants that the signer has already paid, or will use the funds received from this payment to promptly pay in full, all of the signer's laborers, subcontractors, materialmen and suppliers for all work, materials, equipment, or services provided for or to the above-referenced project.</p>
      <div class="sig-row">
        <div class="sig">${YATES.company} ( Company Name )</div>
        ${sigBlock(j.id + ':waiver:co', 'By ( Signature — Owner, CFO or Controller )', 'owner|cfo|controller')}
      </div>
      <div class="sig-row" style="margin-top:30px">
        <div class="sig">${(sigState(j.id + ':waiver:co') || {}).title || 'Title'}</div>
        <div class="sig">${(sigState(j.id + ':waiver:co') || {}).at || 'Date'}</div>
      </div>

<!-- ============ page: certification, acceptance & signatures ============ -->
      <h3 class="sect page-break">Certification &amp; Owner Acceptance</h3>
      <p><b>Contractor's certification.</b> The undersigned certifies that the work described in this report has been completed in accordance with the contract documents, that quantities, percentages and amounts reported are accurate to the best of their knowledge, that all amounts have been paid by the contractor for work for which previous certificates for payment were issued and payments received, and that the current payment shown herein is now due.</p>
      <div class="sig-row">
        ${sigBlock(j.id + ':cert:pm', esc(j.pm) + ' — Project Manager, ' + YATES.company, 'conmgr|eng|svcmgr')}
        ${sigBlock(j.id + ':cert:cfo', 'Lisa Jilek — Chief Financial Officer, ' + YATES.company, 'cfo')}
      </div>
      <p style="margin-top:30px"><b>Owner acknowledgment &amp; acceptance.</b> The Owner acknowledges review of this progress report, the contract and payment status above, and the payment history presented, and approves the current amount due of <b>${fmt$2(currentDue)}</b> for payment${currentDue ? '' : ' (no amounts currently due)'}. Please execute below and return one copy to <b>${YATES.email}</b>.</p>
      <div class="sig-row">
        ${sigBlock(j.id + ':accept:owner', esc(j.owner) + ' — Owner / Authorized Agent', 'ownerext')}
        <div class="sig">${(sigState(j.id + ':accept:owner') || {}).at || 'Date'}</div>
      </div>
      <p class="ynote no-print" style="margin-top:14px">Electronic signatures are recorded with name, title and timestamp (demo: stored locally). The printed package preserves executed signatures; unsigned lines print blank for wet-ink execution.</p>
      <p style="margin-top:26px;font-size:10.5px;color:#97a0ad">${YATES.company} · ${YATES.hq} · ${YATES.phone} · ${YATES.email} · ${YATES.license}</p>
    </div>
    <div class="demo-note">Demo environment · fictional data</div>`;

  $('#rep-job').addEventListener('change', e => { jobId = e.target.value; render(); });
}
render();
</script>
</body>
</html>
