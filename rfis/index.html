<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFIs & Clarifications — MSM Operations Portal</title>
<meta name="description" content="McCorvey Sheet Metal — RFI register and bid qualifications letter generated from Spec Book Review. Demo environment, fictional sample book.">
<link rel="icon" type="image/png" href="/mccorvey/assets/brand/mccorvey-mark.png">
<link rel="stylesheet" href="/mccorvey/css/theme.css?v=20261013d">
<link rel="stylesheet" href="/mccorvey/css/demo.css?v=20261013d">
<link rel="stylesheet" href="/mccorvey/css/mccorvey.css?v=20261013d">
<style>
  .rf-lens { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 16px; }
  .rf-lens .lb { font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--color-slate-hint); text-transform:uppercase; }
  .rf-chip { font:inherit; font-size:12px; font-weight:700; padding:7px 14px; border-radius:999px; border:1px solid var(--color-border); background:var(--color-bg-2); color:var(--color-text-muted); cursor:pointer; }
  .rf-chip.on { background:#14283c; color:#fff; border-color:#14283c; }
  .rf-chip:hover:not(.on) { border-color:var(--color-blue); color:var(--color-blue); }
  .rf-lens .nt { margin-left:auto; font-size:11.5px; color:var(--color-text-muted); }

  .rf-tbl { min-width:980px; }
  .rf-tbl td { vertical-align:middle; font-size:12.3px; }
  .rf-tbl td.no { font-weight:800; white-space:nowrap !important; color:var(--color-cloud-whisper); }
  .rf-tbl td.sj { min-width:240px; }
  .rf-tbl td.ck { white-space:nowrap; }
  .rf-tbl select, .rf-tbl input[type=date] { font:inherit; font-size:12px; font-weight:700; padding:6px 8px; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); }
  .rf-st { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .rf-cite { font-size:10.5px; font-weight:800; color:#14283c; background:#e8edf3; border-radius:5px; padding:2px 7px; white-space:nowrap; margin:1px 3px 1px 0; display:inline-block; }
  [data-theme="dark"] .rf-cite { color:#cfe0f2; background:#1f3248; }
  .rf-clock { font-size:11px; font-weight:800; white-space:nowrap; }
  .rf-clock.late { color:#c8102e; } .rf-clock.soon { color:var(--color-amber); } .rf-clock.ok { color:#2f9e6e; } .rf-clock.na { color:var(--color-slate-hint); font-weight:600; }
  tr.rf-open td { background:var(--color-blue-pale) !important; }
  tr.rf-det td { background:var(--color-bg-2) !important; padding:14px 16px !important; }
  .rf-det-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
  .rf-pre { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:11.5px; line-height:1.6; white-space:pre-wrap; background:#0d1826; color:#dbe5ef; border-radius:10px; padding:13px 15px; margin:0; }
  .rf-ans label { display:block; font-size:10px; font-weight:800; letter-spacing:.09em; color:var(--color-slate-hint); margin-bottom:6px; text-transform:uppercase; }
  .rf-ans textarea { width:100%; min-height:120px; font:inherit; font-size:12.5px; line-height:1.55; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-cloud-whisper); resize:vertical; box-sizing:border-box; }
  .rf-ans .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .lt-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .lt-tools .nt { margin-left:auto; font-size:11.5px; color:var(--color-text-muted); }
  .lt-paper { background:#fff; color:#1b2430; border:1px solid var(--color-border); border-radius:6px; padding:46px 54px 50px; max-width:860px; margin:0 auto; box-shadow:0 10px 30px rgba(10,22,38,.08); font-size:13px; line-height:1.6; }
  .lt-paper:focus { outline:2px solid var(--color-blue); outline-offset:3px; }
  .lt-head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #c8102e; padding-bottom:14px; margin-bottom:20px; gap:20px; }
  .lt-head img { height:42px; }
  .lt-head .ad { text-align:right; font-size:11px; color:#5a6676; line-height:1.5; }
  .lt-paper h2 { font-size:16px; margin:0 0 4px; color:#14283c; letter-spacing:.01em; }
  .lt-paper h3 { font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:#c8102e; margin:22px 0 8px; }
  .lt-meta { display:grid; grid-template-columns:110px 1fr; gap:3px 12px; font-size:12.5px; margin:14px 0 6px; }
  .lt-meta b { color:#5a6676; font-weight:700; }
  .lt-paper ol, .lt-paper ul { margin:0; padding-left:20px; }
  .lt-paper li { margin:0 0 7px; }
  .lt-paper .ref { color:#5a6676; font-size:11.5px; white-space:nowrap; }
  .lt-sign { display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:40px; font-size:11.5px; color:#5a6676; }
  .lt-sign div { border-top:1px solid #9aa6b2; padding-top:6px; }
  .rf-toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:#14283c; color:#fff; padding:11px 18px; border-radius:11px; font-size:12.5px; font-weight:700; opacity:0; transition:.25s; z-index:600; max-width:90vw; }
  .rf-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width: 900px) {
    .rf-det-grid { grid-template-columns:1fr; }
    .lt-paper { padding:26px 20px 30px; }
    .lt-head { flex-direction:column; } .lt-head .ad { text-align:left; }
    .lt-sign { grid-template-columns:1fr; gap:26px; }
    .rf-lens .nt { margin-left:0; width:100%; }
  }
  @media print {
    body * { visibility:hidden !important; }
    #letter-paper, #letter-paper * { visibility:visible !important; }
    #letter-paper { position:absolute; left:0; top:0; width:100%; max-width:none; border:0; box-shadow:none; padding:0 8px; }
  }
</style>
</head>
<body>
<div id="topbar"></div>
<main class="page">
  <div class="demo-wrap" id="app"></div>
</main>
<div class="rf-toast" id="toast"></div>

<script src="/mccorvey/js/data.js?v=20261013d"></script>
<script src="/mccorvey/js/util.js?v=20261013d"></script>
<script src="/mccorvey/js/nav.js?v=20261013d"></script>
<script src="/mccorvey/js/specbook.js?v=20261013d"></script>
<script src="/mccorvey/js/spec-engine.js?v=20261013d"></script>
<script src="/mccorvey/js/mccorvey-brain.js?v=20261013d" defer></script>
<script>
if (!isSignedIn() && !location.search.includes('enter')) location.replace('/mccorvey/welcome/');
McCorveyNav.renderTopbar({ subtitle: 'Preconstruction — RFIs & Clarifications' });
const app = $('#app');
const E = window.SpecEngine;
const BOOK = E.activeBook();
const DEC = E.decisions(BOOK);
let lens = E.store.get('msm-spec-lens', 'sm');
let open = null;
const KEY_RFI = 'msm-spec-rfi-' + BOOK.key, KEY_LET = 'msm-spec-letter-' + BOOK.key;
const STATUSES = [['draft', 'Draft', '#9aa6b2'], ['sent', 'Sent to CM', '#2563eb'], ['answered', 'Answered', '#2f9e6e'], ['closed', 'Closed', '#14283c']];
const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* sample book: a few RFIs already in flight so the register reads like a live job */
let RS = E.store.get(KEY_RFI, null);
if (!RS) {
  RS = {};
  if (BOOK.sample) {
    RS.C03 = { status: 'sent', sent: '2026-10-05' };
    RS.C06 = { status: 'sent', sent: '2026-10-08' };
    RS.C02 = { status: 'answered', sent: '2026-10-02', answer: 'CM response 10/07: provide 12 ga sleeves through masonry and concrete per 23 0500; 22 ga elsewhere. No change to drawings.' };
    RS.C08 = { status: 'closed', sent: '2026-10-01', answer: 'CM response 10/03: confirmed — fire pumps are electric drive. Disregard diesel exhaust insulation in 22 0719.' };
  }
  E.store.set(KEY_RFI, RS);
}
const rs = id => Object.assign({ status: 'draft', sent: '', answer: '' }, RS[id]);
const saveRS = () => E.store.set(KEY_RFI, RS);

/* numbering matches the hub: book order, RFIs in the log */
const NUM = {}; let n = 0;
BOOK.conflicts.forEach(c => { if ((DEC[c.id] || {}).act !== 'off') NUM[c.id] = ++n; });
const inLog = c => NUM[c.id] != null;
const rows = () => BOOK.conflicts.filter(c => inLog(c) && E.inLens(c.lens, lens));

function clock(c) {
  const r = rs(c.id);
  if (r.status === 'draft') return `<span class="rf-clock na">not sent</span>`;
  if (r.status === 'closed') return `<span class="rf-clock na">closed</span>`;
  const open = daysBetween(r.sent, today());
  const notice = addD(r.sent, 10), left = daysBetween(today(), notice);
  if (r.status === 'answered') return `<span class="rf-clock ok">answered · ${open}d</span>`;
  const cls = left < 0 ? 'late' : left <= 3 ? 'soon' : 'ok';
  return `<span class="rf-clock ${cls}">${open}d open · cost notice ${left < 0 ? Math.abs(left) + 'd past' : 'due in ' + left + 'd'}</span>`;
}

/* ---------------- letter ---------------- */
const QUAL = {
  F02: 'Equipment short-circuit current ratings will be coordinated with the electrical gear as submitted. Upgrades required by revised available fault current after bid are not included.',
  F03: 'Electrical feeder or breaker changes resulting from Owner-directed equipment changes are not included.',
  F05: 'Coordination drawings are carried as a separate schedule-of-values line. Progress payments for fabricated and stored material are requested as coordination areas are signed, not upon completion of all coordination.',
  F06: 'Relocation of ductwork installed in accordance with signed coordination drawings is not included.',
  F13: 'Retainage, liquidated damages, bond and insurance requirements and warranty duration are not stated in the specifications. This proposal is subject to mutually agreeable subcontract terms.',
  P07: 'Plumbing pump VFDs are furnished only; installation and power wiring by Division 26.',
  H12: 'Grease duct warranty is limited to the manufacturer\'s warranty as passed through; McCorvey workmanship warranty one year.',
  H17: 'HVAC VFDs are furnished only, delivered to Division 26 for installation and wiring. Start-up by manufacturer.',
  H25: 'Ductwork will be delivered and installed clean and capped per SMACNA IAQ guidelines. NADCA cleaning is not included.',
  H27: 'Division 40 process piping (PCC-9) is excluded.',
};
function qualText(f) {
  if (QUAL[f.id]) return QUAL[f.id];
  return `${f.title}: pricing is limited to the requirement as written in Section ${f.sec}; costs beyond it are excluded until confirmed at award.`;
}
function letterHTML() {
  const E2 = E, D = DEC;
  const fs = BOOK.findings.filter(f => E.inLens(f.lens || E.lensOf(f.sec), lens));
  const priced = fs.filter(f => E.decOf(BOOK, f, D).act === 'price');
  const quals = fs.filter(f => E.decOf(BOOK, f, D).act === 'clarify');
  const excl = fs.filter(f => E.decOf(BOOK, f, D).act === 'exclude');
  const rf = rows().filter(c => rs(c.id).status !== 'closed');
  const p = currentPersona() || { name: 'Preconstruction', title: '' };
  const scope = { sm: 'Division 23 — HVAC Ductwork & Accessories', hvac: 'Division 23 — HVAC', plumb: 'Division 22 — Plumbing', all: 'Divisions 22 & 23 — Mechanical' }[lens];
  const assume = c => (c.q.match(/(Bid (assumes|excludes|includes|is based)[^.]*\.)/) || [])[1] || 'Bid is based on the documents as issued pending response.';
  const cite = f => `<span class="ref">(${E.cite(f.sec, f.para, f.page)})</span>`;
  const ans = rows().filter(c => ['answered', 'closed'].includes(rs(c.id).status) && rs(c.id).answer);
  return `
    <div class="lt-head"><img src="/mccorvey/assets/brand/mccorvey-logo.png" alt="McCorvey Sheet Metal Works"><div class="ad">McCorvey Sheet Metal Works, L.P.<br>Preconstruction<br>${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div></div>
    <h2>Bid Qualifications, Clarifications &amp; Exclusions</h2>
    <div class="lt-meta">
      <b>Project</b><span>${esc(BOOK.name)}</span>
      <b>To</b><span>${esc((BOOK.bid && BOOK.bid.gc) || BOOK.cm || 'Construction Manager')}</span>
      <b>Scope</b><span>${scope}</span>
      ${BOOK.bid && BOOK.bid.bidNo ? `<b>Bid No.</b><span>${esc(BOOK.bid.bidNo)}</span>` : ''}
      <b>Documents</b><span>Project specifications ${BOOK.bookIssue ? 'Issue ' + String(BOOK.bookIssue).padStart(2, '0') : ''}${BOOK.bookDate ? ' dated ' + fmtDate(BOOK.bookDate) : ''}, all divisions as they apply to our scope</span>
    </div>

    <h3>1. Basis of bid — specification requirements included</h3>
    <p style="margin:0 0 8px">Our base bid includes the following requirements, which go beyond typical practice and are called out so they are not assumed to be absent from competing numbers:</p>
    <ol>${priced.map(f => `<li>${esc(f.title)} ${cite(f)}</li>`).join('') || '<li>Per plans and specifications.</li>'}</ol>

    ${rf.length ? `<h3>2. Assumptions pending RFI responses</h3><ol>${rf.map(c => `<li>${esc(assume(c))} <span class="ref">(${E.rfiNo(NUM[c.id])} — ${esc(c.title)})</span></li>`).join('')}</ol>` : ''}

    ${ans.length ? `<h3>${rf.length ? 3 : 2}. RFI responses incorporated</h3><ol>${ans.map(c => `<li>${esc(rs(c.id).answer)} <span class="ref">(${E.rfiNo(NUM[c.id])})</span></li>`).join('')}</ol>` : ''}

    <h3>Clarifications</h3>
    <ol>${quals.map(f => `<li>${esc(qualText(f))} ${cite(f)}</li>`).join('')}
      <li>Testing, adjusting and balancing is by the Construction Manager's TAB contractor. McCorvey provides access, duct leakage testing and one set of drives as furnished.</li>
      <li>Bid is valid for 30 days. Steel pricing is subject to mill surcharge adjustment after validity.</li>
    </ol>

    <h3>Exclusions</h3>
    <ol>${excl.map(f => `<li>${esc(qualText(f))} ${cite(f)}</li>`).join('')}
      <li>HVAC equipment, controls and control wiring, electrical power wiring, and painting of exposed ductwork unless listed above.</li>
      <li>Firestopping of penetrations (Section 07 8413, single-source firestop contractor).</li>
      <li>Work required by specification sections referenced but not issued with the bid documents.</li>
      <li>Connections to Owner-furnished equipment not identified in the bid documents.</li>
    </ol>

    <div class="lt-sign"><div>${esc(p.name)}${p.title ? ', ' + esc(p.title) : ''}<br>McCorvey Sheet Metal Works, L.P.</div><div>Accepted — ${esc((BOOK.bid && BOOK.bid.gc) || 'Construction Manager')}<br>Name, title &amp; date</div></div>`;
}

/* ---------------- render ---------------- */
function render() {
  const R = rows();
  const cnt = k => R.filter(c => rs(c.id).status === k).length;
  const late = R.filter(c => rs(c.id).status === 'sent' && daysBetween(today(), addD(rs(c.id).sent, 10)) < 0).length;
  const fs = BOOK.findings.filter(f => E.inLens(f.lens || E.lensOf(f.sec), lens));
  const nq = fs.filter(f => E.decOf(BOOK, f, DEC).act === 'clarify').length, ne = fs.filter(f => E.decOf(BOOK, f, DEC).act === 'exclude').length;
  const saved = E.store.get(KEY_LET, null);
  app.innerHTML = `
    <div class="cmd-hero">
      <div class="cmd-head">
        <div>
          <div class="cmd-eyebrow">MSM BRAIN — RFIS &amp; CLARIFICATIONS · PRECONSTRUCTION</div>
          <h1 class="cmd-title">RFI Register &amp; Bid Letter</h1>
          <div class="cmd-sub">${esc(BOOK.name)} · every conflict, missing section and blank the Brain found in the spec book, drafted in the CM's format and tracked against the notice clock. Decisions on the Findings tab write the qualifications letter below.</div>
        </div>
        <div class="cmd-side">
          <span class="cmd-range">${BOOK.local ? 'YOUR BOOK · LOCAL ONLY' : 'SAMPLE BOOK · FICTIONAL'}</span>
          <div class="cmd-chips">${srcChip('brain')}</div>
          <a class="pa-btn" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.22)" href="/mccorvey/specreview/#rfis">← Back to Spec Book Review</a>
        </div>
      </div>
      <div class="cmd-tiles">
        <div class="cmd-tile"><div class="l">RFIs in Log</div><div class="v">${R.length}</div><span class="d up">▲ CM format</span><div class="s">${esc(E.LENSES[lens].label)}</div>${sparkSVG('rf-log', { up: true, color: '#14283c' })}</div>
        <div class="cmd-tile"><div class="l">Drafts to Send</div><div class="v">${cnt('draft')}</div><span class="d down">▼ before bid day</span><div class="s">route via the CM</div>${sparkSVG('rf-draft', { up: false, color: '#b98a36' })}</div>
        <div class="cmd-tile"><div class="l">With the CM</div><div class="v">${cnt('sent')}</div><span class="d up">▲ 5-day response</span><div class="s">clock running</div>${sparkSVG('rf-sent', { up: true, color: '#2563eb' })}</div>
        <div class="cmd-tile ${late ? 'hot' : ''}"><div class="l">Cost Notice Past Due</div><div class="v">${late}</div><span class="d ${late ? 'down' : 'up'}">${late ? '▼ notice window closed' : '▲ all inside 10 days'}</span><div class="s">10-day cost/time notice</div>${sparkSVG('rf-late', { up: !late, color: '#c8102e' })}</div>
        <div class="cmd-tile"><div class="l">Answered / Closed</div><div class="v">${cnt('answered') + cnt('closed')}</div><span class="d up">▲ into the letter</span><div class="s">responses incorporated</div>${sparkSVG('rf-ans', { up: true })}</div>
        <div class="cmd-tile"><div class="l">Letter Items</div><div class="v">${nq + ne}</div><span class="d up">▲ ${nq} qualify · ${ne} exclude</span><div class="s">plus standard terms</div>${sparkSVG('rf-let', { up: true, color: '#14283c' })}</div>
      </div>
    </div>

    <div class="rf-lens">
      <span class="lb">Trade lens</span>
      ${Object.entries(E.LENSES).map(([k, v]) => `<button class="rf-chip ${lens === k ? 'on' : ''}" onclick="setLens('${k}')">${v.label}</button>`).join('')}
      <span class="nt">Sub RFIs sent direct to the architect come back unanswered — every draft is addressed to the CM.</span>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>RFI Register</h2><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="k">click a row for the full RFI and the answer</span><button class="pa-btn" onclick="copyAll()">⧉ Copy all drafts</button></span></div>
      <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
        <table class="demo-tbl tbl-left rf-tbl">
          <thead><tr><th>RFI</th><th>Subject</th><th>References</th><th>Status</th><th>Sent</th><th>Clock</th></tr></thead>
          <tbody>${R.map(c => {
            const r = rs(c.id), st = STATUSES.find(s => s[0] === r.status);
            const refs = ['a', 'b', 'c'].map(k => c[k]).filter(x => x && x.sec && x.sec !== '—').map(x => `<span class="rf-cite">${E.cite(x.sec, x.para, x.page)}</span>`).join('');
            const row = `<tr class="yclick ${open === c.id ? 'rf-open' : ''}" onclick="toggle(event,'${c.id}')">
              <td class="no">${E.rfiNo(NUM[c.id])}</td><td class="sj"><b>${esc(c.title)}</b></td><td>${refs}</td>
              <td><span class="rf-st" style="background:${st[2]}"></span><select onclick="event.stopPropagation()" onchange="setStatus('${c.id}',this.value)">${STATUSES.map(s => `<option value="${s[0]}" ${s[0] === r.status ? 'selected' : ''}>${s[1]}</option>`).join('')}</select></td>
              <td><input type="date" value="${r.sent}" onclick="event.stopPropagation()" onchange="setSent('${c.id}',this.value)"></td>
              <td class="ck">${clock(c)}</td></tr>`;
            const det = open === c.id ? `<tr class="rf-det"><td colspan="6"><div class="rf-det-grid">
              <pre class="rf-pre">${esc(E.rfiText(BOOK, c, NUM[c.id]))}</pre>
              <div class="rf-ans"><label>Response from the CM</label>
                <textarea placeholder="Paste the CM's answer — it flows into the bid letter." oninput="setAnswer('${c.id}',this.value)">${esc(r.answer || '')}</textarea>
                <div class="row"><button class="pa-btn" onclick="copyOne('${c.id}')">⧉ Copy RFI</button><button class="pa-btn" onclick="setStatus('${c.id}','sent')">Mark sent today</button><button class="pa-btn primary" onclick="setStatus('${c.id}','answered')">Mark answered</button></div>
              </div></div></td></tr>` : '';
            return row + det;
          }).join('') || '<tr><td colspan="6">No RFIs in the log for this lens. Add them from Spec Book Review → Conflicts.</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="demo-panel" id="letter" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Qualifications Letter</h2><span class="k">${saved ? 'edited — your changes are saved' : 'generated from your decisions'}</span></div>
      <div class="lt-tools">
        <button class="pa-btn primary" onclick="window.print()">Print / save PDF</button>
        <button class="pa-btn" onclick="copyLetter()">⧉ Copy text</button>
        <button class="pa-btn" onclick="regen()">↻ Regenerate from decisions</button>
        <span class="nt">Click into the letter to edit. Price it → basis of bid · Qualify → clarifications · Exclude → exclusions · open RFIs → assumptions.</span>
      </div>
      <div class="lt-paper" id="letter-paper" contenteditable="true" spellcheck="true">${saved || letterHTML()}</div>
    </div>

    <div class="demo-note">${BOOK.local ? 'Built from your locally read book — stored in this browser only.' : 'Sample spec book is fictional — Project Bluebonnet and its clause wording are illustrative.'} · concept build by Endurance AI Labs</div>`;
  const lp = $('#letter-paper');
  lp.addEventListener('input', () => { E.store.set(KEY_LET, lp.innerHTML); });
}

/* ---------------- actions ---------------- */
function setLens(k) { lens = k; E.store.set('msm-spec-lens', k); E.store.set(KEY_LET, null); try { localStorage.removeItem(KEY_LET); } catch (e) {} render(); }
function toggle(ev, id) { if (ev.target.closest('select,input,textarea,button')) return; open = open === id ? null : id; render(); }
function setStatus(id, s) {
  RS[id] = Object.assign(rs(id), { status: s });
  if (s === 'sent' && !RS[id].sent) RS[id].sent = today();
  if (s === 'draft') RS[id].sent = '';
  saveRS(); render(); toast(E.rfiNo(NUM[id]) + ' → ' + STATUSES.find(x => x[0] === s)[1]);
}
function setSent(id, d) { RS[id] = Object.assign(rs(id), { sent: d, status: d ? (rs(id).status === 'draft' ? 'sent' : rs(id).status) : 'draft' }); saveRS(); render(); }
function setAnswer(id, v) { RS[id] = Object.assign(rs(id), { answer: v }); saveRS(); }
function regen() { try { localStorage.removeItem(KEY_LET); } catch (e) {} render(); location.hash = 'letter'; toast('Letter regenerated from current decisions and RFI answers'); }
function cp(txt, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fb(txt, done)); else fb(txt, done);
}
function fb(txt, cb) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); cb(); }
function copyOne(id) { const c = BOOK.conflicts.find(x => x.id === id); cp(E.rfiText(BOOK, c, NUM[id]), 'RFI copied'); }
function copyAll() { const t = rows().filter(c => rs(c.id).status === 'draft').map(c => E.rfiText(BOOK, c, NUM[c.id])).join('\n\n' + '-'.repeat(60) + '\n\n'); cp(t || 'No drafts.', 'All draft RFIs copied'); }
function copyLetter() { cp($('#letter-paper').innerText, 'Letter copied — paste into email or Word'); }

render();
if (location.hash === '#letter') setTimeout(() => { const el = document.getElementById('letter'); if (el) window.scrollTo({ top: el.offsetTop - 160 }); }, 60);
</script>
