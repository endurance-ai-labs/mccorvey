<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs — Y8S Operations Portal</title>
<meta name="description" content="YATES Company, LLC (Y8S) — building automation & energy solutions. Jobs, billing, timesheets and forecasting in one operations portal. Demo environment.">
<meta property="og:site_name" content="Y8S Operations Portal">
<meta property="og:title" content="YATES Company, LLC — Operations Portal">
<meta property="og:description" content="Building Automation Systems Nurtured by Experience — jobs, billing, timesheets and forecasting in one place. Demo environment, fictional data.">
<meta property="og:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://endurance-ai-labs.github.io/yates/assets/brand/og-cover.png">
<link rel="icon" type="image/png" href="/yates/assets/brand/y8s-logo-transparent.png">
<link rel="stylesheet" href="/yates/css/theme.css">
<link rel="stylesheet" href="/yates/css/demo.css">
<link rel="stylesheet" href="/yates/css/yates.css">
</head>
<body>
<div id="topbar"></div>
<main class="page">
  <div class="demo-wrap" id="app"></div>
</main>

<script src="/yates/js/data.js"></script>
<script src="/yates/js/util.js"></script>
<script src="/yates/js/nav.js"></script>
<script src="/yates/js/yates-brain.js" defer></script>
<script>
YatesNav.renderTopbar({ subtitle: 'Jobs' });
const internal = YatesMode.isInternal() && !(currentPersona() && currentPersona().perms.external);
const showMargins = internal && can('margins');
const M = JOBS.map(j => ({ j, m: jobMetrics(j) }));

const FILT = { status: 'all', pm: 'all', owner: 'all' };
const uniq = (f) => [...new Set(JOBS.map(f))].sort();
const selOpt = (list, cur) => `<option value="all">All</option>` + list.map(v => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
const jobFilter = ({ j }) => (FILT.status === 'all' || j.status === FILT.status) && (FILT.pm === 'all' || j.pm === FILT.pm) && (FILT.owner === 'all' || j.owner === FILT.owner);

function renderJobs() {
const shown = M.filter(jobFilter);
const rows = shown.map(({ j, m }) => `
  <tr class="yclick" onclick="location.href='/yates/jobs/job/?id=${j.id}'">
    <td><b>${j.id}</b></td>
    <td>${esc(j.name)}<div class="ynote">${esc(j.address)}</div></td>
    <td>${statusPill(j.status)}</td>
    <td>${esc(j.pm)}<div class="ynote">Supt. ${esc(j.super)}</div></td>
    <td>${esc(j.sub.split('(')[0].trim())}</td>
    <td style="text-align:right">${fmt$(j.contract)}</td>
    <td><div class="ybar ${m.pct >= 100 ? 'g' : ''}"><i style="width:${Math.min(100, m.pct)}%"></i></div><div class="ynote">${fmtPct(m.pct, 0)} complete</div></td>
    <td style="text-align:right;white-space:nowrap">${fmtDateShort(j.start)} – ${fmtDateShort(j.finish)}</td>
    ${showMargins ? `<td style="text-align:right;color:${m.marginToDate >= 0 ? 'var(--color-green)' : 'var(--color-red)'}">${fmt$(m.marginToDate)}</td>` : ''}
  </tr>`).join('');

$('#app').innerHTML = `
  <div class="demo-hero" style="padding-bottom:18px">
    <div>
      <div class="demo-eyebrow">${internal ? 'INTERNAL TRACKING' : 'CLIENT VIEW'}</div>
      <h1>Active <em>Jobs</em></h1>
      <div class="sub">${showMargins ? 'Full financial visibility — earned value, cost and margin per job.' : internal ? 'Operational view — production, schedule and field status per job.' : 'Progress and schedule for every active project.'}</div>
    </div>
    <div class="demo-hero-right"><span class="demo-live"><span class="dot"></span> ${shown.length} OF ${JOBS.length} JOBS</span></div>
  </div>

  <div class="demo-panel">
    <div class="demo-panel-head"><h2>Job Register</h2><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label class="k">Status</label><select class="pa-btn" data-filt="status" style="cursor:pointer">${selOpt(uniq(j => j.status), FILT.status)}</select>
      <label class="k">PM</label><select class="pa-btn" data-filt="pm" style="cursor:pointer">${selOpt(uniq(j => j.pm), FILT.pm)}</select>
      <label class="k">Customer</label><select class="pa-btn" data-filt="owner" style="cursor:pointer">${selOpt(uniq(j => j.owner), FILT.owner)}</select>
      <span class="k">click a job to open its tracker</span></span></div>
    <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
      <table class="demo-tbl tbl-left">
        <thead><tr><th>Job #</th><th>Project</th><th>Status</th><th>PM / Supt</th><th>Lead Sub</th><th style="text-align:right">Contract</th><th>Progress</th><th style="text-align:right">Schedule</th>${showMargins ? '<th style="text-align:right">Margin to Date</th>' : ''}</tr></thead>
        <tbody>${rows || `<tr><td colspan="9" style="padding:18px;color:var(--color-text-muted)">No jobs match the current filters.</td></tr>`}</tbody>
      </table>
    </div>
  </div>
  <div class="demo-note">Demo environment · fictional data</div>`;
$$('select[data-filt]').forEach(s => s.addEventListener('change', () => { FILT[s.dataset.filt] = s.value; renderJobs(); }));
}
renderJobs();
</script>
</body>
</html>
