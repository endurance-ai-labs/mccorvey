<script>
YatesNav.renderTopbar({ subtitle: 'Preconstruction' });
const internal = YatesMode.isInternal() && can('bids');

/* live working copy — resets on reload */
const BID = JSON.parse(JSON.stringify(BID_DEFAULTS));
const APPR_KEY = 'bid-' + BID.meta.bidNumber;
const APPR_STEPS = [
  { role: 'est',   label: 'Estimating — Prepared, Ready for Review', doneLabel: 'Estimate Prepared' },
  { role: 'eng',   label: 'Engineering — Technical Review',           doneLabel: 'Engineering Reviewed' },
  { role: 'owner', label: 'Owner — Authorize Submission',             doneLabel: 'Authorized by Owner' },
];


/* ---------- catalog-driven dropdown options ---------- */
const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
const withCurrent = (list, cur) => (cur && !list.includes(cur)) ? [cur, ...list] : list;
function csiOpts(cur) {
  const known = CSI_OPTIONS.map(c => c[0]);
  return withCurrent(known, cur).map(code => {
    const m = CSI_OPTIONS.find(c => c[0] === code);
    return opt(code, code + (m ? ' — ' + m[1] : ''), cur);
  }).join('');
}
function tradeOpts(cur) {
  return withCurrent(TRADE_CATALOG.map(t => t.trade), cur).map(t => opt(t, t, cur)).join('');
}
function descOpts(l) {
  const cat = TRADE_CATALOG.find(t => t.trade === l.trade);
  const list = withCurrent(cat ? cat.descs.slice() : [], l.desc);
  return list.map(d => opt(d, d, l.desc)).join('');
}
function unitOpts(cur) {
  return withCurrent(UNITS.slice(), cur).map(u => opt(u, u, cur)).join('');
}
function applyTrade(i, trade) {
  const l = BID.lines[i];
  l.trade = trade;
  const cat = TRADE_CATALOG.find(t => t.trade === trade);
  if (cat) {
    l.csi = cat.csi;
    l.unit = cat.unit;
    l.sub = SUBS[cat.sub];
    l.desc = cat.descs[0];
  }
  render();
}


/* ---------- AI Bid Assistant: paste an RFP, get a drafted bid ---------- */
const SAMPLE_RFP = `Request for Proposal — Building Automation Retrofit
Guadalupe Heights ISD, 8 campuses, approx. 620,000 SF total.
Scope: replace existing pneumatic controls district-wide with DDC. Integrate 42 rooftop units
and 3 central plants (chillers and boilers). Provide 96 VAV terminal controllers with new
space sensors and CO2 monitoring in classrooms. New low-voltage wiring and network riser per
campus, BACnet front end with graphics and energy dashboards for the facilities office.
Include utility submetering at each campus, full commissioning with point-to-point checkout,
and operator training for district staff. Bids due August 22.`;

const AI_RULES = [
  { re: /(\d+)\s*(campus|school|building|bldg|facilit)/i, trade: 'DDC Controls', perUnit: 26500, unit: 'campus' },
  { re: /(\d+)\s*(rtu|rooftop)/i, trade: 'RTU Integration', perUnit: 1450, unit: 'RTU' },
  { re: /(\d+)\s*vav/i, trade: 'VAV Controls', perUnit: 640, unit: 'VAV' },
  { re: /(\d+)\s*(ahu|air handler)/i, trade: 'AHU Controls', perUnit: 8200, unit: 'ea' },
  { re: /(\d+)?\s*(central plant|chiller|boiler)/i, trade: 'Plant Controls', perUnit: 31500, unit: 'ea', defQty: 1 },
  { re: /wiring|conduit|riser|cabl/i, trade: 'LV Wiring', lump: 0.075 },
  { re: /sensor|thermostat|co2/i, trade: 'Sensors', lump: 0.022 },
  { re: /actuator|valve|damper/i, trade: 'Actuators', lump: 0.045 },
  { re: /graphic|dashboard|front.?end|alarm/i, trade: 'Graphics', lump: 0.018 },
  { re: /(\d+)?\s*(submeter|meter)/i, trade: 'Metering', perUnit: 5800, unit: 'ea', defQty: 4 },
  { re: /commission|point.?to.?point|checkout|tab\b/i, trade: 'TAB & Commissioning', lump: 0.035 },
  { re: /train/i, trade: 'Training & Closeout', lump: 0.012 },
  { re: /bacnet|network|server|integration/i, trade: 'Front-End & Network', lump: 0.028 },
];

function aiDraftBid(text) {
  const found = [];
  const sqft = (text.match(/([\d,]+)\s*(sf|sq\.?\s*ft|square)/i) || [])[1];
  const scale = sqft ? Math.min(4, Math.max(0.5, parseInt(sqft.replace(/,/g, '')) / 200000)) : 1;
  AI_RULES.forEach(rule => {
    const m = text.match(rule.re);
    if (!m) return;
    if (found.some(f => f.trade === rule.trade)) return;
    const cat = TRADE_CATALOG.find(t => t.trade === rule.trade);
    if (!cat) return;
    let qty = 1, unitCost;
    if (rule.perUnit) {
      qty = m[1] ? parseInt(m[1]) : (rule.defQty || 1);
      unitCost = rule.perUnit;
    } else {
      unitCost = 0;   /* filled after direct base known */
    }
    found.push({ trade: rule.trade, csi: cat.csi, desc: cat.descs[0], qty, unit: rule.unit || 'LS', unitCost, sub: SUBS[cat.sub], offset: 14, dur: 21, lump: rule.lump });
  });
  /* lump-sum trades priced as a share of the unit-priced base, scaled by SF */
  const base = found.filter(f => !f.lump).reduce((a, f) => a + f.qty * f.unitCost, 0) || 250000 * scale;
  found.forEach(f => { if (f.lump) f.unitCost = Math.round(base * f.lump * scale / 50) * 50; });
  /* always carry GC + PM/engineering */
  const gc = TRADE_CATALOG.find(t => t.trade === 'General Conditions');
  const pm = TRADE_CATALOG.find(t => t.trade === 'PM & Engineering');
  const direct = found.reduce((a, f) => a + f.qty * f.unitCost, 0);
  found.push({ trade: 'General Conditions', csi: gc.csi, desc: gc.descs[0], qty: 1, unit: 'LS', unitCost: Math.round(direct * 0.055 / 50) * 50, sub: SUBS[gc.sub], offset: 0, dur: 60 });
  found.push({ trade: 'PM & Engineering', csi: pm.csi, desc: pm.descs[0], qty: 1, unit: 'LS', unitCost: Math.round(direct * 0.05 / 50) * 50, sub: SUBS[pm.sub], offset: 0, dur: 60 });
  /* schedule offsets: stagger */
  found.forEach((f, i) => { if (f.trade !== 'General Conditions' && f.trade !== 'PM & Engineering') { f.offset = 7 + (i % 4) * 10; f.dur = 14 + (i % 3) * 7; } });
  found.forEach(f => delete f.lump);

  /* project + owner detection */
  const lines = text.split(/\n/).map(x => x.trim()).filter(Boolean);
  const ownerLine = lines.find(l => /(ISD|District|County|City of|LLC|LP|Inc|Health|University)/.test(l) && !/^Request|^RFP|^Scope/i.test(l));
  const owner = ownerLine ? ownerLine.split(',')[0].trim() : BID.meta.owner;
  const title = (lines[0] || '').replace(/^request for proposal\s*[—-]*\s*/i, '').trim();
  return { lines: found, owner, title: title || owner + ' — Controls Retrofit', sqft, scale };
}

function aiAssist() {
  const ov = document.createElement('div');
  ov.className = 'svc-modal';
  ov.innerHTML = `
    <div class="svc-card" onclick="event.stopPropagation()" style="max-width:680px">
      <div class="svc-card-head">
        <div><b>🤖 AI Bid Assistant</b><div class="ynote">Paste an RFP, scope email or walk notes — the assistant drafts trade lines, CSI codes, quantities and pricing. Y8S proprietary engine (demo).</div></div>
        <button class="pa-btn" style="cursor:pointer" onclick="this.closest('.svc-modal').remove()">✕</button>
      </div>
      <textarea class="yin" id="ai-rfp" rows="10" style="resize:vertical" placeholder="Paste the RFP or scope description here…"></textarea>
      <div class="ytoolrow" style="margin-top:12px;margin-bottom:0">
        <button class="pa-btn" style="cursor:pointer" id="ai-sample">Use sample RFP</button>
        <div class="spacer"></div>
        <button class="pa-btn primary" style="cursor:pointer" id="ai-go">✨ Draft My Bid</button>
      </div>
      <div id="ai-out" style="margin-top:12px"></div>
    </div>`;
  ov.addEventListener('click', () => ov.remove());
  document.body.appendChild(ov);
  ov.querySelector('#ai-sample').addEventListener('click', () => { ov.querySelector('#ai-rfp').value = SAMPLE_RFP; });
  ov.querySelector('#ai-go').addEventListener('click', () => {
    const text = ov.querySelector('#ai-rfp').value.trim();
    const out = ov.querySelector('#ai-out');
    if (!text) { out.innerHTML = '<div class="ynote">Paste some scope text first.</div>'; return; }
    out.innerHTML = '<div class="ynote" style="animation:bwpulse 1.1s ease-in-out infinite">Reading scope… matching trades… pricing from the Y8S cost database…</div>';
    setTimeout(() => {
      const d = aiDraftBid(text);
      if (!d.lines.length) { out.innerHTML = '<div class="ynote">No controls scope detected — try including systems (RTUs, VAVs, plant, wiring…).</div>'; return; }
      const direct = d.lines.reduce((a, f) => a + f.qty * f.unitCost, 0);
      out.innerHTML = `
        <div class="svc-sect">Detected Scope — ${d.lines.length} trade lines${d.sqft ? ' · ' + d.sqft + ' SF (pricing scaled)' : ''}</div>
        <table class="demo-tbl tbl-left"><thead><tr><th>Trade</th><th>CSI</th><th style="text-align:right">Qty</th><th style="text-align:right">Direct Cost</th></tr></thead>
        <tbody>${d.lines.map(f => `<tr><td>${esc(f.trade)}</td><td>${f.csi}</td><td style="text-align:right">${f.qty} ${f.unit}</td><td style="text-align:right">${fmt$(f.qty * f.unitCost)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="3" style="font-weight:800">Estimated direct cost</td><td style="text-align:right;font-weight:800">${fmt$(direct)}</td></tr></tfoot></table>
        <div class="ytoolrow" style="margin-top:12px;margin-bottom:0">
          <span class="ynote">Project: <b>${esc(d.title)}</b> · Owner: <b>${esc(d.owner)}</b></span>
          <div class="spacer"></div>
          <button class="pa-btn primary" style="cursor:pointer" id="ai-apply">→ Load into Bid Builder</button>
        </div>`;
      out.querySelector('#ai-apply').addEventListener('click', () => {
        BID.lines = d.lines;
        BID.meta.project = d.title;
        BID.meta.owner = d.owner;
        BID.meta.bidNumber = 'Y8S-2026-' + String(400 + Math.floor(Math.random() * 500));
        ov.remove();
        previewProposal = false;
        render();
        window.scrollTo(0, 0);
      });
    }, 1100);
  });
}

function lineCalc(l) {
  const direct = l.qty * l.unitCost;
  const esc$ = direct * BID.levers.escalationPct / 100;
  const oh = (direct + esc$) * BID.levers.overheadPct / 100;
  const profit = (direct + esc$ + oh) * BID.levers.profitPct / 100;
  return { direct, esc$, oh, profit, sell: direct + esc$ + oh + profit };
}
function totals() {
  let direct = 0, esc$ = 0, oh = 0, profit = 0, sellSub = 0;
  BID.lines.forEach(l => { const c = lineCalc(l); direct += c.direct; esc$ += c.esc$; oh += c.oh; profit += c.profit; sellSub += c.sell; });
  const bond = sellSub * BID.levers.bondPct / 100;
  const gl = sellSub * BID.levers.glPct / 100;
  const contingency = sellSub * BID.levers.contingencyPct / 100;
  const tax = (sellSub + bond + gl + contingency) * BID.levers.taxPct / 100;
  const base = sellSub + bond + gl + contingency + tax;
  const alts = BID.alternates.filter(a => a.included).reduce((s, a) => s + a.amount, 0);
  return { direct, esc$, oh, profit, sellSub, bond, gl, contingency, tax, base, alts, grand: base + alts,
           marginPct: base ? (oh + profit + contingency) / base * 100 : 0 };
}
const finishDate = () => addDays(BID.meta.startDate, Math.max(...BID.lines.map(l => l.offset + l.dur)));

function updLever(k, v) { BID.levers[k] = parseFloat(v) || 0; render(); }
function updMeta(k, v) { BID.meta[k] = v; render(); }
function updLine(i, k, v) {
  const l = BID.lines[i];
  if (['qty', 'unitCost', 'offset', 'dur'].includes(k)) l[k] = parseFloat(v) || 0; else l[k] = v;
  render();
}
function addLine() {
  const c = TRADE_CATALOG[0];
  BID.lines.push({ trade: c.trade, csi: c.csi, desc: c.descs[0], qty: 1, unit: c.unit, unitCost: 0, sub: SUBS[c.sub], offset: 0, dur: 5 });
  render();
}
function delLine(i) { BID.lines.splice(i, 1); render(); }
function updAlt(i, k, v) {
  const a = BID.alternates[i];
  if (k === 'included') a.included = v; else if (k === 'amount') a.amount = parseFloat(v) || 0; else a[k] = v;
  render();
}

function bidGantt() {
  const span = Math.max(1, Math.max(...BID.lines.map(l => l.offset + l.dur)));
  return BID.lines.map(l => `
    <div class="ygantt-row">
      <div class="ygantt-lbl">${esc(l.trade)}</div>
      <div class="ygantt-track"><div class="ygantt-bar" style="left:${l.offset / span * 100}%;width:${Math.max(1.5, l.dur / span * 100)}%"></div></div>
      <div class="ygantt-dates">${fmtDateShort(addDays(BID.meta.startDate, l.offset))} · ${l.dur}d</div>
    </div>`).join('');
}

let previewProposal = false;
function render() { $('#app').innerHTML = internal ? (previewProposal ? viewExternal(true) : viewInternal()) : viewExternal(false); }

/* ---------- email the bid straight from the site ---------- */
function emailBid() {
  const T = totals();
  const authorized = apprComplete(APPR_KEY, APPR_STEPS.length);
  const subject = 'Proposal ' + BID.meta.bidNumber + ' — ' + BID.meta.project + ' — Base Bid ' + fmt$2(T.base);
  const body = [
    'Dear ' + BID.meta.owner + ',',
    '',
    'Please find our proposal for ' + BID.meta.project + ' summarized below. The full PDF proposal is attached.',
    '',
    'Base Bid: ' + fmt$2(T.base) + ' (payment & performance bond and general liability included)',
    T.alts ? 'Total with accepted alternates: ' + fmt$2(T.grand) : 'Alternates offered: ' + BID.alternates.map(a => a.id + ' ' + (a.amount < 0 ? '(' + fmt$2(Math.abs(a.amount)) + ')' : fmt$2(a.amount))).join(' · '),
    'Anticipated schedule: ' + fmtDate(BID.meta.startDate) + ' — ' + fmtDate(finishDate()),
    'Project Manager: ' + BID.meta.pm + '  |  Superintendent: ' + BID.meta.super,
    'Proposal valid ' + BID.meta.validDays + ' days.',
    '',
    (authorized ? '' : 'NOTE (internal): estimate not yet fully authorized for submission.\n\n') +
    'We appreciate the opportunity and look forward to building with you.',
    '',
    YATES.company,
    YATES.address + ' | ' + YATES.phone + ' | ' + YATES.email,
  ].join('\n');

  const ov = document.createElement('div');
  ov.className = 'svc-modal';
  ov.innerHTML = `
    <div class="svc-card" onclick="event.stopPropagation()" style="max-width:640px">
      <div class="svc-card-head">
        <div><b>✉ Email Proposal ${esc(BID.meta.bidNumber)}</b><div class="ynote">Review and send — opens in your mail app with everything pre-filled.</div></div>
        <button class="pa-btn" style="cursor:pointer" onclick="this.closest('.svc-modal').remove()">✕</button>
      </div>
      <label class="yfld" style="margin-bottom:10px">To<input class="yin" id="em-to" value="facilities@${esc(BID.meta.owner.toLowerCase().replace(/[^a-z]+/g, '')).slice(0, 18)}.demo" placeholder="owner contact email"></label>
      <label class="yfld" style="margin-bottom:10px">Subject<input class="yin" id="em-subj" value="${esc(subject)}"></label>
      <label class="yfld">Message<textarea class="yin" id="em-body" rows="11" style="resize:vertical;font-family:inherit">${esc(body).replace(/\\n/g, String.fromCharCode(10))}</textarea></label>
      <div class="ytoolrow" style="margin-top:14px;margin-bottom:0">
        <span class="ynote">Tip: use “PDF the Bid” first and attach the saved PDF before sending.</span>
        <div class="spacer"></div>
        <button class="pa-btn primary" style="cursor:pointer" id="em-send">✉ Open in Mail App</button>
      </div>
    </div>`;
  ov.addEventListener('click', () => ov.remove());
  document.body.appendChild(ov);
  ov.querySelector('#em-send').addEventListener('click', () => {
    const to = ov.querySelector('#em-to').value.trim();
    const subj = encodeURIComponent(ov.querySelector('#em-subj').value);
    const bod = encodeURIComponent(ov.querySelector('#em-body').value);
    window.location.href = 'mailto:' + to + '?subject=' + subj + '&body=' + bod;
  });
}

/* ---------- INTERNAL: institutional estimate ---------- */
function viewInternal() {
  const T = totals();
  const authorized = apprComplete(APPR_KEY, APPR_STEPS.length);

  const rows = BID.lines.map((l, i) => {
    const c = lineCalc(l);
    const subOpts = SUBS.map(s => `<option ${s === l.sub ? 'selected' : ''}>${esc(s)}</option>`).join('');
    return `
      <tr>
        <td><select class="yin" style="width:96px" onchange="updLine(${i},'csi',this.value)" title="CSI MasterFormat section">${csiOpts(l.csi)}</select></td>
        <td><select class="yin" style="width:150px" onchange="applyTrade(${i},this.value)">${tradeOpts(l.trade)}</select></td>
        <td><select class="yin" style="min-width:250px;max-width:340px" onchange="updLine(${i},'desc',this.value)">${descOpts(l)}</select></td>
        <td><input class="yin num" type="number" step="1" value="${l.qty}" style="width:56px" onchange="updLine(${i},'qty',this.value)"></td>
        <td><select class="yin" style="width:70px" onchange="updLine(${i},'unit',this.value)">${unitOpts(l.unit)}</select></td>
        <td><input class="yin num" type="number" step="0.01" value="${l.unitCost.toFixed(2)}" style="width:96px" onchange="updLine(${i},'unitCost',this.value)"></td>
        <td style="text-align:right">${fmt$2(c.direct)}</td>
        <td style="text-align:right">${fmt$2(c.oh)}</td>
        <td style="text-align:right">${fmt$2(c.profit)}</td>
        <td style="text-align:right"><b>${fmt$2(c.sell)}</b></td>
        <td><select class="yin" style="min-width:140px" onchange="updLine(${i},'sub',this.value)">${subOpts}</select></td>
        <td><input class="yin num" type="number" value="${l.offset}" style="width:50px" onchange="updLine(${i},'offset',this.value)" title="start offset (days)"></td>
        <td><input class="yin num" type="number" value="${l.dur}" style="width:50px" onchange="updLine(${i},'dur',this.value)" title="duration (days)"></td>
        <td><button class="pa-btn" style="cursor:pointer" onclick="delLine(${i})" title="remove line">✕</button></td>
      </tr>`;
  }).join('');

  const altRows = BID.alternates.map((a, i) => `
    <tr>
      <td><b>${a.id}</b></td>
      <td><input class="yin" value="${esc(a.desc)}" onchange="updAlt(${i},'desc',this.value)"></td>
      <td><span class="alt-amt"><span class="u">$</span><input class="yin num" type="number" step="100" value="${a.amount}" style="width:96px" onchange="updAlt(${i},'amount',this.value)"></span><div class="ynote" style="text-align:right">${a.amount < 0 ? '(' + fmt$(Math.abs(a.amount)) + ')' : fmt$(a.amount)}</div></td>
      <td style="text-align:center"><input type="checkbox" ${a.included ? 'checked' : ''} onchange="updAlt(${i},'included',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>
      <td>${a.included ? '<span class="demo-chip ok">IN BID</span>' : '<span class="demo-chip mut">EXCLUDED</span>'}</td>
    </tr>`).join('');

  const pmOpts = PEOPLE.pms.map(p => `<option ${p === BID.meta.pm ? 'selected' : ''}>${p}</option>`).join('');
  const supOpts = PEOPLE.supers.map(p => `<option ${p === BID.meta.super ? 'selected' : ''}>${p}</option>`).join('');

  const ladder = [
    ['Direct cost (trade buyout)', T.direct],
    BID.levers.escalationPct ? ['Material escalation (' + BID.levers.escalationPct + '%)', T.esc$] : null,
    ['Overhead (' + BID.levers.overheadPct + '%)', T.oh],
    ['Profit (' + BID.levers.profitPct + '%)', T.profit],
    ['Sell subtotal', T.sellSub, 'sub'],
    ['Payment & performance bond (' + BID.levers.bondPct + '%)', T.bond],
    ['General liability insurance (' + BID.levers.glPct + '%)', T.gl],
    T.contingency ? ['Estimating contingency (' + BID.levers.contingencyPct + '%)', T.contingency] : null,
    T.tax ? ['Sales tax (' + BID.levers.taxPct + '%)', T.tax] : null,
    ['BASE BID', T.base, 'noi'],
    T.alts ? ['Selected alternates', T.alts] : null,
    T.alts ? ['TOTAL WITH ALTERNATES', T.grand, 'noi'] : null,
  ].filter(Boolean).map(r => `<tr class="${r[2] || ''}"><td>${r[0]}</td><td style="text-align:right">${fmt$2(r[1])}</td></tr>`).join('');

  return `
    <div class="demo-hero" style="padding-bottom:16px">
      <div>
        <div class="demo-eyebrow">PRECONSTRUCTION · ESTIMATE ${esc(BID.meta.bidNumber)} · REV 3</div>
        <h1>Bid <em>Builder</em></h1>
        <div class="sub">Works <b>alongside</b> the estimating workbook, not instead of it — import an estimate or draft one from an RFP, then let the portal do what spreadsheets can't: pricing levers, release control, e-mail/PDF output, and win/loss reporting in the <a href="/yates/pipeline/" style="color:var(--color-blue)">Bid Pipeline</a>.</div>
      </div>
      <div class="demo-hero-right">
        <span class="demo-live"><span class="dot"></span> BASE BID ${fmt$2(T.base)}</span>
        <span style="display:flex;gap:6px">${srcChip('prop')} ${srcChip('st')}</span>
        <span style="display:flex;gap:8px">
          <button class="pa-btn" style="cursor:pointer" onclick="alert('Demo: drop the estimating workbook (.xlsx) here — line items, quantities and pricing map into the portal automatically. The estimator keeps their spreadsheet; the company gets the reporting.')">⬆ Import Estimate (.xlsx)</button>
          <button class="pa-btn primary" style="cursor:pointer;background:linear-gradient(135deg,#083d75,#0d5aa7)" onclick="aiAssist()">🤖 AI Draft from RFP</button>
          <button class="pa-btn" style="cursor:pointer" onclick="emailBid()">✉ Email Bid</button>
          <button class="pa-btn primary" style="cursor:pointer" onclick="previewProposal=true;render();window.scrollTo(0,0)">📄 PDF the Bid</button>
          <button class="pa-btn primary" style="cursor:pointer" onclick="addLine()">＋ Add Line Item</button>
        </span>
      </div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px;border-left:3px solid ${authorized ? 'var(--color-green)' : 'var(--yates-red)'}">
      <div class="demo-panel-head"><h2>Estimate Release Control</h2><span class="k">sequential sign-off · role-gated · switch role via the account menu (top right)</span></div>
      ${approvalChain(APPR_KEY, APPR_STEPS)}
      ${authorized ? '' : '<div class="ynote" style="margin-top:8px">The client-facing proposal is watermarked <b>DRAFT</b> until the full chain has signed off.</div>'}
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Project Setup</h2><span class="k">details flow into the proposal</span></div>
      <div class="fc-assumps" style="grid-template-columns:repeat(4,1fr)">
        <label class="yfld">Project Name<input class="yin" value="${esc(BID.meta.project)}" onchange="updMeta('project',this.value)"></label>
        <label class="yfld">Owner / Client<input class="yin" value="${esc(BID.meta.owner)}" onchange="updMeta('owner',this.value)"></label>
        <label class="yfld">Site Address<input class="yin" value="${esc(BID.meta.address)}" onchange="updMeta('address',this.value)"></label>
        <label class="yfld">Bid Number<input class="yin" value="${esc(BID.meta.bidNumber)}" onchange="updMeta('bidNumber',this.value)"></label>
        <label class="yfld">Project Manager<select class="yin" onchange="updMeta('pm',this.value)">${pmOpts}</select></label>
        <label class="yfld">Superintendent<select class="yin" onchange="updMeta('super',this.value)">${supOpts}</select></label>
        <label class="yfld">Anticipated Start<input class="yin" type="date" value="${BID.meta.startDate}" onchange="updMeta('startDate',this.value)"></label>
        <label class="yfld">Computed Finish<input class="yin" value="${fmtDate(finishDate())}" disabled style="opacity:.7"></label>
      </div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px;border-left:3px solid var(--yates-red)">
      <div class="demo-panel-head"><h2>Pricing Levers</h2><span class="k">flow through every line — change one, the whole bid reprices</span></div>
      <div class="fc-assumps" style="grid-template-columns:repeat(8,1fr)">
        <div class="fc-assump"><label>Overhead</label><div class="ip"><input value="${BID.levers.overheadPct}" inputmode="decimal" onchange="updLever('overheadPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>Profit</label><div class="ip"><input value="${BID.levers.profitPct}" inputmode="decimal" onchange="updLever('profitPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>P&amp;P bond</label><div class="ip"><input value="${BID.levers.bondPct}" inputmode="decimal" onchange="updLever('bondPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>GL insurance</label><div class="ip"><input value="${BID.levers.glPct}" inputmode="decimal" onchange="updLever('glPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>Escalation</label><div class="ip"><input value="${BID.levers.escalationPct}" inputmode="decimal" onchange="updLever('escalationPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>Contingency</label><div class="ip"><input value="${BID.levers.contingencyPct}" inputmode="decimal" onchange="updLever('contingencyPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>Sales tax</label><div class="ip"><input value="${BID.levers.taxPct}" inputmode="decimal" onchange="updLever('taxPct',this.value)"><span class="u">%</span></div></div>
        <div class="fc-assump"><label>Retainage</label><div class="ip"><input value="${BID.levers.retainagePct}" inputmode="decimal" onchange="updLever('retainagePct',this.value)"><span class="u">%</span></div></div>
      </div>
    </div>

    <div class="ykpi-row">
      <div class="ykpi"><div class="l">Direct Cost</div><div class="v">${fmtK(T.direct)}</div><div class="s">trade buyout basis</div></div>
      <div class="ykpi"><div class="l">OH + Profit</div><div class="v">${fmtK(T.oh + T.profit)}</div><div class="s">${BID.levers.overheadPct}% + ${BID.levers.profitPct}%</div></div>
      <div class="ykpi amber"><div class="l">Bond &amp; Insurance</div><div class="v">${fmtK(T.bond + T.gl)}</div><div class="s">P&amp;P ${BID.levers.bondPct}% · GL ${BID.levers.glPct}%</div></div>
      <div class="ykpi green"><div class="l">Blended Margin</div><div class="v">${fmtPct(T.marginPct)}</div><div class="s">of base bid</div></div>
      <div class="ykpi red"><div class="l">${T.alts ? 'Total w/ Alternates' : 'Base Bid'}</div><div class="v">${fmt$2(T.alts ? T.grand : T.base)}</div><div class="s">${T.alts ? 'base ' + fmt$2(T.base) : BID.alternates.length + ' alternates available'}</div></div>
    </div>

    <div class="demo-panel" style="margin-bottom:22px">
      <div class="demo-panel-head"><h2>Estimate Detail — CSI Trade Lines</h2><span style="display:flex;gap:6px">${srcChip('prop')}<span class="k">unit costs from Y8S historical cost database</span></span></div>
      <div class="demo-tbl-wrap grid-scroll" style="max-height:none">
        <table class="demo-tbl">
          <thead><tr><th>CSI</th><th>Trade</th><th>Scope Description</th><th>Qty</th><th>Unit</th><th>Unit Cost</th><th style="text-align:right">Direct Cost</th><th style="text-align:right">OH</th><th style="text-align:right">Profit</th><th style="text-align:right">Sell</th><th>Subcontractor</th><th>Start +d</th><th>Dur (d)</th><th></th></tr></thead>
          <tbody>${rows}
            <tr style="font-weight:800;background:var(--color-bg-3)">
              <td colspan="6">Totals</td>
              <td style="text-align:right">${fmt$2(T.direct)}</td><td style="text-align:right">${fmt$2(T.oh)}</td>
              <td style="text-align:right">${fmt$2(T.profit)}</td><td style="text-align:right">${fmt$2(T.sellSub)}</td>
              <td colspan="4"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="demo-two" style="margin-bottom:22px">
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Bid Summary Ladder</h2><span class="k">direct cost → base bid</span></div>
        <table class="fc-tbl compact"><tbody>${ladder}</tbody></table>
      </div>
      <div class="demo-panel">
        <div class="demo-panel-head"><h2>Alternates</h2><span class="k">toggle IN BID — totals reprice live</span></div>
        <table class="demo-tbl tbl-left">
          <thead><tr><th style="width:56px">Alt #</th><th>Description</th><th style="width:130px">Amount</th><th style="text-align:center;width:70px">Include</th><th style="width:90px"></th></tr></thead>
          <tbody>${altRows}</tbody>
        </table>
        <div class="demo-panel-head" style="margin-top:18px"><h2>Allowances Carried in Base</h2></div>
        <table class="demo-tbl tbl-left">
          <tbody>${BID.allowances.map(a => `<tr><td>${esc(a.desc)}</td><td style="text-align:right">${fmt$2(a.amount)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="demo-panel">
      <div class="demo-panel-head"><h2>Auto-Generated Timeline</h2><span style="display:flex;gap:6px">${srcChip('st')}<span class="k">crew availability from ServiceTitan dispatch · finish ${fmtDate(finishDate())}</span></span></div>
      ${bidGantt()}
    </div>
    <div class="demo-note">Demo environment · fictional data</div>`;
}

/* ---------- EXTERNAL (client proposal) ---------- */
function viewExternal(preview) {
  const T = totals();
  const authorized = apprComplete(APPR_KEY, APPR_STEPS.length);
  const st = apprState(APPR_KEY, APPR_STEPS.length);
  const groups = {};
  BID.lines.forEach(l => {
    const c = lineCalc(l);
    if (!groups[l.trade]) groups[l.trade] = { sell: 0, offset: l.offset, end: l.offset + l.dur };
    groups[l.trade].sell += c.sell;
    groups[l.trade].offset = Math.min(groups[l.trade].offset, l.offset);
    groups[l.trade].end = Math.max(groups[l.trade].end, l.offset + l.dur);
  });

  return `
    <div class="ytoolrow" style="margin-top:24px">
      ${preview ? `<button class="pa-btn" style="cursor:pointer" onclick="previewProposal=false;render();window.scrollTo(0,0)">← Back to Estimate</button>` : ''}
      <span class="ynote">${authorized ? 'Authorized for submission — full sign-off chain executed.' : '<b style="color:var(--color-red)">DRAFT</b> — not yet authorized for submission (see Estimate Release Control).'}</span>
      <div class="spacer"></div>
      <button class="pa-btn" style="cursor:pointer" onclick="emailBid()">✉ Email Bid</button>
      <button class="pa-btn primary" style="cursor:pointer" onclick="window.print()">🖨 PDF the Bid</button>
    </div>

    <div class="ydoc" style="position:relative">
      ${authorized ? '' : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5"><span style="font-size:110px;font-weight:800;letter-spacing:0.2em;color:rgba(198,151,17,0.13);transform:rotate(-24deg)">DRAFT</span></div>`}
      <div class="ydoc-head">
        <div><img src="/yates/assets/brand/y8s-logo.png" alt="Y8S — YATES Company, LLC" class="y8s-logo"><div class="sub" style="margin-top:8px">YATES Company, LLC · Building Automation &amp; Energy Solutions</div></div>
        <div class="right"><b>Proposal ${esc(BID.meta.bidNumber)}</b><br>Date: ${fmtDate(todayISO())}<br>Valid: ${BID.meta.validDays} days<br>${YATES.license} · Bonded &amp; insured</div>
      </div>
      <div class="big-title">${esc(BID.meta.project)}</div>
      <div class="subtitle">${esc(BID.meta.address)}</div>

      <h3 class="sect">Prepared For</h3>
      <p><b>${esc(BID.meta.owner)}</b><br>${esc(BID.meta.address)}</p>

      <h3 class="sect">Your Project Team</h3>
      <p><b>Project Manager:</b> ${esc(BID.meta.pm)} &nbsp;·&nbsp; <b>Superintendent:</b> ${esc(BID.meta.super)}<br>
      <b>Anticipated schedule:</b> ${fmtDate(BID.meta.startDate)} — ${fmtDate(finishDate())}</p>

      <h3 class="sect">Scope of Work</h3>
      ${Object.keys(groups).map(tr => BID.scopes[tr] ? `<div class="scope-block"><b>${esc(tr)}</b><p>${esc(BID.scopes[tr])}</p></div>` : '').join('')}

      <h3 class="sect">Base Bid — Detailed Schedule of Values</h3>
      <table>
        <thead><tr><th style="width:70px">CSI</th><th>Description of Work</th><th class="num">Qty</th><th style="width:52px">Unit</th><th class="num">Unit Price</th><th class="num">Extended</th></tr></thead>
        <tbody>
          ${Object.entries(groups).map(([tr, g]) => {
            const lines = BID.lines.filter(l => l.trade === tr);
            const catRow = `<tr style="background:#f4f6fa"><td colspan="5" style="font-weight:800;color:#062c55">${esc(tr)}</td><td class="num" style="font-weight:800">${fmt$2(g.sell)}</td></tr>`;
            const detail = lines.map(l => {
              const c = lineCalc(l);
              const unitSell = l.qty ? c.sell / l.qty : c.sell;
              return `<tr>
                <td style="color:#5b6472">${esc(l.csi || '')}</td>
                <td>${esc(l.desc)}<div style="font-size:10.5px;color:#5b6472;margin-top:2px">Performed by ${esc(l.sub)} · ${fmtDate(addDays(BID.meta.startDate, l.offset))} – ${fmtDate(addDays(BID.meta.startDate, l.offset + l.dur))}</div></td>
                <td class="num">${l.qty}</td>
                <td>${esc(l.unit)}</td>
                <td class="num">${fmt$2(unitSell)}</td>
                <td class="num">${fmt$2(c.sell)}</td>
              </tr>`;
            }).join('');
            return catRow + detail;
          }).join('')}
          <tr style="background:#f4f6fa"><td colspan="5" style="font-weight:700">Subtotal — all work categories</td><td class="num" style="font-weight:700">${fmt$2(T.sellSub)}</td></tr>
          <tr><td colspan="5">Payment &amp; performance bond (${BID.levers.bondPct}%)</td><td class="num">${fmt$2(T.bond)}</td></tr>
          <tr><td colspan="5">General liability insurance (${BID.levers.glPct}%)</td><td class="num">${fmt$2(T.gl)}</td></tr>
          ${T.contingency ? `<tr><td colspan="5">Owner contingency (${BID.levers.contingencyPct}%)</td><td class="num">${fmt$2(T.contingency)}</td></tr>` : ''}
          ${T.tax ? `<tr><td colspan="5">Sales tax (${BID.levers.taxPct}%)</td><td class="num">${fmt$2(T.tax)}</td></tr>` : ''}
        </tbody>
        <tfoot><tr><td colspan="5">TOTAL BASE BID</td><td class="num">${fmt$2(T.base)}</td></tr></tfoot>
      </table>
      <p style="font-size:11px;color:#5b6472">Unit prices include labor, material, supervision and warranty. Quantities per the engineered points list; final quantities reconciled at approved shop drawings.</p>

      <h3 class="sect">Alternates</h3>
      <table>
        <thead><tr><th>Alt #</th><th>Description</th><th class="num">Add / (Deduct)</th><th>Status</th></tr></thead>
        <tbody>${BID.alternates.map(a => `<tr><td><b>${a.id}</b></td><td>${esc(a.desc)}</td><td class="num">${a.amount < 0 ? '(' + fmt$2(Math.abs(a.amount)) + ')' : fmt$2(a.amount)}</td><td>${a.included ? 'Accepted' : 'Offered'}</td></tr>`).join('')}</tbody>
        ${T.alts ? `<tfoot><tr><td colspan="2">Total Contract Price with Accepted Alternates</td><td class="num">${fmt$2(T.grand)}</td><td></td></tr></tfoot>` : ''}
      </table>

      <h3 class="sect">Allowances Carried in the Base Bid</h3>
      <ul>${BID.allowances.map(a => `<li>${esc(a.desc)} — ${fmt$2(a.amount)}</li>`).join('')}</ul>

      <h3 class="sect">Project Timeline</h3>
      <table>
        <thead><tr><th>Work Category</th><th>Anticipated Start</th><th>Anticipated Completion</th></tr></thead>
        <tbody>${Object.entries(groups).map(([tr, g]) => `<tr><td>${esc(tr)}</td><td>${fmtDate(addDays(BID.meta.startDate, g.offset))}</td><td>${fmtDate(addDays(BID.meta.startDate, g.end))}</td></tr>`).join('')}</tbody>
      </table>

      <h3 class="sect">Clarifications &amp; Exclusions</h3>
      <ul>${BID.exclusions.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

      <h3 class="sect">Commercial Terms</h3>
      <ul>${BID.terms.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

      ${authorized ? `<h3 class="sect">Authorization</h3>
      <p>This proposal was prepared and released under YATES Company's estimate control procedure:
      ${st.map((x, i) => `<b>${esc(APPR_STEPS[i].doneLabel)}</b> — ${esc(x.by)}, ${esc(x.at)}`).join(' · ')}.</p>` : ''}

      <h3 class="sect">Acceptance</h3>
      <p>Acceptance of this proposal constitutes authorization to proceed under the terms above. We appreciate the opportunity and look forward to building with you.</p>
      <div class="sig-row">
        <div class="sig">${esc(BID.meta.owner)} — Owner / Authorized Agent</div>
        <div class="sig">${YATES.company} — ${esc(BID.meta.pm)}, Project Manager</div>
      </div>
      <p style="margin-top:26px;font-size:10.5px;color:#97a0ad">${YATES.company} · ${YATES.hq} · ${YATES.phone} · ${YATES.email} · ${YATES.license}</p>
    </div>
    <div class="demo-note">Demo environment · fictional data</div>`;
}

render();
</script>
</body>
</html>
